  - id: agent-vessels
    name: 'Agent Vessels'
    summary: 'Launch an agent Vessel and see it and its processes in the arrangement. An agent that another Vessel creates, without naming its permissions, starts in its plain mode.'
    group: agents
    owner: desktop-presentation
    shared_with: [application-queue]
    proof: python-only
    state: {behavior: python-only, performance: none, visual: python-only, debug: python-only}
    platforms: [linux]
    checks: []
    native_journeys: []
    python_journeys: [arrangement, terminal-agent]
    invariants:
      - id: restart-reopens-plain-shells
        kind: user
        says: 'An adopted agent''s Vessel whose program ended closes, at once or on the next reopen, and starts no new program. A Vessel the person opened keeps its shell when an agent run inside it ends, a typed exit closes it, and after a restart or a Voyage reopen it runs a new plain shell in place of a program that ended. An agent is never resumed automatically.'
        owner: application-queue
        guards: []
        checks:
          - 'journey:quit-restore/cold-restart-restores'
          - 'journey:voyage-close/reopen-voyage'
          - 'journey:voyage-close/reopen-after-restart'
          - 'journey:adopt-by-label/reopen-restarts-own-terminal'
          - 'journey:adopt-by-label/reopen-closes-ended-adopted'
          - 'journey:adopt-by-label/ended-away-adopted-removed-when-shown'
          - 'journey:adopt-by-label/agent-exit-in-own-shell-keeps-shell'
          - 'journey:adopt-by-label/user-started-agent-vessel-keeps-shell'
          - 'journey:adopt-by-label/typed-exit-closes-vessel'
        formal: []
        journeys: [adopt-by-label, quit-restore, voyage-close]
      - id: user-placement-is-kept
        kind: user
        says: 'Agents never rearrange what the user placed and never move the user''s view. Agents'' Vessels go in the grid, and Voyager looks without moving the user.'
        guards: []
        checks: ['journey:chat/peek-stays-here']
        formal: []
        journeys: [chat]
      - id: adopted-agents-follow-their-label
        kind: user
        says: 'An agent Program started through voyager appears in the Fleet or Portal its label names and can be docked. Its Vessel closes when its Program ends, and closing the agent removes its Vessel.'
        owner: application-queue
        guards: []
        checks:
          - 'journey:adopt-by-label/agent-in-fleet'
          - 'journey:adopt-by-label/agent-in-portal'
          - 'journey:adopt-by-label/command-fleet-holds-only-its-agent'
          - 'journey:adopt-by-label/dock-agent'
          - 'journey:adopt-by-label/reopen-closes-ended-adopted'
          - 'journey:adopt-by-label/ended-away-adopted-removed-when-shown'
        formal: []
        journeys: [adopt-by-label]
      - id: authority-comes-from-assignment
        kind: user
        says: 'The avatar always acts with its user''s authority. Any other agent instructs another only through a recorded Assignment with a Rank, stored by the app. Fleet membership and Core parentage grant nothing.'
        owner: application-queue
        guards: []
        checks: []
        formal: []
        journeys: []
      - id: any-agent-splits-a-placement
        kind: user
        says: 'Any agent Vessel can put a terminal or agent beside a named placement of a Fleet on the left, right, top or bottom through the voyager.place label, or a Vessel of any ready type there through create-vessel with a beside insertion. A bad side, a malformed label, a closed Fleet, or a placement that is not in the named Fleet places nothing. A created Vessel starts nothing that the same agent''s hc run could not start, and neither route resizes a split.'
        owner: application-queue
        guards: ['type:contract/src/place.rs#Place']
        checks:
          - 'journey:agent-split/label-splits-each-side'
          - 'journey:agent-split/create-vessel-splits-beside'
          - 'journey:agent-split/bad-split-places-nothing'
          - 'test:app/src/workspace/tests.rs#a_vessel_is_not_created_in_a_closed_fleet'
        formal: []
        journeys: [agent-split]
      - id: agents-start-plain-unless-they-name-permissions
        kind: user
        says: 'When a Vessel other than Voyager creates an agent and names no permissions, the agent starts in its plain mode, with the arguments a plain hc run of that agent would carry and no bypass flag. Voyager and the person keep the table default.'
        owner: application-queue
        guards: ['type:contract/src/launch.rs#Defaults']
        checks: ['journey:agent-split/agent-starts-plain']
        formal: []
        journeys: [agent-split]
      - id: person-keeps-the-table-default
        kind: user
        says: 'When the person creates an agent from the app, such as Create Codex, it starts with the agent table''s default, with its model, effort and permission flags, as before. Only a Vessel other than Voyager that names no permissions gets the plain mode.'
        owner: application-queue
        guards: ['type:contract/src/launch.rs#Defaults']
        checks: ['journey:agent-split/person-keeps-table-default']
        formal: []
        journeys: [agent-split]
      - id: agent-splits-keep-the-maximize
        kind: user
        says: 'A placement that a working agent makes, by the voyager.place label or by create-vessel, leaves the Fleet''s maximize as it was, and the new Vessel is drawn when the person un-maximizes. A placement that the person or Voyager makes clears the maximize. Every placement made through the label counts as a working agent''s, whatever Core records as its parent. Voyager is the Vessel on the bound terminal, which clears the maximize through create-vessel.'
        owner: application-queue
        guards: ['type:contract/src/caller.rs#Caller']
        checks: ['journey:agent-split/agent-split-keeps-maximize', 'journey:agent-split/voyager-split-clears-maximize', 'journey:agent-split/new-piece-shows-after-unmaximize']
        formal: []
        journeys: [agent-split]
      - id: typing-feels-immediate
        kind: user
        says: 'Typing into a terminal or agent Vessel shows on screen within the limit in the usage envelope, while a full captain and crew run is going.'
        owner: desktop-presentation
        guards: []
        checks: []
        formal: []
        journeys: []
      - id: wheel-scrolls-full-screen-programs
        kind: user
        says: 'The mouse wheel scrolls full-screen programs such as Codex, as it does in Herdr, and scrolls shell history otherwise, including after reattach.'
        owner: desktop-presentation
        guards: []
        checks: ['journey:terminal-scrolling/mouse', 'journey:terminal-scrolling/normal-history', 'journey:terminal-scrolling/arrows', 'journey:terminal-scrolling/reattached-history']
        formal: []
        journeys: [terminal-scrolling]
      - id: status-is-reported-or-unknown
        kind: user
        says: 'A Program''s status is Core''s latest report or unknown. Silence, or a turn that ended while the agent''s work continues, is never shown as idle or finished.'
        owner: core-adapter
        guards: []
        checks:
          - 'test:app/src/activity.rs#reported_words_optional_limits_and_nonreporters_are_literal'
          - 'test:app/src/activity.rs#split_early_events_missed_and_timestamps_preserve_reported_facts'
          - 'test:app/src/activity.rs#bounds_and_new_binding_seed_cannot_replace_a_later_report'
        formal: []
        journeys: []
      - id: agent-setup-untouched
        kind: developer
        says: 'Voyager never writes to an agent''s own home or configuration. It passes its settings through launch flags and the environment.'
        guards: []
        checks: []
        formal: []
        journeys: []
      - id: any-agent-works
        kind: structure
        says: 'The avatar and Voyager work with any installed agent, and VoyagerShell stays orthogonal to a developer''s agent setup. Agent-specific code lives only in that agent''s adapter.'
        owner: conversation-provider
        guards: ['gate:agent-names-stay-in-adapters']
        checks: []
        formal: []
        journeys: []
    docs: [docs/terminal.md, docs/workspace.md]
    sources: [app/src/launch.rs, desktop/canvas/agents.ts, desktop/canvas/processes.ts]
    code: [app/src/launch.rs, desktop/canvas/agents.ts, desktop/canvas/processes.ts]
