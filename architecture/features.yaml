      - app/src/client_structure.rs
      - app/src/families/structure.rs
      - app/src/scope.rs
      - app/src/workspace.rs
      - desktop/canvas/main.js
      - desktop/canvas/main.ts
      - desktop/canvas/navigation-view.js
      - desktop/canvas/navigation-view.ts
      - desktop/canvas/voyage-colours.ts
