features:
  - id: voyages
    name: Voyages
    summary: 'Create a Voyage from the canvas, switch between Voyages and rename one.'
    group: workspace-layout
    owner: desktop-presentation
    shared_with: [application-queue, placement]
    proof: native
    state: {behavior: covered, performance: none, visual: none, debug: covered}
    platforms: [linux]
    checks: []
    native_journeys: [workspace]
    python_journeys: [demo-feedback]
    invariants:
      - id: placement-survives-relaunch
        kind: user
        says: 'The Voyages, Fleets, placements, Portals, names, arrangements, the canvas with the view each stack has selected, the avatar''s dock and closed Voyages are the same after a relaunch. Reopening a Voyage restores its last-used Fleet, Vessel, split focus and maximize focus.'
        owner: placement
        guards: []
        checks:
          - 'journey:workspace/relaunch-restores'
          - 'journey:arrangement/relaunch-keeps-arrangement'
          - 'journey:portals/relaunch-restores-portal'
          - 'journey:quit-restore/relaunch-reattaches'
          - 'journey:voyage-close/closed-after-restart'
          - 'journey:workspace/split-focus-remembered'
          - 'journey:workspace/reopen-voyage-restores-fleet'
          - 'journey:workspace/relaunch-restores-focus'
          - 'journey:workspace/maximize-focus-remembered'
          - 'journey:workspace/fleet-tab-focus-remembered'
          - 'journey:canvas-stack/selection-after-relaunch'
        formal: []
        journeys: [arrangement, canvas-stack, portals, quit-restore, voyage-close, workspace]
      - id: rename-and-drag-everything
        kind: user
        says: 'Every Voyage, Fleet, Vessel and Portal can be renamed in place, and Vessels can be dragged into a new arrangement that is kept.'
        owner: placement
        guards: []
        checks:
          - 'journey:workspace/rename-fleet-enter'
          - 'journey:workspace/rename-voyage-blur'
          - 'journey:workspace/rename-vessel-f2'
          - 'journey:workspace/rename-escape-cancels'
          - 'journey:portals/rename-portal'
          - 'journey:arrangement/move-vessel'
          - 'journey:arrangement/relaunch-keeps-arrangement'
        formal: []
        journeys: [arrangement, portals, workspace]
      - id: drag-never-moves-window
        kind: user
        says: 'A drag that starts on a Fleet tab, a Vessel, a Voyage row or a terminal selection never moves the window, wherever it is released. Only a drag that starts on the empty top bar or the sidebar moves it.'
        owner: desktop-presentation
        guards: []
        checks:
          - 'journey:workspace/tab-drag-does-not-move-window'
          - 'journey:workspace/voyage-drag-does-not-move-window'
          - 'journey:workspace/terminal-selection-does-not-move-window'
          - 'journey:workspace/drag-bar-moves-window'
          - 'journey:workspace/sidebar-drag-moves-window'
        formal: []
        journeys: [workspace]
    docs: [docs/terminal.md, docs/workspace.md]
    sources: ['desktop/canvas/main.*', 'desktop/canvas/navigation-view.*', desktop/canvas/voyage-colours.ts, app/src/workspace.rs, app/src/scope.rs, app/src/families/structure.rs, app/src/client_structure.rs]
