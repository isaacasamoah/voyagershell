schema: app-atlas/v0
note: 'Plain descriptions of each module and crate: what it holds, where it starts and why. Module ids come from the generated architecture YAML.'
crates:
  - id: 'crate:voyager-app'
    plain: 'The Rust application layer: it owns workspace state, content data, explicit context and policy, and adapts Herdr Core and the Codex provider, with no window code.'
    scope: 'app/src/lib.rs is a 40-line table of contents. It makes public the modules the desktop calls (client, content, context, core, launch, observation, voyage_close, workspace, worktrees, wire, conversation, conversation_client, provider) and the inline core_shapes module of generated Core types. Helpers such as activity, administrator, canvas, core_endpoint, panels, process, scope, terminal_lifecycle, codex and the five voice modules stay private. Lines 38 to 40 use a #[path] attribute to compile experiments/performance/typing-latency/trace.rs as the private typing_trace module and re-export its record function as record_terminal_trace.'
    scope_at: {path: app/src/lib.rs, find: 'pub mod client;'}
    entry: 'The desktop''s startup (desktop/src/lib.rs, around lines 196 to 240) calls in first: it seeds the Notes package with content::seed_package, opens the content owner with content::Owner::open, then calls Client::with_content_and_launches, which spawns the owner thread. It then wraps that Client in conversation_client::Client::with_audio.'
    entry_at: {path: app/src/client.rs, find: 'pub fn with_content_and_launches('}
    why: 'docs/workspace.md says app/src/lib.rs exposes the Rust application independently of GPUI, and app/Cargo.toml lists no GPUI dependency. AGENTS.md names contract/, app/, desktop/ and content/ as the selected product structure, with app/ holding the workspace, content, context and Core owners.'
    inferred: false
  - id: 'crate:voyager-desktop'
    plain: 'The native desktop app: the GPUI window, the native terminal and Notes editors, the avatar, and the host that runs the TypeScript header and Notes scripts.'
    scope: 'lib.rs declares 24 modules (plus a Linux-only test module), the `Quit` action, and three public functions: `run` (start the app), `declarations` and `notes_declarations` (print TypeScript declarations for scripts). At the end it pulls three diagnostic probes in from `experiments/performance/` with `#[path]`: the redraw probe always, the glyph and frame probes only with the `frame-profiler` feature.'
    scope_at: {path: desktop/src/lib.rs, find: 'mod arrangement;'}
    entry: 'The `voyager-shell` binary''s `main` (desktop/src/main.rs) checks `--profile` (an absolute folder) and `--session` (lowercase letters, digits, hyphens) and then calls `voyager_desktop::run`. A second binary, desktop/src/bin/export-script-types.rs, calls `declarations` or `notes_declarations` to print script type definitions.'
    entry_at: {path: desktop/src/main.rs, find: 'arguments().and_then(|(profile, session)| voyager_desktop::run(profile, session))'}
    why: 'docs/workspace.md says app/src/lib.rs exposes the Rust application independently of GPUI, while desktop/src/lib.rs owns native composition, asset seeding and view modules. The README gives desktop/ the GPUI views, native terminal and editors, avatar presentation and interface composition.'
    inferred: false
  - id: 'crate:voyager-contract'
    plain: 'The shared typed vocabulary: identities, workspace actions, requests, responses and tool inputs that Rust, the scripts and agents all use.'
    scope: 'lib.rs declares 12 public modules (activity, avatar_animation, administrator, canvas, content, context, conversation, launch, observation, voice, voyage_close, worktree), a private `panels` module whose types it re-exports, and an inline private `decimal` serde helper. It defines the id types, the saved `Layout` tree (Voyage, Fleet, Vessel, Content, Split), the dock `Context`, the 35 workspace `Action`s and the `Request`/`Response` envelopes, plus `TerminalRequest`/`TerminalResponse`.'
    scope_at: {path: contract/src/lib.rs, find: 'pub mod activity;'}
    entry: 'It has no runtime entry: the app and desktop crates link it as a library. Its `export` binary (contract/src/bin/export.rs) prints JSON Schemas for selected types. contract/build.cjs runs that binary through cargo and writes contract/generated/: a .schema.json and .d.ts per type, one Ajv `validate.js`, and the `workspace` and `conversation` script wrappers. `--check` fails on any drift.'
    entry_at: {path: contract/src/bin/export.rs, find: 'fn main() {'}
    why: 'AGENTS.md asks for one typed application contract for UI, content and agent callers, with client definitions and runtime validators generated from the owning types instead of hand-written schemas. docs/workspace.md says contract/ owns the request, response, identity and layout types and build.cjs generates declarations and validators from them.'
    inferred: false
  - id: 'pkg:header'
    plain: 'The header mod: the TypeScript package that draws the whole workspace window (sidebar, Fleet tabs, panels, Portal column, context bar, chat) and sends typed workspace requests.'
    scope: 'mod.json names the package `Voyager header` with entry `main.js`, version 1 and `contentConfiguration` 2 (the package AGENTS.md still says 1). main.ts default-exports the `Workspace` view. Fourteen helper .ts files cover canvas layout, panels, navigation, creation, menus, chat, agents, processes, worktrees and Voyage close; home.ts and layout-panel.ts are compiled and seeded but not imported. Each .ts compiles to a .js beside it, and lib.rs seeds those .js files, icons and the generated contract wrappers into the profile.'
    scope_at: {path: desktop/mods/header/mod.json, find: '"entry": "main.js",'}
    entry: 'host.rs `load` installs the host modules into a script policy and calls `runtime.try_load(package, ...)`. gpui-shell loads the package''s `main.js`, whose default export is the `Workspace` view; its `init` sends the first `inspect` request and starts the context refresh loop. lib.rs refuses to start unless mod.json names `main.js`, version 1 and a non-empty name.'
    entry_at: {path: desktop/src/host.rs, find: 'runtime.try_load(package, window, cx)'}
    why: 'The README says JavaScript and TypeScript define content and interface layouts through the supported host, so people and agents can change content, look and feel while rendering stays local and native. The header AGENTS.md adds that Rust owns placement, content, context and persistence.'
    inferred: false
  - id: 'pkg:notes'
    plain: 'The Notes content package: a small TypeScript view for a Markdown note that runs in its own restricted script runtime.'
    scope: 'mod.json names the package `Notes` with entry `main.js`, version 1, `contentConfiguration` 2 and a `stateSchema` (a title and a text string). main.ts default-exports the `Notes` view, built from native retained editors imported from `voyager_input`, colours from `voyager_content`, and the shared helpers in ui.js.'
    scope_at: {path: content/notes/mod.json, find: '"stateSchema": {'}
    entry: 'notes.rs `Loader::load` builds a `voyager_content` host module for one Notes content id, then calls `runtime.load_application` with the entry named in mod.json (default `main.js`) and mounts the result. This happens in the Notes watch loop after a Notes component first appears in the header.'
    entry_at: {path: desktop/src/notes.rs, find: 'let application = runtime.load_application(&self.package, entry)?;'}
    why: 'docs/content.md says all Notes instances share one isolated QuickJS VM with the private voyager_input registry and cannot import the header''s Terminal, Name or workspace modules. The header AGENTS.md says source reload grants no Header, process or private-conversation authority to a content package.'
    inferred: false
  - id: 'ts:content/ui.ts'
    plain: 'Shared UI helpers (colours, buttons, menus, a toggle) used by both the header and Notes packages.'
    scope: 'Exports a `ui` colour and size table and builders `actionButton`, `dialogActions`, `menuSurface`, `menuButton`, `disclosureButton` and `toggle`, all built from gpui-kit and gpui-base elements.'
    scope_at: {path: content/ui.ts, find: 'export const ui = {'}
    entry: 'It is never loaded on its own. lib.rs seeds its compiled ui.js into the header package and into the Notes package, and scripts import it as `./ui.js`.'
    entry_at: {path: desktop/src/lib.rs, find: 'seed(&package.join("ui.js"), include_str!("../../content/ui.js"))?;'}
    why: 'One look for buttons and menus across both packages; it is copied into each package because each package loads from its own folder.'
    inferred: true
modules:
  - id: 'rs:voyager_app'
    feature: startup-quit
    plain: 'The crate root. It only declares the app''s modules, generates Core''s message types, and borrows the typing-latency tracer from experiments/.'
    holds: 'nothing: declarations only.'
    entry: {fn: 'voyager_app::client', path: app/src/lib.rs, find: 'pub mod client;', plain: 'Makes the application Client public. It is the first thing the desktop builds at startup.'}
    key:
      - {fn: 'voyager_app::core_shapes', path: app/src/lib.rs, find: 'pub mod core_shapes {', plain: 'Inline module whose types are generated from app/core-schema.json at compile time.'}
      - fn: 'typing_trace (#[path] include)'
        path: app/src/lib.rs
        find: '#[path = "../../experiments/performance/typing-latency/trace.rs"]'
        plain: 'Compiles a file that lives under experiments/ into the product crate.'
      - fn: 'voyager_app::record_terminal_trace'
        path: app/src/lib.rs
        find: 'pub use typing_trace::record as record_terminal_trace;'
        plain: 'Re-exports the tracer so the desktop''s terminal view can record keystroke stages.'
      - {fn: 'tests (cfg(test))', path: app/src/lib.rs, find: 'mod tests;', plain: 'Crate-level unit tests in app/src/tests.rs (1,557 lines), compiled only for tests.'}
    inferred: false
    size: 40
    note: 'The feature assignment is a judgement call: the root has no behaviour of its own, and it is grouped with startup because the desktop links against it at launch.'
  - id: 'rs:voyager_app::activity'
    feature: agents
    plain: 'Keeps a live cache of what each terminal program says it is doing (working, blocked, idle, done or error), read from Core''s optional activity stream.'
    holds: 'A map from Core terminal address to the last reported activity, a revision counter, the subscription channel and sequence number, small buffers for partial and early stream bytes, and a dirty flag with a wake callback.'
    entry:
      fn: 'activity::Activity'
      path: app/src/activity.rs
      find: 'pub(crate) struct Activity {'
      plain: 'The shared cache. The Core adapter''s reader thread and the client owner thread both hold it behind one Arc<Mutex>.'
    key:
      - fn: 'Activity::install'
        path: app/src/activity.rs
        find: 'pub(crate) fn install(&mut self, value: Value) -> Result<u32, String> {'
        plain: 'Accepts Core''s subscribe reply: records the channel, applies the first snapshot, then replays bytes that arrived early.'
      - fn: 'Activity::data'
        path: app/src/activity.rs
        find: 'pub(crate) fn data(&mut self, channel: u32, bytes: &[u8]) -> u32 {'
        plain: 'Takes raw bytes from the activity channel and applies the complete event lines in them.'
      - fn: 'Activity::bind'
        path: app/src/activity.rs
        find: 'pub(crate) fn bind<''a>(&mut self, addresses: impl IntoIterator<Item = &''a str>) {'
        plain: 'Limits tracking to the terminal addresses the layout binds, at most 256. The client owner thread calls it before handling each message.'
      - fn: 'Activity::projection'
        path: app/src/activity.rs
        find: 'pub(crate) fn projection(&self) -> Projection {'
        plain: 'Produces the read-only view behind Client::reported_activity, which Vessel headers and the Agents list show.'
    talks_to: 'Fed by the Core adapter''s reader thread from Core''s framed connection (core.rs activity_frame). Client::reported_activity reads it for the desktop.'
    why: 'docs/terminal.md (Program-reported activity) says the adapter applies snapshots and ordered events and never infers activity from output or silence; gaps and channel loss stay unknown.'
    inferred: false
    size: 629
  - id: 'rs:voyager_app::administrator'
    feature: assistant
    plain: 'Runs the private assistant''s four Voyager tools (workspace, process, content, worktree): it checks each tool call, hands it to the app Client on a worker thread, and keeps receipts so a call is never run twice.'
    holds: 'Per-turn tool receipts (at most 32 calls, each with its argument fingerprint and reply ids), at most one in-flight Work item, and a flag recording any uncertain outcome.'
    entry:
      fn: 'administrator::Tools::call'
      path: app/src/administrator.rs
      find: '    pub fn call('
      plain: 'Checks a tool call against the accepted thread, turn and tool name, applies the size and 32-call limits, returns a stored result for a repeated call, and otherwise starts at most one effect.'
    key:
      - fn: 'administrator::catalog'
        path: app/src/administrator.rs
        find: 'pub(crate) fn catalog() -> Result<Vec<ToolDefinition>, String> {'
        plain: 'Builds the four tool definitions from the generated JSON schemas in contract/generated, with the usage rules written into each description.'
      - fn: 'Tools::call worker thread'
        path: app/src/administrator.rs
        find: 'thread::spawn(move || {'
        plain: 'Turns the parsed tool input into one Client call (scoped_call, process, worktree or content), which then waits in the client owner queue.'
      - fn: 'administrator::Tools::poll'
        path: app/src/administrator.rs
        find: 'pub fn poll(&mut self) -> Option<Completed> {'
        plain: 'Polled by the conversation owner loop; returns the finished result and a reply for every callback id that was waiting on it.'
      - {fn: 'administrator::Dispatch', path: app/src/administrator.rs, find: 'enum Dispatch {', plain: 'The four kinds of effect a tool call can become.'}
    talks_to: 'Called by the conversation owner thread with tool calls decoded from Codex. Its worker thread sends requests into the app Client''s owner queue.'
    why: 'docs/conversation.md (Typed provider conversion) says the administrator retains dispatch, caller checks and receipt policy, while the Codex adapter only encodes and decodes.'
    inferred: false
    size: 1480
    note: 'Lines 766 onward are tests.'
  - id: 'rs:voyager_app::canvas'
    feature: workspace-layout
    plain: 'Checks that a canvas, the window''s arrangement of sidebar, Fleet strip, active Fleet, Portals column and context bar, is valid before it is used.'
    holds: 'nothing: pure functions.'
    entry:
      fn: 'canvas::validate'
      path: app/src/canvas.rs
      find: 'pub(crate) fn validate(canvas: &Canvas) -> Result<(), String> {'
      plain: 'Refuses trees deeper than 12 levels or larger than 64 nodes, duplicate or missing regions, and a Portals column that is not rightmost beside the active Fleet.'
    key:
      - {fn: 'canvas::validate::visit', path: app/src/canvas.rs, find: '    fn visit(', plain: 'Recursive check of each node. Every alternative in a stack must keep the same regions.'}
    talks_to: 'Called when the layout document is loaded from Core (client.rs load) and when an UpdateCanvas action is applied (workspace.rs).'
    inferred: false
    size: 348
  - id: 'rs:voyager_app::client'
    feature: workspace-layout
    plain: 'The application''s single request queue. A Client is a cheap, cloneable handle; every request it sends is handled one at a time by one owner thread, which holds the Core connection and the current workspace layout.'
    holds: 'The Client handle holds the queue sender (8 slots), a request sequence, a package revision, a process identity, the shared activity cache and the latest prepared dock preview. The owner thread holds the Core connection, the current layout and its version, a fresh flag, the last 32 receipts for each request family (workspace, terminal, process, content, worktree), unconfirmed terminal starts, newly created terminals allowed to start, live terminal bindings, the workspace-change listener, the quit result, the Voyage close state and any Notes rename in progress.'
    entry:
      fn: 'Client::with_content_and_launches'
      path: app/src/client.rs
      find: 'pub fn with_content_and_launches('
      plain: 'Called once by desktop/src/lib.rs at startup. It creates the queue and the Client handle and spawns the owner thread.'
    key:
      - fn: 'Client::start_with_launches (owner thread start)'
        path: app/src/client.rs
        find: 'let mut core = Core::connect_activity(&session, observed_activity.clone());'
        plain: 'First line of the spawned owner thread: it connects to Herdr Core, then sets up the state it alone will own.'
      - fn: 'owner loop'
        path: app/src/client.rs
        find: 'while let Ok(message) = next_message('
        plain: 'Waits for the next message. next_message also binds the activity cache to the layout''s terminals and publishes an activity notice if anything changed.'
      - fn: 'main dispatch match'
        path: app/src/client.rs
        find: 'let (request, scope, reply) = match message {'
        plain: 'One arm per message type. Most arms finish and continue; Workspace and NoteExit fall through to the shared workspace handling below.'
      - fn: 'shared workspace handling'
        path: app/src/client.rs
        find: 'let inspecting = matches!(request.action, Action::Inspect);'
        plain: 'Start of the path every workspace Request takes after dedupe: Inspect, freshness and version checks, scope check, special actions, then apply and save.'
      - fn: 'Client::call'
        path: app/src/client.rs
        find: 'pub fn call(&self, request: Request) -> Result<Response, String> {'
        plain: 'Blocking workspace request used by the header host, the avatar and the conversation; waits up to 20 seconds (120 for confirming a Voyage close).'
      - {fn: 'Client::terminal', path: app/src/client.rs, find: '    pub fn terminal(', plain: 'Opens a terminal viewer for a content id and returns a core::Viewer; used by host.rs terminal_open.'}
      - fn: 'Client::process'
        path: app/src/client.rs
        find: '    pub fn process('
        plain: 'Scoped process request (list, read, send, interrupt, stop); used by the header''s Agents list and by the assistant tools.'
      - {fn: 'Client::worktree', path: app/src/client.rs, find: '    pub fn worktree(', plain: 'Git worktree request from the header''s worktree dialog or the assistant.'}
      - {fn: 'Client::workspace_changes', path: app/src/client.rs, find: 'pub async fn workspace_changes(', plain: 'Subscribes to WorkspaceNotice revisions so the desktop knows when to re-inspect.'}
      - {fn: 'Client::workspace_observation', path: app/src/client.rs, find: 'pub async fn workspace_observation(', plain: 'Live folders, programs and names for visible panels, for the header.'}
      - fn: 'Client::context_facts'
