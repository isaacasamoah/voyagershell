    talks_to: 'Sends requests to Herdr Core through the Core adapter (document get and set of voyager-layout-v1, terminal list, get, run and attach). Asks the content owner for Notes data. Spawns short-lived worker threads for Git worktree commands, process effects that wait on Core, Voyage close and Notes rename waits; each reports back as a message on the same queue.'
    why: 'AGENTS.md names app/src/client.rs as the native application queue and says a received request is not a completed effect and uncertain operations are never replayed. That is why each family keeps receipts by request id and a timeout is reported as unconfirmed rather than retried.'
