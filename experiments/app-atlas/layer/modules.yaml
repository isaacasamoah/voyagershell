        find: 'pub async fn context_facts(&self) -> Result<voyager_contract::context::Facts, String> {'
        plain: 'Scope, path and folder for the context bar.'
      - fn: 'Client::launches'
        path: app/src/client.rs
        find: 'pub async fn launches(&self) -> Result<voyager_contract::launch::Catalog, String> {'
        plain: 'Reads the launch catalog (launches.json); host.rs exposes it to the header script as the launches function.'
      - fn: 'Client::reported_activity / refresh_activity'
        path: app/src/client.rs
        find: 'pub fn reported_activity(&self) -> voyager_contract::activity::Projection {'
        plain: 'Reads program-reported activity without entering the queue; refresh_activity (line 278) asks the owner to renew the Core subscription.'
      - {fn: 'Client::bind_content_view', path: app/src/client.rs, find: 'pub async fn bind_content_view(', plain: 'Binds a Notes view to its content instance and returns a ViewBinding.'}
      - {fn: 'Client::content_view', path: app/src/client.rs, find: 'pub fn content_view(', plain: 'Blocking content request from a Notes view (for example Update), refused if the view is not active.'}
      - {fn: 'Client::read_content_view', path: app/src/client.rs, find: 'pub async fn read_content_view(', plain: 'Async read-only content request (Describe, Inspect, ListNotes) from a Notes view.'}
      - {fn: 'Client::view_changed', path: app/src/client.rs, find: 'pub async fn view_changed(', plain: 'Waits for the next change to a view''s content, or for the view to retire.'}
      - {fn: 'Client::content_native_save', path: app/src/client.rs, find: 'pub fn content_native_save(', plain: 'The Notes host''s save path during Voyage close or rename; only Update is allowed.'}
