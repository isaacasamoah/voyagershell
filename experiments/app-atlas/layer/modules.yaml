    size: 4382
    note: 'This file holds the main request queue and is 4,382 lines. Lines 310 to 2117 are one function, start_with_launches, whose spawned thread is the owner loop. Its match handles each message family: content, worktree, process, terminal, observation and close messages finish in their own arms, while workspace requests and Notes exits fall through to a shared tail (lines 1562 to 2108) that dedupes, checks scope and version, applies the action to a copy of the layout, saves it to Core and notifies listeners. The public API follows at lines 2119 to 2627: async methods for GPUI tasks, and blocking methods that try_send (so a full 8-slot queue gives a busy refusal) and then wait 20 to 25 seconds. Helpers for terminal start, layout load and save, and Notes selection sit at lines 2778 to 3430, with test modules interleaved at 2687, 3432, 4033 and 4292. Client::quit asks Core to stop its whole session (server.stop), but the desktop''s Ctrl+Q handler at this commit (desktop/src/quit.rs) only quits the conversation client, so Core programs keep running.'
