        via: ipc
        symbol: '<voyager_app::conversation_client::Owner>::start_audio'
        says: 'Codex answers account/read; only an account of type chatgpt counts. start_audio then checks the voice package against the version the running Codex reported at initialize, captures the current dock focus with a workspace Inspect waited on by a short "voice-turn-focus" thread (kept as the opening focus), and calls voice_session::spawn.'
        fails: 'Another account type: "Native speech requires the existing ChatGPT account. No account or billing route was changed." Version mismatch: "The running Codex version does not match its native voice package. Audio did not open."'
      - id: ask-by-voice-6
        fn: 'Host::spawn'
        module: 'rs:voyager_app::voice_host'
        at: {path: app/src/voice_host.rs, find: 'let child = Command::new(&package.helper)'}
        runs_on: background
        via: call
        symbol: '<voyager_app::voice_host::Host>::spawn'
        says: 'On a new "native-voice" thread, voice_session::run starts the codex-voice-host helper from the Codex package folder with a cleared environment. Only the audio, proxy and certificate variables chosen by platform::audio_environment are passed in. A "voice-helper-reader" thread reads its frames; each frame is a 4-byte big-endian length followed by JSON (voice_wire), with a size bound.'
        fails: '"Native voice helper could not start".'
      - id: ask-by-voice-7
        fn: 'codex-voice-host (external helper)'
        module: 'ext:codex-voice-host'
        runs_on: program
        via: process
        inferred: true
        says: 'The helper answers Hello (protocol 1 and the build commit) with Ready, InitializeRuntime with RuntimeReady, and StartTransport with a WebRTC offer. How it opens the microphone and speaker and runs WebRTC is not in this repository.'
      - id: ask-by-voice-8
        fn: 'voice_session::run (offer)'
        module: 'rs:voyager_app::voice_session'
        at: {path: app/src/voice_session.rs, find: '.send(Event::Offer { generation, sdp })'}
        runs_on: background
        via: ipc
        symbol: 'voyager_app::voice_session::run'
        says: 'The worker marks the capability Compatible, sets the voice phase to Negotiating, sends the offer to the conversation owner on a 2-slot channel and waits up to 30 seconds for an answer.'
        fails: '"Native WebRTC offer was not produced" or "Private voice negotiation was not confirmed".'
      - id: ask-by-voice-9
        fn: 'Owner::audio_tick (StartAudio)'
        module: 'rs:voyager_app::conversation_client::audio'
        at: {path: app/src/conversation_audio.rs, find: 'let command = Command::StartAudio {'}
        runs_on: background
        via: channel
        symbol: '<voyager_app::conversation_client::Owner>::audio_tick'
        says: 'On each owner loop turn audio_event stores the offer. Once no provider request is pending and the opening focus has arrived, audio_tick sends thread/realtime/start: the thread id, a voyager-voice-<pid>-<generation> session id, the offer, WebRTC transport, voice "sol", version v3, the opening focus as an initial developer item, and the VOICE_INSTRUCTIONS prompt.'
      - id: ask-by-voice-10
        fn: 'Codex realtime session (external)'
        module: 'ext:codex'
        runs_on: program
        via: ipc
        inferred: true
        says: 'Codex app-server opens a realtime voice session for the thread with its service and returns thread/realtime/started and thread/realtime/sdp with the WebRTC answer. The service and how audio reaches it are outside this repository.'
      - id: ask-by-voice-11
        fn: 'Owner::realtime_event (Started, Answer)'
        module: 'rs:voyager_app::conversation_client::audio'
        at: {path: app/src/conversation_audio.rs, find: 'answer.try_send(sdp.clone()).map_err(|_| "Native voice negotiation is no longer waiting")?;'}
        runs_on: background
        via: ipc
        symbol: inlined
        symbol_caller: '<voyager_app::conversation_client::Owner>::receive'
        says: 'The Codex reader thread decodes these notifications into audio events. On Started with the same session id and version v3, the owner records the thread and session in the voice state. On the answer it hands the SDP, once, to the waiting native-voice thread.'
        fails: 'A different session id or version ends voice with "Native voice returned a different session identity".'
      - id: ask-by-voice-12
        fn: 'voice_session::run (answer, devices, Active)'
        module: 'rs:voyager_app::voice_session'
        at: {path: app/src/voice_session.rs, find: 'shared.update(generation, |state| state.phase = Phase::Active)?;'}
        runs_on: background
        via: channel
        symbol: 'voyager_app::voice_session::run'
        says: 'The worker sends ApplyAnswer and waits for TransportReady, sends OpenDevices with no explicit microphone or speaker (the helper''s defaults), then SetAudioControls with both on. The voice phase becomes Active, and every 50 ms the worker asks InspectAudio for the microphone and speaker peak levels.'
        fails: '"Native voice transport did not connect" or "Native microphone or speaker could not open"; any failure closes the helper and records the error.'
      - id: ask-by-voice-13
        fn: 'Speech::render (active)'
        module: 'rs:voyager_desktop::speech'
        at: {path: desktop/src/speech.rs, find: 'let label = if active { "Stop voice" } else { "Start voice" };'}
        runs_on: ui-thread
        via: render
        symbol: '<voyager_desktop::speech::Speech as gpui::element::Render>::render'
        says: 'Speech::observe polls the shared voice state every 50 ms while it is checking, preparing, negotiating, active or stopping. "Connecting voice…" shows under the button while preparing or negotiating; when Active the wave turns green and the button''s name becomes "Stop voice". With VOYAGER_VOICE_EVIDENCE set, each new state is written to that file.'
      - id: ask-by-voice-14
        fn: 'The person speaks (external audio path)'
        module: 'ext:codex-voice-host'
        runs_on: program
        via: ipc
        inferred: true
        says: 'The person says "open a terminal here". The audio goes from the microphone through the helper over WebRTC to the realtime session. The realtime model can answer by voice and, for workspace work, hands off to the backing Codex agent on the same thread, as VOICE_INSTRUCTIONS ask.'
      - id: ask-by-voice-15
        fn: 'voice_transcript::notification'
        module: 'rs:voyager_app::voice_transcript'
        at: {path: app/src/voice_transcript.rs, find: 'let id = format!("speech-{generation}:{}", value.item);'}
        runs_on: background
        via: ipc
        symbol: 'voyager_app::voice_transcript::notification'
        says: 'Transcript items from Codex (transcriptSegment items and transcript deltas) become chat messages with id speech-<generation>:<item> and role user or assistant in the shared snapshot. Each is capped at 64 KiB and the whole display at 256 KiB.'
        fails: 'At the cap the snapshot is marked limited with "The displayed voice transcript reached its limit..."; audio continues.'
      - id: ask-by-voice-16
        fn: 'Owner::voice_turn'
        module: 'rs:voyager_app::conversation_client::audio'
        at: {path: app/src/conversation_audio.rs, find: 'self.active = format!("voice-{generation}-{turn}");'}
        runs_on: background
        via: ipc
        symbol: '<voyager_app::conversation_client::Owner>::voice_turn::{closure#5}'
        says: 'When Codex reports turn/started on the voice thread and no text turn is starting, voice_turn binds that turn: phase Working, a fresh tool set and a request label voice-<generation>-<turn>. It holds early tool calls and messages, and captures the dock focus again with another Inspect on a "voice-turn-focus" thread, so tools act where the avatar is docked when the turn starts.'
        fails: '"Native voice started a different turn before the previous request completed. No tools were retargeted." The conversation becomes Unconfirmed.'
      - id: ask-by-voice-17
        fn: 'Owner::accept_scope'
        module: 'rs:voyager_app::conversation_client::audio'
        at: {path: app/src/conversation_audio.rs, find: 'self.context = Some(result?);'}
        runs_on: background
        via: channel
        symbol: '<voyager_app::conversation_client::Owner>::accept_scope'
        says: 'When the focus arrives for the same generation and turn, it becomes the turn''s Focus. Held messages are folded in and held tool calls go to Tools::call. From here the request follows the typed-text path: the scope check against the captured Fleet, create-content on the owner thread, the result back to Codex, and the header starting the terminal (ask-by-text steps 10 to 14, 17 and 18).'
      - id: ask-by-voice-18
        fn: 'Spoken and written reply (external)'
        module: 'ext:codex'
        runs_on: program
        via: ipc
        inferred: true
        says: 'The realtime session speaks a reply that the helper plays through the speaker. The backing turn''s text reply arrives as agentMessage events and its end as turn/completed, which the owner folds into the snapshot as for text (ask-by-text step 15). Assistant transcript segments arrive too.'
      - id: ask-by-voice-19
        fn: 'Chat.render (voice messages)'
        module: 'ts:desktop/mods/header/chat.ts'
        at: {path: desktop/mods/header/chat.ts, find: 'message.role === "user"'}
        runs_on: script
        via: script-call
        symbol: script
        says: 'If the chat is open, its observe loop shows the spoken words as You, tool outcomes as Workspace, and the spoken transcript and text reply as Voyager. If the chat is closed, nothing on screen except the voice control reflects the voice turn, though the snapshot still records it.'
    branches:
      - name: 'The person stops voice'
        from: ask-by-voice-13
        steps:
          - id: ask-by-voice-13a
            fn: 'Speech::activate (stop)'
            module: 'rs:voyager_desktop::speech'
            at: {path: desktop/src/speech.rs, find: 'if let Err(error) = audio.stop() {'}
            runs_on: ui-thread
            via: call
            symbol: '<voyager_desktop::speech::Speech>::activate'
            says: 'Clicking "Stop voice" calls AudioLease::stop. voice::Shared::stop marks the run stopping, sets the phase to Stopping and kills the helper process through its Cancellation.'
          - id: ask-by-voice-13b
            fn: 'Owner::audio_tick (StopAudio)'
            module: 'rs:voyager_app::conversation_client::audio'
            at: {path: app/src/conversation_audio.rs, find: 'self.rpc(Command::StopAudio { thread })?;'}
            runs_on: background
            via: channel
            symbol: '<voyager_app::conversation_client::Owner>::audio_tick'
            says: 'The native-voice thread ends and records the helper''s exit. audio_tick sees the generation is no longer current and sends thread/realtime/stop. Once Codex reports the session closed and the stop is acknowledged, the realtime record is cleared and the voice phase returns to Off.'
      - name: 'Voice is unavailable or refused'
        from: ask-by-voice-5
        steps:
          - id: ask-by-voice-5a
            fn: 'Speech::render (disabled)'
            module: 'rs:voyager_desktop::speech'
            at: {path: desktop/src/speech.rs, find: '.disabled(unavailable || self.pending || stopping)'}
            runs_on: ui-thread
            via: render
            symbol: '<voyager_desktop::speech::Speech as gpui::element::Render>::render'
            says: 'With capability Unavailable (no codex on the path, no voice package, an unsupported manifest) the button stays disabled and its tooltip shows the reason. Text chat is unaffected.'
          - id: ask-by-voice-5b
            fn: 'Owner::receive (provider refusal)'
            module: 'rs:voyager_app::conversation_client'
            at: {path: app/src/conversation_client.rs, find: 'self.audio.end(Some("The provider refused native voice. Text and accepted work remain available.".into()))?;'}
            runs_on: background
            via: ipc
            symbol: '<voyager_app::conversation_client::Owner>::receive'
            says: 'If Codex refuses account/read or thread/realtime/start, voice ends with "The provider refused native voice. Text and accepted work remain available." The text conversation keeps working.'
      - name: 'A voice turn starts while a text turn is still running'
        from: ask-by-voice-16
        steps:
          - id: ask-by-voice-16a
            fn: 'Owner::voice_turn refusal'
            module: 'rs:voyager_app::conversation_client::audio'
            at: {path: app/src/conversation_audio.rs, find: 'return Err("Native voice started a different turn before the previous request completed. No tools were retargeted.".into());'}
            runs_on: background
            via: call
            symbol: inlined
            symbol_caller: '<voyager_app::conversation_client::Owner>::receive'
            says: 'voice_turn refuses to rebind tools while a tool effect is busy or the phase is Working, Starting or Unconfirmed. The owner loop marks the conversation Unconfirmed with this message, and later sends are refused until the state is resolved.'
    better:
      - step: ask-by-voice-19
        idea: 'Show voice activity, such as a live transcript line or a working indicator, when the chat is closed.'
        why: 'During a voice turn the only visible sign is the green wave on the voice control.'
        inferred: true
      - step: ask-by-voice-16
        idea: 'Tell the person when a voice turn''s dock focus differs from the focus the voice session opened with.'
        why: 'Each delegated turn captures the dock at its start, so moving the avatar mid-conversation silently changes where later spoken requests act.'
        inferred: true
      - step: ask-by-voice-1
        idea: 'Re-check voice capability after Codex is installed or updated without restarting Voyager.'
        why: 'The check runs once when the conversation owner starts, so a later install leaves the control disabled.'
        inferred: true
    open_questions:
      - 'What codex-voice-host does inside, including device choice and WebRTC, and how audio reaches Codex''s realtime service, is not in this repository.'
      - 'Whether the realtime model''s hand-off to the backing Codex agent always arrives as an ordinary turn/started on the same thread. Voyager binds any such turn while voice is live.'
      - 'Whether the spoken reply''s assistant transcript and the backing turn''s text reply both appear in the chat, which would look like a duplicate.'
      - 'The existing proving journey (tests/native/proof_voice.py) records "intelligibleSpeechTested" as false; no checked-in test feeds real speech through the helper.'
      - 'Whether the helper can use a virtual microphone and speaker under Xvfb depends on its default-device behaviour and the PulseAudio or PipeWire variables passed to it.'
    common: true
    not_run: 'Not run yet. Voice opens your real microphone and streams the audio to OpenAI through the Codex voice helper, so it needs you present and your go-ahead.'
  - id: launch-agent
    name: 'Start a terminal agent in a Vessel'
    trigger: 'The person opens the content picker for a new or split Vessel and chooses an agent entry such as Codex or Claude.'
    summary: 'The header''s content picker asks the owner thread for the launch catalog, which comes from the profile''s launches.json and is checked against the PATH. Choosing an entry sends create-content with that launch; the owner creates the Vessel and records a one-time permission to start it. The header then opens the terminal, the owner asks Herdr Core to run the agent wrapped in an interactive bash, and the Agents list later recognises the running program from Core''s process list.'
    steps:
      - id: launch-agent-1
        fn: CreationPicker.open
        module: 'ts:desktop/mods/header/creation.ts'
        at: {path: desktop/mods/header/creation.ts, find: 'const metadata = await Promise.allSettled([launches(), descriptions()]);'}
        runs_on: script
        via: call
        says: 'Opening a split or empty Fleet area opens the picker for that destination. It asks the host for the launch catalog and the content type descriptions at the same time, and validates both against the contract schemas.'
        carries: 'The destination: a panel in a Fleet (beside a Vessel or empty) or a new Fleet.'
        fails: 'Validation or host errors are collected and shown in the picker.'
        symbol: script
      - id: launch-agent-2
        fn: 'launch::catalog'
        module: 'rs:voyager_app::launch'
        at: {path: app/src/launch.rs, find: 'pub fn catalog(path: Option<&Path>, cwd: &str) -> Result<Catalog, String> {'}
        runs_on: owner-thread
        via: channel
        says: 'The launches host function sends Message::Launches to the owner thread, which calls catalog. It reads the profile''s launches.json (seeded on first run with Terminal, Codex and Claude), checks it is at most 8 KiB with unique ids and a valid default, and looks up each entry''s executable on the PATH. Entries that resolve are listed as available.'
        carries: 'Catalog {settings with entries and default, available ids, errors, path}.'
        fails: 'An invalid launches.json makes the whole catalog an error, shown in the picker.'
        symbol: 'voyager_app::launch::catalog'
      - id: launch-agent-3
        fn: CreationPicker.render
        module: 'ts:desktop/mods/header/creation.ts'
        at: {path: desktop/mods/header/creation.ts, find: 'chosen(opening.destination, "terminal", launch),'}
        runs_on: script
        via: render
        says: 'The picker shows one button per available entry, default first, such as ''Create Codex Vessel''. Clicking builds a create-content action with typeId terminal and the entry''s launch, or create-fleet-with-content for a new Fleet.'
        carries: '{operation: create-content, destination, typeId: terminal, launch: {kind: codex, model, effort, permissions} or {kind: program, argv}}.'
        symbol: script
      - id: launch-agent-4
        fn: 'Workspace.creationControl callback'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'this.run(action, cx, undefined, version);'}
        runs_on: script
        via: call
        says: 'The header runs the action with the version the picker opened at. run calls invoke from the generated workspace wrapper, which goes to the host call function and Client::call on the owner queue.'
        fails: 'If another workspace request is pending: ''Wait for the pending workspace request. No Vessel was created.'''
        symbol: script
      - id: launch-agent-5
        fn: 'Model::apply (Action::CreateContent)'
        module: 'rs:voyager_app::workspace'
        at: {path: app/src/workspace.rs, find: 'let panel = self.placement(cwd, type_id, name, launch)?;'}
        runs_on: owner-thread
        via: channel
        says: 'With no captured scope the authority check passes. The owner confirms the content type is available; apply allows a launch only on terminal content and validates it with launch::argv, then stores a Content with the launch and no Core terminal, and a Vessel placed in the split. The layout is saved to Core.'
        fails: 'Refused for an unsupported type, a launch on non-terminal content, an empty model or executable, or a stale version.'
        symbol: '<voyager_app::workspace::Model>::apply'
      - id: launch-agent-6
        fn: record_created_terminals
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn record_created_terminals('}
        runs_on: owner-thread
        via: call
        says: 'The owner remembers the new terminal with its exact launch as a one-time permission to start it. The reply''s createdContents lists it, so the header knows it may start this Vessel.'
        carries: 'CreatedTerminal {content id, launch}.'
        symbol: inlined
        symbol_caller: '<voyager_app::client::Client>::start_with_launches::{closure#0}::{closure#47}::{closure#14}'
      - id: launch-agent-7
        fn: Workspace.prepare
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'opened = await openTerminal(vessel.content, this.version);'}
        runs_on: script
        via: script-call
        says: 'After the applied reply, prepare walks the visible Vessels and calls openTerminal for terminals listed in createdContents, then inspects again to pick up the bound terminal.'
        carries: 'TerminalRequest {requestId, contentId, expectedVersion}.'
        symbol: script
      - id: launch-agent-8
        fn: 'terminal_open host function'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: '.async_function("terminal_open", move |arguments| {'}
        runs_on: background
        via: script-call
        says: 'Checks the request size and ids, then calls Client::terminal, which queues Message::Terminal and waits up to 25 seconds. The owner refuses reused ids, a stale or uninspected layout, a closing Voyage, an earlier unconfirmed start, or created content that is not visible.'
        fails: 'Refusals return as a TerminalResponse with status rejected and a message; a timeout is uncertain: ''Terminal result unconfirmed; no request was repeated''.'
        symbol: inlined
        symbol_caller: '<gpui_shell::host_modules::HostModule>::async_function::<voyager_desktop::host::load::{closure#10}::{closure#1}, &str, voyager_desktop::host::load::{closure#10}>::{closure#0}'
      - id: launch-agent-9
        fn: 'open_terminal (start marker)'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'item.start_pending = Some(operation.clone());'}
        runs_on: owner-thread
        via: channel
        says: 'open_terminal checks that the stored launch still matches the recorded permission, then writes a start-pending marker named voyager-start-<request id> into the layout and saves it before asking Core to start anything. If anything goes wrong later, the marker shows a start may exist.'
        fails: 'A changed launch is refused: ''The creation launch changed; no program was started''. A saved worker without the permission is refused: ''This saved worker has no new-creation permission; no command was restarted''.'
        symbol: 'voyager_app::client::open_terminal'
      - id: launch-agent-10
        fn: 'launch::shell_command'
        module: 'rs:voyager_app::launch'
        at: {path: app/src/launch.rs, find: 'fn shell_command(launch: &Launch, args: Vec<String>) -> Result<Vec<String>, String> {'}
        runs_on: owner-thread
        via: call
        says: 'terminal_command builds the argv. For Codex it is codex --no-daemon --model <model> with the reasoning effort and permission flags; the executable is resolved on the PATH to a full path. Known agent programs are wrapped as bash -i -c with a script that runs the agent and then execs an interactive bash, so the Vessel keeps a shell after the agent exits. Arguments stay literal.'
        carries: 'argv, for example [/usr/bin/bash, -i, -c, <script>, voyager-agent, /path/to/codex, --no-daemon, ...].'
        fails: 'A missing executable: ''Executable <name> is unavailable''. The marker is then cleared and the start is refused.'
        symbol: inlined
        symbol_caller: 'voyager_app::launch::terminal_command'
      - id: launch-agent-11
        fn: 'Core::terminal_run_with'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: 'self.call("terminal.run", params)'}
        runs_on: owner-thread
        via: core-rpc
        says: 'Sends terminal.run to Herdr Core over its socket with the argv, the Vessel''s working directory, no_parent, and a voyager-operation label matching the marker.'
        symbol: '<voyager_app::core::Core>::terminal_run_with'
      - id: launch-agent-12
        fn: 'terminal.run (Herdr Core)'
        module: 'ext:hc'
        runs_on: core
        via: process
        says: 'Herdr Core starts the program in a new terminal it owns and returns the terminal''s address and state. The program keeps running in Core even if Voyager''s viewer detaches.'
        symbol: external
      - id: launch-agent-13
        fn: 'open_terminal (bind and attach)'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'item.backend = Some(CoreTerminalId(address.clone()));'}
        runs_on: owner-thread
        via: core-rpc
        says: 'If Core reports the terminal live or finished, the owner stores the Core address on the content, clears the marker, saves the layout and sends terminal.attach to get a viewer.'
        fails: 'A start that is still pending, or a failed save after start, is recorded as unconfirmed and returned as Uncertain; nothing is started again.'
        symbol: 'voyager_app::client::open_terminal'
      - id: launch-agent-14
        fn: install_viewer
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: '.and_then(|viewer| install_viewer(&viewers, &request.content_id.0, viewer));'}
        runs_on: background
        via: channel
        says: 'The viewer is registered for the content so the native terminal view can show the screen Core streams. The header marks the opening applied and creates the terminal''s script state; the person now sees the agent running in the Vessel.'
        symbol: 'voyager_desktop::host::load::{closure#10}::{closure#1}'
      - id: launch-agent-15
        fn: 'Workspace.startContext loop'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'await this.readProcesses(task);'}
        runs_on: script
        via: call
        says: 'Every 3 seconds, if an Agents Vessel is visible, and after every accepted workspace snapshot, the header reads processes. inspectProcesses calls the processes host function, which calls Client::process with the whole-workspace scope and a List action.'
        fails: 'A stale revision or owner error empties the list and keeps the message, which the Agents list shows as unavailable.'
        symbol: script
      - id: launch-agent-16
        fn: 'process::start (List)'
        module: 'rs:voyager_app::process'
        at: {path: app/src/process.rs, find: 'let listed = core.terminal_list()?;'}
        runs_on: owner-thread
        via: channel
        says: 'The owner reloads the layout from Core and requires the same revision, then asks Core for its terminal list and builds a ProcessInfo for every terminal content that has a Core address.'
        carries: 'ProcessInfo {contentId, terminalId, pid, cwd, state, foreground program, agentName, placementNames, reportedActivity}.'
        fails: '''Inspect the current workspace revision before using processes'' when the revision moved on.'
        symbol: 'voyager_app::process::start'
      - id: launch-agent-17
        fn: 'observation::conversation_name'
        module: 'rs:voyager_app::observation'
        at: {path: app/src/observation.rs, find: 'pub(crate) fn conversation_name(terminal: &Terminal) -> Option<String> {'}
        runs_on: owner-thread
        via: call
        says: 'process::info names the agent. If the foreground program is a known agent and its terminal title looks like a session name, the title is used; otherwise agent_name uses the folder of the live working directory. effective_name gives each Vessel''s display name, and reported activity is parsed from Core''s terminal metadata.'
        symbol: 'voyager_app::observation::conversation_name'
      - id: launch-agent-18
        fn: agentsView
        module: 'ts:desktop/mods/header/agents.ts'
        at: {path: desktop/mods/header/agents.ts, find: 'const agent = recognized ? AGENT_NAMES[recognized] : undefined;'}
        runs_on: script
        via: render
        says: 'The Agents list makes a row for each live terminal Vessel, plus visible Notes and Agents Vessels; terminals without a live process are left out. It recognises the agent from the foreground program name (codex shows as Codex), groups rows by reported activity (Needs attention, Working, Done, Idle) and lets the person click a row to reveal its Vessel.'
        symbol: script
    branches:
      - name: 'Start the agent in a new Git worktree'
        from: launch-agent-1
        steps:
          - id: launch-agent-1a
            fn: 'worktree call'
            module: 'ts:desktop/mods/header/worktrees.ts'
            at: {path: desktop/mods/header/worktrees.ts, find: 'const raw: unknown = JSON.parse(await worktree(JSON.stringify(request)));'}
