    better:
      - step: split-vessel-8
        idea: 'Wait for workspace replies on an async channel, as launches already does, instead of a blocking recv_timeout.'
        why: 'Each call occupies a background executor thread for up to 20 seconds while the owner works.'
        inferred: true
      - step: split-vessel-20
        idea: 'Send a WorkspaceNotice when open_terminal saves a new layout version.'
        why: 'The Terminal message path changes the version twice but sends no notice itself, so other observers rely on an activity notice or their own inspect to see the backend.'
