        says: 'task.notify() makes GPUI re-render the header. render places the canvas regions with composeCanvas, and the active Fleet region walks the split tree in pane: each branch becomes a native Split with its axis and share, and each leaf goes to renderPanel, which shows Terminal.new(state) for the new terminal.'
        carries: 'Split axis, share, layout version and the splitReset counter.'
      - id: split-vessel-25
        fn: 'Split::materialize / TerminalMaterializer::materialize'
        module: 'rs:voyager_desktop::split'
        at: {path: desktop/src/split.rs, find: 'impl ComponentMaterializer for Split {'}
        runs_on: ui-thread
        via: render
        says: 'The Rust Split component turns the script''s request into a gpui-base resizable panel group with two children, keeping per-split state keyed by id; a measuring canvas sets panel sizes from the share after layout. The terminal child renders the Pane entity, whose task pumps output from the viewer into the screen.'
        fails: 'A Split without exactly two children fails to render.'
    branches:
      - name: 'Corner split control instead of the shortcut'
        from: split-vessel-2
        steps:
          - id: split-vessel-b1-1
            fn: Workspace.splitControl
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: '  splitControl('}
            runs_on: script
            via: render
            says: 'Each Vessel''s title row has two split buttons that appear on hover. splitControl wraps each in creationControl with the destination beside this Vessel and the picker id split-<vessel>-<side>.'
          - id: split-vessel-b1-2
            fn: 'CreationPicker.render (Popover on_open_change)'
            module: 'ts:desktop/mods/header/creation.ts'
            at: {path: desktop/mods/header/creation.ts, find: 'this.open(id, destination, version, cx, hidden);'}
            runs_on: script
            via: call
            says: 'Clicking the button opens the popover, and on_open_change calls open. From here the path joins split-vessel-4.'
      - name: 'Core refuses the layout write as stale'
        from: split-vessel-13
        steps:
          - id: split-vessel-b2-1
            fn: 'owner thread result mapping'
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'if inspecting || kind == "conflict" {'}
            runs_on: owner-thread
            via: call
            says: 'On a conflict the owner keeps its old layout, marks its snapshot not fresh and replies rejected with Core''s message. Every later change is refused until the header inspects.'
          - id: split-vessel-b2-2
            fn: Workspace.run
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: 'if (!prepared) this.pendingShortcuts = [];'}
            runs_on: script
            via: script-call
            says: 'The header shows the message, skips prepare and drops any queued shortcuts. No terminal is started.'
      - name: 'Terminal start is unconfirmed'
        from: split-vessel-20
        steps:
          - id: split-vessel-b3-1
            fn: open_terminal
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: '"Terminal start {operation} is unconfirmed: {message}. Inspect Core terminals with voyager-operation={operation}; no start was repeated"'}
            runs_on: owner-thread
            via: call
            says: 'If terminal.run comes back uncertain, the owner stores the message against the content and returns uncertain. The start_pending marker stays in the saved layout.'
          - id: split-vessel-b3-2
            fn: Workspace.terminalStatus
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: 'return "Terminal start is unconfirmed. Inspect before trying again.";'}
            runs_on: script
            via: render
            says: 'The new Vessel shows that the start is unconfirmed instead of a terminal. Asking again returns the same uncertain message, so Voyager never starts a second program on its own.'
    better:
      - step: split-vessel-8
        idea: 'Wait for workspace replies on an async channel, as launches already does, instead of a blocking recv_timeout.'
        why: 'Each call occupies a background executor thread for up to 20 seconds while the owner works.'
        inferred: true
      - step: split-vessel-20
        idea: 'Send a WorkspaceNotice when open_terminal saves a new layout version.'
        why: 'The Terminal message path changes the version twice but sends no notice itself, so other observers rely on an activity notice or their own inspect to see the backend.'
        inferred: true
      - step: split-vessel-3
        idea: 'Track the last clicked Vessel from keyboard focus as well as mouse-down.'
        why: 'this.focused changes on mouse-down, the maximize menu item and layout changes, but not when keyboard focus moves, so the split target can differ from the terminal the person is typing in.'
        inferred: true
    open_questions:
      - 'How many threads the GPUI background executor has, and so whether blocking host calls can starve other background work, is not visible in this repository.'
      - 'What Herdr Core runs for terminal.run with an empty argv (login shell, a fixed shell or something else) is decided inside Core, which is not in this repository.'
      - 'When the new Pane first resizes the Core terminal to the split''s real size was not traced; it lives in desktop/src/terminal.rs.'
  - id: notes-save
    name: 'Edit and save a note'
    trigger: 'The person types in a Notes Vessel''s title or body, then moves focus out of the editor.'
    summary: 'Typing goes into a native gpui-base editor owned by a Rust Session, which keeps a draft and marks it dirty; the Notes script only places the editor. When focus leaves the editor, the Session sends one content Update to the app''s owner thread, which checks the draft''s base revision, writes the Markdown file in the Voyage''s notes folder by replacing it atomically, and confirms by reading it back. The owner then wakes the Session''s read loop, and every placement of that note shows the same Session, so they all update together.'
    steps:
      - id: notes-save-1
        fn: Notes.render
        module: 'ts:content/notes/main.ts'
        at: {path: content/notes/main.ts, find: ': Body.new(this.text).w_full().flex_1().min_h(0).py(16).text_size(13),'}
        runs_on: script
        via: render
        says: 'The Notes package script renders the title and body editors. this.text is a RetainedBodyState made in init(); its constructor returns the Rust Session''s text editor, so the draft lives in Rust and survives a reload of the package script.'
      - id: notes-save-2
        fn: 'Body::materialize'
        module: 'rs:voyager_desktop::notes_input'
        at: {path: desktop/src/notes_input.rs, find: '.child(Textarea::new(&state));'}
        runs_on: ui-thread
        via: render
        says: 'The Rust Body component renders a gpui-base Textarea bound to that editor state. The native Textarea handles each keystroke and emits InputEvent::Change; the script does not re-render per keystroke.'
        inferred: true
      - id: notes-save-3
        fn: 'Session::changed -> Draft::changed'
        module: 'rs:voyager_desktop::notes_session'
        at: {path: desktop/src/notes_session.rs, find: '    fn changed(&mut self, field: Field, cx: &mut Context<Self>) {'}
        runs_on: ui-thread
        via: call
        says: 'The Session subscribes to both editors. On Change it compares the value with the last observed one and, if different, Draft::changed marks the field touched, bumps the draft generation and sets dirty. Nothing is written yet and there is no timed autosave.'
        carries: 'Which field changed (title or text).'
      - id: notes-save-4
        fn: 'Session::new (Blur subscription)'
        module: 'rs:voyager_desktop::notes_session'
        at: {path: desktop/src/notes_session.rs, find: 'let text_events = cx.subscribe(&text, |session, _, event: &InputEvent, cx| match event {'}
        runs_on: ui-thread
        via: call
        says: 'The save trigger is focus leaving the title or body: InputEvent::Blur calls Session::save with the Native intent. SessionState also has a save() method for scripts, but content/notes/main.ts does not call it.'
      - id: notes-save-5
        fn: 'Session::save'
        module: 'rs:voyager_desktop::notes_session'
        at: {path: desktop/src/notes_session.rs, find: '    pub fn save(&mut self, intent: Intent, cx: &mut Context<Self>) {'}
        runs_on: ui-thread
        via: call
        says: 'save needs an active view binding and a Save from the draft. It builds a content Update with the draft''s base revision and the full title and text, adds the Voyage-close ticket if a close lease is held, and runs the blocking call on the background executor.'
        carries: 'Update {requestId, contentId, expectedRevision, data {title, text}}.'
        fails: 'If the selected file changed under a dirty draft, the status reads ''The selected file changed while this draft was open; the draft is retained'' and nothing is sent. A retired view sends nothing.'
      - id: notes-save-6
        fn: 'Draft::blur'
        module: 'rs:voyager_desktop::notes_draft'
        at: {path: desktop/src/notes_draft.rs, find: '    pub fn blur(&mut self) -> Option<Save> {'}
        runs_on: ui-thread
        via: call
        says: 'Draft::blur allows one save at a time. It returns nothing for a clean draft or for a generation whose earlier save is unconfirmed, so an unknown result is never replayed. If no base revision has been read yet or a save is running, it records a pending blur that fires when the read or save finishes.'
      - id: notes-save-7
        fn: 'Client::content_native_save -> Client::content_inner'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: '    pub fn content_native_save('}
        runs_on: background
        via: channel
        says: 'Only Update is allowed on this path. content_inner checks the envelope size, holds the view gate''s lock to confirm the view is Active rather than Pending or Retired, try_sends a Content message marked native_save to the owner, and blocks up to 25 seconds.'
        fails: '''Notes view was retired; nothing was queued'', ''Workspace busy; no content operation was queued'', or after 25 seconds ''Content result unconfirmed; do not repeat the request''.'
      - id: notes-save-8
        fn: 'owner thread: Content message admission'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: '"This Voyage is closing; its Notes are temporarily read-only"'}
        runs_on: owner-thread
        via: channel
        says: 'A repeat of a recent request id returns the stored response. Otherwise the owner refuses during a Notes rename, while the Voyage is closing (unless this native save carries the close ticket), while quitting, and for invalid, reused or oversized requests.'
        fails: 'Refusals become a content Rejected response, for example ''This Voyage is closing; its Notes are temporarily read-only''.'
      - id: notes-save-9
        fn: 'load (layout read from Core)'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'let doc = core.document_get("voyager-layout-v1")?;'}
        runs_on: owner-thread
        via: core-rpc
        says: 'Before running the request, the owner re-reads the layout document from Herdr Core with doc.get and adopts it, so the Note''s placement and file binding are checked against the latest saved layout.'
        fails: 'If Core does not answer, the save is refused with the Core error.'
        inferred: true
      - id: notes-save-10
        fn: 'content::run -> content::admit'
        module: 'rs:voyager_app::content'
        at: {path: app/src/content.rs, find: 'pub(crate) fn admit('}
        runs_on: owner-thread
        via: call
        says: 'admit checks that the view''s binding is for this content and that a Notes placement for it is in the layout. register_content then binds the content to its Markdown file from the layout''s Notes configuration, or to a legacy JSON file in the profile''s data folder.'
        fails: '''That content is outside this view'' or ''That Notes instance is outside the captured workspace scope''.'
      - id: notes-save-11
        fn: 'Owner::dispatch (Request::Update revision check)'
        module: 'rs:voyager_app::content'
        at: {path: app/src/content.rs, find: 'if current.revision != expected_revision {'}
        runs_on: owner-thread
        via: file
        says: 'The owner reads the file and takes its revision as the SHA-256 of its bytes. If that differs from the draft''s base revision, the save is refused, so an edit made elsewhere (another editor or an agent) is not overwritten.'
        fails: 'Refused with ''Portal data changed. Read it again before saving.'' A schema warning on the current data also refuses.'
      - id: notes-save-12
        fn: 'Owner::dispatch (Markdown write)'
        module: 'rs:voyager_app::content'
        at: {path: app/src/content.rs, find: 'let bytes = match markdown::encode(&data) {'}
        runs_on: owner-thread
        via: file
        says: 'markdown::encode writes ''# Title'', a blank line, then the text. The owner writes that to a hidden .<name>.tmp beside the file with the original permissions, syncs it and renames it over the note, so the file is replaced in one step. The file is <Voyage folder>/notes/<name>.md; the note text is not stored in Core.'
        fails: 'Errors before the rename are refused and the temporary file is removed. A failed rename is uncertain.'
      - id: notes-save-13
        fn: finish_write
        module: 'rs:voyager_app::content'
        at: {path: app/src/content.rs, find: 'fn finish_write('}
        runs_on: owner-thread
        via: file
        says: 'The owner reads the file back. It reports Applied with the new snapshot only if the fresh read''s revision equals the hash of the bytes it wrote.'
        fails: 'Otherwise the result is Uncertain, for example ''Data changed after replacement''.'
      - id: notes-save-14
        fn: 'Owner::notify and Content reply'
        module: 'rs:voyager_app::content'
        at: {path: app/src/content.rs, find: '    pub(crate) fn notify(&mut self, response: &Response) {'}
        runs_on: owner-thread
        via: channel
        says: 'Owner::call passes the response to notify, which bumps this content''s change counter and wakes its subscriber. The client then bounds the response size, stores it as a receipt for repeat detection, refreshes Notes views and sends a WorkspaceNotice if the layout version moved, and delivers the reply.'
        carries: 'Content Response (Applied with the new snapshot and revision, Rejected or Uncertain).'
      - id: notes-save-15
        fn: 'Draft::finish'
        module: 'rs:voyager_desktop::notes_draft'
        at: {path: desktop/src/notes_draft.rs, find: '    pub fn finish(&mut self, generation: u64, response: Result<&Response, &CallError>) -> bool {'}
        runs_on: ui-thread
        via: channel
        says: 'The save task returns to the UI thread. Applied moves the base revision to the saved one and, if nothing was typed during the save, clears dirty and sets status ''Saved''. A rejection keeps the draft dirty with the message; an uncertain or timed-out result marks this generation unconfirmed. A blur that arrived during the save triggers another save.'
      - id: notes-save-16
        fn: 'Session::observe'
        module: 'rs:voyager_desktop::notes_session'
        at: {path: desktop/src/notes_session.rs, find: '    fn observe(&mut self, view: ViewBinding, window: &mut Window, cx: &mut Context<Self>) {'}
        runs_on: ui-thread
        via: channel
        says: 'The Session''s read loop wakes on the change counter, sends an Inspect read through the same owner and hydrates the editors. Draft::load will not replace a dirty or diverged draft and only fills untouched fields, so outside changes arrive without overwriting typing.'
        fails: 'If the file changed elsewhere, the status reads ''Notes changed outside this draft. Its original revision is retained.'' and the draft keeps its old base.'
      - id: notes-save-17
        fn: 'Note::new (Session observer)'
        module: 'rs:voyager_desktop::notes'
        at: {path: desktop/src/notes.rs, find: 'let observer = cx.observe(&session, |note, _, cx| {'}
        runs_on: ui-thread
        via: render
        says: 'The Note view observes the Session. Each notify from the Session refreshes the mounted script view, so the status line from session.status() shows ''Saved'' or the error.'
      - id: notes-save-18
        fn: 'Notes host component'
        module: 'rs:voyager_desktop::notes'
        at: {path: desktop/src/notes.rs, find: 'let cached = host.views.borrow().get(&id).cloned();'}
        runs_on: ui-thread
        via: render
        says: 'The header renders Notes.new(contentId) in every placement of the content, and the host returns the cached Note view for that content id. All placements share one Session, one draft and one script view, so no separate update is sent between them.'
      - id: notes-save-19
        fn: 'Notes.render (preview)'
        module: 'ts:content/notes/main.ts'
        at: {path: content/notes/main.ts, find: '? TextView.markdown("notes-preview-body", this.text.value())'}
        runs_on: script
        via: render
        says: 'The preview toggle swaps the editor for a Markdown TextView built from the editor''s current value, so the preview shows the unsaved draft, not the saved file.'
    branches:
      - name: 'Voyage close flushes the draft under a close lease'
        from: notes-save-4
        steps:
          - id: notes-save-b1-1
            fn: 'Host::watch_close_saves'
            module: 'rs:voyager_desktop::notes'
            at: {path: desktop/src/notes.rs, find: 'pending.push(session.update(cx, |session, cx| session.flush_for_close(ticket.clone(), cx)));'}
            runs_on: ui-thread
            via: channel
            says: 'When a Voyage close is confirmed, the owner asks the desktop to prepare that Voyage''s Notes. The desktop refuses for a legacy view, then calls flush_for_close on each Session with the close ticket.'
          - id: notes-save-b1-2
            fn: 'Session::flush'
            module: 'rs:voyager_desktop::notes_session'
            at: {path: desktop/src/notes_session.rs, find: '    fn flush('}
            runs_on: ui-thread
            via: call
            says: 'flush makes both editors read-only, records a CloseLease with the ticket, and saves a dirty draft with the Close intent. The close waits until the draft is clean; an unconfirmed or failed save is reported back and stops the close.'
          - id: notes-save-b1-3
            fn: 'Closing::blocks_content'
            module: 'rs:voyager_app::voyage_close'
            at: {path: app/src/voyage_close.rs, find: '    pub fn blocks_content('}
            runs_on: owner-thread
            via: call
            says: 'While the close holds its ticket, every change to those Notes is refused except a native save that carries the same ticket.'
      - name: 'Save refused because the file changed elsewhere'
        from: notes-save-11
        steps:
          - id: notes-save-b2-1
            fn: 'Owner::dispatch (Request::Update)'
            module: 'rs:voyager_app::content'
            at: {path: app/src/content.rs, find: 'return rejected("Portal data changed. Read it again before saving.".into());'}
            runs_on: owner-thread
            via: call
            says: 'The file''s revision no longer matches the draft''s base, so nothing is written.'
          - id: notes-save-b2-2
            fn: 'Draft::load'
            module: 'rs:voyager_desktop::notes_draft'
            at: {path: desktop/src/notes_draft.rs, find: '"Notes changed outside this draft. Its original revision is retained."'}
            runs_on: ui-thread
            via: channel
            says: 'Draft::finish keeps the draft dirty. The read loop will not rebase a dirty draft, so it keeps the old base, and the next blur is refused the same way.'
            inferred: true
      - name: 'Save confirmation is lost'
        from: notes-save-7
        steps:
          - id: notes-save-b3-1
            fn: 'Client::content_inner'
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'CallError::Unconfirmed("Content result unconfirmed; do not repeat the request".into())'}
            runs_on: background
            via: channel
            says: 'No reply arrives within 25 seconds, so the call returns unconfirmed. The write may or may not have happened.'
          - id: notes-save-b3-2
            fn: 'Draft::finish'
            module: 'rs:voyager_desktop::notes_draft'
            at: {path: desktop/src/notes_draft.rs, find: 'self.unconfirmed = Some(generation);'}
            runs_on: ui-thread
            via: call
            says: 'finish marks this generation unconfirmed, and blur will not resend it. The next edit makes a new generation that can be saved; if the lost write had landed, that save is refused as a revision change.'
            inferred: true
    better:
      - {step: notes-save-11, idea: 'Use a Notes-specific message for a revision conflict.', why: 'The refusal says ''Portal data changed'' even when the note is in a Vessel.', inferred: true}
      - step: notes-save-16
        idea: 'Offer a way to reload or rebase a draft after a revision conflict.'
        why: 'Draft::load keeps a dirty draft''s stale base, so later saves keep failing, and opening another note is blocked until the draft is saved.'
        inferred: true
      - step: notes-save-4
        idea: 'Consider saving after a pause in typing as well as on blur.'
        why: 'Typed text exists only in the in-memory editor until focus leaves it, so a crash loses everything since the last blur.'
        inferred: true
    open_questions:
      - 'Every placement of the same content gets the same cached Note view. Whether GPUI renders one entity in two places in one frame without problems was not established from source.'
      - 'Owner::subscribe keeps one listener per content id, so a second subscriber would replace the Session''s. Nothing else subscribes today (content/notes/main.ts does not call changed), so the effect was not traced.'
      - 'After a save, the save task and the read loop both update the Session on the UI thread; whether the follow-up read can overwrite the ''Saved'' status depends on their order, which the source does not fix.'
  - id: assistant-request
    name: 'Dock the avatar on a Fleet and ask Voyager for something'
    trigger: 'The person drags the avatar onto a Fleet tab (or presses Shift+Enter on it), then types a request such as ''open a terminal in this tab'' in the avatar chat.'
    summary: 'Docking sends a Dock request through the app''s single owner thread, which records the Fleet as the layout''s context and prepares a short preview of what is on screen there. When the person sends a chat message, the private conversation owner inspects the workspace, freezes the dock focus into the message and starts a turn in a Codex app-server child process. Codex calls a Voyager tool, the call is checked against the frozen focus and run through the same owner queue the UI uses, the result goes back to Codex and into the chat, and the desktop header later starts the new terminal through Herdr Core.'
    steps:
      - id: assistant-request-1
        fn: 'Avatar::released'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: 'fn released(&mut self, event: &gpui::MouseUpEvent'}
        runs_on: ui-thread
        via: call
        says: 'When the person lets go of a moved avatar, Geometry::target_at looks for the dock target under the pointer and, if one is found, calls Avatar::dock with its scope. The header script registers each Fleet tab as a target through the avatar module''s Target component, which records the tab''s scope and painted bounds.'
        carries: 'The pointer position and the target''s scope, here {kind: fleet, id} (the contract Context enum in contract/src/lib.rs).'
        fails: 'If no target is under the pointer, the avatar does not dock; a floating avatar simply moves, otherwise it plays the release tone.'
      - id: assistant-request-2
        fn: 'Avatar::dock'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: 'action: Action::Dock { context: scope },'}
        runs_on: ui-thread
        via: call
        says: 'Builds a workspace Request with Action::Dock and the layout version the avatar last saw, then runs Client::call on the GPUI background executor so the UI thread does not block. Client::call puts the request on the owner thread''s bounded queue (8 slots) and waits up to 20 seconds for the reply.'
        carries: 'Request {requestId, expectedVersion, action: Dock {context}}.'
        fails: 'A second dock is ignored while one is pending. A full queue returns ''Workspace busy or unavailable; nothing was queued''. The avatar keeps the result and the header script reads it with take_result and shows any message in its status line.'
      - id: assistant-request-3
        fn: 'Model::apply (Action::Dock)'
        module: 'rs:voyager_app::workspace'
        at: {path: app/src/workspace.rs, find: 'Action::Dock { context } => {'}
        runs_on: owner-thread
        via: channel
        says: 'The owner thread checks the request identity, that the workspace was inspected and that the version still matches. The avatar''s request has no captured scope, and scope::check always allows Dock anyway. Model::apply confirms the Voyage, Fleet, Vessel or Portal exists and sets layout.context to it; the owner saves the layout document to Core and replies. Back on the UI thread, Avatar::applied_dock plays the dock tone and animation.'
        carries: 'The new layout with context = the Fleet, and the new layout version.'
        fails: 'Refused with ''Dock target not found'', ''Inspect the workspace before making a change'' or ''Layout changed; inspect it before making a new request''. The reply carries the message, which the header shows.'
      - id: assistant-request-4
        fn: 'context::prepare'
        module: 'rs:voyager_app::context'
        at: {path: app/src/context.rs, find: 'pub(crate) fn prepare('}
        runs_on: owner-thread
        via: channel
        says: 'After an applied, fresh Dock, the owner sends itself a PrepareContext message, after it has already replied to the avatar. If the layout and context are unchanged, prepare reads the screens of up to three visible terminals in the docked scope through Core and the saved text of visible Notes, capped at 4096 bytes, and stores it in a shared slot.'
        carries: 'Prepared {scope, revision, capture time, text}.'
        fails: 'If the layout moved on before this message is handled, nothing is prepared. An unreadable screen is recorded as ''Current terminal screen is unavailable.'''
      - id: assistant-request-5
        fn: Chat.submit
        module: 'ts:desktop/mods/header/chat.ts'
        at: {path: desktop/mods/header/chat.ts, find: 'submit(cx: Context, interrupt = false) {'}
        runs_on: script
        via: call
        says: 'Pressing Enter in the chat composer calls submit, which ignores empty text or a send already in flight and calls send({operation: send, text}). The generated wrapper in contract/generated/conversation.ts adds a host-issued request id and validates the request and reply against the contract schemas.'
        carries: 'The typed text.'
        fails: 'If the reply''s delivery is not ''accepted'', the chat shows the reply''s error, or ''Request refused''. Thrown errors are shown the same way.'
      - id: assistant-request-6
        fn: 'conversation host module call'
        module: 'rs:voyager_desktop::conversation'
        at: {path: desktop/src/conversation.rs, find: '.async_function("call", move |arguments| {'}
        runs_on: background
        via: script-call
        says: 'The script''s call reaches this Rust host function. It refuses requests over 64 KiB and parses the JSON into the contract''s conversation Request. Its asynchronous half, which gpui-shell drives off the UI thread, calls conversation_client::Client::call; that queues OwnerMessage::Call on the conversation owner''s bounded channel and waits up to 25 seconds.'
        carries: 'conversation::Request {requestId, action: Send {text}}.'
        fails: '''Conversation busy or unavailable; nothing was queued'' or ''Conversation result unconfirmed; do not repeat this request'' reaches the chat as an error.'
      - id: assistant-request-7
        fn: 'Owner::apply'
        module: 'rs:voyager_app::conversation_client'
        at: {path: app/src/conversation_client.rs, find: 'fn apply('}
        runs_on: background
        via: channel
        says: 'On the conversation owner thread (spawned by conversation_client::Client::with_audio), Owner::call first rejects request ids this client never issued or has already seen, so nothing is replayed. Owner::apply then refuses if the provider disconnected, the text is outside 1 to 8192 bytes, or a tool effect or previous turn is still running. It then asks the workspace owner for an Inspect through the normal owner queue and requires an applied, fresh answer.'
        carries: 'The send request, then the inspected layout and version from the owner thread.'
        fails: 'Rejected with reasons such as ''Voyager is still handling the previous request'' or ''Inspect the workspace before starting this conversation''. If a provider message had already been sent, the reply is ''unconfirmed'' and the chat phase becomes Unconfirmed.'
      - id: assistant-request-8
        fn: 'Client::conversation_focus'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'pub(crate) fn conversation_focus('}
        runs_on: background
        via: call
        says: 'Freezes the dock into a Focus for this request. conversation::focus takes the scope from layout.context, a readable path such as the Voyage and Fleet names, a working directory when every Vessel in the Fleet shares one, and the layout revision; the dock preview is added only if its scope and revision still match. The owner stores this Focus for the whole turn and attaches it to the user message, so a later dock does not retarget the request.'
        carries: 'voyager_contract::conversation::Focus {scope, path, cwd, revision, preview}.'
        fails: 'If the docked target vanished, focus returns ''Focused workspace target is missing'' and the send is rejected.'
      - id: assistant-request-9
        fn: 'Codex::open'
        module: 'rs:voyager_app::codex'
        at: {path: app/src/codex.rs, find: '"app-server",'}
        runs_on: background
        via: process
        says: 'The owner adds the user message to the shared chat snapshot with phase Starting. On the first message of the session it starts ''codex app-server --listen stdio://'' in the profile''s conversation folder, with the shell tool on and multi-agent features off, and a reader thread for its stdout. Later messages reuse the running process.'
        carries: 'Model and effort from the profile''s conversation.json (default gpt-6.1-sol, high).'
        fails: 'If Codex is not on the application path or cannot start, the chat phase becomes Failed and the error is shown.'
      - id: assistant-request-10
        fn: 'administrator::catalog'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: 'pub(crate) fn catalog() -> Result<Vec<ToolDefinition>, String> {'}
        runs_on: background
        via: ipc
        says: 'When Codex answers the initialize request, the owner sends thread/start with this catalog as dynamic tools: voyager_worktree, voyager_workspace, voyager_process and voyager_content, each with a description and a JSON schema generated from the contract. The thread is ephemeral, read-only sandboxed, never asks for approval, and carries the ADMINISTRATOR instructions.'
        carries: 'Four tool definitions built from contract/generated/*Tool.schema.json, plus model, effort and instructions.'
        fails: 'If Codex refuses thread/start, the chat phase becomes Failed with Codex''s message.'
      - id: assistant-request-11
        fn: 'protocol::encode (Command::StartTurn)'
        module: 'rs:voyager_app::codex::protocol'
        at: {path: app/src/codex_protocol.rs, find: '"turn/start",'}
        runs_on: background
        via: ipc
        says: 'start_turn sets the phase to Working and sends turn/start over the app-server''s JSON-RPC on stdin: the user''s text, the effort, and the frozen Focus as additional context named voyager.focus. Each request gets a 25-second deadline.'
        carries: '{threadId, input text, effort, additionalContext voyager.focus = Focus JSON}.'
      - id: assistant-request-12
        fn: 'Codex turn (external)'
        module: 'ext:codex'
        runs_on: program
        via: ipc
        says: 'Codex reads the request and focus and decides to use voyager_workspace: its description tells it to inspect first with expectedVersion 0, then use the returned version. For ''open a terminal in this tab'' it would then ask for create-content of type terminal in the docked Fleet. Each tool call is sent back as an item/tool/call request.'
        carries: '{threadId, turnId, callId, tool, arguments: {expectedVersion, action}}.'
        inferred: true
      - id: assistant-request-13
        fn: 'protocol::decode'
        module: 'rs:voyager_app::codex::protocol'
        at: {path: app/src/codex_protocol.rs, find: 'return Some(Event::Tool(Box::new(ToolCall {'}
        runs_on: background
        via: ipc
        says: 'The Codex stdout reader thread reads one JSON line at a time, bounded to 1 MiB except for voyager_content frames. A request with an id and method item/tool/call becomes Event::Tool and is sent to the conversation owner on a channel.'
        fails: 'Any other callback from Codex, such as an approval request, is answered with error -32601 ''Unsupported private provider callback; nothing was dispatched''. A broken or oversized frame disconnects the provider and the chat shows the error.'
      - id: assistant-request-14
        fn: 'Tools::call'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: 'pub fn call('}
        runs_on: background
        via: channel
        says: 'The conversation owner hands the call to Tools::call, holding it until turn/start has answered if needed. The call must match the accepted thread and turn, name one of the four tools and carry no namespace. A repeated callId with the same arguments gets the stored result. Otherwise it checks the 32-call limit, the 8 KiB argument limit, that a turn is active with a captured Focus and no other effect running, and parses the arguments. It then starts a short-lived effect thread and replies later.'
