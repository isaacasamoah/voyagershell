            runs_on: ui-thread
            via: call
            symbol: '<voyager_desktop::avatar::view::AvatarView as gpui::element::Render>::render::{closure#10}'
            says: 'The avatar is a tab stop. When it has focus, Enter or Space calls Avatar::activate directly, and the pathway continues at step 3. Escape cancels a drag; S plays the hover animation; F5 reloads the animation pack from the profile folder.'
      - name: 'Hover, Shift-click or S plays the hover animation'
        from: avatar-open-chat-1
        steps:
          - id: avatar-open-chat-1a
            fn: 'AvatarView::render (hover listener)'
            module: 'rs:voyager_desktop::avatar::view'
