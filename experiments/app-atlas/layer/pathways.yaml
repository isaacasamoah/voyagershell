            says: 'If the target vanished, the owner replies Rejected with "invalid_workspace: Dock target not found" and changes nothing. A stale expected version is refused the same way before apply runs. The header puts the message in its status line and the avatar stays where it was.'
    better:
      - step: dock-avatar-18
        idea: 'Read the dock preview''s terminal screens off the owner thread.'
        why: 'Up to three Core screen reads run on the single owner thread, so a request queued right after a dock waits behind them.'
        inferred: true
      - step: dock-avatar-6
        idea: 'Show a pending state on the avatar while a dock request is in flight.'
        why: 'A second drag during that time is silently ignored, which can look like a failed drop.'
        inferred: true
      - step: dock-avatar-17
        idea: 'Label the branch in the context bar as belonging to the focused panel, or take it from the dock.'
        why: 'The path follows the dock but the branch follows keyboard focus, so the two can describe different places.'
        inferred: true
    open_questions:
      - 'How Herdr Core reports a doc.set version conflict and what else it does with the layout document is defined by the external hc program.'
      - 'Whether the Avatar''s expected version can lag the owner''s version in normal use (for example right after another window or agent changes the layout); if it does, the first drop is refused with "Layout changed".'
      - 'The Dock tone needs paplay; without a sound server only a stderr line is printed. Whether a test driver should treat the missing tone as a failure is a product decision.'
    common: true
  - id: ask-by-text
    name: 'Ask Voyager by text to open a terminal in the docked Fleet'
    trigger: 'With the avatar docked on a Fleet and the chat open, the person types "open a terminal here" and presses Enter.'
    summary: 'The header chat script sends the text through the voyager_conversation host module to the private conversation owner. That owner inspects the workspace, freezes the dock into a Focus for this message, and starts a turn in a Codex app-server child process, starting Codex on the first message. Codex calls a Voyager tool. The call is checked against the frozen Focus and run through the same owner queue the UI uses, and the result goes back to Codex and into the chat. Codex''s reply streams into the chat, and the header later starts the new terminal through Herdr Core.'
    steps:
      - id: ask-by-text-1
        fn: Chat.submit
        module: 'ts:desktop/mods/header/chat.ts'
        at: {path: desktop/mods/header/chat.ts, find: 'submit(cx: Context, interrupt = false) {'}
        runs_on: script
        via: call
        symbol: script
        says: 'The composer''s submit event (Enter, or the Send button showing an up arrow) calls submit. It ignores empty text or a send already in flight and calls send({operation: send, text}). The generated wrapper in contract/generated/conversation.ts adds a host-issued request id ("conversation-<n>") and validates the request and the reply against the contract schemas.'
        carries: 'The typed text.'
        fails: 'If the reply''s delivery is not "accepted", the chat shows the reply''s error, or "Request refused". Thrown errors show the same way.'
      - id: ask-by-text-2
        fn: 'conversation host call'
        module: 'rs:voyager_desktop::conversation'
        at: {path: desktop/src/conversation.rs, find: '.async_function("call", move |arguments| {'}
        runs_on: background
        via: script-call
        symbol: 'voyager_desktop::conversation::module::{closure#1}'
        says: 'The host function refuses requests over 64 KiB and parses the JSON into the contract''s conversation Request. Its asynchronous half calls conversation_client::Client::call, which puts OwnerMessage::Call on the conversation owner''s bounded queue (8 slots) and waits up to 25 seconds for the reply.'
        carries: 'conversation::Request {requestId, action: Send {text}}.'
        fails: '"Conversation busy or unavailable; nothing was queued" or "Conversation result unconfirmed; do not repeat this request" reaches the chat as an error.'
      - id: ask-by-text-3
        fn: 'Owner::call, Owner::apply'
        module: 'rs:voyager_app::conversation_client'
        at: {path: app/src/conversation_client.rs, find: 'fn apply('}
        runs_on: background
        via: channel
        symbol: inlined
        symbol_caller: '<voyager_app::conversation_client::Owner>::call'
        says: 'On the conversation owner thread (spawned by Client::with_audio at launch), call rejects request ids this client never issued or has already seen, so nothing is replayed. apply refuses if the provider disconnected, the text is outside 1 to 8192 bytes, or a tool effect or earlier turn is still running. It reads model and effort from <profile>/conversation.json on first use, then asks the workspace owner thread for an Inspect through the same queue the avatar uses. The owner reloads the layout from Core, and apply requires an applied, fresh answer.'
        carries: 'The send request, then the inspected layout and version from the owner thread.'
        fails: '"Voyager is still handling the previous request", "Inspect the workspace before starting this conversation" or a settings error. If a provider message had already gone out, the reply is "unconfirmed" and the chat phase becomes Unconfirmed.'
      - id: ask-by-text-4
        fn: 'Client::conversation_focus'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'pub(crate) fn conversation_focus('}
        runs_on: background
        via: call
        symbol: '<voyager_app::client::Client>::conversation_focus'
        says: 'Freezes the dock into a Focus for this request: the scope from layout.context (the Fleet), a readable path such as the Voyage and Fleet names, a working directory when every Vessel in the Fleet shares one, and the layout revision. The dock preview from dock-avatar step 18 is added only if its scope and revision still match. The owner keeps this Focus for the whole turn and adds the user message to the shared snapshot with phase Starting, so a later dock does not retarget the request.'
        carries: 'voyager_contract::conversation::Focus {scope, path, cwd, revision, preview}.'
        fails: 'If the docked target vanished, focus returns "Focused workspace target is missing" and the send is rejected.'
      - id: ask-by-text-5
        fn: 'Codex::open'
        module: 'rs:voyager_app::codex'
        at: {path: app/src/codex.rs, find: '"app-server",'}
        runs_on: background
        via: process
        symbol: '<voyager_app::codex::Codex>::open'
        says: 'On the first message of the session, open_provider creates <profile>/conversation and starts "codex app-server --listen stdio://" there, from PATH or VOYAGER_CODEX_BIN, with the shell tool on and multi-agent features off. A reader thread reads its stdout, and the owner sends initialize. Later messages reuse the running process.'
        carries: 'Model and effort from conversation.json (default gpt-6.1-sol, high).'
        fails: 'If Codex is not on the path or cannot start, the chat phase becomes Failed and the error is shown.'
      - id: ask-by-text-6
        fn: 'administrator::catalog (thread/start)'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: 'pub(crate) fn catalog() -> Result<Vec<ToolDefinition>, String> {'}
        runs_on: background
        via: ipc
        symbol: 'voyager_app::administrator::catalog'
        says: 'When Codex answers initialize over its JSON-RPC, the owner sends initialized and then thread/start with this catalog as dynamic tools: voyager_worktree, voyager_workspace, voyager_process and voyager_content, each with a description and a JSON schema generated from the contract. The thread is ephemeral, read-only sandboxed, never asks for approval and carries the ADMINISTRATOR instructions.'
        carries: 'Four tool definitions from contract/generated/*Tool.schema.json, plus model, effort and instructions.'
        fails: 'If Codex refuses thread/start, the chat phase becomes Failed with Codex''s message.'
      - id: ask-by-text-7
