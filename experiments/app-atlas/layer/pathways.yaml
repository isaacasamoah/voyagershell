        says: 'On applied, the script creates a native TerminalState; its Rust constructor takes the Viewer from the viewers map and builds a Pane. The header then inspects again so it holds the layout that now includes the backend, and run moves focus to the new Vessel.'
        fails: 'Without a viewer the constructor fails with ''Terminal is not attached''. If the follow-up inspect is not applied and fresh, prepare throws and the status explains why.'
      - id: split-vessel-24
        fn: 'Workspace.render / Workspace.pane'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'return NativeSplit.new('}
