        says: 'The audio lease belongs to this Speech control. It sends a StartVoice request carrying the lease through call_bound, the same bounded conversation queue and 25-second wait as a chat message.'
        fails: '"Conversation busy or unavailable; nothing was queued", shown as the control''s tooltip.'
      - id: ask-by-voice-4
