        at: {path: app/src/scope.rs, find: 'pub(crate) fn check('}
        runs_on: owner-thread
        via: channel
        says: 'The owner thread runs the same checks as for UI requests (identity, quitting, freshness, expected version), then checks authority. scope::check projects the layout down to the captured Fleet and allows create-content only in that Fleet, either beside a Vessel inside it or into an empty Fleet. The first inspect call passes the same check and returns a layout trimmed to the Fleet.'
        fails: 'Outside the focus: ''That target is outside this request''s captured avatar focus. Ask the human before changing focus.'' If the Fleet is gone: ''The request''s captured focus no longer exists''.'
      - id: assistant-request-17
        fn: 'Model::apply (Action::CreateContent)'
        module: 'rs:voyager_app::workspace'
        at: {path: app/src/workspace.rs, find: 'Action::CreateContent {'}
        runs_on: owner-thread
        via: call
        says: 'On a copy of the layout, apply checks the content type, allows a program launch only for terminals, then creates a Content with no Core terminal yet and a Vessel inserted into the Fleet''s split. The owner saves the layout document to Core with the expected version, records the new terminal as allowed to start once (record_created_terminals), notifies the desktop that the revision changed, and replies with the layout projected to the captured scope.'
        carries: 'The new Vessel and Content ids and the new version.'
        fails: 'A Core save conflict or failure is reported as Rejected or Uncertain; the in-memory layout is only replaced after the save succeeds.'
      - id: assistant-request-18
        fn: 'Owner::tool_result'
        module: 'rs:voyager_app::conversation_client'
        at: {path: app/src/conversation_client.rs, find: 'fn tool_result(&mut self) -> Result<(), String> {'}
        runs_on: background
        via: channel
        says: 'The conversation owner polls Tools each loop turn. When the effect thread''s result arrives it adds a Tool message to the chat snapshot (for example ''Content created'') and writes a JSON-RPC result to Codex''s stdin with success and the full response JSON. A response over 24 KiB is replaced by a short summary without the layout.'
        carries: 'ToolOutcome {tool, callId, requestId, action, status, version} and the result text.'
      - id: assistant-request-19
        fn: 'conversation::notification'
        module: 'rs:voyager_app::conversation'
        at: {path: app/src/conversation.rs, find: 'pub(crate) fn notification(state: &mut Snapshot, value: &Visible, request: &str) -> bool {'}
        runs_on: background
        via: ipc
        says: 'Codex streams its reply as agentMessage deltas and completed items, then turn/completed. The reader thread decodes them and the owner folds them into the shared snapshot: assistant text is appended for the active request, and the turn''s final status sets the phase. Each change bumps the snapshot version and wakes waiting readers.'
        fails: 'A Codex error event sets the phase to Failed (unless Codex says it will retry) and stores the message. Oversized replies are cut and marked ''The displayed response is incomplete...''.'
      - id: assistant-request-20
        fn: 'Chat.toggle observe loop'
        module: 'ts:desktop/mods/header/chat.ts'
        at: {path: desktop/mods/header/chat.ts, find: 'const next = await observe(this.state?.version ?? null);'}
        runs_on: script
        via: script-call
        says: 'While the chat is open, the script calls observe with the last version it has. The host snapshot function waits up to 20 seconds for a newer version, then returns the whole snapshot. render lists messages labelled You, Workspace (tool outcomes) or Voyager, shows ''Thinking…'' while the turn runs, and shows any error.'
        carries: 'conversation Snapshot {version, phase, messages, error, limited, omitted}.'
      - id: assistant-request-21
        fn: Workspace.prepare
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'opened = await openTerminal(vessel.content, this.version);'}
        runs_on: script
        via: script-call
        says: 'The desktop''s workspace watcher (host.rs) wakes on the owner''s revision notice and re-renders the header. render sees the new revision and runs an inspect; the reply lists the agent-created terminal in createdContents. prepare then calls openTerminal for that Vessel, which goes to the terminal_open host function and Client::terminal.'
        carries: 'TerminalRequest {requestId, contentId, expectedVersion}.'
        fails: 'The header records rejected or uncertain openings per Vessel and shows a status such as ''Terminal start is unconfirmed. Inspect before trying again.'''
      - id: assistant-request-22
        fn: open_terminal
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn open_terminal('}
        runs_on: owner-thread
        via: channel
        says: 'The owner thread marks the Vessel''s content as start pending and saves, asks Core to run the launch (an empty argv for a plain terminal) in the Vessel''s directory, binds the returned Core terminal address, saves again and attaches a viewer. The new Vessel now shows a live terminal in the docked Fleet.'
        carries: 'Core terminal.run with cwd and a voyager-operation label, then terminal.attach.'
        fails: 'Only content recorded as newly created may start a program. An unclear Core answer leaves the marker in place and returns Uncertain; nothing is retried automatically.'
    branches:
      - name: 'Dock with Shift+Enter instead of dragging'
        from: assistant-request-1
        steps:
          - id: assistant-request-1a
            fn: 'Target on_key_down'
            module: 'rs:voyager_desktop::avatar'
            at: {path: desktop/src/avatar.rs, find: '&& event.keystroke.modifiers.shift'}
            runs_on: ui-thread
            via: call
            says: 'Each dock target is a keyboard tab stop described as ''Shift+Enter to dock Voyager in this context''. When the focused Fleet target gets Shift+Enter, it calls Avatar::dock with that target''s scope and the pathway continues at step 2.'
      - name: 'Codex asks for a change outside the captured focus'
        from: assistant-request-16
        steps:
          - id: assistant-request-16a
            fn: 'scope::check refusal'
            module: 'rs:voyager_app::scope'
            at: {path: app/src/scope.rs, find: 'captured avatar focus. Ask the human before changing focus.'}
            runs_on: owner-thread
            via: call
            says: 'The target is not inside the projected Fleet, so check returns an error. The owner replies Rejected with the message prefixed ''invalid_workspace:'' and changes nothing.'
          - id: assistant-request-16b
            fn: outcome_text
            module: 'rs:voyager_app::administrator'
            at: {path: app/src/administrator.rs, find: 'fn outcome_text(action: &Action, status: &Status, message: Option<&str>) -> String {'}
            runs_on: background
            via: channel
            says: 'The effect thread turns the reply into ''Workspace request refused: ...''. Codex receives it as an unsuccessful tool result, and its instructions tell it to report the real outcome and ask the human before changing focus.'
          - id: assistant-request-16c
            fn: Chat.render
            module: 'ts:desktop/mods/header/chat.ts'
            at: {path: desktop/mods/header/chat.ts, find: '? "Workspace"'}
            runs_on: script
            via: script-call
            says: 'The refusal appears in the chat as a message labelled Workspace, followed by Codex''s own explanation labelled Voyager.'
      - name: 'An effect or the provider stays unconfirmed'
        from: assistant-request-18
        steps:
          - id: assistant-request-18a
            fn: 'Tools::poll'
            module: 'rs:voyager_app::administrator'
            at: {path: app/src/administrator.rs, find: 'self.uncertain |= result.status == Status::Uncertain;'}
            runs_on: background
            via: channel
            says: 'An Uncertain result (for example a timed-out owner reply) marks the turn uncertain. Later calls in the turn may still read, but any new effect is refused with ''An earlier effect is unconfirmed. Inspect and report it; do not replay it.'''
          - id: assistant-request-18b
            fn: 'conversation owner deadline'
            module: 'rs:voyager_app::conversation_client'
            at: {path: app/src/conversation_client.rs, find: '"Provider acknowledgement unconfirmed; nothing was resubmitted".into(),'}
            runs_on: background
            via: channel
            says: 'If Codex does not answer a request within 25 seconds, the owner sets the phase to Unconfirmed with this error and resubmits nothing. New sends are refused while the phase is Unconfirmed.'
          - id: assistant-request-18c
            fn: Chat.render
            module: 'ts:desktop/mods/header/chat.ts'
            at: {path: desktop/mods/header/chat.ts, find: 'const error = this.error || this.state?.error;'}
            runs_on: script
            via: script-call
            says: 'The chat shows either the local send error or the snapshot''s error text under the messages, so the person sees that the result is unknown.'
    better:
      - step: assistant-request-8
        idea: 'Tell the model, or show the person, when the dock preview was dropped because the layout revision changed after docking.'
        why: 'The preview is attached only when the revision is unchanged, so any later layout change silently removes the on-screen context.'
        inferred: true
      - step: assistant-request-4
        idea: 'Read the dock preview screens off the owner thread.'
        why: 'Up to three Core screen reads run on the single owner thread, so a request queued right after a dock waits behind them.'
        inferred: true
      - step: assistant-request-17
        idea: 'Say in the create-content tool result that the terminal start is still pending in the desktop.'
        why: 'The tool reports ''Content created'' before any program runs; the shell only starts when the header script later inspects and calls openTerminal.'
        inferred: true
    open_questions:
      - 'How Codex chooses which tool to call and in what order happens inside the external codex app-server; only the tool descriptions and ADMINISTRATOR instructions in this repo guide it.'
      - 'The claim that an async host function''s future runs off the UI thread comes from gpui-shell''s documentation at the pinned gpui-kit revision, not from Voyager''s own source.'
      - 'No code in app/ starts an agent-created terminal by itself; it starts only when a running header script inspects and calls openTerminal. It is unclear whether that dependency on the header is intended for every case, such as a busy header.'
      - 'The exact JSON-RPC rules of the app-server (whether turn/completed can arrive before a pending tool reply, retry behaviour) are defined by Codex, not by this repository.'
  - id: launch-agent
    name: 'Start a terminal agent in a Vessel'
    trigger: 'The person opens the content picker for a new or split Vessel and chooses an agent entry such as Codex or Claude.'
    summary: 'The header''s content picker asks the owner thread for the launch catalog, which comes from the profile''s launches.json and is checked against the PATH. Choosing an entry sends create-content with that launch; the owner creates the Vessel and records a one-time permission to start it. The header then opens the terminal, the owner asks Herdr Core to run the agent wrapped in an interactive bash, and the Agents list later recognises the running program from Core''s process list.'
    steps:
      - id: launch-agent-1
        fn: CreationPicker.open
        module: 'ts:desktop/mods/header/creation.ts'
        at: {path: desktop/mods/header/creation.ts, find: 'const metadata = await Promise.allSettled([launches(), descriptions()]);'}
        runs_on: script
        via: call
        says: 'Opening a split or empty Fleet area opens the picker for that destination. It asks the host for the launch catalog and the content type descriptions at the same time, and validates both against the contract schemas.'
        carries: 'The destination: a panel in a Fleet (beside a Vessel or empty) or a new Fleet.'
        fails: 'Validation or host errors are collected and shown in the picker.'
      - id: launch-agent-2
        fn: 'launch::catalog'
        module: 'rs:voyager_app::launch'
        at: {path: app/src/launch.rs, find: 'pub fn catalog(path: Option<&Path>, cwd: &str) -> Result<Catalog, String> {'}
        runs_on: owner-thread
        via: channel
        says: 'The launches host function sends Message::Launches to the owner thread, which calls catalog. It reads the profile''s launches.json (seeded on first run with Terminal, Codex and Claude), checks it is at most 8 KiB with unique ids and a valid default, and looks up each entry''s executable on the PATH. Entries that resolve are listed as available.'
        carries: 'Catalog {settings with entries and default, available ids, errors, path}.'
        fails: 'An invalid launches.json makes the whole catalog an error, shown in the picker.'
      - id: launch-agent-3
        fn: CreationPicker.render
        module: 'ts:desktop/mods/header/creation.ts'
        at: {path: desktop/mods/header/creation.ts, find: 'chosen(opening.destination, "terminal", launch),'}
        runs_on: script
        via: render
        says: 'The picker shows one button per available entry, default first, such as ''Create Codex Vessel''. Clicking builds a create-content action with typeId terminal and the entry''s launch, or create-fleet-with-content for a new Fleet.'
        carries: '{operation: create-content, destination, typeId: terminal, launch: {kind: codex, model, effort, permissions} or {kind: program, argv}}.'
      - id: launch-agent-4
        fn: 'Workspace.creationControl callback'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'this.run(action, cx, undefined, version);'}
        runs_on: script
        via: call
        says: 'The header runs the action with the version the picker opened at. run calls invoke from the generated workspace wrapper, which goes to the host call function and Client::call on the owner queue.'
        fails: 'If another workspace request is pending: ''Wait for the pending workspace request. No Vessel was created.'''
      - id: launch-agent-5
        fn: 'Model::apply (Action::CreateContent)'
        module: 'rs:voyager_app::workspace'
        at: {path: app/src/workspace.rs, find: 'let panel = self.placement(cwd, type_id, name, launch)?;'}
        runs_on: owner-thread
        via: channel
        says: 'With no captured scope the authority check passes. The owner confirms the content type is available; apply allows a launch only on terminal content and validates it with launch::argv, then stores a Content with the launch and no Core terminal, and a Vessel placed in the split. The layout is saved to Core.'
        fails: 'Refused for an unsupported type, a launch on non-terminal content, an empty model or executable, or a stale version.'
      - id: launch-agent-6
        fn: record_created_terminals
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn record_created_terminals('}
        runs_on: owner-thread
        via: call
        says: 'The owner remembers the new terminal with its exact launch as a one-time permission to start it. The reply''s createdContents lists it, so the header knows it may start this Vessel.'
        carries: 'CreatedTerminal {content id, launch}.'
      - id: launch-agent-7
        fn: Workspace.prepare
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'opened = await openTerminal(vessel.content, this.version);'}
        runs_on: script
        via: script-call
        says: 'After the applied reply, prepare walks the visible Vessels and calls openTerminal for terminals listed in createdContents, then inspects again to pick up the bound terminal.'
        carries: 'TerminalRequest {requestId, contentId, expectedVersion}.'
      - id: launch-agent-8
        fn: 'terminal_open host function'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: '.async_function("terminal_open", move |arguments| {'}
        runs_on: background
        via: script-call
        says: 'Checks the request size and ids, then calls Client::terminal, which queues Message::Terminal and waits up to 25 seconds. The owner refuses reused ids, a stale or uninspected layout, a closing Voyage, an earlier unconfirmed start, or created content that is not visible.'
        fails: 'Refusals return as a TerminalResponse with status rejected and a message; a timeout is uncertain: ''Terminal result unconfirmed; no request was repeated''.'
      - id: launch-agent-9
        fn: 'open_terminal (start marker)'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'item.start_pending = Some(operation.clone());'}
        runs_on: owner-thread
        via: channel
        says: 'open_terminal checks that the stored launch still matches the recorded permission, then writes a start-pending marker named voyager-start-<request id> into the layout and saves it before asking Core to start anything. If anything goes wrong later, the marker shows a start may exist.'
        fails: 'A changed launch is refused: ''The creation launch changed; no program was started''. A saved worker without the permission is refused: ''This saved worker has no new-creation permission; no command was restarted''.'
      - id: launch-agent-10
        fn: 'launch::shell_command'
        module: 'rs:voyager_app::launch'
        at: {path: app/src/launch.rs, find: 'fn shell_command(launch: &Launch, args: Vec<String>) -> Result<Vec<String>, String> {'}
        runs_on: owner-thread
        via: call
        says: 'terminal_command builds the argv. For Codex it is codex --no-daemon --model <model> with the reasoning effort and permission flags; the executable is resolved on the PATH to a full path. Known agent programs are wrapped as bash -i -c with a script that runs the agent and then execs an interactive bash, so the Vessel keeps a shell after the agent exits. Arguments stay literal.'
        carries: 'argv, for example [/usr/bin/bash, -i, -c, <script>, voyager-agent, /path/to/codex, --no-daemon, ...].'
        fails: 'A missing executable: ''Executable <name> is unavailable''. The marker is then cleared and the start is refused.'
      - id: launch-agent-11
        fn: 'Core::terminal_run_with'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: 'self.call("terminal.run", params)'}
        runs_on: owner-thread
        via: core-rpc
        says: 'Sends terminal.run to Herdr Core over its socket with the argv, the Vessel''s working directory, no_parent, and a voyager-operation label matching the marker.'
      - id: launch-agent-12
        fn: 'terminal.run (Herdr Core)'
        module: 'ext:hc'
        runs_on: core
        via: process
        says: 'Herdr Core starts the program in a new terminal it owns and returns the terminal''s address and state. The program keeps running in Core even if Voyager''s viewer detaches.'
      - id: launch-agent-13
        fn: 'open_terminal (bind and attach)'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'item.backend = Some(CoreTerminalId(address.clone()));'}
        runs_on: owner-thread
        via: core-rpc
        says: 'If Core reports the terminal live or finished, the owner stores the Core address on the content, clears the marker, saves the layout and sends terminal.attach to get a viewer.'
        fails: 'A start that is still pending, or a failed save after start, is recorded as unconfirmed and returned as Uncertain; nothing is started again.'
      - id: launch-agent-14
        fn: install_viewer
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: '.and_then(|viewer| install_viewer(&viewers, &request.content_id.0, viewer));'}
        runs_on: background
        via: channel
        says: 'The viewer is registered for the content so the native terminal view can show the screen Core streams. The header marks the opening applied and creates the terminal''s script state; the person now sees the agent running in the Vessel.'
      - id: launch-agent-15
        fn: 'Workspace.startContext loop'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'await this.readProcesses(task);'}
        runs_on: script
        via: call
        says: 'Every 3 seconds, if an Agents Vessel is visible, and after every accepted workspace snapshot, the header reads processes. inspectProcesses calls the processes host function, which calls Client::process with the whole-workspace scope and a List action.'
        fails: 'A stale revision or owner error empties the list and keeps the message, which the Agents list shows as unavailable.'
      - id: launch-agent-16
        fn: 'process::start (List)'
        module: 'rs:voyager_app::process'
        at: {path: app/src/process.rs, find: 'let listed = core.terminal_list()?;'}
        runs_on: owner-thread
        via: channel
        says: 'The owner reloads the layout from Core and requires the same revision, then asks Core for its terminal list and builds a ProcessInfo for every terminal content that has a Core address.'
        carries: 'ProcessInfo {contentId, terminalId, pid, cwd, state, foreground program, agentName, placementNames, reportedActivity}.'
        fails: '''Inspect the current workspace revision before using processes'' when the revision moved on.'
      - id: launch-agent-17
        fn: 'observation::conversation_name'
        module: 'rs:voyager_app::observation'
        at: {path: app/src/observation.rs, find: 'pub(crate) fn conversation_name(terminal: &Terminal) -> Option<String> {'}
        runs_on: owner-thread
        via: call
        says: 'process::info names the agent. If the foreground program is a known agent and its terminal title looks like a session name, the title is used; otherwise agent_name uses the folder of the live working directory. effective_name gives each Vessel''s display name, and reported activity is parsed from Core''s terminal metadata.'
      - id: launch-agent-18
        fn: agentsView
        module: 'ts:desktop/mods/header/agents.ts'
        at: {path: desktop/mods/header/agents.ts, find: 'const agent = recognized ? AGENT_NAMES[recognized] : undefined;'}
        runs_on: script
        via: render
        says: 'The Agents list makes a row for each live terminal Vessel, plus visible Notes and Agents Vessels; terminals without a live process are left out. It recognises the agent from the foreground program name (codex shows as Codex), groups rows by reported activity (Needs attention, Working, Done, Idle) and lets the person click a row to reveal its Vessel.'
    branches:
      - name: 'Start the agent in a new Git worktree'
        from: launch-agent-1
        steps:
          - id: launch-agent-1a
            fn: 'worktree call'
            module: 'ts:desktop/mods/header/worktrees.ts'
            at: {path: desktop/mods/header/worktrees.ts, find: 'const raw: unknown = JSON.parse(await worktree(JSON.stringify(request)));'}
            runs_on: script
            via: script-call
            says: 'The worktree dialog sends create {name, branch, base HEAD} for the selected Voyage. The host calls Client::worktree, and the owner checks freshness, version and that the Voyage has a working directory.'
          - id: launch-agent-1b
            fn: 'worktrees::create'
            module: 'rs:voyager_app::worktrees'
            at: {path: app/src/worktrees.rs, find: '&["worktree", "add", "-b", branch, "--", path, commit.trim()],'}
            runs_on: background
            via: process
            says: 'On a thread spawned by the owner, git creates the branch and checkout under the main checkout''s .worktrees folder, after adding /.worktrees/ to Git''s local exclude file.'
          - id: launch-agent-1c
            fn: worktree_voyage_action
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'vec![worktree_voyage_action('}
            runs_on: owner-thread
            via: channel
            says: 'When Git reports back, the owner opens a Voyage at the checkout (or selects or reopens one already there) with a default Terminal Vessel, saves, and records that terminal as startable. The person then launches the agent in this Voyage from step 1.'
      - name: 'The agent''s executable is missing'
        from: launch-agent-2
        steps:
          - id: launch-agent-2a
            fn: 'launch::catalog'
            module: 'rs:voyager_app::launch'
            at: {path: app/src/launch.rs, find: 'Err(error) => errors.push(format!("{} is unavailable: {error}", entry.name)),'}
            runs_on: owner-thread
            via: call
            says: 'An entry whose executable is not on the PATH is left out of available and an error such as ''Claude is unavailable: ...'' is added.'
          - id: launch-agent-2b
            fn: CreationPicker.render
            module: 'ts:desktop/mods/header/creation.ts'
            at: {path: desktop/mods/header/creation.ts, find: 'for (const error of this.catalog.errors)'}
            runs_on: script
            via: render
            says: 'The picker does not offer that entry and shows the error text in red under the choices.'
      - name: 'Core does not confirm the start'
        from: launch-agent-11
        steps:
          - id: launch-agent-11a
            fn: 'open_terminal (uncertain start)'
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'Terminal start {operation} is unconfirmed: {message}'}
            runs_on: owner-thread
            via: call
            says: 'If Core''s answer is uncertain, the owner keeps the start-pending marker, records the content as unconfirmed and returns Uncertain, telling the person to look for the voyager-operation label in Core. It never runs the program again by itself.'
          - id: launch-agent-11b
            fn: Workspace.terminalStatus
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: 'return "Terminal start is unconfirmed. Inspect before trying again.";'}
            runs_on: script
            via: render
            says: 'The Vessel shows ''Terminal start is unconfirmed. Inspect before trying again.'' The Agents list leaves it out, because it has no live Core process.'
    better:
      - step: launch-agent-10
        idea: 'Default the Codex entry to workspace-write permissions, or show the permission level on the picker button.'
        why: 'The seeded Codex entry uses Permissions::Yolo, which adds --dangerously-bypass-approvals-and-sandbox, so one click starts an agent with no sandbox or approvals.'
        inferred: true
      - step: launch-agent-17
        idea: 'Keep one list of known agent program names in the contract and use it in launch.rs, observation.rs and agents.ts.'
        why: 'The three hand-written lists already differ (''cursor'' is recognised in observation.rs and agents.ts but not wrapped by launch.rs), so the same program can be treated differently.'
        inferred: true
      - step: launch-agent-15
        idea: 'Drive process identity changes from Core''s event stream, which Voyager already subscribes to for activity, instead of a 3-second poll.'
        why: 'Each poll is a full owner-thread round trip with a Core terminal list, and the list can lag a just-started agent by up to 3 seconds.'
        inferred: true
      - step: launch-agent-9
        idea: 'Explain in the Vessel why a saved agent Vessel that never started cannot start after a restart, and offer a deliberate start action.'
        why: 'The start permission lives only in the owner thread''s memory, so after a restart open_terminal refuses with ''This saved worker has no new-creation permission''.'
        inferred: true
    open_questions:
      - 'How Herdr Core runs the argv (pseudo-terminal, environment, process group, what no_parent means) is defined by the external hc program.'
      - 'How an agent program''s working, done or blocked state gets into Core''s terminal metadata is outside this repository; activity.rs only parses what Core reports.'
      - 'When an agent Vessel is created in a Fleet that is not visible, the owner refuses to start it (''Created content is not currently visible''); it is not clear from source when the header retries once the Fleet is shown.'
  - id: stop-program
    name: 'Stopping a terminal program'
    trigger: 'The person asks the assistant to stop the program running in a terminal Vessel.'
    summary: 'At e6bd5b1 a Vessel has no Stop button; its close button only closes the viewer, and the program keeps running. One program is stopped through the assistant''s voyager_process tool: the app owner thread checks the request against the saved layout and Core''s live record, then sends Core a terminal.kill request. Core ends the program and closes the viewer channel, the Pane shows "Terminal ended", and the Vessel stays in the layout.'
    steps:
      - id: stop-program-1
        fn: 'Owner::receive (conversation owner)'
        module: 'rs:voyager_app::conversation_client'
        at: {path: app/src/conversation_client.rs, find: 'ProviderEvent::Tool(call) => {'}
        runs_on: background
        via: ipc
        says: 'Codex app-server sends a JSON-RPC item/tool/call for voyager_process with operation stop, naming the content ID, Core terminal ID and the PID the assistant saw when it listed processes. The conversation owner thread hands the call to the tool layer.'
        carries: 'Tool arguments (expectedVersion, contentId, terminalId, pid).'
      - id: stop-program-2
        fn: 'Tools::call'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: '"voyager_process" => serde_json::from_value::<ProcessInput>(arguments.clone())'}
        runs_on: background
        via: call
        says: 'Checks the call belongs to the current thread and turn, that the turn is active, that no other tool effect is running and that no earlier effect is unconfirmed. It parses the input and runs the effect on a short-lived thread, so the conversation owner keeps handling events.'
        fails: 'Refused before dispatch; the refusal text goes back to Codex.'
      - id: stop-program-3
        fn: 'Client::process'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'pub fn process('}
        runs_on: background
        via: call
