entry_points:
  - who: 'voyager-shell binary (desktop crate)'
    fn: main
    at: {path: desktop/src/main.rs, find: 'fn main() {'}
    plain: 'The process starts here. It parses --profile and --session and hands them to voyager_desktop::run.'
    why: 'The binary stays a thin argument parser so the desktop library holds all start-up logic.'
    inferred: true
  - who: 'voyager_desktop library'
    fn: 'voyager_desktop::run'
    at: {path: desktop/src/lib.rs, find: 'pub fn run(profile: PathBuf, session: String) -> Result<()> {'}
    plain: 'Seeds the profile, creates the app clients, then starts GPUI. It returns only after GPUI quits.'
    why: 'One function owns the whole lifetime, so everything created here lives until quit.'
    inferred: true
  - who: 'voyager_app (content packages)'
    fn: 'content::seed_package'
    at: {path: app/src/content/package.rs, find: 'pub fn seed_package(package: &Path, files: &[(&str, &str)]) -> io::Result<()> {'}
    plain: 'The first call into the app crate. It writes the Notes package into the profile unless it, or a removed copy, already exists.'
    why: 'A removed package stays removed, and the person''s edits are kept.'
  - who: 'voyager_app (workspace owner thread)'
    fn: 'Client::start_with_launches'
    at: {path: app/src/client.rs, find: 'fn start_with_launches('}
    plain: 'Spawns the owner thread, the single place that holds the layout, the Core connection and the content owner, and returns a cheap cloneable Client.'
    why: 'Every change is applied in order on one thread, so callers on any thread see one consistent layout version.'
    inferred: true
  - who: 'Herdr Core (through the `hc connect` bridge process)'
    fn: 'Core::connect_activity'
    at: {path: app/src/core.rs, find: '.args(["connect", "--session", session])'}
    plain: 'The owner thread starts `hc connect --session <name>` and speaks framed JSON-RPC to Core through its stdin and stdout, starting with `hello`.'
    why: 'Core is a separate program that owns terminals and saved documents; this is Voyager''s only connection to it.'
  - who: 'Core bridge reader thread'
