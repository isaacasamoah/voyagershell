    open_questions:
      - 'Whether click-to-float is meant to be the avatar''s main click action. No code links an avatar click to the chat or to a menu.'
      - 'How minimise and restore behave under Xvfb with no window manager or a minimal one. The code relies on the window manager honouring the minimise request and keeping _NET_WM_STATE up to date.'
      - 'That an async host function''s future runs off the UI thread comes from gpui-shell at the pinned gpui-kit revision, not from Voyager''s own source.'
    common: true
  - id: dock-avatar
    name: 'Drag the avatar onto a Fleet (or another dock)'
    trigger: 'The person drags the avatar from where it sits and releases it on a Fleet tab in the Fleet strip.'
    summary: 'The header script wraps every Fleet tab, Voyage row, Vessel, Portal and the brand image in an avatar Target that records its scope and painted bounds. While the avatar is dragged it follows the pointer and outlines the target under it. On release, Avatar::dock sends a Dock request through the app''s single owner thread, which sets layout.context, saves the layout to Herdr Core and queues a dock preview for the conversation. The reply plays the dock tone and the float animation. The header accepts the new layout, the docked tab grows and the avatar shrinks into it, and the context bar reads the dock''s path back from the owner thread.'
    steps:
      - id: dock-avatar-1
        fn: 'avatar Target component'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: '.component("Target", move |mut args, _, cx| {'}
        runs_on: ui-thread
        via: script-call
        symbol: '<voyager_desktop::avatar::Binding>::module::{closure#5}'
        says: 'On each header render, Workspace.target in main.ts wraps each Fleet tab in Target.new with scope {kind: fleet, id}. The Rust component keeps one Target per scope, makes it a keyboard tab stop named "Fleet dock", and a canvas measures its painted bounds clipped to the visible area, telling the avatar when they change. Targets that were not rendered in a frame are dropped by the Layer component.'
        carries: 'The scope as JSON and the target''s painted bounds.'
      - id: dock-avatar-2
        fn: 'AvatarView::render (avatar mouse-down listener)'
        module: 'rs:voyager_desktop::avatar::view'
        at: {path: desktop/src/avatar/view.rs, find: 'cx.listener(move |this, event: &gpui::MouseDownEvent, window, cx| {'}
        runs_on: ui-thread
        via: call
        symbol: '<voyager_desktop::avatar::view::AvatarView as gpui::element::Render>::render::{closure#6}'
        says: 'Pressing the left button on the avatar records a Drag with the press point, the offset of the pointer inside the circle, the avatar''s size and the time.'
      - id: dock-avatar-3
        fn: 'Avatar::moving'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: 'if !drag.moved && f32::from(delta.x).hypot(f32::from(delta.y)) > 7. {'}
        runs_on: ui-thread
        via: call
        symbol: '<voyager_desktop::avatar::Avatar>::moving'
        says: 'A window-level mouse-move listener feeds every move to moving. Once the pointer is more than 7 px from the press point the drag counts as a move: Motion gets Trigger::Undock, which stops any playing clip (the default pack has no undock clip), and the falling tone plays. Each later move updates the drag position and redraws.'
        fails: 'If the left button is no longer reported pressed, the drag is cancelled with the rising tone. Escape also cancels.'
      - id: dock-avatar-4
        fn: 'AvatarView::render (landing preview)'
        module: 'rs:voyager_desktop::avatar::view'
        at: {path: desktop/src/avatar/view.rs, find: 'let (bounds, circular) = landing_preview(scope, bounds);'}
        runs_on: ui-thread
        via: render
        symbol: '<voyager_desktop::avatar::view::AvatarView as gpui::element::Render>::render'
        says: 'While moving, the avatar is drawn under the pointer with a closed-hand cursor, and Geometry::target_at finds the target under the grab point. That target gets a 1 px light blue outline; for the whole Workspace the outline is a circle where the avatar would land.'
      - id: dock-avatar-5
        fn: 'Avatar::released'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: '.target_at(window.bounds().origin + event.position)'}
        runs_on: ui-thread
        via: call
        symbol: '<voyager_desktop::avatar::Avatar>::released'
        says: 'On release in the same window, target_at is asked again with the release point. It only answers while the workspace window is visible and the point is inside it. If a target is found, released calls Avatar::dock with that target''s scope.'
        fails: 'With no target under the pointer, no request is sent; the rising tone plays and the avatar is drawn back at its current dock.'
      - id: dock-avatar-6
        fn: 'Avatar::dock'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: 'action: Action::Dock { context: scope },'}
        runs_on: ui-thread
        via: call
        symbol: '<voyager_desktop::avatar::Avatar>::dock'
        says: 'Builds a workspace Request with a new request id, the layout version the avatar last received from the header, and Action::Dock with the target''s scope. It spawns a GPUI task that runs Client::call on the background executor, so the UI thread does not wait for the owner thread.'
        carries: 'Request {requestId, expectedVersion, action: Dock {context: {kind: fleet, id}}}.'
        fails: 'A second dock while one is still pending is ignored.'
      - id: dock-avatar-7
        fn: 'Client::call, Client::queue_workspace'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn queue_workspace('}
        runs_on: background
        via: call
        symbol: '<voyager_app::client::Client>::queue_workspace'
        says: 'Puts Message::Workspace on the owner thread''s bounded queue (8 slots) without blocking, then waits up to 20 seconds on a one-slot reply channel.'
        fails: 'A full queue gives "Workspace busy or unavailable; nothing was queued". No reply in time gives "Workspace result unconfirmed; do not repeat the request".'
      - id: dock-avatar-8
        fn: 'Model::apply (Action::Dock)'
        module: 'rs:voyager_app::workspace'
        at: {path: app/src/workspace.rs, find: 'self.layout.context = context;'}
        runs_on: owner-thread
        via: channel
        symbol: '<voyager_app::workspace::Model>::apply'
        says: 'The owner thread (the loop in Client::start_with_launches) rejects reused or invalid request ids, refuses a layout that was not inspected or whose version moved on, and runs scope::check, which always allows Dock. On a copy of the layout, apply confirms the Voyage, Fleet, Vessel or Portal exists and sets layout.context to it. The owner then saves the layout document voyager-layout-v1 to Herdr Core with the expected version.'
        fails: 'Rejected with "invalid_workspace: Dock target not found", "Inspect the workspace before making a change" or "Layout changed; inspect it before making a new request". The in-memory layout changes only after Core accepts the save.'
      - id: dock-avatar-9
        fn: 'doc.set voyager-layout-v1 (external)'
        module: 'ext:hc'
        runs_on: core
        via: core-rpc
        says: 'Herdr Core receives doc.set with the layout and the version Voyager expects, stores it and returns the new version. A failure or version conflict comes back as an error that the owner turns into a refusal or an unconfirmed result.'
      - id: dock-avatar-10
        fn: 'owner reply and PrepareContext'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'let _ = close_sender.try_send(Message::PrepareContext {'}
        runs_on: owner-thread
        via: core-rpc
        symbol: '<voyager_app::client::Client>::start_with_launches::{closure#0}'
        says: 'The owner replies with status Applied, the new version and the layout projected for the caller. Because the version changed it also sends a WorkspaceNotice to the desktop''s workspace watcher. For an applied, fresh Dock it clears the old dock preview and, after replying, queues a PrepareContext message to itself, so preparing the preview never delays the avatar''s reply.'
        carries: 'Response {status, version, layout with context = the Fleet, fresh}.'
      - id: dock-avatar-11
        fn: 'Avatar::applied_dock'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: 'self.motion.trigger(Trigger::Dock);'}
        runs_on: ui-thread
        via: channel
        symbol: '<voyager_desktop::avatar::Avatar>::applied_dock'
        says: 'Back on the UI thread the dock task stores the new version and scope from the reply. For Applied, applied_dock records the receipt, activates the workspace window, closes the floating pop-up if there was one, plays the rising tone and triggers the Dock clip. In the default pack that is "float": the avatar image bobs up and back over 2 seconds. The response is stored for the header and Changed is emitted.'
        fails: 'A refused response is stored as well, so the header can show its message.'
      - id: dock-avatar-12
        fn: 'Workspace.render (take_result and acceptSnapshot)'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'const raw = take_result();'}
        runs_on: script
        via: script-call
        symbol: script
        says: 'Changed reaches Binding::observe, which refreshes the header script. In render the script calls take_result, validates the Response, and acceptSnapshot replaces the header''s layout and version. Because the context changed it clears the context facts and starts readContext. The Fleet strip redraws with the docked tab 40 px tall and 48 px of left padding.'
        fails: 'An invalid or refused response puts its message in the header status line.'
      - id: dock-avatar-13
        fn: 'avatar Layer component'
        module: 'rs:voyager_desktop::avatar'
        at: {path: desktop/src/avatar.rs, find: '.component("Layer", move |mut args, window, cx| {'}
        runs_on: ui-thread
        via: script-call
        symbol: '<voyager_desktop::avatar::Binding>::module::{closure#4}'
        says: 'The header wraps the whole shell in Layer with the layout''s context, version, dock receipt and a layout key. Layer updates the avatar''s scope and version, cancels a drag if the layout key changed, and recomputes dock visibility. For a visible Fleet dock, speech_in_primary becomes true, so the voice control and a green status dot move into the sidebar heading next to the Chat button.'
      - id: dock-avatar-14
        fn: 'AvatarView::position (Fleet landing)'
        module: 'rs:voyager_desktop::avatar::view'
        at: {path: desktop/src/avatar/view.rs, find: 'Scope::Voyage { .. } | Scope::Fleet { .. } => Some((small_landing(b), 38.)),'}
        runs_on: ui-thread
        via: render
        symbol: '<voyager_desktop::avatar::view::AvatarView as gpui::element::Render>::render'
        says: 'On the next frame the avatar finds the Fleet target''s bounds and draws a 38 px avatar 2 px below the tab''s top and up to 12 px in from its left edge, inside the padding the tab made. The status dot is not drawn on a 38 px Fleet avatar. Each frame also ticks Motion, which keeps requesting frames while the float clip plays.'
      - id: dock-avatar-15
        fn: 'context_facts host function'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: '.async_function("context_facts", move |_| {'}
        runs_on: background
        via: script-call
        symbol: 'voyager_desktop::host::load::{closure#7}::{closure#0}'
        says: 'readContext in main.ts calls context_facts. Its asynchronous half sends Message::ContextFacts on the owner queue, then runs context::resolve off the UI thread, which reads .git/HEAD under the dock''s directory for a branch name.'
        fails: '"Workspace context is unavailable" or a reply over 64 KiB; the header then shows no path.'
      - id: dock-avatar-16
        fn: 'context::capture'
        module: 'rs:voyager_app::context'
        at: {path: app/src/context.rs, find: 'pub(crate) fn capture(layout: &Arc<Layout>, version: u64) -> Result<Facts, String> {'}
        runs_on: owner-thread
        via: channel
        symbol: 'voyager_app::context::capture'
        says: 'On the owner thread, capture builds Facts from the current layout: the dock scope; the readable path from conversation::focus (the Voyage name then the Fleet name, only "Home" for the Home Voyage, "Overwatch" for the whole Workspace); the working directory if every content in the scope shares one; and the version.'
