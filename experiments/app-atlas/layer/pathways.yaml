        via: ipc
        symbol: 'voyager_app::codex::protocol::decode'
        says: 'The Codex stdout reader thread reads one JSON line at a time, bounded to 1 MiB except for voyager_content frames. A request with an id and method item/tool/call becomes Event::Tool and goes to the conversation owner on a channel.'
        fails: 'Any other callback, such as an approval request, is answered with error -32601 "Unsupported private provider callback; nothing was dispatched". A broken or oversized frame disconnects the provider and the chat shows the error.'
      - id: ask-by-text-10
        fn: 'Tools::call'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: 'pub fn call('}
        runs_on: background
        via: channel
        symbol: '<voyager_app::administrator::Tools>::call'
        says: 'Owner::receive hands the call to Tools::call, holding it until turn/start has answered if needed. The call must match the accepted thread and turn, name one of the four tools and carry no namespace. A repeated callId with the same arguments gets the stored result. Otherwise it checks the 32-call limit, the 8 KiB argument limit, that a turn is active with a captured Focus and no other effect running, parses the arguments, and starts a short-lived effect thread.'
        carries: 'The parsed workspace input and the Focus scope captured at send time, not the current dock.'
        fails: 'Refusals go straight back to Codex as an unsuccessful result starting "Rejected before dispatch:", for example "No active tool capacity; nothing was dispatched".'
      - id: ask-by-text-11
        fn: 'Tools::call effect thread (workspace dispatch)'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: 'match client.scoped_call(scope, request) {'}
        runs_on: background
        via: call
        symbol: '<voyager_app::administrator::Tools>::call::{closure#12}'
        says: 'The effect thread builds a workspace Request with a request id issued by Voyager, not by Codex, and calls Client::scoped_call with the captured scope. That puts Message::Workspace on the same bounded owner queue the header and avatar use, and waits up to 20 seconds.'
        carries: 'Request {requestId, expectedVersion, action: CreateContent {typeId: terminal, destination: panel in the Fleet}} plus scope = the docked Fleet.'
        fails: 'A full queue gives "Workspace busy or unavailable; nothing was queued" (Rejected). No reply in time gives an Uncertain result.'
      - id: ask-by-text-12
        fn: 'scope::check'
        module: 'rs:voyager_app::scope'
        at: {path: app/src/scope.rs, find: 'pub(crate) fn check('}
