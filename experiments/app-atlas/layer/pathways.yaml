        fails: 'Refusals go straight back to Codex as an unsuccessful result starting ''Rejected before dispatch:'', for example ''No active tool capacity; nothing was dispatched''.'
      - id: assistant-request-15
        fn: 'effect thread (Dispatch::Workspace)'
        module: 'rs:voyager_app::administrator'
        at: {path: app/src/administrator.rs, find: 'match client.scoped_call(scope, request) {'}
        runs_on: background
        via: call
        says: 'The effect thread builds a workspace Request with a request id issued by Voyager, not by Codex, and calls Client::scoped_call with the captured scope. That puts Message::Workspace on the same bounded owner queue the header and avatar use, and waits up to 20 seconds.'
        carries: 'Request {requestId, expectedVersion, action: CreateContent {typeId: terminal, destination: panel in the Fleet}} plus scope = the docked Fleet.'
        fails: 'A full queue gives ''Workspace busy or unavailable; nothing was queued'' (Rejected). No reply in time gives an Uncertain result: ''Workspace result unconfirmed; do not repeat the request''.'
      - id: assistant-request-16
        fn: 'scope::check'
