            symbol: '<voyager_desktop::avatar::view::AvatarView as gpui::element::Render>::render::{closure#3}'
            says: 'Hovering with no drag in progress triggers Hover. The default "stretch" clip fades through uncross, stretch and peak, holds about 1.9 seconds and returns to rest. A Hover is ignored while another clip is playing.'
          - id: avatar-open-chat-1b
            fn: 'Motion::tick'
