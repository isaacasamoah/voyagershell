      - id: dock-avatar-17
        fn: renderContext
        module: 'ts:desktop/mods/header/navigation-view.ts'
        at: {path: desktop/mods/header/navigation-view.ts, find: 'if (facts) row.child(div().child(facts.path.join(" / ")));'}
        runs_on: script
        via: script-call
        symbol: script
        says: 'When the facts match the header''s version and scope, the context bar shows the branch of the focused panel (from a separate workspace observation, not from the dock) and the dock path joined with " / ", for example "<Voyage name> / <Fleet name>". If the docked target is not visible, the bar instead holds a small fallback spot for the avatar and a "Go there" button.'
      - id: dock-avatar-18
        fn: 'context::prepare'
        module: 'rs:voyager_app::context'
        at: {path: app/src/context.rs, find: 'pub(crate) fn prepare('}
        runs_on: owner-thread
        via: channel
        symbol: 'voyager_app::context::prepare'
        says: 'When the owner reaches the queued PrepareContext and the layout and context are unchanged, prepare reads the screens of up to three visible terminals in the docked scope through Core terminal.read, and the saved text of visible Notes, capped at 4096 bytes. It stores the result as the dock preview. Nothing shows it on screen; it is attached to the next chat message''s focus (ask-by-text step 4).'
