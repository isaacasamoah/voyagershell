      - 'What Herdr Core runs for terminal.run with an empty argv (login shell, a fixed shell or something else) is decided inside Core, which is not in this repository.'
      - 'When the new Pane first resizes the Core terminal to the split''s real size was not traced; it lives in desktop/src/terminal.rs.'
    common: true
  - id: resize-split
    name: 'Resize two Vessels by dragging their divider'
    trigger: 'The person presses the left mouse button on the thin divider between two Vessels, drags it, and releases.'
    summary: 'The header script draws each branch of a Fleet''s split tree as a native Split and gives it the saved share, the layout version and a callback. While the button is held, gpui-base resizes the two panes natively and nothing is sent anywhere. On release the Split turns the pane sizes into a share out of 10000 and calls the script once; the script sends resize-panel-split to the app''s owner thread, which changes that branch''s share in a copy of the layout, saves the whole layout to Herdr Core and replies, and the next render re-applies the saved share.'
    steps:
      - id: resize-split-1
        fn: Workspace.pane
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'return NativeSplit.new('}
        runs_on: script
        via: render
        says: 'When the header renders a Fleet or the Portal column, pane walks its saved split tree. Each branch with two visible children becomes a native Split whose id joins the session id, the panel owner and the path from the root, so the same divider keeps its native state across renders.'
        carries: 'Split id, axis, saved share (out of 10000, 5000 when missing), the layout version as revision, the splitReset counter and the resize callback.'
        symbol: script
      - id: resize-split-2
        fn: 'Split constructor / Split::materialize'
        module: 'rs:voyager_desktop::split'
        at: {path: desktop/src/split.rs, find: 'window.use_keyed_state(format!("voyager-split:{}", config.id), cx, |_, cx| State {'}
        runs_on: ui-thread
        via: script-call
        says: 'The Split constructor checks the id, the decimal revision, the reset counter and that the share is a whole number from 1 to 9999. At render, materialize keeps one State per Split id holding gpui-base''s ResizableState, the latest config and callback, the drag gesture and two markers (awaiting and applied). It builds a gpui-base ResizablePanelGroup of two panels, each at least 24 pixels, a divider exposed as a splitter named "Resize side by side panes" or "Resize stacked panes", and an invisible full-size tracker canvas.'
        fails: 'A bad argument fails with "Invalid split configuration"; a Split without exactly two children fails with "Split requires two children".'
        symbol: '<voyager_desktop::split::Split as gpui_shell::component_registry::ComponentMaterializer>::materialize'
      - id: resize-split-3
        fn: 'Split tracker mouse-down listener (Gesture::begin)'
        module: 'rs:voyager_desktop::split'
        at: {path: desktop/src/split.rs, find: 'state.gesture.begin(state.config.clone());'}
        runs_on: ui-thread
        via: call
        says: 'The tracker registers a window-level, capture-phase mouse-down listener. A left press anywhere inside the Split''s bounds records the current config as the gesture''s origin and marks it pressed. When the pointer then moves, gpui-base''s divider handle starts its own native drag and records which panel is being resized.'
        carries: 'Pointer position; the config (id, revision, reset) at press time.'
        symbol: 'split::Split as gpui_shell::component_registry::ComponentMaterializer>::materialize::{closure#5}::{closure#0}::{closure#0}>::{closure#0}'
      - id: resize-split-4
        fn: 'ResizableState::resize_panel_at_handle (gpui-base, on each mouse move)'
        module: 'rs:voyager_desktop::split'
        at: {path: desktop/src/split.rs, find: 'let mut group = ResizablePanelGroup::new(format!("split-panels:{}", config.id))'}
        runs_on: ui-thread
        via: call
        says: 'While the button is held, gpui-base''s panel group handles every mouse move itself: it resizes the panel before the divider, within the 24-pixel minimum, and repaints. The divider is drawn in the theme''s active handle colour. The tracker sees gesture.pressed and does not re-apply the saved share, so it does not fight the drag. Nothing reaches the header script, the owner thread or Core during the drag.'
        symbol: '<gpui_base::resizable::ResizableState>::resize_panel_at_handle'
      - id: resize-split-5
        fn: 'Split on_resize (Gesture::finish, Allocation::completed)'
        module: 'rs:voyager_desktop::split'
        at: {path: desktop/src/split.rs, find: '.on_resize(move |native, window, cx| {'}
        runs_on: ui-thread
        via: call
        says: 'On release gpui-base ends the resize and calls on_resize. The Split turns the two pane sizes into a share: 10000 times the first pane over both, rounded and kept between 1 and 9999. Gesture::finish returns the press-time config only if id, revision, reset and allocation still match the current config. The Split marks that config as awaiting, so the tracker leaves the divider where it was dropped while the save is in flight, and calls the script callback.'
        carries: 'The revision captured at press time and the new share.'
        fails: 'If the layout version or reset counter changed during the drag, no callback runs and the next layout pass puts the divider back at the saved share. If the callback throws, the Split logs "Split resize callback" and clears awaiting.'
        symbol: '<voyager_desktop::split::Split as gpui_shell::component_registry::ComponentMaterializer>::materialize::{closure#3}'
      - id: resize-split-6
        fn: 'Workspace.pane (Split resize callback)'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: '{ operation: "resize-panel-split", owner: group.owner, path, share },'}
        runs_on: script
        via: script-call
        says: 'This callback is the first thing the header script hears about the drag. It calls run with a resize-panel-split action naming the panel owner (a Fleet or a Voyage''s Portal column), the list of first and second steps to the branch, and the share. It passes the press-time revision as the expected version, so the owner refuses the resize if the layout changed since the press.'
        carries: 'resize-panel-split {owner, path, share} and the expected version.'
        symbol: script
      - id: resize-split-7
        fn: Workspace.run
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'action.operation === "resize-panel-split" ||'}
        runs_on: script
        via: call
        says: 'run first clears any arrangement drag. A resize is never queued: if another workspace request is in flight, run bumps splitReset, sets a status and returns. Otherwise it marks the header busy and starts an async task that calls the generated invoke wrapper.'
        fails: '"Resize was not saved while another workspace request was pending." The bumped splitReset changes the Split''s config, so the divider snaps back to the saved share.'
        symbol: script
      - id: resize-split-8
        fn: invoke
        module: 'ts:contract/generated/workspace.ts'
        at: {path: contract/generated/workspace.ts, find: 'export async function invoke('}
        runs_on: script
        via: call
        says: 'The generated wrapper adds a fresh request id from the host''s request_id, checks the Request against the generated schema (share 1 to 9999, path at most 128 steps) and awaits the host function call with the JSON. It then checks the Response schema and that the request id matches.'
        fails: 'A mismatch throws "Invalid workspace request" or "Invalid workspace response"; run shows it, marks its snapshot not fresh and bumps splitReset.'
        symbol: script
      - id: resize-split-9
        fn: 'workspace host function call -> Client::call -> Client::queue_workspace'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: 'let result = client.call(request).map_err(gpui_shell::HostError::new)?;'}
        runs_on: background
        via: script-call
        says: 'The host''s call function checks the 64 KiB size limit, then on the GPUI background executor parses the Request and calls Client::call. That try_sends a Workspace message into the owner thread''s bounded queue with no agent scope and blocks waiting for the reply.'
        fails: 'A full queue refuses at once with "Workspace busy or unavailable; nothing was queued". No reply within 20 seconds gives "Workspace result unconfirmed; do not repeat the request".'
        symbol: 'voyager_desktop::host::load::{closure#9}::{closure#0}'
      - id: resize-split-10
        fn: 'owner thread: Workspace message admission'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: '"Layout changed; inspect it before making a new request"'}
        runs_on: owner-thread
        via: channel
        says: 'The owner thread handles one message at a time, so layout changes never interleave. It replays the stored result for a repeated request id, refuses work while quitting or while its snapshot is not fresh, and refuses when the expected version is not its current version. The header''s requests carry no scope, so the scope check passes.'
        fails: '"Inspect the workspace before making a change" or "Layout changed; inspect it before making a new request", returned with status rejected and kind invalid_workspace.'
        symbol: '<voyager_app::client::Client>::start_with_launches::{closure#0}::{closure#47}'
      - id: resize-split-11
        fn: 'Model::apply -> panels::apply (ResizePanelSplit)'
        module: 'rs:voyager_app::panels'
        at: {path: app/src/panels.rs, find: 'Action::ResizePanelSplit { owner, path, share } => {'}
        runs_on: owner-thread
        via: call
        says: 'The owner applies the action to a copy of the layout. Model::apply passes panel actions to panels::apply, which finds the owner''s split tree with group_mut, follows the path through first and second children, and replaces that branch''s share. Placements, contents and Core terminals are untouched.'
        carries: 'Owner, path and share.'
        fails: '"Split path exceeds 128 steps", "Split branch not found" or "Panel arrangement not found"; nothing is saved.'
        symbol: 'voyager_app::panels::apply'
      - id: resize-split-12
        fn: 'owner thread save -> Core::document_set'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'let revision = save(core, &candidate.layout, version).map_err(|error| {'}
        runs_on: owner-thread
        via: core-rpc
        says: 'After the Voyage-close check, the owner writes the whole layout to Herdr Core as the document voyager-layout-v1 with doc.set, passing the version it holds, and blocks until Core answers. So one finished drag costs one full layout write, made on release and never during the drag.'
        carries: 'The complete layout JSON and the expected document version.'
        symbol: '<voyager_app::core::Core>::document_set::<voyager_contract::Layout>'
      - id: resize-split-13
        fn: doc.set
        module: 'ext:hc'
        runs_on: core
        via: core-rpc
        says: 'Herdr Core stores the document if the expected version still matches and returns the new version. The saved share therefore lives in Core, not in a Voyager file.'
        fails: 'A stale version is refused with kind conflict; the owner then marks its snapshot not fresh and replies rejected.'
      - id: resize-split-14
        fn: 'owner thread reply and WorkspaceNotice'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: '|| closing.revision != previous_close_revision'}
        runs_on: owner-thread
        via: channel
        says: 'The owner adopts the new layout and version and fills the Response with status applied, the new version, the layout and fresh. Because the version moved, it refreshes Notes views and sends a WorkspaceNotice to the desktop listener. It keeps the outcome as a receipt and replies on the request''s channel, which wakes the waiting background task.'
        carries: 'Response {requestId, status, version, layout, fresh}.'
        symbol: '<voyager_app::client::Client>::start_with_launches::{closure#0}'
      - id: resize-split-15
        fn: Workspace.acceptSnapshot
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: '  acceptSnapshot(result: Response, task: AsyncContext) {'}
        runs_on: script
        via: script-call
        says: 'The call promise resolves with the Response. acceptSnapshot keeps it unless its version is older than the header''s, replaces the layout and version, and bumps splitReset. run then clears busy and asks for a re-render. When the notice arrives later its revision is not newer, so it triggers no extra inspect.'
        fails: 'On a refusal the header still accepts the unchanged layout and shows the owner''s message (branch 2).'
        symbol: script
      - id: resize-split-16
        fn: 'Split tracker canvas (Allocation::resize_target, ResizableState::resize_panel)'
        module: 'rs:voyager_desktop::split'
        at: {path: desktop/src/split.rs, find: 'let (index, size) = expected.allocation.resize_target(extent);'}
        runs_on: ui-thread
        via: render
        says: 'The re-render gives the Split the saved share with a new revision and reset, so its config changes and it is no longer awaiting. After layout, the tracker measures its width or height and defers a call to gpui-base''s resize_panel that sets the first pane to share/10000 of it. The divider stays where it was dropped, now backed by the saved value, and later window resizes keep the same ratio.'
        symbol: 'split::Split as gpui_shell::component_registry::ComponentMaterializer>::materialize::{closure#4}::{closure#1}::{closure#0}>::{closure#0}'
    branches:
      - name: 'Another request is pending, so the resize is dropped'
        from: resize-split-7
        steps:
          - id: resize-split-b1-1
            fn: Workspace.run
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: '"Resize was not saved while another workspace request was pending.";'}
            runs_on: script
            via: call
            says: 'If a request such as a terminal start is still in flight, the resize is neither sent nor queued. splitReset increases and the status line explains why.'
            symbol: script
          - id: resize-split-b1-2
            fn: 'Split tracker canvas'
            module: 'rs:voyager_desktop::split'
            at: {path: desktop/src/split.rs, find: 'state.applied = Some((expected, extent));'}
            runs_on: ui-thread
            via: render
            says: 'The new reset counter makes the config differ from the awaiting one, so the tracker re-applies the saved share and the divider jumps back.'
            symbol: 'split::Split as gpui_shell::component_registry::ComponentMaterializer>::materialize::{closure#4}::{closure#1}::{closure#0}>::{closure#0}'
      - name: 'The owner refuses because the layout changed'
        from: resize-split-10
        steps:
          - id: resize-split-b2-1
            fn: 'Workspace.pane (resize done handler)'
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: 'if (result?.status === "applied") return;'}
            runs_on: script
            via: script-call
            says: 'When the result is not applied, the done handler keeps the status message and runs an inspect, so the header reloads the current layout and every Split re-applies its saved share.'
            symbol: script
      - name: 'Dragging the Portal column edge'
        from: resize-split-5
        steps:
          - id: resize-split-b3-1
            fn: 'Column constructor'
            module: 'rs:voyager_desktop::split'
            at: {path: desktop/src/split.rs, find: 'allocation: Allocation::TrailingPixels(*width as u16),'}
            runs_on: ui-thread
            via: script-call
            says: 'The Portal column uses the same Rust component registered as Column. Its second panel is fixed at a pixel width from 1 to 4096, and on release it reports that width instead of a share.'
            symbol: 'voyager_desktop::split::register::{closure#1}'
          - id: resize-split-b3-2
            fn: 'Workspace.portalColumn (width callback)'
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: '{ operation: "set-portal-presentation", voyage: voyage.id, width },'}
            runs_on: script
            via: script-call
            says: 'The header sends set-portal-presentation with only the width, and the owner stores it in that Voyage''s PortalLayout.width. A busy header drops it in the same way as a split resize.'
            symbol: script
    better:
      - step: resize-split-7
        idea: 'Keep the last released share and send it once the pending request finishes, as run already does for a selection made during a rename.'
        why: 'A drag released while a terminal start or other request is in flight snaps back, and the person''s change is lost without being saved.'
