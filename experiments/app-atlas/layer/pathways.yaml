        at: {path: app/src/codex_protocol.rs, find: '"turn/start",'}
        runs_on: background
        via: ipc
        symbol: 'voyager_app::codex::protocol::encode'
        says: 'When thread/start returns a thread id, start_turn sets the phase to Working and sends turn/start on Codex''s stdin: the user''s text, the effort, and the frozen Focus as additional context named voyager.focus. Each request has a 25-second deadline.'
