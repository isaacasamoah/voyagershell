        fails: '"Native voice compatibility is being inspected", "The previous native connection is still starting or stopping", or the Unavailable reason.'
      - id: ask-by-voice-5
        fn: 'Owner::start_audio'
        module: 'rs:voyager_app::conversation_client::audio'
