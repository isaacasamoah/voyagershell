schema: app-atlas/v0
note: 'Pathways traced by reading source at the recorded commit. Each step names the function, the thread it runs on and how it is reached.'
pathways:
  - id: startup
    name: 'Start Voyager and draw the first useful frame'
    trigger: 'The person runs `voyager-shell --profile <absolute dir> --session <name>`.'
    summary: 'The binary checks its arguments, copies the header and Notes scripts into the profile if they are missing, and starts the workspace owner thread, which connects to Herdr Core through an `hc connect` bridge program. On the GPUI main thread it opens the window and loads the header script into QuickJS. The script''s first inspect request goes through a background thread to the owner thread, which reads or creates the saved layout in Core; each visible terminal is then attached and its Core output painted.'
    steps:
      - id: startup-1
        fn: arguments
        module: 'bin:voyager-shell'
        at: {path: desktop/src/main.rs, find: 'fn arguments() -> Result<(PathBuf, String)> {'}
        runs_on: ui-thread
        via: process
        says: 'The OS starts the binary. `main` reads `--profile` (an absolute folder holding the person''s scripts, theme and content) and `--session` (the Herdr Core session name). This is the process''s main thread, which later becomes the GPUI main thread.'
        carries: 'command-line arguments'
        fails: 'An unknown argument, a missing or relative profile, or a session containing anything other than lowercase letters, digits and hyphens prints the error and exits with status 1. No window opens.'
        symbol: inlined
        symbol_caller: 'voyager_shell::main'
      - id: startup-2
        fn: 'voyager_desktop::run'
        module: 'rs:voyager_desktop'
        at: {path: desktop/src/lib.rs, find: 'pub fn run(profile: PathBuf, session: String) -> Result<()> {'}
        runs_on: ui-thread
        via: file
        says: '`run` copies the built-in header scripts, icons, theme and generated contract helpers (validate.js, workspace.js, conversation.js) into `<profile>/mods/header`, and the Notes package into `<profile>/mods/notes`. Each copy only creates a missing file, so a file the person edited is never overwritten. It then opens the content owner over `<profile>/data`, checks that the header''s mod.json names main.js, version 1 and a name, hashes the header''s .js files for later reload detection, and seeds launches.json.'
        carries: 'profile path; file contents compiled into the binary with include_str!'
        fails: 'A file-system error other than "already exists", or a header manifest without a name, version 1 and main.js entry, stops start-up with an error and exit status 1.'
        symbol: 'voyager_desktop::run'
      - id: startup-3
        fn: 'Client::start_with_launches'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn start_with_launches('}
        runs_on: ui-thread
        via: call
        says: 'Creates the workspace client: a queue with room for 8 messages and one new thread, the owner thread, which alone holds the layout, the Core connection and the content owner. The call returns at once. Every later workspace request becomes a message that this thread handles one at a time.'
        carries: 'session name, current working directory, content owner, launches.json path'
        symbol: '<voyager_app::client::Client>::start_with_launches'
      - id: startup-4
        fn: 'Core::connect_activity'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: '.args(["connect", "--session", session])'}
        runs_on: owner-thread
        via: process
        says: 'The owner thread''s first act. It checks that the session starts with `voyager-`, then starts the `hc connect --session <name>` bridge program (or the program named by VOYAGER_HC) with HC_SOCKET set by core_endpoint::endpoint. It sends a JSON-RPC `hello` over the bridge''s stdin and reads one reply line; validate_hello requires Core''s permanent ID, the 13 methods Voyager uses and the framed, attach and shell features. The Core ID is kept so a later stop can confirm it is the same Core.'
        carries: 'session name; socket path such as $XDG_RUNTIME_DIR/herdr-core/<session>.sock'
        fails: 'A session without the `voyager-` prefix is refused ("Use a dedicated voyager- session"). If `hc` cannot start, or the hello reply is missing, malformed or lacks required capabilities, the bridge is killed and reaped. In every case the owner thread keeps the error and carries on without Core (see branch).'
        symbol: '<voyager_app::core::Core>::connect_activity'
      - id: startup-5
        fn: 'Core::connect_activity (bridge reader and writer threads)'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: 'let Ok(frame) = Frame::read_from(&mut output) else {'}
        runs_on: background
        via: core-stream
        says: 'Two more threads start. The writer thread sends queued frames to the bridge, control frames before terminal input. The reader thread routes each frame from Core to the waiting RPC reply, a terminal''s output buffer or the activity observer. The owner thread then subscribes to program activity events (events.subscribe) when Core supports it, and enters its message loop, blocking until a message arrives.'
        fails: 'When either thread loses the pipe it marks the connection closed, drops waiting replies and records "Core is disconnected" for activity.'
        symbol: inlined
        symbol_caller: '__rust_begin_short_backtrace::<<voyager_app::core::Core>::connect_activity::{closure#6}, ()>'
      - id: startup-6
        fn: 'conversation_client::Client::with_audio'
        module: 'rs:voyager_app::conversation_client'
        at: {path: app/src/conversation_client.rs, find: 'pub fn with_audio('}
        runs_on: background
        via: channel
        says: 'Back on the main thread, `run` prepares the avatar animation pack and creates the private assistant client. It spawns its own conversation owner thread with an 8-slot queue. At start that thread only checks whether a Codex executable is available for voice; no Codex app-server is started yet.'
        symbol: '<voyager_app::conversation_client::Client>::with_audio'
      - id: startup-7
        fn: 'voyager_desktop::run (GPUI launch callback)'
        module: 'rs:voyager_desktop'
        at: {path: desktop/src/lib.rs, find: '.run(move |cx: &mut App| {'}
        runs_on: ui-thread
        via: call
        says: 'GPUI starts with the header package as its asset folder. The launch callback builds the native component registry (text, status, arrangement, split, overlay and the Terminal component, which shares the `viewers` map), binds Ctrl+Q to the Quit action, creates the QuickJS script runtime (ShellRuntime) and creates the Notes host with its own isolated script runtime.'
        fails: 'A registry or script-runtime failure prints the error and calls cx.quit(), so the app exits without a window.'
        symbol: inlined
        symbol_caller: '<gpui::app::Application>::run<voyager_desktop::run::{closure#1}>::{closure#0} as core::ops::function::FnOnce<()>>::call_once'
      - id: startup-8
        fn: 'open_window callback'
        module: 'rs:voyager_desktop'
        at: {path: desktop/src/lib.rs, find: 'if let Err(error) = cx.open_window(options, |window, cx| {'}
        runs_on: ui-thread
        via: call
        says: 'Opens a 1450 by 940 window titled with "Voyager" and the session name. Inside, it sets up speech and the avatar, builds the Header (host::Header::new), registers the Quit handler (quit::register) and makes ShellRoot the window root with the avatar drawn as a native overlay.'
        fails: 'If the window cannot open, prints "Native window failed" and quits.'
        symbol: inlined
        symbol_caller: '<gpui::app::Application>::run<voyager_desktop::run::{closure#1}>::{closure#0} as core::ops::function::FnOnce<()>>::call_once'
      - id: startup-9
        fn: 'host::load'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: 'runtime.try_load(package, window, cx)'}
        runs_on: ui-thread
        via: script-call
        says: 'Header::new applies the theme, then `load` builds the host modules the script may import (voyager_header for theme colours, voyager_workspace for workspace calls, plus content view, conversation and avatar) and installs them as the load policy. gpui-shell reads mod.json, evaluates main.js in QuickJS and constructs its default export, the Workspace view. Header::new also starts a task that waits for workspace change notices from the owner thread.'
        fails: 'A script error leaves no root view. The Header shows "Header load failed: ..." and retries (see branch).'
        symbol: 'voyager_desktop::host::load'
      - id: startup-10
        fn: Workspace.init
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'this.status = "Opening workspace";'}
        runs_on: script
        via: script-call
        says: 'The header script''s init sets empty state, sets the status to "Opening workspace", starts an inspect request with run({operation: "inspect"}) and starts a loop that refreshes context facts. The request runs as an async task, so init returns at once.'
        symbol: script
      - id: startup-11
        fn: Workspace.render
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: '.child(this.status || "Workspace canvas unavailable")'}
        runs_on: ui-thread
        via: render
        says: 'GPUI draws the window. Header::render shows the script view; with no layout yet, the script renders the status "Opening workspace" and a Refresh button on the theme background. Because the inspect needs a round trip through two other threads and Core, this is normally the first frame.'
        inferred: true
        symbol: script
      - id: startup-12
        fn: 'voyager_workspace.call host function'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: 'let result = client.call(request).map_err(gpui_shell::HostError::new)?;'}
        runs_on: background
        via: script-call
        says: 'The script''s invoke (contract/generated/workspace.ts) builds a Request with a new request id and expected version 0, validates it against the generated schema and passes its JSON to the Rust host function `call`. gpui-shell drives that function''s future on a GPUI background thread, where Client::call puts a Workspace message on the owner''s queue and waits up to 20 seconds for the reply.'
        carries: 'Request {requestId, expectedVersion: "0", action: inspect} as JSON'
        fails: 'A full queue is refused at once ("Workspace busy or unavailable; nothing was queued"). No reply within 20 seconds returns "Workspace result unconfirmed; do not repeat the request".'
        symbol: 'voyager_desktop::host::load::{closure#9}::{closure#0}'
      - id: startup-13
        fn: 'owner thread Inspect, client::load'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'load(core, &cwd).and_then(|(loaded, revision, missing)| {'}
        runs_on: owner-thread
        via: channel
        says: 'The owner asks Core for the saved document "voyager-layout-v1" (doc.get), validates and prepares it. If none exists it creates a Voyage named "Voyager" for the working directory and saves it (doc.set). On the first inspect only, it lists Core''s terminals (terminal.list); a saved terminal placement whose program has ended or is missing is cleared so it opens a new ordinary shell, and agents are not resumed. It marks the layout fresh and replies with the layout and version.'
        carries: 'the Inspect request; Core RPCs doc.get, doc.set and terminal.list'
        fails: 'With no Core connection, the stored connect error is returned. A stored layout that does not parse or validate is refused ("Stored workspace is invalid"). A lost Core reply is uncertain and marks the layout not fresh.'
        symbol: '<voyager_app::client::Client>::start_with_launches::{closure#0}::{closure#47}'
      - id: startup-14
        fn: 'Workspace.prepare, openTerminal, voyager_workspace.terminal_open'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'opened = await openTerminal(vessel.content, this.version);'}
        runs_on: script
        via: script-call
        says: 'The script accepts the snapshot (stores layout and version) and, for each visible Terminal placement, calls openTerminal. On an existing workspace it only attaches placements that already have a Core program, plus those the owner just marked for a new shell. The Rust host function `terminal_open` runs on a background thread and calls Client::terminal, which queues a Terminal message and waits up to 25 seconds.'
        carries: 'TerminalRequest {requestId, contentId, expectedVersion}'
        fails: 'A throw marks that placement "uncertain" and stops preparation; the error becomes the header status.'
        symbol: script
      - id: startup-15
        fn: 'client::open_terminal'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn open_terminal('}
        runs_on: owner-thread
        via: core-rpc
        says: 'For a placement bound to a Core program, the owner reads it (terminal.get). Otherwise it first saves a start marker in the layout, runs the program in Core (terminal.run with a voyager-operation label) and saves the new address. It then attaches (terminal.attach), which opens a Core output channel, and returns a Viewer: a handle to that channel''s buffer and the shared input and control queues.'
        fails: 'Refused when the layout is not fresh, the version changed, the Voyage is closing or the content is not a terminal. An unconfirmed start is reported once with the label to look for in Core and is never repeated.'
        symbol: 'voyager_app::client::open_terminal'
      - id: startup-16
        fn: 'TerminalState constructor, Pane::new'
        module: 'rs:voyager_desktop::terminal'
        at: {path: desktop/src/terminal.rs, find: 'Pane::new(screen, viewer, font_family, cell_width, window, cx)'}
        runs_on: ui-thread
        via: script-call
        says: 'On the background thread, install_viewer stores the Viewer in the shared `viewers` map under the content id. Back in the script, TerminalState.new(contentId) calls this registered constructor, which takes that Viewer, creates a terminal screen at the size Core reported and a Pane. The Pane starts a task that wakes whenever the reader thread signals new output.'
        fails: 'If no Viewer is in the map, the constructor fails with "Terminal is not attached".'
        symbol: inlined
        symbol_caller: '<gpui::app::App as gpui::AppContext>::new::<voyager_desktop::terminal::Pane, voyager_desktop::terminal::register::{closure#0}::{closure#4}>::{closure#0}'
      - id: startup-17
        fn: 'Pane::pump, Pane render'
        module: 'rs:voyager_desktop::terminal'
        at: {path: desktop/src/terminal.rs, find: 'fn pump(&mut self, cx: &mut Context<Self>) -> bool {'}
        runs_on: ui-thread
        via: core-stream
        says: 'Core streams the program''s screen output on the attached channel; the reader thread buffers it. pump takes up to 64 KiB per pass (2 ms at most), feeds it to the terminal emulator, returns flow-control credit to Core and asks for a redraw. panel-view.ts places Terminal.new(state) in the Vessel, and terminal_view.rs paints the rows. This is the first useful frame.'
        fails: 'Shows "Core disconnected" or "Terminal ended" in the pane when the channel closes.'
        symbol: inlined
        symbol_caller: '<gpui::app::App as gpui::AppContext>::update_entity::<voyager_desktop::terminal::Pane, bool, <voyager_desktop::terminal::Pane>::new::{closure#0}::{closure#0}::{closure#0}>::{closure#0}'
    branches:
      - name: 'Core is unreachable or the session name is refused'
        from: startup-4
        steps:
          - id: startup-b1-1
            fn: 'owner thread Workspace handling'
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'let result = match core.as_mut() {'}
            runs_on: owner-thread
            via: channel
            says: 'The window still opens and the script still sends its inspect. The owner has no Core, so it returns the stored connect error as the result, rejected or uncertain, with an empty layout.'
            symbol: '<voyager_app::client::Client>::start_with_launches::{closure#0}'
          - id: startup-b1-2
            fn: Workspace.acceptSnapshot
            module: 'ts:desktop/mods/header/main.ts'
            at: {path: desktop/mods/header/main.ts, find: 'this.status = result.message || "";'}
            runs_on: script
            via: script-call
            says: 'The script stores the message as its status. Render shows that message and a Refresh button. Refresh sends another inspect, but the owner never reconnects; a restart is needed.'
            symbol: script
      - name: 'Header script fails to load'
        from: startup-9
        steps:
          - id: startup-b2-1
            fn: 'Header::new'
            module: 'rs:voyager_desktop::host'
            at: {path: desktop/src/host.rs, find: 'Err(error) => (None, Some(format!("Header load failed: {error:#}"))),'}
            runs_on: ui-thread
            via: render
            says: 'The Header keeps no root view and draws "Header load failed" with the error in its status box.'
            symbol: '<voyager_desktop::host::Header>::new'
          - id: startup-b2-2
            fn: 'Header poll task'
            module: 'rs:voyager_desktop::host'
            at: {path: desktop/src/host.rs, find: 'let source_path = retrying.then(|| package.clone());'}
            runs_on: background
            via: file
            says: 'Every 250 ms a task rehashes the header''s .js files and rereads the theme on a background thread. When the source or a valid theme changes, it tries the load again on the UI thread.'
            symbol: inlined
            symbol_caller: '<gpui::app::App>::spawn::<<gpui::app::context::Context<voyager_desktop::host::Header>>::spawn<<voyager_desktop::host::Header>::new::{closure#4}, ()>::{closure#0}, ()>::{closure#0}'
      - name: 'First run with no saved layout'
        from: startup-13
        steps:
          - id: startup-b3-1
            fn: 'owner thread Inspect'
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'response.created_workspace = true;'}
            runs_on: owner-thread
            via: core-rpc
            says: 'Core''s document is empty, so the owner applies CreateVoyage("Voyager", cwd), which also makes "Fleet 1" holding one "Terminal 1" placement with no program yet. It saves this with doc.set and flags the reply createdWorkspace.'
            symbol: inlined
            symbol_caller: '<voyager_app::client::Client>::start_with_launches::{closure#0}::{closure#47}'
          - id: startup-b3-2
            fn: 'client::open_terminal (start path)'
            module: 'rs:voyager_app::client'
            at: {path: app/src/client.rs, find: 'core.terminal_run_with(crate::core_shapes::RunParams {'}
            runs_on: owner-thread
            via: core-rpc
            says: 'Because the workspace was just created, the script prepares every visible terminal, not only bound ones. The owner saves a start marker, asks Core to run a shell in the working directory, saves the new address and attaches, then the main path continues at startup-16.'
            symbol: 'voyager_app::client::open_terminal::{closure#7}'
    better:
      - step: startup-1
        idea: 'Check the `voyager-` session prefix in `arguments()` as well as in Core::connect_activity.'
        why: 'Today a session like `dev` passes the argument check, the window opens, and the person only sees a refused workspace with no Core.'
        inferred: true
      - step: startup-4
        idea: 'Put a time limit on the hello handshake read.'
        why: 'The read blocks the owner thread with no deadline, so a hung `hc connect` would make every workspace request time out as "unconfirmed" instead of saying Core is unreachable.'
        inferred: true
      - step: startup-2
        idea: 'Refresh or version-check the generated contract helpers (validate.js, workspace.js) when they are older than the binary.'
        why: 'Seeding never overwrites, so a profile made by an older build keeps old validators that can drift from the Rust contract after an upgrade, even though personal header edits should be kept.'
        inferred: true
    open_questions:
      - 'Does `hc connect` start a Core server for the session when none is running, or fail? The bridge is external.'
      - 'Is the "Opening workspace" frame always painted before the inspect reply arrives? That depends on GPUI scheduling, not on this source.'
      - 'Speech and avatar setup inside open_window were not traced; they may add their own threads or windows.'
    common: true
  - id: typing
    name: 'Typing into a terminal Vessel'
    trigger: 'The person types `ls` and presses Enter while a terminal Vessel running a shell has keyboard focus.'
    summary: 'The terminal Pane handles each key on the UI thread, encodes it with libghostty-vt and puts the bytes straight onto the Core connection''s input queue, without passing through the app owner thread. A writer thread sends them to Herdr Core, which writes them to the shell. The shell''s echo comes back through a reader thread, is parsed on the UI thread, and only then is the view repainted.'
    steps:
      - id: typing-1
        fn: 'Pane::render (on_key_down listener)'
        module: 'rs:voyager_desktop::terminal::view'
        at: {path: desktop/src/terminal_view.rs, find: '.on_key_down(move |event, _, cx| {'}
        runs_on: ui-thread
        via: call
        says: 'GPUI delivers the key-down event to the focused terminal element. Ctrl+Q, keys during an input-method composition and workspace shortcuts are left for other handlers; any other key goes to Pane::key, and the listener then stops propagation.'
        carries: 'The GPUI keystroke (key name, modifiers, typed character, repeat flag).'
        symbol: inlined
        symbol_caller: '<gpui::elements::div::Interactivity>::on_key_down::<<voyager_desktop::terminal::Pane as gpui::element::Render>::render::{closure#19}>::{closure#0}'
      - id: typing-2
        fn: 'Pane::key'
        module: 'rs:voyager_desktop::terminal'
        at: {path: desktop/src/terminal.rs, find: 'encoder.set_options_from_terminal(&self.screen.terminal);'}
        runs_on: ui-thread
        via: call
        says: 'Builds a libghostty-vt key event from the key name (via key_code), modifiers and typed text, then encodes it using the terminal''s current keyboard modes. Printable keys such as `l` and `s` become their characters; Enter becomes whatever sequence those modes call for.'
        carries: 'Encoded bytes for one key.'
        symbol: '<voyager_desktop::terminal::Pane>::key'
      - id: typing-3
        fn: 'Pane::send'
        module: 'rs:voyager_desktop::terminal'
        at: {path: desktop/src/terminal.rs, find: 'fn send(&mut self, bytes: Vec<u8>) -> Result<()> {'}
        runs_on: ui-thread
        via: call
        says: 'Hands the bytes to the Pane''s Viewer, then clears any selection and scrolls history back to the live screen. The Pane is marked dirty only if selection or scroll changed, so an ordinary key causes no repaint by itself; the shell''s echo does (docs/terminal.md, "Terminal input invalidation").'
        fails: 'If the Viewer refuses, the Pane shows "Input: ..." in its status strip and leaves selection and scroll unchanged.'
        symbol: inlined
        symbol_caller: '<voyager_desktop::terminal::Pane>::key'
      - id: typing-4
        fn: 'Viewer::input'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: 'pub fn input(&self, bytes: Vec<u8>) -> Result<(), Error> {'}
        runs_on: ui-thread
        via: call
        says: 'The Viewer holds clones of the single Core connection''s queue senders, so the UI thread puts a data frame for this viewer''s channel directly on the bounded input queue (64 frames) with a non-blocking try_send. The app owner thread in client.rs is not involved.'
        carries: 'A frame: channel number, kind 0 (data), payload of key bytes.'
        fails: 'Refused as "quitting" once Quit has started, "too_large" above 64 KiB, or "busy" when the queue is full. Nothing is retried.'
        symbol: '<voyager_app::core::Viewer>::input'
      - id: typing-5
        fn: 'Core writer thread (Core::write_frame)'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: 'Err(_) => match inputs.recv_timeout(Duration::from_millis(5)) {'}
        runs_on: background
        via: channel
        says: 'One writer thread, started when the owner thread connects to Core, owns the stdin pipe of the `hc connect` child process. It takes a waiting control frame first, otherwise waits up to 5 ms for an input frame, then write_frame writes the 9-byte header and payload and flushes.'
        fails: 'A write or flush error ends the thread, marks the connection disconnected and wakes every viewer.'
        symbol: inlined
        symbol_caller: '__rust_begin_short_backtrace::<<voyager_app::core::Core>::connect_activity::{closure#5}, ()>'
      - id: typing-6
        fn: 'Herdr Core input handling'
        module: 'ext:hc'
        runs_on: core
        via: core-rpc
        says: 'The `hc connect` child (started in core.rs with HC_SOCKET set) carries the frame to Herdr Core, which writes the bytes to the shell''s pseudo-terminal. This is a data frame on the same framed connection as Core''s JSON-RPC requests, not a request with a reply.'
        inferred: true
        symbol: external
      - id: typing-7
        fn: 'Shell reads and echoes input'
        module: 'ext:shell'
        runs_on: program
        via: ipc
        says: 'Over the pseudo-terminal, the shell reads `l`, `s` and Enter, echoes the characters and, on Enter, runs `ls`, whose listing is written back to the same pseudo-terminal.'
        inferred: true
        symbol: external
      - id: typing-8
        fn: 'Herdr Core output streaming'
        module: 'ext:hc'
        runs_on: core
        via: ipc
        says: 'Core reads the pseudo-terminal output and sends it to each attached viewer as data frames on that viewer''s channel. It holds back once the viewer''s returned credit is used up, so Voyager limits how much unparsed output can pile up.'
        inferred: true
        symbol: external
      - id: typing-9
        fn: 'Core reader thread'
        module: 'rs:voyager_app::core'
        at: {path: app/src/core.rs, find: 'buffer.bytes.extend(frame.payload);'}
        runs_on: background
        via: core-stream
        says: 'One reader thread reads every frame from the `hc connect` stdout. A data frame for a known viewer channel is appended to that viewer''s buffer, and a token is posted to the viewer''s one-slot ready channel to wake its Pane.'
        fails: 'If a viewer''s buffer would pass 1 MiB, or all buffers 16 MiB, the reader stops and the connection is marked disconnected; the Pane then shows "Core disconnected".'
        symbol: inlined
        symbol_caller: '__rust_begin_short_backtrace::<<voyager_app::core::Core>::connect_activity::{closure#6}, ()>'
      - id: typing-10
        fn: 'Pane::new (stream task)'
        module: 'rs:voyager_desktop::terminal'
        at: {path: desktop/src/terminal.rs, find: 'while waiter.ready().await.is_ok() {'}
        runs_on: ui-thread
        via: channel
        says: 'Each Pane owns a GPUI foreground task that waits for the ready token and then runs pump on the UI thread. Between rounds it yields once to the event loop, and it waits on a 5 ms timer only when credit or a reply could not be queued.'
        symbol: inlined
        symbol_caller: '<gpui::app::App>::spawn::<<gpui::app::context::Context<voyager_desktop::terminal::Pane>>::spawn<<voyager_desktop::terminal::Pane>::new::{closure#0}, ()>::{closure#0}, ()>::{closure#0}'
      - id: typing-11
        fn: 'Pane::pump'
