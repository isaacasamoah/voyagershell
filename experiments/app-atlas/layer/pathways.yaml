        idea: 'Skip the request when the rounded share equals the saved share.'
        why: 'A tiny drag that rounds to the same value still writes the whole layout to Core and bumps the version, which refuses any other request prepared against the old version.'
        inferred: true
    open_questions:
      - 'Whether terminal panes inside the Split resize their Core terminals on every drag frame or only after release was not traced; it depends on desktop/src/terminal.rs.'
      - 'Whether gpui-base''s per-move notify also re-runs the header script''s render during a drag depends on gpui-shell, which is outside this repository.'
      - 'The movement threshold before gpui-base''s divider on_drag starts belongs to GPUI and was not checked.'
    common: true
  - id: move-vessel
    name: 'Move a Vessel by dragging its title'
    trigger: 'The person presses the left mouse button on a Vessel''s title row (its icon and name), drags onto another Vessel in the same Fleet, and releases near one of that Vessel''s edges.'
    summary: 'The header script records the drag and, while it lasts, adds a native ArrangementCapture that reports every mouse move and the release. Vessels under the pointer pick the nearest edge and draw a half-Vessel preview. On a valid release the script sends one move-panel request; the owner thread removes the Vessel''s leaf from the split tree and inserts it beside the target, saves the layout to Herdr Core, and the header re-renders the tree with the same terminals and notes. A Vessel can only be rearranged inside its own Fleet or Portal column; a drop anywhere else sends nothing.'
    steps:
      - id: move-vessel-1
        fn: Workspace.startDrag
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'if (this.busy || this.editing || !this.layout) return;'}
        runs_on: script
        via: call
        says: 'The title row in renderPanel calls startDrag on a left mouse-down; the surrounding frame also records this Vessel as focused. startDrag stores the drag kind, the placement id, the layout version, the selected Voyage and Fleet and the start position, with moved false, and asks for a re-render.'
        carries: 'Placement id and pointer position.'
        fails: 'Nothing starts while a workspace request is pending, a name is being edited, or no layout is loaded.'
        symbol: script
      - id: move-vessel-2
        fn: 'Capture::materialize (mouse-move listener)'
        module: 'rs:voyager_desktop::arrangement'
        at: {path: desktop/src/arrangement.rs, find: 'window.on_mouse_event(move |event: &gpui::MouseMoveEvent, phase, window, cx| {'}
        runs_on: ui-thread
        via: render
        says: 'While this.drag is set, the header''s render adds an ArrangementCapture over the whole shell. Its invisible canvas registers window-level, capture-phase listeners, so it sees every mouse move before any element does. Each move calls the script with "move" and the position if the left button is still held, otherwise with "cancel".'
        carries: 'Kind (move or cancel), x and y.'
        symbol: '<gpui::window::Window>::on_mouse_event::<gpui::interactive::MouseMoveEvent, <voyager_desktop::arrangement::Capture as gpui_shell::component_registry::ComponentMaterializer>::materialize::{closure#1}::{closure#0}>::{closure#0}'
      - id: move-vessel-3
        fn: Workspace.moveDrag
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'Math.hypot(x - this.drag.x, y - this.drag.y) > 7'}
        runs_on: script
        via: script-call
        says: 'The capture callback passes "move" to moveDrag. Once the pointer is more than 7 pixels from the start, moveDrag marks the drag as moved and focuses the header''s own focus handle, so Escape reaches the header rather than a terminal. A "cancel" clears the drag.'
        symbol: script
      - id: move-vessel-4
        fn: Workspace.targetDrag
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'JSON.stringify(origin.owner) !== JSON.stringify(destination.owner)'}
        runs_on: script
        via: call
        says: 'Each Vessel frame forwards its own mouse moves to targetDrag. It ignores moves before the drag has moved and moves over the dragged Vessel itself. Both Vessels must be in the same panel group, meaning the same Fleet or the same Portal column. It then picks the edge nearest the pointer (left, right, top or bottom) and stores the target, the side and the target''s bounds.'
        carries: 'Target placement id, side and target bounds.'
        fails: 'Over a Vessel in another group the target is cleared, so a release there sends nothing.'
        symbol: script
      - id: move-vessel-5
        fn: 'renderPanel (drop preview)'
        module: 'ts:desktop/mods/header/panel-view.ts'
        at: {path: desktop/mods/header/panel-view.ts, find: '.bg("#b3d2e525"),'}
        runs_on: script
        via: render
        says: 'On the re-render the dragged and the target Vessel frames turn light blue, and the target shows a translucent half over the chosen side. Nothing has been sent to the owner yet.'
        symbol: script
      - id: move-vessel-6
        fn: 'Capture::materialize (mouse-up listener)'
        module: 'rs:voyager_desktop::arrangement'
        at: {path: desktop/src/arrangement.rs, find: 'ComponentCallbackArgument::String("up".into()),'}
        runs_on: ui-thread
        via: call
        says: 'A left release anywhere in the window reaches the capture-phase listener, which calls the script with "up" and the release position.'
        carries: 'Release position.'
        symbol: '<gpui::window::Window>::on_mouse_event::<gpui::interactive::MouseUpEvent, <voyager_desktop::arrangement::Capture as gpui_shell::component_registry::ComponentMaterializer>::materialize::{closure#1}::{closure#1}>::{closure#0}'
      - id: move-vessel-7
        fn: Workspace.finishDrag
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: '? { operation: "move-panel", id, target, side }'}
        runs_on: script
        via: script-call
        says: 'finishDrag clears the drag first, so the capture disappears on the next render. It sends a move only if the drag moved, the layout version and the selected Voyage and Fleet are unchanged since the press, a target and side were recorded, and the release point is inside the target''s bounds.'
        carries: 'move-panel {id, target, side}.'
        fails: 'Otherwise nothing is sent and the Vessels stay where they were.'
        symbol: script
      - id: move-vessel-8
        fn: 'Workspace.run -> invoke'
        module: 'ts:desktop/mods/header/main.ts'
        at: {path: desktop/mods/header/main.ts, find: 'result = await invoke(action, expectedVersion);'}
        runs_on: script
        via: call
        says: 'run marks the header busy and awaits the generated invoke wrapper, which adds a request id, checks the Request schema and calls the host function call, expecting the current layout version.'
        fails: 'If another request is pending, run drops the move with "Workspace preparation is pending. This action was not sent."'
        symbol: script
      - id: move-vessel-9
        fn: 'workspace host function call -> Client::call -> Client::queue_workspace'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: 'let result = client.call(request).map_err(gpui_shell::HostError::new)?;'}
