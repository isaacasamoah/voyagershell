  - id: quit
    name: 'Quit Voyager while programs keep running'
    trigger: 'The person presses Ctrl+Q in the workspace window.'
    summary: 'Ctrl+Q runs a Quit handler on the GPUI main thread. It shows "Closing Voyager. Programs keep running." and waits, on a background thread, for the private assistant owner to stop its Codex app-server and audio. If that succeeds GPUI stops and the process exits; the Core bridge loses its pipes and Core keeps every program running. At this commit the workspace owner is not told about the quit, so its "Voyager is quitting" refusals and its Core stop are not used by the desktop.'
    steps:
      - id: quit-1
        fn: 'Quit key binding'
        module: 'rs:voyager_desktop'
        at: {path: desktop/src/lib.rs, find: 'cx.bind_keys([KeyBinding::new("ctrl-q", Quit, None)]);'}
        runs_on: ui-thread
        via: call
        says: 'Ctrl+Q is bound to the `Quit` action declared in lib.rs. No header control or menu dispatches Quit; the window close button takes a different path (see branch).'
      - id: quit-2
        fn: 'quit::register Quit handler'
        module: 'rs:voyager_desktop::quit'
        at: {path: desktop/src/quit.rs, find: 'cx.on_action(move |_: &Quit, cx| {'}
        runs_on: ui-thread
        via: call
        says: 'The handler keeps one state: Ready, Pending or Finished. From Ready it moves to Pending, so only one shutdown ever runs.'
        fails: 'While Pending, another Ctrl+Q is ignored. After a failed quit it only shows the error again. After a successful one it calls cx.quit().'
      - id: quit-3
        fn: 'Header::quit_status'
        module: 'rs:voyager_desktop::host'
