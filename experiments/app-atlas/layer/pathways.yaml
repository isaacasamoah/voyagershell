  - id: ask-by-voice
    name: 'Ask Voyager by voice'
    trigger: 'With the avatar docked on a Fleet, the person presses the "Start voice" control and says "open a terminal here".'
    summary: 'Voice runs entirely through the external Codex installation. Voyager starts Codex''s codex-voice-host helper, which owns the microphone, the speaker and the WebRTC connection, and passes its connection offer to a Codex realtime session on the same private thread used for text. Voyager never handles audio samples. When the realtime model hands work to the backing Codex agent, a normal turn starts on that thread. Voyager binds it, captures the then-current dock focus and runs its tool calls exactly as for typed text. The spoken reply comes back as audio through the helper, and transcripts and text replies land in the same chat snapshot.'
    steps:
      - id: ask-by-voice-1
        fn: 'Codex::voice_capability'
        module: 'rs:voyager_app::codex'
        at: {path: app/src/codex.rs, find: 'pub(crate) fn voice_capability() -> voyager_contract::voice::Capability {'}
        runs_on: background
        via: call
        symbol: '<voyager_app::codex::Codex>::voice_capability'
        says: 'Before any press, the conversation owner thread checks voice once at launch. It finds the codex executable, then Package::discover looks two folders up from it for codex-resources/voice/manifest.json (schema 1, an app version and a 40-hex build commit) and the codex-voice-host helper beside it. Found means Candidate; anything else is Unavailable with the reason. Every later step depends on this helper shipped inside the Codex installation.'
        fails: 'Unavailable reasons such as "This Codex installation has no native voice package" keep the voice control disabled and appear as its tooltip.'
      - id: ask-by-voice-2
        fn: 'Speech::activate'
        module: 'rs:voyager_desktop::speech'
