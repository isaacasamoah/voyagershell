    at: {path: app/src/core.rs, find: 'let Ok(frame) = Frame::read_from(&mut output) else {'}
    plain: 'Reads every frame from Core and routes it to an RPC reply, a terminal output buffer or the activity observer. A matching writer thread sends frames out.'
    why: 'Output and replies arrive at any time, so one thread drains the pipe while the owner thread waits on its queue.'
