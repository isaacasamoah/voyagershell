        at: {path: desktop/mods/header/main.ts, find: 'opened = await openTerminal(vessel.content, this.version);'}
        runs_on: script
        via: call
        says: 'Because the result is applied and fresh, run calls prepare. For each visible terminal Vessel with no backend that is in the allowed set (createdContents plus contents new since the request), it marks the opening pending and calls the generated openTerminal wrapper with the new version.'
        carries: 'TerminalRequest {requestId, contentId, expectedVersion}.'
        fails: 'If the wrapper throws, the opening is marked uncertain (''Terminal result unconfirmed; do not repeat the request'') and the snapshot is marked not fresh.'
      - id: split-vessel-18
        fn: 'workspace host function terminal_open -> Client::terminal'
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: 'let result = client.terminal('}
        runs_on: background
        via: script-call
        says: 'terminal_open checks sizes on the UI thread, then on the background executor calls Client::terminal, which try_sends a Terminal message to the owner and waits up to 25 seconds.'
        fails: 'A full queue gives ''Workspace busy or unavailable; no terminal was started''. A timeout gives uncertain ''Terminal result unconfirmed; no request was repeated''.'
      - id: split-vessel-19
        fn: 'owner thread: Terminal message admission'
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: '"Inspect the workspace before opening a terminal".into(),'}
        runs_on: owner-thread
        via: channel
        says: 'A repeat of the same terminal request returns its stored outcome. Otherwise the owner refuses while quitting, when the id belongs to another kind of request, when its snapshot is stale or the version moved, when the Voyage is closing, and when a just-created content is no longer visible.'
        fails: 'Most refusals are rejected with a message. If an earlier start for this content is unconfirmed, that uncertain message is returned again so no second program starts.'
      - id: split-vessel-20
        fn: open_terminal
        module: 'rs:voyager_app::client'
        at: {path: app/src/client.rs, find: 'fn open_terminal('}
        runs_on: owner-thread
        via: core-rpc
        says: 'open_terminal first saves the layout with a start_pending marker named voyager-start-<requestId>, then sends terminal.run with the launch argv, the folder and a voyager-operation label. When Core reports the terminal live, it saves the layout again with the backend address and clears the marker, then calls terminal.attach and builds a Viewer on the attached channel. The marker and label let a later inspect find an unconfirmed start instead of starting another.'
        fails: 'If the marker save fails, no start is sent. If terminal.run is uncertain, the terminal is not live, or the backend save fails, the content is recorded as unconfirmed and the result is uncertain. If attach fails after a start, the message says the program started and its binding was saved.'
      - id: split-vessel-21
        fn: 'terminal.run / terminal.attach'
        module: 'ext:hc'
        runs_on: core
        via: core-rpc
        says: 'Herdr Core starts the program as its own child process, so Core rather than Voyager owns it. For the plain Terminal launch the argv is empty, which leaves the choice of shell to Core. Attach opens an output channel and reports the terminal''s size.'
        inferred: true
      - id: split-vessel-22
        fn: install_viewer
        module: 'rs:voyager_desktop::host'
        at: {path: desktop/src/host.rs, find: 'fn install_viewer(viewers: &Viewers, content: &str, viewer: Viewer) -> Result<(), Error> {'}
        runs_on: background
        via: channel
        says: 'Back on the background executor, the Viewer goes into the shared viewers map under the content id, closing an older viewer for that content on another channel. The host returns a TerminalResponse with status applied, rejected or uncertain.'
        fails: 'A Core refusal of kind finished is reported with reason ended, so the Vessel can offer ''Start new shell''.'
