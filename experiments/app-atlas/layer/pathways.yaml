            says: 'Each render ticks the motion. During a cross-fade it returns Frame and the view requests the next animation frame; between poses it returns a deadline and the view sets a timer. When the clip ends it returns Still, so the avatar only redraws while something plays.'
      - name: 'Closing the workspace window floats the avatar'
        from: avatar-open-chat-3
        steps:
          - id: avatar-open-chat-3a
