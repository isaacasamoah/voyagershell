        symbol: '<voyager_desktop::speech::Speech>::activate'
        says: 'The voice control is one shared Speech entity drawn by the Speech host component. Docked on a Fleet it sits in the sidebar heading between the green status dot and the Chat button; for other docks it is drawn beside the large avatar. It is a 20 px wave-icon button named "Start voice", disabled while capability is Checking or Unavailable. A click with no session running marks it pending and runs AudioLease::start on the GPUI background executor.'
        fails: 'If a session is preparing, negotiating or active, the same click stops it instead (see the branch).'
      - id: ask-by-voice-3
        fn: 'AudioLease::start'
        module: 'rs:voyager_app::conversation_client'
        at: {path: app/src/conversation_client.rs, find: 'pub fn start(&self) -> Result<Reply, String> {'}
        runs_on: background
        via: call
