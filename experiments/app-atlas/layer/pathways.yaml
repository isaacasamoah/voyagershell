        says: 'When the call promise resolves, the header keeps the result only if its version is not older than the one it holds. It replaces its layout, closes the picker and menus, bumps splitReset so each native Split re-applies its share, and starts follow-up reads. When it later sees the notice, its revision is not newer, so it skips another inspect.'
