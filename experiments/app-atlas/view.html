<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voyager Shell atlas</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d21; --muted: #5d6270; --faint: #8b90a0; --line: #d9dbe1; --line-soft: #e9eaee;
  --c-neutral: #6b7280; --c-blue: #2563eb; --c-violet: #7c3aed; --c-amber: #b45309; --c-green: #15803d; --c-rose: #be123c; --c-slate: #475569;
  --route: #111827; --route-halo: #fde68a; --change: #0e7490; --problem: #dc2626; --proposed: #9333ea;
  --edge-code: #a3a8b5; --edge-runtime: #0d9488; --edge-build: #a3a8b5;
  --chip: #eef0f3; --code-bg: #f3f4f6; --hl: #fff4c2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --panel: #1d1f24; --ink: #e8e9ec; --muted: #a3a8b5; --faint: #7a7f8c; --line: #343741; --line-soft: #2a2c33;
    --c-neutral: #9ca3af; --c-blue: #60a5fa; --c-violet: #a78bfa; --c-amber: #f59e0b; --c-green: #4ade80; --c-rose: #fb7185; --c-slate: #94a3b8;
    --route: #f9fafb; --route-halo: #854d0e; --change: #22d3ee; --problem: #f87171; --proposed: #c084fc;
    --edge-code: #5b606d; --edge-runtime: #2dd4bf; --edge-build: #5b606d;
    --chip: #2a2c33; --code-bg: #24262c; --hl: #4a3f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --panel: #1d1f24; --ink: #e8e9ec; --muted: #a3a8b5; --faint: #7a7f8c; --line: #343741; --line-soft: #2a2c33;
  --c-neutral: #9ca3af; --c-blue: #60a5fa; --c-violet: #a78bfa; --c-amber: #f59e0b; --c-green: #4ade80; --c-rose: #fb7185; --c-slate: #94a3b8;
  --route: #f9fafb; --route-halo: #854d0e; --change: #22d3ee; --problem: #f87171; --proposed: #c084fc;
  --edge-code: #5b606d; --edge-runtime: #2dd4bf; --edge-build: #5b606d;
  --chip: #2a2c33; --code-bg: #24262c; --hl: #4a3f12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.92em; }
header.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 650; }
.commit { color: var(--muted); font-size: 12.5px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button, .seg button { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 7px; cursor: pointer; }
nav.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.toolbar label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.toolbar select, .toolbar input[type=search] { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 4px 8px; max-width: 220px; }
.toolbar input[type=search] { width: 150px; }
.seg { display: inline-flex; gap: 0; }
.seg button { border-radius: 0; margin-left: -1px; padding: 4px 10px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg button:last-child { border-radius: 0 7px 7px 0; }
main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; display: flex; flex-direction: column; }
#map, #seq, #pmap { flex: 1; width: 100%; min-height: 0; display: block; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
#map[hidden], #seq[hidden], .toolbar[hidden] { display: none; }
.zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; cursor: pointer; }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 11.5px; color: var(--muted); max-width: 520px; }
.legend summary { cursor: pointer; color: var(--ink); }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 4px; vertical-align: 3px; }
aside#inspector { width: 430px; max-width: 46vw; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 18px 40px; }
aside h2 { font-size: 18px; margin: 2px 0 4px; }
aside h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
aside p { margin: 6px 0; }
.kicker { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); }
.chip.inferred { background: transparent; border: 1px dashed var(--faint); }
.chip.proposal { background: transparent; border: 1px solid var(--proposed); color: var(--proposed); }
.chip.warn { background: transparent; border: 1px solid var(--problem); color: var(--problem); }
.chip.exp { background: transparent; border: 1px solid var(--c-amber); color: var(--c-amber); }
.box { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin: 8px 0; }
.box.idea { border-color: var(--proposed); }
.box.fails { border-color: color-mix(in srgb, var(--problem) 60%, var(--line)); }
.list { list-style: none; padding: 0; margin: 4px 0; }
.list li { padding: 3px 0; border-bottom: 1px solid var(--line-soft); }
.list li:last-child { border-bottom: 0; }
a, .link { color: var(--c-blue); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; text-align: left; }
a:hover, .link:hover { text-decoration: underline; }
details.code { margin: 6px 0; }
details.code summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
pre.src { background: var(--code-bg); border-radius: 8px; padding: 8px 0; overflow-x: auto; font-size: 11.5px; line-height: 1.5; margin: 6px 0; }
pre.src span.l { display: block; padding: 0 10px 0 0; white-space: pre; }
pre.src span.l.hit { background: var(--hl); }
pre.src i { display: inline-block; width: 44px; text-align: right; padding-right: 10px; color: var(--faint); font-style: normal; user-select: none; }
.steps { list-style: none; padding: 0; margin: 6px 0; counter-reset: s; }
.steps li { display: flex; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: pointer; align-items: baseline; }
.steps li:hover { background: var(--chip); }
.steps li.on { background: var(--route-halo); }
.steps .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--route); color: var(--bg); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; font-weight: 650; }
.steps .t { font-size: 12.5px; }
.stepnav { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
.stepnav button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 10px; cursor: pointer; }
.pathbar { display: none; align-items: center; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12.5px; flex-wrap: wrap; }
.pathbar.on { display: flex; }
.stage.has-path .legend { bottom: 58px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.grid2 dt { color: var(--muted); }
.grid2 dd { margin: 0; }
.bar { height: 5px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; }
/* proposals and about */
#proposals, #about { flex: 1; display: none; min-height: 0; }
#proposals.on { display: flex; }
#about.on { display: block; overflow-y: auto; }
.plist { width: 300px; border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); padding: 10px; }
.pcard { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
.pcard:hover { border-color: var(--faint); }
.pcard[aria-current="true"] { border-color: var(--proposed); box-shadow: 0 0 0 1px var(--proposed); }
.pcard .m { font-size: 11px; color: var(--proposed); font-weight: 650; }
.pcard .t { font-weight: 600; font-size: 13px; }
.pcard .s { font-size: 12px; color: var(--muted); }
.about { max-width: 860px; margin: 0 auto; padding: 20px 20px 60px; }
.about h2 { font-size: 18px; margin-top: 26px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; border-bottom: 1px solid var(--line-soft); padding: 5px 6px; vertical-align: top; }
/* svg */
svg text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
svg .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.leaf { cursor: pointer; }
.leaf:focus { outline: none; }
.leaf:focus-visible rect.body, .leaf.sel rect.body { stroke: var(--ink); stroke-width: 2.5; }
.dim { opacity: .22; }
.frame-label { cursor: pointer; }
.edge { fill: none; }
.edge.code { stroke: var(--edge-code); }
.edge.runtime { stroke: var(--edge-runtime); }
.edge.build { stroke: var(--edge-build); stroke-dasharray: 2 4; }
.edge.faint { opacity: .25; }
.edge.hot { opacity: 1; stroke-width: 2.4; }
.route { fill: none; stroke: var(--route); stroke-width: 2.6; }
.route.cur { stroke-width: 4; }
.badge circle { fill: var(--route); }
.badge text { fill: var(--bg); font-size: 10.5px; font-weight: 700; }
.badge.cur circle { fill: var(--route); stroke: var(--route-halo); stroke-width: 4; }
.chg rect { fill: var(--change); }
.chg text { fill: #fff; font-size: 10px; font-weight: 650; }
.prob { fill: none; stroke: var(--problem); stroke-width: 2.5; stroke-dasharray: 5 3; }
.prop rect.body { stroke-dasharray: 6 4; stroke: var(--proposed) !important; stroke-width: 2 !important; }
@media (max-width: 860px) {
  main { flex-direction: column; }
  .stage { min-height: 62vh; }
  aside#inspector { width: auto; max-width: none; border-left: 0; border-top: 1px solid var(--line); }
  #proposals.on { flex-direction: column; }
  .plist { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.tabs { margin-left: 0; }
  .legend { display: none; }
  .seg { flex-wrap: wrap; row-gap: 4px; }
  .seg button { padding: 4px 8px; font-size: 12.5px; }
  .toolbar { gap: 8px; }
  header.top h1 { font-size: 15px; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Voyager Shell atlas</h1>
  <span class="commit" id="commit"></span>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-map" aria-selected="true">How it works</button>
    <button role="tab" id="tab-proposals" aria-selected="false">Proposed changes</button>
    <button role="tab" id="tab-about" aria-selected="false">About this map</button>
  </nav>
  <button class="iconbtn" id="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
</header>
<div class="toolbar" id="toolbar">
  <span class="seg" role="group" aria-label="Level" id="levels"></span>
  <label>Pathway <select id="pathway"><option value="">None</option></select></label>
  <label>Changes <select id="pr"><option value="">None</option></select></label>
  <label id="commit-wrap" hidden>Commit <select id="commitsel"></select></label>
  <label><input type="checkbox" id="showall"> All links</label>
  <label>Find <input type="search" id="find" list="findlist" placeholder="module or function"></label>
  <datalist id="findlist"></datalist>
</div>
<main>
  <div class="stage" id="stage">
    <svg id="map" role="group" aria-label="Architecture map"></svg>
    <svg id="seq" role="group" aria-label="Pathway sequence" hidden></svg>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to view">⤢</button></div>
    <details class="legend" id="legend"><summary>Legend</summary><div class="row" id="legend-concepts"></div><div class="row" id="legend-lines"></div></details>
    <div class="pathbar" id="pathbar"></div>
  </div>
  <aside id="inspector" aria-live="polite"></aside>
</main>
<section id="proposals"><div class="plist" id="plist"></div><div class="stage" id="pstage"><svg id="pmap" role="group" aria-label="Proposal map"></svg><div class="zoom"><button id="pzfit" aria-label="Fit to view">⤢</button></div></div><aside id="pinspector" style="width:430px;max-width:46vw;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px 18px 40px"></aside></section>
<section id="about"><div class="about" id="aboutbody"></div></section>
<script>
const DATA = /*ATLAS_DATA*/null;
const LEVELS = [
  { n: 1, name: "Concepts", one: "concept" },
  { n: 2, name: "Crates & packages", one: "crate or package" },
  { n: 3, name: "Features", one: "feature" },
  { n: 4, name: "Modules", one: "module" },
  { n: 5, name: "Functions", one: "function" },
];
const LANES = [
  { id: "os", name: "You / OS" }, { id: "ui-thread", name: "UI thread" }, { id: "script", name: "Script (QuickJS)" },
  { id: "owner-thread", name: "App owner thread" }, { id: "background", name: "Background thread" }, { id: "core", name: "Herdr Core" }, { id: "program", name: "Program" },
];
const VIA = { call: "function call", channel: "message on a channel", "core-rpc": "request to Herdr Core", "core-stream": "stream from Herdr Core", "script-call": "script ↔ Rust host call", render: "render and paint", process: "starts or signals a process", file: "file read or write", ipc: "message to another process" };
const RUNS = { "ui-thread": "UI thread", "owner-thread": "app owner thread", background: "background thread", script: "script engine", core: "Herdr Core", program: "a program", os: "operating system" };
const GRID = [["concept:you", "concept:desktop", "concept:app", "concept:core"], [null, "concept:scripts", "concept:contract", "concept:programs"]];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);

// ---------- model ----------
const T = new Map(); // id -> node {id,type,level,parent,children,data,concept}
const add = (id, type, level, parent, data) => { const n = { id, type, level, parent, children: [], data }; T.set(id, n); if (parent) T.get(parent)?.children.push(n); return n; };
const featureOrder = new Map(DATA.features.map((f, i) => [f.id, i]));
const featureById = new Map(DATA.features.map((f) => [f.id, f]));
for (const c of DATA.concepts) add(c.id, "concept", 1, null, c);
for (const c of DATA.containers) add(c.id, "container", 2, c.concept, c);
const slices = [...DATA.slices].sort((a, b) => (featureOrder.get(a.feature) ?? 99) - (featureOrder.get(b.feature) ?? 99));
for (const s of slices) if (T.has(s.container)) add(s.id, "slice", 3, s.container, { ...s, name: featureById.get(s.feature)?.name ?? "Unassigned" });
const mods = [...DATA.modules].sort((a, b) => (a.kind === "external") - (b.kind === "external") || String(a.name).localeCompare(String(b.name)));
for (const m of mods) if (T.has(m.slice)) add(m.id, "module", 4, m.slice, m);
for (const f of DATA.functions) if (T.has(f.module)) add(f.id, "function", 5, f.module, f);
for (const n of T.values()) { let c = n; while (c.parent) c = T.get(c.parent); n.concept = c.id; }
const conceptColour = (id) => `var(--c-${T.get(T.get(id)?.concept)?.data.colour ?? "neutral"})`;
const sizeOf = (n) => n.type === "module" ? (n.data.size ?? 0) : n.type === "function" ? 0 : n.children.reduce((s, c) => s + sizeOf(c), 0);
const countModules = (n) => n.type === "module" ? 1 : n.children.reduce((s, c) => s + countModules(c), 0);
const ancestorAt = (id, L) => { let n = T.get(id); if (!n) return null; while (n.level > L && n.parent) n = T.get(n.parent); return n.id; };
const anchor = (id) => (id ? DATA.anchors[id] : null);
const pathwayById = new Map(DATA.pathways.map((p) => [p.id, p]));

// ---------- state ----------
const S = { tab: "map", level: 2, sel: null, pathway: null, step: 0, branch: null, pr: "", commit: "", showAll: false, seq: false, proposal: null };
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("level")) S.level = Math.min(5, Math.max(1, Number(h.get("level")) || 2));
  if (h.get("node") && T.has(h.get("node"))) S.sel = h.get("node");
  if (h.get("path") && pathwayById.has(h.get("path"))) { S.pathway = h.get("path"); S.step = Number(h.get("step") || 0); }
  if (h.get("pr")) S.pr = h.get("pr");
  if (h.get("tab")) S.tab = h.get("tab");
  if (h.get("proposal")) S.proposal = h.get("proposal");
  if (h.get("seq") === "1") S.seq = true;
}
function writeHash() {
  const h = new URLSearchParams();
  if (S.tab !== "map") h.set("tab", S.tab);
  h.set("level", S.level);
  if (S.sel) h.set("node", S.sel);
  if (S.pathway) { h.set("path", S.pathway); h.set("step", S.step); if (S.seq) h.set("seq", "1"); }
  if (S.pr) h.set("pr", S.pr);
  if (S.proposal) h.set("proposal", S.proposal);
  history.replaceState(null, "", "#" + h.toString());
}

// ---------- layout ----------
const LEAF = { 1: [236, 150], 2: [212, 78], 3: [182, 54], 4: [178, 42], 5: [204, 28] };
const PAD = { 1: 14, 2: 10, 3: 8, 4: 6 };
const HEAD = { 1: 30, 2: 24, 3: 20, 4: 18 };
function isLeaf(n, L) { return n.level === L || !n.children.length || (n.level < L && !n.children.some((c) => c.level <= L)); }
function visibleChildren(n, extra) { return [...n.children, ...(extra.get(n.id) ?? [])]; }
function measure(n, L, extra, out) {
  const kids = visibleChildren(n, extra);
  if (isLeaf(n, L) && !(extra.get(n.id) ?? []).length) { const [w, h] = LEAF[n.level === L ? L : n.level] ?? LEAF[L]; out.set(n.id, { w, h, leaf: true }); return out.get(n.id); }
  const sizes = kids.map((c) => ({ c, s: measure(c, L, extra, out) }));
  const pad = PAD[n.level] ?? 6, head = HEAD[n.level] ?? 18, gap = n.level === 1 ? 12 : 8;
  const area = sizes.reduce((a, { s }) => a + (s.w + gap) * (s.h + gap), 0);
  const widest = Math.max(...sizes.map(({ s }) => s.w));
  const target = Math.max(widest, Math.sqrt(area * (n.level === 1 ? 1.15 : 1.9)));
  let x = 0, y = 0, rowH = 0, maxW = 0;
  for (const { c, s } of sizes) {
    if (x > 0 && x + s.w > target) { x = 0; y += rowH + gap; rowH = 0; }
    s.rx = x; s.ry = y; x += s.w + gap; rowH = Math.max(rowH, s.h); maxW = Math.max(maxW, x - gap);
  }
  const box = { w: maxW + pad * 2, h: y + rowH + pad * 2 + head, leaf: false, kids: sizes.map(({ c }) => c.id), pad, head };
  out.set(n.id, box);
  return box;
}
function place(id, x, y, out) {
  const b = out.get(id); b.x = x; b.y = y;
  if (!b.leaf) for (const k of b.kids) { const kb = out.get(k); place(k, x + b.pad + kb.rx, y + b.head + b.pad + kb.ry, out); }
}
function layout(L, extraNodes = []) {
  const extra = new Map();
  for (const e of extraNodes) { if (!extra.has(e.parent)) extra.set(e.parent, []); extra.get(e.parent).push(e); T.set(e.id, e); }
  const out = new Map();
  for (const c of DATA.concepts) measure(T.get(c.id), L, extra, out);
  const gapX = 70, gapY = 60;
  const colW = GRID[0].map((_, i) => Math.max(...GRID.map((r) => (r[i] ? out.get(r[i]).w : 0))));
  const rowH = GRID.map((r) => Math.max(...r.map((id) => (id ? out.get(id).h : 0))));
  let y = 0;
  GRID.forEach((row, ri) => {
    let x = 0;
    row.forEach((id, ci) => { if (id) place(id, x + (colW[ci] - out.get(id).w) / 2 * (ri === 0 ? 0 : 0), y, out); x += colW[ci] + gapX; });
    y += rowH[ri] + gapY;
  });
  for (const e of extraNodes) T.delete(e.id);
  return out;
}

// ---------- edges ----------
function levelEdges(L) {
  const agg = new Map();

  if (!p) { svg.innerHTML = ""; $("pinspector").innerHTML = ""; writeHash(); return; }
  const L = p.level ?? 4;
  const extra = (p.adds ?? []).map((a, i) => ({ id: `prop:${p.id}:${i}`, type: "module", level: Math.min(L, 4), parent: slicesFor(a), children: [], data: { name: a.name, plain: a.plain, kind: "proposed" }, proposed: true, concept: T.get(a.container)?.concept }));
  for (const e of extra) { let c = T.get(e.parent); while (c?.parent) c = T.get(c.parent); e.concept = c?.id; }
  const pos = draw(svg, L, { extra: extra.filter((e) => e.parent), problems: p.today_nodes ?? [], highlight: [...(p.today_nodes ?? []).map((id) => ancestorAt(id, L))], noEdges: true });
  viewport(svg);
  const focusBox = boxOf(pos, [...(p.today_nodes ?? []).map((id) => ancestorAt(id, L)), ...extra.map((e) => e.id)]);
  fit(svg, focusBox, 0.5);
  let h = `<div class="kicker"><span class="chip proposal">proposal</span><span>${esc(p.step ?? "")}</span>${p.decision ? `<span>awaiting decision ${esc(p.decision)}</span>` : ""}</div><h2>${esc(p.title)}</h2><p>${esc(p.plain)}</p>`;
  const countBox = (c) => `<p><strong style="font-size:20px">${c.total.toLocaleString()}</strong> <span class="small muted">lines${c.text ? ` contain <code>${esc(c.text)}</code>` : ""}${c.files.length > 1 ? ` across ${c.files.length} files` : c.files[0] ? ` in <code>${esc(c.files[0].path)}</code>` : ""}, counted at this commit</span></p>${c.files.length > 1 ? `<div class="small muted">${c.files.map((f) => `${esc(f.path)}: ${f.count}`).join(" · ")}</div>` : ""}`;
  h += `<h3>What you can see today</h3><p>${esc(p.today)}</p>${(p.evidence ?? []).map((e) => `<div class="box"><div class="small">${esc(e.plain)}</div>${e.count ? countBox(e.count) : codeBlock(e.at)}</div>`).join("")}`;
  if (p.today_nodes?.length) h += `<p class="small muted">Marked on the map with a red dashed outline: ${p.today_nodes.map((id) => `<button class="link" data-gomap="${esc(id)}">${esc(T.get(id) ? fullName(T.get(id)) : id)}</button>`).join(", ")}.</p>`;
  h += `<h3>What would change</h3><p>${esc(p.change)}</p>`;
  if (p.adds?.length) h += `<ul class="list">${p.adds.map((a) => `<li><code>${esc(a.name)}</code> <span class="small muted">${esc(a.plain)}</span></li>`).join("")}</ul>`;
  h += `<h3>Why</h3><p>${esc(p.why)}</p>`;
  if (p.cost) h += `<h3>What it costs</h3><p>${esc(p.cost)}</p>`;
  if (p.pathways?.length) h += `<h3>Pathways that get simpler</h3><ul class="list">${p.pathways.map((x) => `<li><button class="link" data-path="${esc(x.pathway)}" data-step="${Math.max(0, (pathwayById.get(x.pathway)?.steps.findIndex((s) => s.id === x.step) ?? 0))}">${esc(pathwayById.get(x.pathway)?.name ?? x.pathway)}</button><div class="small">${esc(x.how)}</div></li>`).join("")}</ul>`;
  if (p.depends?.length) h += `<p class="small muted">Comes after: ${p.depends.map((d) => esc(list.find((x) => x.id === d)?.title ?? d)).join(", ")}.</p>`;
  $("pinspector").innerHTML = h;
  writeHash();
}
function slicesFor(a) {
  const id = `fs:${a.container}|${a.feature}`;
  if (T.has(id)) return id;
  const any = [...T.values()].find((n) => n.type === "slice" && n.parent === a.container);
  return any?.id ?? null;
}

// ---------- about tab ----------
function renderAbout() {
  const m = DATA.meta; const statusCount = {};
  for (const a of Object.values(DATA.anchors)) statusCount[a.status] = (statusCount[a.status] ?? 0) + 1;
  let h = `<h2 style="margin-top:0">About this map</h2><p>Generated from <code>${esc(m.commit)}</code> (${esc(m.date)}) of <a href="${esc(m.repository)}" target="_blank" rel="noopener">${esc(m.repository.replace("https://", ""))}</a>.</p>`;
  h += `<h2>What is generated and what is written by hand</h2><table><tr><th>Part</th><th>Source</th><th>How it stays true</th></tr>
  <tr><td>Crates, modules, scripts, imports and module links (${m.counts.modules} modules, ${m.counts.edges} links)</td><td>The architecture-map extractor (<code>experiments/architecture-map</code>, rules ${esc(m.observedGenerator.rules)})</td><td>Regenerated from the commit every build.</td></tr>
  <tr><td>Pull requests and commits</td><td>Git history since <code>${esc(DATA.history.from)}</code></td><td>Regenerated every build.</td></tr>
  <tr><td>Concepts, features, module descriptions, entry points, reasons, pathways and proposals</td><td><code>experiments/app-atlas/layer/*.yaml</code></td><td>Every claim points at a source line by its text. The build re-finds each line; a line that disappears or changes is flagged.</td></tr></table>`;
  h += `<h2>Source anchors</h2><p>${Object.keys(DATA.anchors).length} anchors: ${Object.entries(statusCount).map(([k, v]) => `${v} ${esc(k)}`).join(", ")}.${m.locked ? "" : " No review lock recorded yet, so changed-since-review cannot be shown."}</p>`;
  if (DATA.problems.length) h += `<table><tr><th>Problem</th><th>Where</th></tr>${DATA.problems.map((p) => `<tr><td>${esc(p.kind)}</td><td><code>${esc(p.id)}</code>${p.file ? ` (${esc(p.file)})` : ""}</td></tr>`).join("")}</table>`;
  else h += `<p>No problems: every anchor resolved to exactly one line, every module has a feature.</p>`;
  h += `<h2>Limits</h2><ul>
  <li>Function-level links come only from the traced pathways. There is no full call graph.</li>
  <li>Pathways were traced by reading source, not by running the app. They show what the code says, not measured behaviour.</li>
  <li>Module links are a lower bound: the extractor reads Rust with patterns, so macros, glob imports and trait calls can be missed.</li>
  <li>Feature assignment and every "why" are judgements. Items marked inferred are the writer's reading, not a statement in the code or docs.</li>
  <li>Herdr Core and the programs are outside this repository and are shown only where Voyager touches them.</li></ul>`;
  h += `<h2>Rebuild</h2><pre class="src"><span class="l">  node experiments/app-atlas/atlas.cjs build --rev ${esc(m.short)}</span><span class="l">  node experiments/app-atlas/atlas.cjs check --rev HEAD</span></pre>`;
  $("aboutbody").innerHTML = h;
  writeHash();
}

// ---------- events ----------
function selectNode(id, { open = false, focusMap = false } = {}) {
  if (!T.has(id)) return;
  S.tab = "map";
  const n = T.get(id);
  if (open) { S.level = Math.min(5, n.level + 1); S._fitTo = id; S.sel = id; svgReset(); }
  else { if (n.level > S.level && focusMap) { S.level = n.level; svgReset(); S._fitTo = id; } S.sel = id; }
  render();
}
function svgReset() { $("map")._level = null; }
function setPathway(id, step = 0) { S.tab = "map"; S.pathway = id || null; S.step = step; S.branch = null; S._fitRoute = true; render(); }
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-open],[data-path],[data-step],[data-stepmove],[data-clearpath],[data-branch],[data-pr],[data-commit],[data-seq],[data-proposal],[data-gomap],.leaf,.frame-label");
  if (!t) return;
  const ds = t.dataset;
  if (ds.open) return selectNode(ds.open, { open: true });
  if (ds.gomap) return selectNode(ds.gomap, { focusMap: true });
  if (ds.go) return selectNode(ds.go, { focusMap: true });
  if (ds.path !== undefined) return setPathway(ds.path, Number(ds.step || 0));
  if (ds.stepmove) { const n = activeSteps().length; S.step = Math.min(n - 1, Math.max(0, S.step + Number(ds.stepmove))); return render(); }
  if (ds.clearpath !== undefined) { S.pathway = null; S.seq = false; return render(); }
  if (ds.branch !== undefined) { S.branch = ds.branch === "" ? null : Number(ds.branch); S.step = Math.min(S.step, activeSteps().length - 1); return render(); }
  if (ds.pr) { S.tab = "map"; S.pr = ds.pr; S.commit = ""; fillCommits(); return render(); }
  if (ds.commit) { S.commit = ds.commit; $("commitsel").value = ds.commit; return render(); }
  if (ds.seq !== undefined) { S.seq = ds.seq === "1"; return render(); }
  if (ds.proposal) { S.proposal = ds.proposal; return render(); }
  if (ds.step !== undefined && (S.pathway)) { S.step = Number(ds.step); return render(); }
  if (ds.id) { if (t.classList.contains("leaf") && e.detail >= 2) return selectNode(ds.id, { open: true }); S.sel = ds.id; return render(); }
});
document.addEventListener("dblclick", (e) => { const t = e.target.closest(".leaf"); if (t?.dataset.id && T.get(t.dataset.id)?.children.length) selectNode(t.dataset.id, { open: true }); });
document.addEventListener("keydown", (e) => {
  const t = e.target.closest?.(".leaf,.pcard");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); if (t.dataset.proposal) { S.proposal = t.dataset.proposal; return render(); } if (t.dataset.step !== undefined && S.pathway) { S.step = Number(t.dataset.step); return render(); } if (e.shiftKey && T.get(t.dataset.id)?.children.length) return selectNode(t.dataset.id, { open: true }); S.sel = t.dataset.id; render(); document.querySelector(`.leaf[data-id="${CSS.escape(t.dataset.id)}"]`)?.focus(); return; }
  if (e.target.matches("input,select,textarea")) return;
  if (S.pathway && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); const n = activeSteps().length; S.step = Math.min(n - 1, Math.max(0, S.step + (e.key === "ArrowRight" ? 1 : -1))); return render(); }
  if (e.key === "Escape") { if (S.pathway) { S.pathway = null; S.seq = false; } else if (S.pr) { S.pr = ""; S.commit = ""; } else S.sel = null; return render(); }
  if (e.key === "/") { e.preventDefault(); $("find").focus(); }
  if (/^[1-5]$/.test(e.key) && S.tab === "map") { S.level = Number(e.key); svgReset(); render(); }
});
function fillCommits() {
  const pr = DATA.history.prs.find((p) => String(p.pull ?? p.commit) === S.pr);
  $("commitsel").innerHTML = `<option value="">All ${pr?.commits.length ?? 0} commits together</option>` + (pr?.commits ?? []).slice().reverse().map((c) => `<option value="${esc(c.sha)}">${esc(c.date)} · ${esc(c.subject.slice(0, 70))}</option>`).join("");
  $("commitsel").value = S.commit;
}
function init() {
  $("commit").textContent = `${DATA.meta.short} · ${DATA.meta.date}`;
  $("levels").innerHTML = LEVELS.map((l) => `<button data-level="${l.n}" aria-pressed="false" title="Key ${l.n}">${esc(l.name)}</button>`).join("");
  $("levels").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; S.level = Number(b.dataset.level); svgReset(); render(); });
  $("pathway").innerHTML = `<option value="">None</option>` + DATA.pathways.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  $("pathway").addEventListener("change", (e) => setPathway(e.target.value, 0));
  $("pr").innerHTML = `<option value="">None</option>` + DATA.history.prs.slice().reverse().map((p) => `<option value="${esc(String(p.pull ?? p.commit))}">PR #${esc(p.pull)} · ${esc(p.title.slice(0, 60))}</option>`).join("");
  $("pr").addEventListener("change", (e) => { S.pr = e.target.value; S.commit = ""; fillCommits(); render(); });
  $("commitsel").addEventListener("change", (e) => { S.commit = e.target.value; render(); });
  $("showall").addEventListener("change", (e) => { S.showAll = e.target.checked; render(); });
  const names = []; for (const n of T.values()) if (n.type === "module" || n.type === "function") names.push(`<option value="${esc(n.type === "function" ? n.data.fn : shortName(n))}" label="${esc(n.type)} · ${esc(n.id)}">`);
  $("findlist").innerHTML = names.join("");
  $("find").addEventListener("change", (e) => { const q = e.target.value.trim(); const n = [...T.values()].find((x) => (x.type === "function" ? x.data.fn : shortName(x)) === q) ?? [...T.values()].find((x) => x.type !== "slice" && shortName(x).toLowerCase().includes(q.toLowerCase())); if (n) { S.level = n.level; svgReset(); S._fitTo = n.id; S.sel = n.id; render(); } });
  const active = () => ($("map").hasAttribute("hidden") ? $("seq") : $("map"));
  $("zin").onclick = () => zoomAt(active(), 1 / 1.3);
  $("zout").onclick = () => zoomAt(active(), 1.3);
  $("zfit").onclick = () => fit(active());
  $("pzfit").onclick = () => fit($("pmap"));
  for (const t of ["map", "proposals", "about"]) $(`tab-${t}`).onclick = () => { S.tab = t; if (t === "map") svgReset(); render(); };
  $("theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("atlas-theme", r.dataset.theme); } catch {} };
  try { const t = localStorage.getItem("atlas-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("legend-concepts").innerHTML = DATA.concepts.map((c) => `<span><span class="sw" style="background:var(--c-${c.colour})"></span>${esc(c.name)}</span>`).join("");
  $("legend-lines").innerHTML = `<span><span class="ln" style="border-color:var(--edge-code)"></span>uses code</span><span><span class="ln" style="border-color:var(--edge-runtime)"></span>runtime hop</span><span><span class="ln" style="border-color:var(--route);border-top-width:3px"></span>selected pathway</span><span><span class="sw" style="background:var(--change)"></span>changed by PR</span><span>keys 1–5 change level · ←/→ step · Esc clears</span>`;
  readHash(); if (S.pr) fillCommits();
  render();
}
init();
</script>
</body>
</html>
