<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App atlas</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d21; --muted: #5d6270; --faint: #8b90a0; --line: #d9dbe1; --line-soft: #e9eaee;
  --c-neutral: #6b7280; --c-blue: #2563eb; --c-violet: #7c3aed; --c-amber: #b45309; --c-green: #15803d; --c-rose: #be123c; --c-slate: #475569;
  --route: #111827; --route-halo: #fde68a; --change: #0e7490; --problem: #dc2626; --proposed: #9333ea; --seen: #15803d;
  --edge-code: #a3a8b5; --edge-runtime: #0d9488; --edge-build: #a3a8b5;
  --chip: #eef0f3; --code-bg: #f3f4f6; --hl: #fff4c2;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --panel: #1d1f24; --ink: #e8e9ec; --muted: #a3a8b5; --faint: #7a7f8c; --line: #343741; --line-soft: #2a2c33;
    --c-neutral: #9ca3af; --c-blue: #60a5fa; --c-violet: #a78bfa; --c-amber: #f59e0b; --c-green: #4ade80; --c-rose: #fb7185; --c-slate: #94a3b8;
    --route: #f9fafb; --route-halo: #854d0e; --change: #22d3ee; --problem: #f87171; --proposed: #c084fc; --seen: #4ade80;
    --edge-code: #5b606d; --edge-runtime: #2dd4bf; --edge-build: #5b606d;
    --chip: #2a2c33; --code-bg: #24262c; --hl: #4a3f12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --panel: #1d1f24; --ink: #e8e9ec; --muted: #a3a8b5; --faint: #7a7f8c; --line: #343741; --line-soft: #2a2c33;
  --c-neutral: #9ca3af; --c-blue: #60a5fa; --c-violet: #a78bfa; --c-amber: #f59e0b; --c-green: #4ade80; --c-rose: #fb7185; --c-slate: #94a3b8;
  --route: #f9fafb; --route-halo: #854d0e; --change: #22d3ee; --problem: #f87171; --proposed: #c084fc; --seen: #4ade80;
  --edge-code: #5b606d; --edge-runtime: #2dd4bf; --edge-build: #5b606d;
  --chip: #2a2c33; --code-bg: #24262c; --hl: #4a3f12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 0.92em; }
header.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 650; }
.commit { color: var(--muted); font-size: 12.5px; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button, .seg button { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 7px; cursor: pointer; }
nav.tabs button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 9px; cursor: pointer; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.toolbar[hidden] { display: none; }
nav.tabs button[hidden] { display: none; }
.toolbar label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.toolbar label[hidden] { display: none; }
.toolbar select, .toolbar input[type=search] { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 4px 8px; max-width: 220px; }
.toolbar input[type=search] { width: 150px; }
nav.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13.5px; min-width: 0; }
nav.crumbs button { border: 0; background: none; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--c-blue); }
nav.crumbs button:hover { background: var(--chip); }
nav.crumbs button.iconbtn { border: 1px solid var(--line); color: var(--ink); }
nav.crumbs .here { font-weight: 650; color: var(--ink); padding: 3px 6px; }
nav.crumbs .sep { color: var(--faint); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; padding: 4px 10px; }
.seg button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
.seg button:last-child { border-radius: 0 7px 7px 0; }
main { flex: 1; display: flex; min-height: 0; }
main[hidden] { display: none; }
.stage { flex: 1; position: relative; min-width: 0; display: flex; flex-direction: column; }
svg.canvas { flex: 1; width: 100%; min-height: 0; display: block; cursor: grab; touch-action: none; }
svg.canvas.dragging { cursor: grabbing; }
svg.canvas[hidden] { display: none; }
.zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; cursor: pointer; }
.hint { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 3px 8px; border-radius: 6px; pointer-events: none; }
.hint[hidden] { display: none; }
.legend { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 11.5px; color: var(--muted); max-width: 560px; }
.stage.has-path .legend { display: none; }
.legend summary { cursor: pointer; color: var(--ink); }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid; margin-right: 4px; vertical-align: 3px; }
aside.inspector { width: 440px; max-width: 46vw; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 18px 40px; }
aside h2 { font-size: 18px; margin: 2px 0 4px; }
aside h3 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
aside p { margin: 6px 0; }
.kicker { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); }
.chip.inferred { background: transparent; border: 1px dashed var(--faint); }
.chip.proposal, .chip.new { background: transparent; border: 1px solid var(--proposed); color: var(--proposed); }
.chip.warn { background: transparent; border: 1px solid var(--problem); color: var(--problem); }
.chip.exp { background: transparent; border: 1px solid var(--c-amber); color: var(--c-amber); }
.chip.seen { background: transparent; border: 1px solid var(--seen); color: var(--seen); }
.box { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin: 8px 0; }
.box.idea { border-color: var(--proposed); }
.box.fails { border-color: color-mix(in srgb, var(--problem) 60%, var(--line)); }
.list { list-style: none; padding: 0; margin: 4px 0; }
.list > li { padding: 4px 0; border-bottom: 1px solid var(--line-soft); }
.list > li:last-child { border-bottom: 0; }
a, .link { color: var(--c-blue); cursor: pointer; text-decoration: none; background: none; border: 0; padding: 0; text-align: left; font: inherit; }
a:hover, .link:hover { text-decoration: underline; }
details.code { margin: 6px 0; }
details.code > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); }
pre.src { background: var(--code-bg); border-radius: 8px; padding: 8px 0; overflow-x: auto; font-size: 11.5px; line-height: 1.5; margin: 6px 0; }
pre.src span.l { display: block; padding: 0 10px 0 0; white-space: pre; }
pre.src span.l.hit { background: var(--hl); }
pre.src i { display: inline-block; width: 44px; text-align: right; padding-right: 10px; color: var(--faint); font-style: normal; user-select: none; }
.steps { list-style: none; padding: 0; margin: 6px 0; }
.steps li { display: flex; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: pointer; align-items: baseline; }
.steps li:hover { background: var(--chip); }
.steps li.on { background: var(--route-halo); }
.steps .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--route); color: var(--bg); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; font-weight: 650; }
.steps .t { font-size: 12.5px; }
.stepnav { display: flex; gap: 6px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
.stepnav button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 10px; cursor: pointer; }
.pathbar { display: none; align-items: center; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12.5px; flex-wrap: wrap; }
.pathbar.on { display: flex; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.grid2 { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12.5px; }
.grid2 dt { color: var(--muted); }
.grid2 dd { margin: 0; }
.evline { font-size: 11.5px; margin: 3px 0; }
.evline code { display: block; white-space: pre-wrap; word-break: break-word; background: var(--code-bg); padding: 3px 6px; border-radius: 5px; margin-top: 2px; }
#proposals, #about { flex: 1; display: none; min-height: 0; }
#proposals.on { display: flex; }
#about.on { display: block; overflow-y: auto; }
.plist { width: 300px; border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); padding: 10px; }
.pcard { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
.pcard:hover { border-color: var(--faint); }
.pcard[aria-current="true"] { border-color: var(--proposed); box-shadow: 0 0 0 1px var(--proposed); }
.pcard .m { font-size: 11px; color: var(--proposed); font-weight: 650; }
.pcard .t { font-weight: 600; font-size: 13px; }
.pcard .s { font-size: 12px; color: var(--muted); }
.about { max-width: 860px; margin: 0 auto; padding: 20px 20px 60px; }
.about h2 { font-size: 18px; margin-top: 26px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; border-bottom: 1px solid var(--line-soft); padding: 5px 6px; vertical-align: top; }
svg text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
svg .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
.leaf, .frame-label, .stub { cursor: pointer; }
.leaf:focus, .stub:focus { outline: none; }
.leaf:focus-visible rect.body, .leaf.sel rect.body, .stub:focus-visible rect.body { stroke: var(--ink); stroke-width: 2.5; }
.dim { opacity: .22; }
.edge { fill: none; pointer-events: none; opacity: .7; }
.edge.code { stroke: var(--edge-code); }
.edge.runtime { stroke: var(--edge-runtime); }
.edge.build { stroke: var(--edge-build); stroke-dasharray: 2 4; }
.edge.proposed { stroke: var(--proposed); }
.edge.today { stroke: var(--edge-code); }
.edge.broken { stroke: var(--problem); stroke-dasharray: 6 4; }
.edge.inner { opacity: .28; }
.edge.under { opacity: .16; }
pre.shape { background: var(--code-bg); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; line-height: 1.45; overflow-x: auto; margin: 4px 0; white-space: pre; }
.iface { border: 1px solid var(--line); border-left: 4px solid var(--edge-runtime); border-radius: 9px; padding: 8px 10px; margin: 10px 0; }
.iface h4 { margin: 0 0 4px; font-size: 14px; }
.iface .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0 2px; }
.edge.hot { opacity: 1; stroke-width: 2.6 !important; }
.edge.sel { opacity: 1; stroke: var(--ink); stroke-width: 3.2 !important; }
.hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
.route { fill: none; stroke: var(--route); stroke-width: 2.6; pointer-events: none; }
.route.cur { stroke-width: 4; }
.badge text { fill: var(--bg); font-size: 10.5px; font-weight: 700; }
.chg rect { fill: var(--change); }
.chg text { fill: #fff; font-size: 10px; font-weight: 650; }
.prob { fill: none; stroke: var(--problem); stroke-width: 2.5; stroke-dasharray: 5 3; pointer-events: none; }
.prop rect.body { stroke-dasharray: 6 4; }
.edge.planned { stroke: var(--proposed); stroke-dasharray: 5 4; }
.cmp rect { fill: var(--c-amber); }
.cmp text { fill: #fff; font-size: 10px; font-weight: 650; }
@media (max-width: 860px) {
  main { flex-direction: column; }
  .stage { min-height: 62vh; }
  aside.inspector { width: auto; max-width: none; border-left: 0; border-top: 1px solid var(--line); }
  #proposals.on { flex-direction: column; }
  .plist { width: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.tabs { margin-left: 0; }
  .legend, .hint { display: none; }
  header.top h1 { font-size: 15px; }
}
</style>
</head>
<body>
<header class="top">
  <h1 id="apptitle">App atlas</h1>
  <span class="commit" id="commit"></span>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-map" aria-selected="true">How it works</button>
    <button role="tab" id="tab-proposed" aria-selected="false">Proposed architecture</button>
    <button role="tab" id="tab-proposals" aria-selected="false">Proposed changes</button>
    <button role="tab" id="tab-about" aria-selected="false">About this map</button>
  </nav>
  <button class="iconbtn" id="theme" title="Switch light or dark" aria-label="Switch light or dark">◐</button>
</header>
<div class="toolbar" id="toolbar">
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <label id="pathway-wrap">Pathway <select id="pathway"></select></label>
  <label id="pr-wrap">Changes <select id="pr"></select></label>
  <label id="commit-wrap" hidden>Commit <select id="commitsel"></select></label>
  <label id="today-wrap" hidden><input type="checkbox" id="today"> Compare with code</label>
  <label>Find <input type="search" id="find" list="findlist" placeholder="module or function"></label>
  <datalist id="findlist"></datalist>
</div>
<main id="main">
  <div class="stage" id="stage">
    <svg class="canvas" id="map" role="group" aria-label="Architecture map"></svg>
    <svg class="canvas" id="seq" role="group" aria-label="Pathway sequence" hidden></svg>
    <div class="hint" id="hint">Click a box to open it. Click a line to see what connects them.</div>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to view">⤢</button></div>
    <details class="legend" id="legend"><summary>Legend</summary><div class="row" id="legend-concepts"></div><div class="row" id="legend-lines"></div></details>
    <div class="pathbar" id="pathbar"></div>
  </div>
  <aside class="inspector" id="inspector" aria-live="polite"></aside>
</main>
<section id="proposals"><div class="plist" id="plist"></div><div class="stage" id="pstage"><svg class="canvas" id="pmap" role="group" aria-label="Proposal map"></svg><div class="zoom"><button id="pzfit" aria-label="Fit to view">⤢</button></div></div><aside class="inspector" id="pinspector"></aside></section>
<section id="about"><div class="about" id="aboutbody"></div></section>
<script>
const DATA = /*ATLAS_DATA*/null;
// What the app calls things comes from its atlas.yaml (carried in the code document as `view`).
const VIEW = DATA.meta.view ?? {};
const MECHANISMS = {
  call: ["function call", "a direct function call"], channel: ["message on a channel", "a message on a queue between threads"],
  rpc: ["JSON-RPC request", "a JSON-RPC request over a socket"], stream: ["byte stream", "a stream of bytes on its own channel"],
  "core-rpc": ["request to the core service", "a request to the core service"], "core-stream": ["stream from the core service", "a stream of frames from the core service"],
  "script-call": ["script and Rust host call", "a call between the script engine and Rust"], render: ["render and paint", "drawing"],
  process: ["starts or signals a process", "starting another program"], file: ["file read or write", "a file both sides read or write"],
  ipc: ["message to another process", "messages to another program"], network: ["connection to another machine", "a connection to another machine"],
  signal: ["operating-system signal", "an operating-system signal"], build: [null, "a build step"],
};
for (const [k, v] of Object.entries(VIEW.mechanisms ?? {})) MECHANISMS[k] = [v.short ?? MECHANISMS[k]?.[0] ?? k, v.long ?? MECHANISMS[k]?.[1] ?? k];
const VIA = Object.fromEntries(Object.entries(MECHANISMS).filter(([, v]) => v[0]).map(([k, v]) => [k, v[0]]));
const MECH = Object.fromEntries(Object.entries(MECHANISMS).map(([k, v]) => [k, v[1]]));
const KIND = {
  uses: "Rust code here names functions or types defined there, through a use statement or a path such as crate::core::Viewer.",
  uses_crate: "Uses an external Rust library.",
  imports: "A TypeScript import of the other file or host module.",
  exposes: "Registers a host module that scripts can import.",
  embeds: "Compiles the other file's contents into the program with include_str! or include_bytes!.",
  includes: "Compiles a source file from experiments/ into this module with #[path].",
  spawns: "Starts the other program as a child process.",
  generates: "Build time: a generator writes the other.", generated_from: "Build time: generated from the other.", runs: "Build time: runs the other.",
  proposed: "A connection the proposed design intends.", build: "Build time: generated from the other.",
};
const LANES = VIEW.lanes?.length ? VIEW.lanes : [{ id: "os", name: "Outside", plain: "outside the app" }, { id: "main", name: "Main thread", plain: "the main thread" }, { id: "background", name: "Background thread", plain: "a background thread" }, { id: "program", name: "Program", plain: "another program" }];
const RUNS = Object.fromEntries(LANES.map((l) => [l.id, l.plain ?? l.name]));
const LANE0 = LANES[0].id;
const GRID = VIEW.grid ?? [];
const STRIP = (VIEW.strip_prefixes ?? []).map((p) => new RegExp(`^${p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`));
const stripName = (t) => STRIP.reduce((x, r) => x.replace(r, ""), t);
const TYPE_NAME = { concept: "concept", container: "crate or package", slice: "feature", module: "module", function: "function" };
const STATUS = { new: "new", changed: "changes", split: "split up", merged: "merged", moved: "moved", unchanged: "stays as it is" };
const COMPARE = { matched: "built as planned", changed: "built, needs changes", moved: "code exists elsewhere", missing: "not built yet", unplanned: "not in the plan" };
const comparisonPart = new Map((DATA.comparison?.parts ?? []).map((p) => [p.id, p]));
const comparing = () => S.tab === "proposed" && S.today && DATA.comparison;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (id) => document.getElementById(id);
const pathwayById = new Map(DATA.pathways.map((p) => [p.id, p]));

// ---------- models: today's code and the proposed architecture share one shape ----------
function buildModel(kind) {
  const modules = kind === "current" ? DATA.modules : DATA.proposed.modules;
  const features = kind === "current" ? DATA.features : [...DATA.proposed.features, ...DATA.features];
  const featureById = new Map(features.map((f) => [f.id, f]));
  const order = new Map(features.map((f, i) => [f.id, i]));
  const T = new Map();
  const add = (id, type, level, parent, data) => { const n = { id, type, level, parent, children: [], data }; T.set(id, n); if (parent) T.get(parent)?.children.push(n); return n; };
  for (const c of DATA.concepts) add(c.id, "concept", 1, null, c);
  for (const c of DATA.containers) add(c.id, "container", 2, c.concept, c);
  const slices = [...new Map(modules.map((m) => [m.slice, { id: m.slice, container: m.container, feature: m.feature ?? "unassigned" }])).values()].sort((a, b) => (order.get(a.feature) ?? 99) - (order.get(b.feature) ?? 99));
  for (const s of slices) if (T.has(s.container)) add(s.id, "slice", 3, s.container, { ...s, name: featureById.get(s.feature)?.name ?? "Unassigned" });
  const sorted = [...modules].sort((a, b) => (a.kind === "external") - (b.kind === "external") || String(a.name).localeCompare(String(b.name)));
  for (const m of sorted) if (T.has(m.slice)) add(m.id, "module", 4, m.slice, m);
  for (const f of DATA.functions) if (T.has(f.module)) add(f.id, "function", 5, f.module, f);
  for (const n of T.values()) { let c = n; while (c.parent) c = T.get(c.parent); n.concept = c.id; }
  return { kind, T, edges: kind === "current" ? DATA.edges : DATA.proposed.edges, featureById };
}
const MODELS = { map: buildModel("current"), proposed: buildModel("proposed") };
let M = MODELS.map;
const node = (id) => M.T.get(id);
const conceptColour = (id) => `var(--c-${node(node(id)?.concept)?.data.colour ?? "neutral"})`;
const sizeOf = (n) => n.type === "module" ? (n.data.size ?? 0) : n.type === "function" ? 0 : n.children.reduce((s, c) => s + sizeOf(c), 0);
const countModules = (n) => n.type === "module" ? 1 : n.children.reduce((s, c) => s + countModules(c), 0);
const ancestorAt = (id, L) => { let n = node(id); if (!n) return null; while (n.level > L && n.parent) n = node(n.parent); return n.id; };
const isInside = (id, root) => { let n = node(id); while (n) { if (n.id === root) return true; n = node(n.parent); } return false; };

function init() {
  if (!DATA.proposed) $("tab-proposed").hidden = true;
  else if (DATA.meta.intended?.tab) $("tab-proposed").textContent = DATA.meta.intended.tab;
  if (!DATA.proposals.length) $("tab-proposals").hidden = true;
  $("commit").textContent = `${DATA.meta.short} · ${DATA.meta.date}`;
  $("pathway").innerHTML = `<option value="">None</option>` + pathwayGroups().map(([label, list]) => `<optgroup label="${esc(label)}">${list.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</optgroup>`).join("");
  $("pathway").addEventListener("change", (e) => { S.pathway = e.target.value || null; S.step = 0; S.branch = null; S.sel = null; S._refit = Date.now(); render(); });
  $("pr").innerHTML = `<option value="">None</option>` + DATA.history.prs.slice().reverse().map((p) => `<option value="${esc(String(p.pull ?? p.commit))}">PR #${esc(p.pull)} · ${esc(p.title.slice(0, 60))}</option>`).join("");
  $("pr").addEventListener("change", (e) => { S.pr = e.target.value; S.commit = ""; fillCommits(); render(); });
  $("commitsel").addEventListener("change", (e) => { S.commit = e.target.value; render(); });
  $("today").addEventListener("change", (e) => { S.today = e.target.checked; render(); });
  const names = new Map(); for (const model of Object.values(MODELS)) for (const n of model.T.values()) if (n.type === "module" || n.type === "function" || n.type === "slice") { M = model; names.set(n.type === "function" ? n.data.fn : fullName(n), n.type); }
  M = MODELS.map;
  $("findlist").innerHTML = [...names].map(([v, t]) => `<option value="${esc(v)}" label="${esc(t)}">`).join("");
  $("find").addEventListener("change", (e) => { const q = e.target.value.trim().toLowerCase(); if (!q) return; const all = [...M.T.values()]; const name = (x) => (x.type === "function" ? x.data.fn : fullName(x)).toLowerCase(); const n = all.find((x) => name(x) === q) ?? all.find((x) => x.type !== "concept" && name(x).includes(q)); if (n) open(n.id); });
  const active = () => ($("map").hasAttribute("hidden") ? $("seq") : $("map"));
  $("zin").onclick = () => zoomAt(active(), 1 / 1.3); $("zout").onclick = () => zoomAt(active(), 1.3); $("zfit").onclick = () => fit(active()); $("pzfit").onclick = () => fit($("pmap"));
  for (const t of ["map", "proposed", "proposals", "about"]) $(`tab-${t}`).onclick = () => {
    const leaving = S.tab;
    if ((t === "map" || t === "proposed") && (leaving === "map" || leaving === "proposed") && t !== leaving) carryPlace(t);
    else S.sel = null;
    S.tab = t; render();
  };
  $("theme").onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("atlas-theme", r.dataset.theme); } catch {} };
  try { const t = localStorage.getItem("atlas-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  readHash(); if (S.pr) fillCommits();
  render();
}
init();
</script>
