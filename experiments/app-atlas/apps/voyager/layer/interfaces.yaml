  - id: notes-markdown-file
    name: 'A note is a Markdown file in the Voyage folder (read, atomic replace, SHA-256 revision)'
    from: ['rs:voyager_app::content', 'rs:voyager_app::content::markdown']
    to: ['ext:you', 'ext:terminal-agent']
    mechanism: file
    nature: 'The owner thread reads and writes the note file directly with blocking file calls; the note text is not stored in Core. Each read hashes the file bytes into a revision, and a save is accepted only if the file still has the revision the editor started from, so edits made outside Voyager, for example by another editor or a terminal agent, are not overwritten.'
    request:
      plain: 'The file is the directory and filename recorded in the Notes file binding in the layout. New notes and file listings use <owning Voyage folder>/notes (for the Home Voyage, the content''s own folder). A save sends title, text and the expected revision. Notes not bound to a Markdown file use the older <profile>/data/<content id>.json in the same way.'
      shape: "path   <Voyage cwd>/notes/<name>.md               # one plain filename ending in .md\nbytes  \"# \" + title + \"\\n\\n\" + text               # title must fit on one line\nsave   check: SHA-256(current bytes) == expected_revision\n       write .<name>.md.tmp (create_new, original permissions, write, sync_all)\n       rename .<name>.md.tmp -> <name>.md         # replaces the file in one step\nnew    \"<title>.md\", then \"<title> 2.md\", ...     # create_new, never overwrites"
      type_at: {path: app/src/content/markdown.rs, find: 'pub(crate) fn encode(notes: &Notes) -> Result<Vec<u8>, String> {'}
    response:
      plain: 'After the rename Voyager reads the file back and reports Applied, with the fresh snapshot, only if its revision equals the SHA-256 of the bytes it wrote. A read takes a first line starting "# " as the title; otherwise the filename stem is the title and the whole file is the text.'
      shape: "revision = lowercase hex SHA-256 of the file bytes\nApplied   {version, request_id, content_id, snapshot: {content_id, revision,\n           data: {title, text}, warning?}}\nRejected | Uncertain {version, request_id, content_id, expected_revision, message}"
      type_at: {path: app/src/content.rs, find: 'fn finish_write('}
    errors: 'A revision mismatch is Rejected ("Portal data changed. Read it again before saving.") and nothing is written. Errors before the rename are Rejected and the temporary file is removed. A failed rename, or a read-back that does not match, is Uncertain ("Data changed after replacement"). A note over 1 MiB is refused ("Notes data exceeds 1 MiB"). Because the temporary file is opened with create_new, a leftover .<name>.md.tmp from a crash makes every later save of that note fail until it is removed (inferred from the code).'
    limits: '1 MiB per note, read and write. Only the temporary file is synced; the folder is not synced after the rename.'
    why: 'Writing a temporary file and renaming it means a reader sees either the old note or the new one, never half of one (inferred). The SHA-256 revision lets a draft detect outside edits; the voyager_content tool description says "A dirty visible draft retains its original revision; do not bypass stale refusal."'
    inferred: true
    at: {path: app/src/content.rs, find: 'temp_name.push(".tmp");'}
    steps: [notes-save-10, notes-save-11, notes-save-12, notes-save-13, notes-save-b2-1]
