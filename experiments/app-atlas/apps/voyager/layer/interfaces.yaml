schema: app-atlas/v0
note: 'Interfaces between the parts: what kind of connection, what is sent and returned, how it fails and why. Shapes use field names from the code; observed_core links recorded Core messages from runs/.'
interfaces:
  - id: you-to-terminal-pane
    name: 'You type, click, scroll or paste in a terminal pane'
    from: ['ext:you', 'ext:gpui']
    to: ['rs:voyager_desktop::terminal::view', 'rs:voyager_desktop::terminal', 'rs:voyager_desktop::terminal::input']
    mechanism: call
    nature: 'GPUI turns OS input into typed Rust events and calls the listeners the terminal pane attached in its render function, on the UI thread. No thread or language boundary is crossed: the pane encodes the event into terminal bytes at once and hands them to its Viewer. GPUI waits for nothing from Core.'
    request:
      plain: 'A key press with its key name, typed character, modifier flags and repeat flag; left-button press, drag and release positions for text selection; a scroll delta and position; or committed IME text through GPUI''s input-handler trait.'
      shape: "KeyDownEvent { keystroke: { key, key_char?, modifiers: { shift, alt, control, platform, function } }, is_held }\nMouseDownEvent { position }          // left button: start selection, focus the pane\nMouseMoveEvent { position, pressed_button }   // drag selection while left is held\nMouseUpEvent { position }            // end selection (also on_mouse_up_out)\nScrollEvent { delta, position }      // wheel: mouse-report bytes or local scrollback\nEntityInputHandler::replace_text_in_range(text)   // IME commit\nCtrl+Shift+C / Ctrl+Shift+V (Command on macOS)    // copy selection / paste clipboard"
      type_at: {path: desktop/src/terminal.rs, find: 'fn key(&mut self, event: &KeyDownEvent) -> Result<()> {'}
    response:
      plain: 'Nothing goes back to GPUI. The pane marks itself dirty and calls cx.notify() so GPUI redraws it. Any failure is written into a status line at the bottom of the pane.'
      shape: 'status: String   // "Input: ...", "Terminal scroll: ...", "Selection: ..."'
      type_at: {path: desktop/src/terminal_view.rs, find: '.when(!self.status.is_empty(), |view| {'}
    errors: 'Errors become status text in the pane. Ctrl+Q, keys typed while an IME composition is open, and the workspace shortcuts (Ctrl+Shift+O, E, T, Ctrl+Alt+P, Ctrl+Shift+Z, or Cmd+Shift+Enter on macOS) return early without stopping propagation, so they bubble up to the header script or the Quit key binding instead of reaching the shell.'
    limits: 'Encoded input over 64 KiB (including paste and its bracketed-paste markers) is refused by the Viewer; see terminal-input-frames.'
    why: 'docs/terminal.md places pointer routing in terminal_view.rs and OS text composition in terminal_input.rs behind one registration boundary. Letting workspace shortcuts fall through keeps them working while a terminal has focus; the test workspace_shortcuts_leave_normal_terminal_input_alone pins the list.'
    inferred: false
    at: {path: desktop/src/terminal_view.rs, find: '.on_key_down(move |event, _, cx| {'}
    steps: [typing-1, typing-2, typing-b1-1, typing-b1-2, typing-b2-1, split-vessel-1, stop-program-b3-1]
  - id: you-to-header-handlers
    name: 'Your clicks and keys reach the header script''s handlers'
    from: ['ext:you', 'ext:gpui']
    to: ['ts:desktop/mods/header/main.ts', 'ts:desktop/mods/header/panel-view.ts', 'ts:desktop/mods/header/chat.ts']
    mechanism: script-call
    nature: 'The header script builds its elements with gpui-kit and attaches JavaScript handlers such as on_click, on_mouse_down, on_key_down and on_hover. When GPUI dispatches an event to such an element on the UI thread, gpui-kit converts it to a plain object and calls the handler synchronously inside QuickJS. This covers the Vessel title drag, the maximize, close and split buttons, the Chat button and the window-wide keyboard shortcuts.'
    request:
      plain: 'A plain object with the key or button, positions and modifier flags, plus a cx context the handler uses to redraw, stop propagation or start async work.'
      shape: "KeyEvent { key, keystroke, key_char?, modifiers: { shift, control, alt, platform, function }, is_held? }\nMouseButtonEvent { button, click_count, position: { x, y }, local_position?, bounds?, modifiers }\nMouseMoveEvent { position, local_position, bounds, modifiers }\nClickEvent { click_count, modifiers }\non_hover(hovered: boolean, cx)\n// panel-view.ts: on_mouse_down(\"left\") on a Vessel title -> workspace.startDrag(\"vessel\", id, event, cx)\n// main.ts: shell on_key_down -> shortcut(event, cx) for Ctrl+Shift+O/E/T and Ctrl+Alt+P"
      type_at: {path: desktop/mods/header/main.ts, find: 'shortcut(event: KeyEvent, cx: UIContext) {'}
    response:
      plain: 'Nothing is returned. The handler changes script state (focus, drag, hover), calls cx.notify() to redraw or cx.stop_propagation(), or starts a typed workspace request through run(), which awaits invoke().'
      shape: "run(action: Action, cx, done?, expectedVersion = this.version, prepareContents = true)\n// e.g. { operation: \"remove-panel\", id }  { operation: \"set-panel-maximized\", id, maximized }"
      type_at: {path: desktop/mods/header/main.ts, find: 'done?: (result: Response | null, cx: AsyncContext) => void,'}
    errors: 'The script writes refusals and caught errors into this.status, which the next render shows. While a request is in flight (busy), run() refuses resize gestures with "Resize was not saved while another workspace request was pending." and queues at most one unsent Close or Portal intent; shortcuts typed while busy wait in pendingShortcuts.'
    limits: 'Event field types come from gpui-kit''s generated declarations (target/script-types/gpui-kit.d.ts, built by desktop/typecheck.cjs and not tracked in Git).'
    why: 'The README says JavaScript and TypeScript define interface layouts through the supported host while rendering stays native. docs/workspace.md says the header keeps application requests and terminal preparation serialized, which is why busy state gates new requests.'
    inferred: false
    at: {path: desktop/mods/header/main.ts, find: 'this.shortcut(event, cx);'}
    steps: [split-vessel-2, split-vessel-b1-1, move-vessel-1, move-vessel-b3-1, stop-program-b1-1, stop-program-b2-1, portal-1, portal-14, avatar-open-chat-12]
  - id: arrangement-capture-to-script
    name: 'Window-wide pointer moves during a drag go to the header script'
    from: ['ext:you', 'rs:voyager_desktop::arrangement']
    to: ['ts:desktop/mods/header/main.ts']
    mechanism: script-call
    nature: 'While a Vessel, Fleet or Voyage drag is active, the header script adds an ArrangementCapture native element. Rust registers capture-phase mouse handlers on the whole window and calls the script''s callback for every move and the left-button release, on the UI thread. The script decides when the drag has moved more than 7 pixels, previews the target, and on release sends move-panel.'
    request:
      plain: 'A kind string and the pointer''s window position. "move" while the left button is held, "cancel" if the button is no longer held, "up" on release.'
      shape: 'callback(kind: "move" | "cancel" | "up", x: number, y: number, cx: Context) => void'
      type_at: {path: desktop/src/arrangement.rs, find: '"(kind: string, x: number, y: number, cx: Context) => void",'}
    response:
      plain: 'Nothing. The script updates its drag state and redraws, or clears the drag on cancel.'
      shape: "if (kind === \"cancel\") { this.drag = null; task.notify(); }\nelse if (kind === \"move\") this.moveDrag(x, y, task); else this.finishDrag(x, y, task);"
      type_at: {path: desktop/mods/header/main.ts, find: 'ArrangementCapture.new((kind, x, y, task) => {'}
    errors: 'invoke_and_report_with reports a throwing callback under the label "arrangement move" or "arrangement release". Escape, a changed snapshot or release outside a target cancels the gesture without a request.'
    why: 'docs/arrangement.md says the native capture component uses the existing window and the current JavaScript callback and does not own the layout or start a process. Capturing at window level keeps the drag alive after the pointer leaves the title it started on.'
    inferred: true
    at: {path: desktop/src/arrangement.rs, find: 'moving.invoke_and_report_with('}
    steps: [move-vessel-2, move-vessel-3, move-vessel-6, move-vessel-7]
  - id: you-to-avatar
    name: 'You click, drag, hover or press keys on the avatar'
    from: ['ext:you', 'ext:gpui']
    to: ['rs:voyager_desktop::avatar::view', 'rs:voyager_desktop::avatar']
    mechanism: call
    nature: 'The avatar is native Rust, not script. GPUI calls the AvatarView listeners on the UI thread; a press starts a Drag, and window-level capture handlers follow the pointer until release. A short click (under 350 ms, not moved) activates the avatar; a release after moving over a dock target sends a Dock request.'
    request:
      plain: 'Pointer press, move, release and exit events with window positions, the hover flag, and key presses on the focused avatar or on a focused dock Target.'
      shape: "MouseDownEvent { position, modifiers.shift }   // Shift+press only animates\nMouseMoveEvent { position, pressed_button }     // capture phase; > 7 px = moved, Trigger::Undock\nMouseUpEvent { button: Left, position }         // capture phase; target_at(desktop point) -> dock\nMouseExitEvent { pressed_button: None }         // cancel the drag\non_hover(hovered: bool)                          // Trigger::Hover animation\nKeyDownEvent { keystroke.key: \"escape\" | \"s\" | \"f5\" | \"enter\" | \"space\", modifiers, is_held }\nTarget on_key_down: Shift+Enter                  // keyboard dock into that Target's scope"
      type_at: {path: desktop/src/avatar.rs, find: 'fn released(&mut self, event: &gpui::MouseUpEvent, window: &Window, cx: &mut Context<Self>) {'}
    response:
      plain: 'Nothing to GPUI. The avatar changes its own state (drag, motion trigger, floating window) and calls cx.notify(), or calls dock(scope), which becomes a workspace request.'
      shape: "fn dock(&mut self, scope: Scope, cx)   // Scope = voyager_contract::Context\nfn activate(&mut self, window, cx)    // click, Enter or Space"
      type_at: {path: desktop/src/avatar.rs, find: 'fn dock(&mut self, scope: Scope, cx: &mut Context<Self>) {'}
    errors: 'A failure to float or restore is stored as Err(message) in the avatar result and surfaced to the header script through take_result(). A moved release over no target repositions a floating avatar; a docked one plays a tone and stays.'
    why: 'docs/avatar.md says native pointer events supply the source window and real pointer coordinates, and that a pointer release, recall or keyboard gesture sends the existing typed Dock request through the application client.'
    inferred: false
    at: {path: desktop/src/avatar/view.rs, find: 'cx.listener(move |this, event: &gpui::MouseDownEvent, window, cx| {'}
    steps: [avatar-open-chat-1, avatar-open-chat-1a, avatar-open-chat-2, avatar-open-chat-2a, dock-avatar-2, dock-avatar-3, dock-avatar-5, dock-avatar-5a]
  - id: header-package-load
    name: 'Rust loads the header package into QuickJS'
    from: ['rs:voyager_desktop::host']
    to: ['ts:desktop/mods/header/main.ts', 'ext:quickjs']
    mechanism: script-call
    nature: 'On the UI thread, host::load builds five host modules, puts them in a gpui-shell Policy and installs that policy as the default for exactly one load. gpui-shell then reads mod.json, evaluates main.js in the shared QuickJS runtime and constructs its default export, the Workspace view, whose init() runs at once. Rust waits for the load to finish; the script''s first request runs later as async work.'
    request:
      plain: 'The package folder in the profile, plus the policy that decides which modules the script may import.'
      shape: "load(runtime, package: &Path, theme, workspace_binding, conversation, window, cx)\nPolicy::new()\n  .with_host_module(voyager_header)      .with_host_module(voyager_workspace)\n  .with_host_module(voyager_content_view) .with_host_module(voyager_conversation)\n  .with_host_module(voyager_avatar)\n// plus the frozen voyager_native component registry given to ShellRuntime at start\nmod.json { \"name\", \"version\": 1, \"entry\": \"main.js\", \"contentConfiguration\": 2 }"
      type_at: {path: desktop/src/host.rs, find: 'fn load('}
    response:
      plain: 'A ShellRoot entity whose content is the script''s view. Header keeps it, starts a source watcher, and draws its content on every render.'
      shape: "Result<Entity<ShellRoot>>\n// script side: export default class Workspace extends View { init(); render(cx) }"
      type_at: {path: desktop/src/host.rs, find: ') -> Result<Entity<ShellRoot>> {'}
    errors: 'A load error leaves no root. Header shows "Header load failed: ..." in a red box, and a task polling every 250 ms reloads once the package''s .js files or the theme change. LoadGuard refuses a nested load ("Nested package load is not allowed") and always restores an empty default policy afterwards, even on panic.'
    limits: 'The source snapshot hashes at most 4096 .js or .mjs files, 8 directories deep.'
    why: 'docs/workspace.md says voyager_workspace is installed only in the workspace chrome''s policy and content packages do not receive it. The LoadGuard test content_load_scope_restores_deny_after_normal_error_and_unwind shows the policy is meant to apply only for the duration of one load.'
    inferred: false
    at: {path: desktop/src/host.rs, find: 'runtime.try_load(package, window, cx)'}
    steps: [startup-9, startup-b2-1, startup-b2-2]
  - id: notes-package-load
    name: 'Rust loads the Notes package into its own isolated QuickJS runtime'
    from: ['rs:voyager_desktop::notes']
    to: ['ts:content/notes/main.ts', 'ext:quickjs']
    mechanism: script-call
    nature: 'The Notes host owns a second, isolated ShellRuntime built only with the voyager_input registry. For each Notes content id, Loader::load builds a voyager_content module bound to that id and view, installs a policy naming the application "notes-<content id>", loads the entry file and mounts it as a ScriptView. It runs on the UI thread from the Notes watch loop.'
    request:
      plain: 'The Notes package folder, the entry file named in mod.json (main.js), and a policy carrying only that instance''s voyager_content module.'
      shape: "Policy::new().with_application(format!(\"notes-{}\", id.0)).with_host_module(voyager_content)\nruntime.load_application(&self.package, entry)?   // runtime = ShellRuntime::new_isolated_with_components(voyager_input)\nmod.json { \"name\": \"Notes\", \"entry\": \"main.js\", \"version\": 1, \"stateSchema\": { title, text } }"
      type_at: {path: desktop/src/notes.rs, find: '.with_application(application)'}
    response:
      plain: 'A mounted ScriptView entity, held as a Candidate until it is validated and published in place of the previous view.'
      shape: 'Candidate { view: Entity<ScriptView>, binding: ViewBinding, retained, validated: false }'
      type_at: {path: desktop/src/notes.rs, find: 'let view = runtime.mount_application(&application, window, cx)?;'}
    errors: 'If the isolated runtime could not be created, every Notes component draws "Notes unavailable: <error>" and the content description is marked Unavailable with that reason.'
    why: 'docs/content.md says all Notes instances share one isolated QuickJS VM with the private voyager_input registry and cannot import the header''s Terminal, Name or workspace modules; each candidate has its own captured voyager_content module and application generation.'
    inferred: false
    at: {path: desktop/src/notes.rs, find: 'let application = runtime.load_application(&self.package, entry)?;'}
    steps: []
  - id: script-element-tree
    name: 'A script returns an element tree that GPUI draws'
    from: ['ts:desktop/mods/header/main.ts', 'ts:content/notes/main.ts', 'ext:quickjs']
    to: ['rs:voyager_desktop::host', 'ext:gpui']
    mechanism: render
    nature: 'When gpui-shell re-renders a ScriptView it calls the view''s render(cx) in QuickJS on the UI thread. The script returns a gpui-kit NativeElement tree built with chained style and handler calls; gpui-kit turns it into GPUI elements, and native components (Terminal, Split, Notes, Layer and others) are materialized by Rust. Header::render places that view in the window, cached unless accessibility is active.'
    request:
      plain: 'A tree of gpui-kit elements: div() boxes with layout and colour calls, text children, JavaScript handlers, and native component elements created with Name.new(...) and similar constructors with typed arguments or a props object.'
      shape: "render(cx): NativeElement\ndiv().track_focus(this.focus).on_key_down(...).flex().w_full().bg(colors.background)\n  .child(NativeSplit.new(id, \"horizontal\", share, revision, reset, callback))\n  .child(Terminal.new(TerminalState.new(contentId)).size_full())\n  .child(Notes.new(content.id, { contentId: content.id }))\n  .child(Layer.new(\"avatar-layer\", { dockReceipt, dockEpoch, version, scope, layoutKey }))"
      type_at: {path: desktop/mods/header/main.ts, find: 'render(cx: UIContext): NativeElement {'}
    response:
      plain: 'Nothing comes back to the script. GPUI lays out and paints the elements in the next frame.'
      shape: "Header::render -> root.read(cx).content().clone()\n  .cached(StyleRefinement::default().size_full())   // unless window.is_a11y_active()"
      type_at: {path: desktop/src/host.rs, find: 'view.cached(StyleRefinement::default().size_full())'}
    errors: 'Load, theme, reload and quit errors are joined and drawn by Header::render in a red box at the bottom left. A native component with bad props draws its own message, such as "Invalid avatar scope" or "Notes requires a content identity".'
    why: 'The README says scripts define layout through the supported host while rendering stays local and native. Caching the view avoids re-running script render on every frame; it is skipped when accessibility is active so the accessibility tree stays current (Header also invalidates Notes then).'
    inferred: true
    at: {path: desktop/src/host.rs, find: 'let view = root.read(cx).content().clone();'}
    steps: [startup-11, move-vessel-5, portal-11, portal-12, portal-16, avatar-open-chat-14, notes-save-1, notes-save-19, launch-agent-3, launch-agent-2b, launch-agent-18, split-vessel-b3-2, launch-agent-11b]
  - id: workspace-change-notices
    name: 'The owner thread tells the header that something changed'
    from: ['rs:voyager_app::client']
    to: ['rs:voyager_desktop::host', 'host-module:voyager_workspace', 'ts:desktop/mods/header/main.ts']
    mechanism: channel
    nature: 'A long-lived GPUI task in Header subscribes to the owner thread with workspace_changes(after) and awaits a WorkspaceNotice on a one-slot channel. On each notice it stores the notice in a shared cell, re-reads reported activity on a background thread, and asks gpui-shell to refresh the script view. The script then reads the small notice() projection during render and decides whether to inspect.'
    request:
      plain: 'The last notice the header saw (or none). The owner replies with a fresh one-slot receiver and sends the current notice at once if it differs.'
      shape: "Message::WorkspaceChanges { after: Option<WorkspaceNotice>, reply }\nWorkspaceNotice { package_revision: u64, revision: u64, activity_revision: u64, close_revision: u64 }"
      type_at: {path: app/src/client.rs, find: 'pub struct WorkspaceNotice {'}
    response:
      plain: 'Inside the script, notice() returns the four counters as decimal strings. render compares them with the last seen values and calls inspectNotice, which runs { operation: "inspect" } only if the package or close revision changed or the layout revision is newer.'
      shape: "notice(): { revision: string; closeRevision: string; packageRevision: string; activityRevision: string }\n// main.ts: BigInt(notice.revision) <= BigInt(this.version) -> no inspect"
      type_at: {path: desktop/mods/header/main.ts, find: 'const ownerNotice = workspace_notice();'}
    errors: 'If the owner is gone or the receiver is replaced, the task records "Workspace observer was replaced" (or the subscribe error) as a header watch error and stops listening.'
    limits: 'One slot. The owner uses try_send, so a burst of changes keeps only the first unread notice; the next subscription compares its last pair with the current one, so the final state is still delivered.'
    why: 'docs/workspace.md says the owner publishes confirmed change notices to one bounded native Header subscription, exposes only a small read-only revision projection to JavaScript, and that comparing the last pair with the current one means a full bounded notification cannot hide the final accepted state.'
    inferred: false
    at: {path: desktop/src/host.rs, find: 'let next = match changed_client.workspace_changes(after).await {'}
    steps: [split-vessel-14, split-vessel-15, resize-split-14, move-vessel-13, program-exits-8, program-exits-9, program-exits-10, program-exits-16]
  - id: host-voyager-workspace
    name: 'The header script calls voyager_workspace'
    from: ['ts:desktop/mods/header/main.ts', 'ts:contract/generated/workspace.ts', 'ts:desktop/mods/header/creation.ts', 'ts:desktop/mods/header/processes.ts', 'ts:desktop/mods/header/worktrees.ts']
    to: ['host-module:voyager_workspace', 'rs:voyager_desktop::host']
    mechanism: script-call
    nature: 'Header-only door to the workspace owner. Plain functions run synchronously on the UI thread; async functions validate their arguments on the UI thread, then gpui-shell drives the returned future on another thread and resolves the script''s Promise. Most arguments and results are JSON strings checked by serde on the Rust side and by generated Ajv validators on the script side.'
    request:
      plain: 'Twelve functions. Requests travel as JSON text; revisions travel as decimal strings.'
      shape: "request_id(): string                     revision(): string\ncall(request: string): Promise<string>                 // Request JSON\nterminal_open(request: string): Promise<string>        // TerminalRequest JSON\nworktree(request: string): Promise<string>             // worktree Request JSON\nprocesses(version: string): Promise<string>            // ProcessAction::List\nlaunches(): Promise<string>     context_facts(): Promise<string>\nworkspace_observation(version: string, active: string | null): Promise<string>\nnotice(): { revision; closeRevision; packageRevision; activityRevision }\nreported_activity(): string     refresh_activity(): Promise<void>"
      type_at: {path: desktop/src/script_types.rs, find: 'pub const WORKSPACE: &str = r#"'}
    response:
      plain: 'JSON text the script parses and validates: Response, TerminalResponse, worktree Response, ProcessResponse, launch Catalog, context Facts, WorkspaceObservation or the activity Projection.'
      shape: "Response { requestId, status: \"applied\"|\"rejected\"|\"uncertain\", version: \"42\", layout, fresh,\n           createdWorkspace, createdContents, message, closePlan? }\nTerminalResponse { requestId, contentId, status, reason?: \"ended\", message }\nCatalog { settings, available, errors, path }      Facts { version, scope, path, directory, branch }\nWorkspaceObservation { version, active, directory, panels, branch }\nProjection { terminals, limited, reason }          // reported_activity()"
      type_at: {path: contract/src/lib.rs, find: 'pub struct Response {'}
    errors: 'Bad arguments or oversize JSON throw at once ("Workspace request exceeds 64 KiB", "processes expects one decimal revision"). Owner failures become a HostError with the message text, which gpui-shell turns into a rejected Promise naming the module and function. A Promise whose view is reloaded stays pending for ever (gpui-kit''s documented cancellation rule).'
    limits: 'call, worktree, context_facts and workspace_observation: 64 KiB of JSON. terminal_open: 1 KiB, and requestId and contentId at most 128 bytes each.'
    why: 'docs/workspace.md says the module is installed only in the workspace chrome''s policy, a caller cannot grant itself a role through its request, and the host limits request JSON to 64 KiB before dispatching async work. It also says revisions cross JavaScript as decimal strings so a JavaScript number cannot round a Rust u64.'
    inferred: false
    at: {path: desktop/src/host.rs, find: 'let workspace = HostModule::new(crate::script_types::WORKSPACE_MODULE)'}
