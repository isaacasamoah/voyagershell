  - id: output-to-screen
    name: 'A program''s output reaches the screen and every viewer'
    trigger: 'A program in a terminal, say the bun dev server in t7, prints a line.'
    summary: 'The Holder''s pump thread for the terminal is always reading the pseudo-terminal. It keeps the newest 1 MiB in a tail and sends each chunk to the Core as an OUTPUT frame. The Core''s reader thread for that Holder takes the state lock and calls Core::output, which feeds the bytes through a Relay into the terminal''s ghostty-vt screen and gets back what viewers should see: everything except queries the screen has already answered. The screen''s replies go back to the program as input; status reports and title changes become facts and events. Each attached viewer''s outbox gets the bytes, and the connection''s writer task sends them as DATA frames as far as the viewer''s credit allows.'
    steps:
      - id: output-to-screen-1
        fn: 'the program writes output'
        module: 'ext:program'
        runs_on: program
        via: process
        says: 'The program writes to its stdout or stderr, which are the slave side of its pseudo-terminal. The bytes become readable on the master side, which the Holder holds.'
      - id: output-to-screen-2
        fn: 'Holder::pump'
        module: 'rs:herdr_core::holder'
        at: {path: crates/herdr-core/src/holder.rs, find: 'fn pump(&self, id: u32, mut reader: impl Read) {'}
        runs_on: holder
        via: process
        says: 'One pump thread per terminal reads up to 64 KiB at a time, whether or not a Core is connected, so a program never stalls on a full pseudo-terminal. Under the Holder''s lock it appends the chunk to the terminal''s tail and trims the tail to TAIL_BYTES (1 MiB), keeping the newest bytes.'
        fails: 'A read of 0 bytes or an error (EIO once every slave side has closed) ends the pump and marks reader_done; reap then reports the exit after this output.'
      - id: output-to-screen-3
        fn: 'Holder::to_core, Holder::write_to_core'
        module: 'rs:herdr_core::holder'
        at: {path: crates/herdr-core/src/holder.rs, find: 'self.to_core(&mut st, &proto::frame(proto::OUTPUT, id, &buf[..n]));'}
        runs_on: holder
        via: channel
        says: 'The chunk becomes an OUTPUT frame (kind 103) on the connected Core''s channel and is added to that Core''s backlog count; a writer thread writes the frames to the Core in order. With no Core connected, only the tail keeps the output.'
        fails: 'With more than BACKLOG_BYTES (8 MiB) queued for a Core that reads slowly, the pump waits before reading more, so the program slows down as if nobody read its terminal.'
      - id: output-to-screen-4
        fn: 'Core::holder_frames'
        module: 'rs:herdr_core::runtime'
        at: {path: crates/herdr-core/src/runtime.rs, find: 'proto::OUTPUT => self.output(&mut st, id, &payload),'}
        runs_on: core-thread
        via: ipc
        says: 'The Core''s reader thread for this Holder, started in take_over, reads one frame at a time with holder_proto::read, takes the Core''s state lock and calls Core::output.'
        fails: 'A frame over 16 MiB, a broken frame or a panic ends the reading. read_holder reconnects once if the Holder still answers (at most one relink per 5 s); otherwise every live terminal of that Holder finishes as holder_lost and its leftovers are swept.'
      - id: output-to-screen-5
        fn: 'Core::output'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn output(&self, st: &mut State, id: u32, bytes: &[u8]) {'}
        runs_on: core-thread
        via: call
        says: 'Records last_output and output_seq (send''s settle and read use them) and counts newlines in `printed`. It feeds the bytes through the terminal''s Relay. While a read is scrolling a full-screen app (stitching), viewers and output waits get nothing; they get one repaint afterwards.'
      - id: output-to-screen-6
        fn: 'Relay::feed'
        module: 'rs:herdr_core::relay'
        at: {path: crates/herdr-core/src/relay.rs, find: 'pub fn feed(&mut self, screen: &mut Screen, input: &[u8]) -> Vec<u8> {'}
        runs_on: core-thread
        via: call
        says: 'Plain text goes to the screen and into the viewers'' copy. An escape sequence is held until it is complete (a CSI up to 64 bytes, a string up to 512, then it passes unexamined). A possible query is written to the screen first; if the screen produced a reply, the query is left out of the viewers'' copy, because a viewer seeing it would answer a second time. Images (APC) go the other way: the screen takes them, but its replies are dropped. It also notes win32-input-mode requests.'
        carries: 'the bytes for viewers'
      - id: output-to-screen-7
        fn: 'ghostty_vt::Terminal::write'
        module: 'rs:ghostty_vt'
        at: {path: crates/ghostty-vt/src/lib.rs, find: 'pub fn write(&mut self, bytes: &[u8]) {'}
        runs_on: core-thread
        via: call
        says: 'The safe wrapper calls ghostty_terminal_vt_write on the terminal''s libghostty-vt handle. The handle was set up in Terminal::wrap with a scrollback cap (history_bytes from config.toml) and callbacks that collect replies, OSC 7501 reports and title changes into the wrapper''s Hooks.'
      - id: output-to-screen-8
        fn: 'libghostty-vt parses the bytes'
        module: 'ext:libghostty'
        runs_on: core-thread
        via: call
        says: 'libghostty-vt updates the grid, scrollback and modes. For queries such as cursor position or device attributes it writes a reply through on_write_pty; for OSC 7501 it calls on_program_status; for a title change, on_title_changed. Colours and cell size are answered from what a viewer reported, else Ghostty''s defaults.'
      - id: output-to-screen-9
        fn: 'Core::output (replies)'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'link.input(id, &Relay::take_responses(screen));'}
        runs_on: core-thread
        via: call
        says: 'Replies the screen produced go straight back to the program as an INPUT frame on the same Holder link; in-band resize reports are left for viewers. Waits started with --output get the viewers'' copy through output_watch.'
        carries: 'INPUT frame with the replies'
      - id: output-to-screen-10
        fn: 'Core::output (viewers)'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'if !ob.data(v.channel, bytes) {'}
        runs_on: core-thread
        via: channel
        says: 'For each viewer of t7 that is not waiting for a repaint, Outbox::data queues the bytes on that viewer''s channel and conn.with wakes the connection''s writer. Then status reports go to report_status (see status-and-wait), and a changed title is stored, saved within 2 s and emitted as a title event.'
        fails: 'A viewer more than MAX_PENDING (4 MiB) behind loses its backlog and gets a fresh paint of the whole screen instead.'
      - id: output-to-screen-11
        fn: 'server::write_frames'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'async fn write_frames(core: Arc<Core>, conn: Arc<Conn>, mut write: Writer) -> io::Result<()> {'}
        runs_on: core-loop
        via: channel
        says: 'The connection''s writer task wakes, lets pending repaints be prepared, then writes what Outbox::next_frame hands out: control frames such as JSON-RPC replies first, then the streams in turn as DATA frames, each limited by the credit its viewer has returned (WINDOW, 256 KiB, to start).'
        carries: 'DATA frames: [channel u32 LE][kind 0][len u32 LE][bytes]'
      - id: output-to-screen-12
        fn: 'attach::run (output thread)'
        module: 'rs:herdr_core::attach'
        at: {path: crates/herdr-core/src/attach.rs, find: 'out(&shown(&payload));'}
        runs_on: cli
        via: stream
        says: 'In `hc attach`, a reader thread writes each DATA payload to the person''s terminal and returns the same number of bytes as CREDIT, so the Core may send more. An app such as Voyager does the same on its own framed connection.'
    branches:
      - id: output-to-screen-b1
        name: 'After a Core crash, the tail rebuilds the screen'
        from: output-to-screen-2
        steps:
          - id: output-to-screen-b1-1
            fn: 'Holder::serve (welcome and tails)'
            module: 'rs:herdr_core::holder'
            at: {path: crates/herdr-core/src/holder.rs, find: 'out.extend(proto::frame(proto::TAIL, *id, &[a, b].concat()));'}
            runs_on: holder
            via: ipc
            says: 'When a new Core says HELLO, the Holder answers WELCOME listing every terminal it runs, with previous "crash" when the last Core vanished without a goodbye, then one TAIL frame per terminal holding its kept output, up to 1 MiB. After a planned handover the tails were cleared at GOODBYE, so they hold only what came after.'
            carries: 'WELCOME, then TAIL frames'
          - id: output-to-screen-b1-2
            fn: 'Core::adopt'
            module: 'rs:herdr_core::runtime'
            at: {path: crates/herdr-core/src/runtime.rs, find: 'relay.feed(&mut screen, &tail);'}
            runs_on: core-loop
            via: call
            says: 'Without a saved snapshot (a crash), the Core makes a new screen at the terminal''s size and feeds the tail through a Relay; the record''s screen becomes "inexact", since output older than the tail is gone. The screen''s replies are not sent: the program got its answers long ago. Status reports in the tail are replayed, counting at most one ended turn. Each such terminal is then nudged, resized one row smaller and back after 50 ms, so full-screen programs repaint.'
  - id: status-and-wait
    name: 'A program reports its status; a waiting parent hears it'
    trigger: 'A parent agent in t3 started a reviewer, review (t7), and runs `hc wait review`. The reviewer finishes its turn and prints OSC 7501 with state=done.'
    summary: 'The parent''s wait subscribes one of the Core''s own Waiter sinks to t7''s events and blocks. The reviewer''s status sequence travels like any output; libghostty-vt recognises it and hands a StatusReport to the Core. status::apply stores the report as the root record and ends the turn, because the program left working; status_changed emits status and turn events to every subscriber and records news for the parent. The wait sees the status event, returns with reason status, marks the news seen, and hc prints `t7 done, turn 1. Read: hc read t7`. A parent that is not waiting is not told about a done turn; a note is typed into its input only when a child is blocked, hits an error or ends (the branch).'
    steps:
      - id: status-and-wait-1
        fn: 'cli::run (Wait)'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'let r = call("terminal.wait", to(&p))?;'}
        runs_on: cli
        via: process
        says: 'The parent agent runs `hc wait review` in t3. The command keeps the terminal as given, sets caller to t3 and makes one terminal.wait call. Without --timeout the Core uses `wait_timeout` from config.toml, else 180 s.'
        carries: 'WaitParams {terminal "review", caller "t3"}'
      - id: status-and-wait-2
        fn: 'api::waiting::terminal_wait'
        module: 'rs:herdr_core::api::waiting'
        at: {path: crates/herdr-core/src/api/waiting.rs, find: 'pub(super) async fn terminal_wait(core: Ctx<''_>, p: WaitParams) -> Result<WaitResult, RpcError> {'}
        runs_on: core-loop
        via: rpc
        says: 'Resolves review to t7. For a bare wait (no --output) it looks up last_send for (t3, t7): if t3 sent to t7 earlier, the wait is for the turn that send started. watch counts this wait in st.waiting, which keeps notes about t7 out of t3''s input while it waits.'
      - id: status-and-wait-3
        fn: 'Core::wait'
        module: 'rs:herdr_core::wait'
        at: {path: crates/herdr-core/src/wait.rs, find: 'pub async fn wait(&self, id: u32, spec: WaitSpec, waiter: Option<u32>) -> WaitResult {'}
        runs_on: core-loop
        via: call
        says: 'Subscribes a Waiter sink filtered to t7: an unbounded channel that lives for this one call. If t7 has ended, is already not working, or has passed the turn it waits for, it returns at once; a program that never reported status counts as working until it exits. Otherwise it waits on three things: t7''s events, a message typed into t3 meanwhile (reason message), and the deadline.'
        fails: 'At the deadline it returns ended false with reason timeout: a check-in that leaves t7 running, not an error.'
      - id: status-and-wait-4
        fn: 'the reviewer prints OSC 7501'
        module: 'ext:program'
        runs_on: program
        via: process
        says: 'The reviewer prints ESC ] 7501 ; state=done ESC \ among its output. Other fields are optional: id, kind, progress, app, title and msg. The Holder''s pump reads the bytes like any output, keeps them in the tail and forwards them in an OUTPUT frame (see output-to-screen).'
      - id: status-and-wait-5
        fn: 'ghostty_vt on_program_status'
        module: 'rs:ghostty_vt'
        at: {path: crates/ghostty-vt/src/lib.rs, find: 'extern "C" fn on_program_status(_: ffi::Terminal, ud: *mut c_void, r: *const ffi::ProgramStatus) {'}
        runs_on: core-thread
        via: ipc
        says: 'The Core''s holder reader thread feeds the bytes through the Relay into t7''s screen. libghostty-vt parses the sequence and calls on_program_status, which pushes a StatusReport (state idle, working, done, blocked, error or clear; kind permission, question or auth; progress 0 to 100; id, app, title, message) onto the screen''s list. An unknown state is dropped.'
        carries: 'StatusReport {state "done", id ""}'
      - id: status-and-wait-6
        fn: 'Core::report_status'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn report_status(&self, st: &mut State, id: u32, reports: &[ghostty_vt::StatusReport]) {'}
        runs_on: core-thread
        via: call
        says: 'Core::output takes the reports from the screen (take_status_reports) and report_status applies each in order. Because the status word changed, the registry is saved now, since a reboot that also loses the Holder leaves no tail to replay; changes that keep the word are saved within 2 s.'
      - id: status-and-wait-7
        fn: 'status::apply'
        module: 'rs:herdr_core::status'
        at: {path: crates/herdr-core/src/status.rs, find: 'pub fn apply(t: &mut Terminal, r: &StatusReport) -> Change {'}
        runs_on: core-thread
        via: call
        says: 'Sets reported to true. A report without an id replaces the root record, t.status; one with an id replaces that child record in t.records (at most 256), and clear removes records. status_ms is stamped when the word changes. The root record left working, so turn goes up by one. It returns a Change: status, root_report, turn_ended, and stuck when the program just became blocked or error.'
        carries: 'Change {status true, root_report true, turn_ended true, stuck false}'
      - id: status-and-wait-8
        fn: 'Core::status_changed'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn status_changed(&self, st: &mut State, id: u32, change: crate::status::Change) {'}
        runs_on: core-thread
        via: call
        says: 'Emits a status event with {status, records, reported} and, because the turn ended, a turn event with {turn, state}. An ended turn, a newly stuck program or a finished first task is news: Core::news raises t7''s news count and queues Job::Notes for its parent t3, unless t7 was started with --no-notify.'
      - id: status-and-wait-9
        fn: 'Core::deliver_event'
        module: 'rs:herdr_core::events'
        at: {path: crates/herdr-core/src/events.rs, find: 'fn deliver_event(&self, st: &mut State, mut params: Value, record: &Value, was: Option<&Value>) {'}
        runs_on: core-thread
        via: call
        says: 'Each event gets the next sequence number and goes to every subscriber whose filter matches t7: framed connections as a JSON line on their event channel, plain connections such as `hc events` through a queue of 1024 lines, and the Core''s own waits through their unbounded channel. A subscriber too far behind later gets `missed` and a fresh snapshot instead of the backlog. Finally it wakes every task waiting on `changed`.'
        carries: '{"jsonrpc":"2.0","method":"event","params":{"type":"status","terminal":"t7","data":{...},"seq":N}}'
      - id: status-and-wait-10
        fn: 'Core::wait (returns)'
        module: 'rs:herdr_core::wait'
        at: {path: crates/herdr-core/src/wait.rs, find: 'return result(true, "status", Some(new));'}
        runs_on: core-loop
        via: channel
        says: 'The waiting task receives the status event. ends(prev, new) holds because the word went from working to done, so the wait returns.'
        carries: 'WaitResult {terminal "t7", ended true, reason "status", status "done", turn 1}'
      - id: status-and-wait-11
        fn: 'api::waiting::watch, Core::saw'
        module: 'rs:herdr_core::api::waiting'
        at: {path: crates/herdr-core/src/api/waiting.rs, find: 'pub(super) async fn watch(core: &Arc<Core>, caller: Option<String>, id: u32, spec: WaitSpec) -> WaitResult {'}
        runs_on: core-loop
        via: call
        says: 'Core::saw: t3 is t7''s parent, so t7''s news counts as seen (seen = news, seen_ms) and is saved; the waiting count drops. terminal_wait forgets the send turn it waited for, calls flush_saved and replies. The note job queued at step 8 types nothing: a live child that is not stuck is never a note.'
      - id: status-and-wait-12
        fn: 'cli::output::describe_wait'
        module: 'rs:herdr_core::cli::output'
        at: {path: crates/herdr-core/src/cli/output.rs, find: '_ => format!("{t} {word}, turn {}. Read: hc read {t}", r["turn"]),'}
        runs_on: cli
        via: rpc
        says: 'Prints `t7 done, turn 1. Read: hc read t7`, or the WaitResult JSON when piped, and hc exits 0. The parent agent reads the reviewer''s answer with hc read.'
    branches:
      - id: status-and-wait-b1
        name: 'The parent is not waiting and the child is blocked: a note is typed in'
        from: status-and-wait-8
        steps:
          - id: status-and-wait-b1-1
            fn: 'Core::news'
            module: 'rs:herdr_core::notes'
            at: {path: crates/herdr-core/src/notes.rs, find: 'pub fn news(&self, st: &mut State, id: u32) {'}
            runs_on: core-thread
            via: call
            says: 'Here t7 reported state=blocked:kind=permission while t3 was not waiting on it. status_changed calls news because t7 just got stuck; news raises its count and sends Job::Notes(3) on the Core''s jobs channel. An exit does the same through record_finish.'
            carries: 'Job::Notes(parent id)'
          - id: status-and-wait-b1-2
            fn: 'Core::run_jobs'
            module: 'rs:herdr_core::notes'
            at: {path: crates/herdr-core/src/notes.rs, find: 'pub async fn run_jobs(self: Arc<Self>, mut jobs: tokio::sync::mpsc::UnboundedReceiver<Job>) {'}
            runs_on: core-loop
            via: channel
            says: 'The jobs task, started by serve, starts one deliver_notes task per parent; a parent that already has one (note_tasks) gets no second.'
          - id: status-and-wait-b1-3
            fn: 'Core::deliver_notes'
            module: 'rs:herdr_core::notes'
            at: {path: crates/herdr-core/src/notes.rs, find: 'async fn deliver_notes(self: Arc<Self>, parent: u32) {'}
            runs_on: core-loop
            via: call
            says: 'Waits, checking at least every 60 s, until t3 can take a note: it is live, has reported status and is not blocked itself, since typing into its dialog could answer it. A working parent gets the note as a message. With `notes = false` in config.toml nothing is typed.'
          - id: status-and-wait-b1-4
            fn: 'Core::type_note'
            module: 'rs:herdr_core::notes'
            at: {path: crates/herdr-core/src/notes.rs, find: 'async fn type_note(&self, parent: u32) -> Result<bool, RpcError> {'}
            runs_on: core-loop
            via: call
            says: 'Through type_in, the same per-terminal queue and quiet rule as hc send (notes_quiet in config.toml, else 3 s), it builds the notes at typing time: every child of t3 with unseen news that is blocked, errored or gone, and that t3 is not waiting on. Here: `<hc>t7 review is blocked (permission). See: hc read t7</hc>`. It pastes the notes (bracketed when t3 asked for it), pauses 200 ms and presses Enter, then records noted = news so the same news is never typed twice.'
            carries: 'INPUT frames for t3'
            fails: 'If t3 becomes blocked while the note waits for quiet, the attempt fails and deliver_notes tries again.'
          - id: status-and-wait-b1-5
            fn: 'the parent agent reads the note'
            module: 'ext:agent'
            runs_on: program
            via: process
            says: 'The frames reach the Holder and t3''s pseudo-terminal like any send (agent-sends-input-8 to agent-sends-input-11). The parent agent sees the note as a message in its input and can run hc read t7.'
  - id: attach-and-detach
    name: 'Attach to a terminal and detach again: hc attach web'
    trigger: 'A person types `hc attach web` in their own terminal, works in the program, then presses Ctrl+\ to leave it running.'
    summary: 'hc attach puts the person''s terminal in raw mode, asks it for its colours and cell size, and opens a framed connection to the session''s Core. A terminal.attach call on channel 0 adds a viewer; the Core replies with a channel number and sends a first paint of the current screen on it, then every byte the program prints, limited by credit. Keys, size changes and focus go back as frames on the same channel and reach the program through the Holder. Ctrl+\ sends CLOSE: the Core drops the viewer, the program keeps running in the Holder, and hc attach resets the outer terminal and prints "[detached from web]".'
    steps:
      - id: attach-and-detach-1
        fn: 'cli::main'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'Cmd::Attach(p) => {'}
        runs_on: cli
        via: process
        says: 'The shell starts hc. main parses the arguments with clap and run matches Cmd::Attach. pick passes the name "web" through unchanged; an empty name would list the live terminals and open the picker. attach::run does the rest, and cli prints its closing message on stderr.'
        carries: 'terminal "web", observe false, history 0 (the --observe and --history flags)'
      - id: attach-and-detach-2
        fn: 'attach::run'
        module: 'rs:herdr_core::attach'
        at: {path: crates/herdr-core/src/attach.rs, find: 'let _raw = tty.then(RawMode::enter);'}
        runs_on: cli
        via: call
        says: 'Reads detach_key from config.toml (default ctrl+\, the byte 0x1c, key code 92). Without a terminal on stdin it refuses ("attach needs a terminal") unless --observe. RawMode::enter switches the person''s terminal to raw mode with cfmakeraw and keeps the old settings to restore later. catch_termination turns SIGTERM, SIGHUP and SIGINT into a flag, so the loop still cleans up. It writes ASK_DISPLAY (OSC 10, 11 and 12 colour queries, CSI 16 t for the cell size, then DA1) and reads replies for up to 500 ms; take_replies turns them into Display facts and keeps anything else typed meanwhile for later.'
        carries: 'Display {fg, bg, cursor as #rrggbb, cell [width, height]}; keys typed early'
        fails: 'An invalid detach_key or config file returns a config error before the terminal is touched.'
      - id: attach-and-detach-3
        fn: 'client::connect_or_start'
        module: 'rs:herdr_core::client'
        at: {path: crates/herdr-core/src/client.rs, find: 'pub fn connect_or_start(paths: &Paths) -> Result<Stream, RpcError> {'}
        runs_on: cli
        via: call
        says: 'Connects to the session socket (a named pipe on Windows). If nobody listens and core.lock names no other live socket, it starts the Core with spawn_core and polls every 10 ms for up to START_WAIT (15 s). attach::run then writes hello with framed: true as one plain JSON line, reads the one-line reply without checking it, and speaks frames from then on. Its first frame is terminal.attach on channel 0.'
        carries: '{"method":"terminal.attach","params":{terminal, observe, history, cols, rows (from TIOCGWINSZ, else 80x24), display, caller (HC_TERMINAL_ID inside an hc terminal)}}'
        fails: 'A Core that cannot be reached or started returns unavailable, such as "core did not start within 15 s".'
      - id: attach-and-detach-4
        fn: 'server::connection'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'async fn connection(core: Arc<Core>, read: platform::AsyncRead, mut write: Writer) -> io::Result<()> {'}
        runs_on: core-loop
        via: rpc
        says: 'The accept loop spawned a task for this connection. It starts in plain mode, one JSON-RPC message per line. handle answers hello, and because the reply says framed: true the loop breaks: the connection gets a Conn (its outbox), a write_frames task, and read_frames for everything that follows. peer_joined does nothing, since this hello names no Core.'
      - id: attach-and-detach-5
        fn: terminal_attach
        module: 'rs:herdr_core::api'
        at: {path: crates/herdr-core/src/api.rs, find: 'async fn terminal_attach(core: Ctx<''_>, p: AttachParams) -> Result<AttachResult, RpcError> {'}
        runs_on: core-loop
        via: rpc
        says: 'read_frames gets DATA on channel 0 and spawns a task for it, so a slow call never holds up typing. handle asks remote::route where the call goes: "web" has no machine prefix, so it stays here and api::dispatch calls terminal_attach. It needs a framed connection, resolves "web" to a terminal id, and refuses when the caller is that same terminal ("attached to itself, it would show its own output forever").'
        fails: 'not_found for an unknown name, refused for attaching to yourself. The error comes back as the channel-0 reply; attach::run returns it and hc prints "error: ..." with a hint.'
      - id: attach-and-detach-6
        fn: 'Core::attach'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn attach(&self, conn: &Arc<Conn>, id: u32, req: AttachRequest) -> Result<u32, RpcError> {'}
        runs_on: core-loop
        via: call
        says: 'Under the state lock. A terminal with no screen has finished (error "finished", hint hc read web). conn.new_channel numbers the stream and a Viewer, active from now, joins the terminal''s viewers. apply_size makes the most recently active typing viewer the leader, so the screen and the program take this viewer''s size (a RESIZE frame to the Holder) and colours. first_paint builds CAN, the screen with any requested history, CSI ?9001h or l, the latest OSC 7501 status reports and the rest of any half-written character. The stream opens paused with the paint queued. The task then queues the reply as a control frame and resumes the channel, so the reply always arrives first; write_frames sends control frames, then stream data in 16 KiB chunks within the viewer''s credit.'
        carries: 'reply {channel, terminal, resize_notifications, automatic_input: true}, then DATA frames with the paint'
        fails: 'A finished terminal gives the error "finished" with a hint to read it instead.'
      - id: attach-and-detach-7
        fn: 'attach::run (output thread)'
        module: 'rs:herdr_core::attach'
        at: {path: crates/herdr-core/src/attach.rs, find: 'out(&shown(&payload));'}
        runs_on: cli
        via: stream
        says: 'attach::run reads frames until the channel-0 reply gives the channel; frames that came earlier are kept. It turns on focus reports (CSI ?1004h) in the outer terminal and starts an output thread. Each DATA frame on the channel goes to stdout through shown(), which removes win32-input-mode requests (CSI ?9001h and l) and turns a program''s CSI ?1004l back into h, because focus reports decide which viewer is active. After writing, the thread sends CREDIT with the payload''s length.'
        carries: 'program bytes to the person''s terminal; CREDIT (u32) back to the Core'
      - id: attach-and-detach-8
        fn: 'Core::output'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn output(&self, st: &mut State, id: u32, bytes: &[u8]) {'}
        runs_on: core-thread
        via: ipc
        says: 'Live output. The Holder''s pump thread reads the pseudo-terminal 64 KiB at a time and sends OUTPUT frames; the Core''s holder reader thread calls Core::output under the state lock. Relay::feed writes every byte to the screen and leaves out queries the screen already answered (the answers go to the program). The rest is queued on every viewer''s stream with data(), which wakes the connection''s writer. A viewer more than MAX_PENDING (4 MiB) behind loses its backlog and gets a fresh first_paint instead.'
        carries: 'raw program output, minus queries the Core answered'
      - id: attach-and-detach-9
        fn: 'attach::run (input loop)'
        module: 'rs:herdr_core::attach'
        at: {path: crates/herdr-core/src/attach.rs, find: 'if !observe && !input.is_empty() {'}
        runs_on: cli
        via: stream
        says: 'The person types. The main loop polls stdin every 100 ms, or 50 ms while an escape sequence is cut off, so a lone Esc is decided by the clock as in tmux. incomplete_tail holds back an unfinished sequence and take_replies removes late display replies. ESC [ I and ESC [ O become FOCUS frames (1 or 0); regaining focus asks for colours again, and changed facts go as FACTS. Everything else goes as one DATA frame on the channel. Each pass also compares window_size with the last size and sends RESIZE (u16 cols, u16 rows, little-endian) when it changed. An observer sends neither keys nor sizes.'
        carries: 'DATA (key bytes), RESIZE, FOCUS and FACTS frames on the attach channel'
      - id: attach-and-detach-10
        fn: 'Core::viewer_input'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn viewer_input(&self, conn: &Arc<Conn>, channel: u32, bytes: &[u8], automatic: bool) {'}
        runs_on: core-loop
        via: stream
        says: 'read_frames hands DATA on a stream channel to viewer_input. touch marks this viewer active, so its size and colours count. Gate::viewer passes the bytes straight on, or holds them while an agent''s send is going in and releases them after it. link.input wraps them in an INPUT frame to the Holder that runs the terminal, which queues them for that terminal''s writer thread; the thread writes them to the pseudo-terminal.'
        carries: 'INPUT {terminal id, bytes} on the Core-Holder wire'
      - id: attach-and-detach-11
        fn: 'Core::apply_size'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'fn apply_size(&self, st: &mut State, id: u32) {'}
        runs_on: core-loop
        via: stream
        says: 'RESIZE and FOCUS frames reach viewer_resize and viewer_focus, which also go through touch. apply_size picks the leader (the typing viewer active most recently), resizes the screen, stores cols and rows in the record, sends RESIZE {cols, rows} to the Holder so the program gets its new window size, and emits a size event. A focus change reaches the program as ESC [ I or ESC [ O only if it turned on focus reporting (mode 1004). FACTS from the leading viewer change the colours the Core uses to answer the program''s colour queries.'
        carries: 'RESIZE {cols, rows} to the Holder; a size event to subscribers'
      - id: attach-and-detach-12
        fn: 'attach::find_detach'
        module: 'rs:herdr_core::attach'
        at: {path: crates/herdr-core/src/attach.rs, find: 'let detach = find_detach(&input, detach_key);'}
        runs_on: cli
        via: stream
        says: 'Ctrl+\ is found in any keyboard encoding: the control byte 0x1c, kitty''s CSI 92;5u (a press or repeat, lock keys ignored) or modifyOtherKeys'' CSI 27;5;92~. Input before the chord is still sent; the chord and anything after it in the same read are dropped. The loop sends an empty CLOSE frame on the channel and stops.'
        carries: 'CLOSE with an empty payload'
      - id: attach-and-detach-13
        fn: 'Core::detach'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'pub fn detach(&self, conn: &Arc<Conn>, channel: Option<u32>) {'}
        runs_on: core-loop
        via: stream
        says: 'read_frames gets CLOSE, calls detach for that channel and queues an empty CLOSE back. The viewer is removed and apply_size runs again: another typing viewer becomes leader, or with none the terminal runs headless at the configured size (default 200 columns by 120 rows), so the program is resized. The program, its pseudo-terminal and its screen stay. When the socket then closes, connection calls detach for the whole connection, remote::conn_gone and remote::peer_left.'
      - id: attach-and-detach-14
        fn: 'attach::run (cleanup)'
        module: 'rs:herdr_core::attach'
        at: {path: crates/herdr-core/src/attach.rs, find: 'out(RESET);'}
        runs_on: cli
        via: call
        says: 'attach::run shuts the socket both ways, joins the output thread and writes RESET to the outer terminal: synchronized output off, kitty key flags cleared on both screens, mouse, paste and focus reports off, and the scroll region, cursor, character set and colours back to their defaults, keeping the cursor where the program left it. Dropping RawMode restores the saved terminal settings. It returns "[detached from web]", which cli prints. If the Core went away instead, the message is "[lost the core; it keeps web running: hc attach web]".'
        carries: 'exit status 0'
    branches:
      - id: attach-and-detach-b1
        name: 'The program ends while attached'
        from: attach-and-detach-8
        steps:
          - id: attach-and-detach-b1-1
            fn: 'Core::record_finish'
            module: 'rs:herdr_core::runtime'
            at: {path: crates/herdr-core/src/runtime.rs, find: 'v.conn.with(|out| out.finish(v.channel, end.to_string().as_bytes()));'}
            runs_on: core-thread
            via: ipc
            says: 'The Holder reports EXITED after the program''s last output is forwarded. record_finish records the end and finishes every viewer stream: CLOSE with {"reason", "exit_code", "signal", "finished_ms"} is sent once the queued output is out, so the viewer sees the last screen. The screen is saved to screens/<address>.snap for hc read.'
            carries: 'CLOSE {"reason":"exited","exit_code":0,"signal":null,"finished_ms":...}'
          - id: attach-and-detach-b1-2
            fn: 'attach::run'
            module: 'rs:herdr_core::attach'
            at: {path: crates/herdr-core/src/attach.rs, find: 'Some(end) => format!("[{address} finished: {}]", end["reason"].as_str().unwrap_or("ended")),'}
            runs_on: cli
            via: stream
            says: 'The output thread keeps the CLOSE reason and sets done. The input loop sees it within 100 ms, resets the outer terminal and prints "[web finished: exited]" (or killed, server_stop and so on).'
      - id: attach-and-detach-b2
        name: 'The terminal is on another machine: hc attach box/t3'
        from: attach-and-detach-5
        steps:
          - id: attach-and-detach-b2-1
            fn: 'remote::attach'
            module: 'rs:herdr_core::remote::viewers'
            at: {path: crates/herdr-core/src/remote/viewers.rs, find: 'pub async fn attach(core: &Core, conn: &Arc<Conn>, m: &Machine, mut params: Value) -> Result<Value, RpcError> {'}
            runs_on: core-loop
            via: call
            says: 'remote::route names the machine box, so handle calls remote::attach instead of the local handler. It waits for the line to box, turns resize_notifications off if that Core lacks the feature, opens a paused channel here and calls terminal.attach there for t3. Line::take_reply maps the channel there to the channel here before the reply is handed on, so no stream byte is lost. The viewer is recorded in relayed, and hc attach gets the channel here with addresses as seen from here.'
            fails: 'A line that is down, needs a login or needs an update gives unavailable or needs_update; the channel here is closed.'
          - id: attach-and-detach-b2-2
            fn: 'remote::hold'
            module: 'rs:herdr_core::remote'
            at: {path: crates/herdr-core/src/remote.rs, find: '(there, wire::DATA) => {'}
            runs_on: core-loop
            via: network
            says: 'Frames from box on the mapped channel are queued unchanged on the viewer''s channel here: DATA with data, RESIZE in order with ordered_resize, CLOSE with finish. Frames from hc attach on the channel here go through relay_in to the channel there. CREDIT is applied here as well as forwarded, and RESIZE and FACTS are remembered for a later reattach.'
          - id: attach-and-detach-b2-3
            fn: 'remote::hold (line lost)'
            module: 'rs:herdr_core::remote'
            at: {path: crates/herdr-core/src/remote.rs, find: 'lost; reconnecting...'}
            runs_on: core-loop
            via: network
            says: 'If the line drops, the viewer stays open and shows "[line to box lost; reconnecting...]". Keys typed meanwhile are dropped, not queued. Once supervise has redialled, reattach calls terminal.attach again with history 0 and resumed true, on the same channel here, and the screen is painted again.'
  - id: app-connects
    name: 'An app connects through hc connect'
    trigger: 'An app such as Voyager starts `hc connect --session <name>` as a child process and writes JSON-RPC to its stdin.'
    summary: 'hc connect is a plain pipe: it connects to the session''s Core, starting it if needed, and copies bytes both ways between its stdin and stdout and the socket. The Core sees an ordinary connection. The app''s first line is hello with framed: true; after the one-line reply the connection carries frames, with JSON-RPC on channel 0. Calls such as terminal.list run side by side and their replies go ahead of stream data, while terminal.attach opens a stream channel on the same connection. Closing stdin ends the connection and drops the app''s viewers; the programs keep running.'
    steps:
      - id: app-connects-1
        fn: 'app starts hc connect'
        module: 'ext:app'
        at: {path: schema/README.md, find: '`hc connect` speaks the same protocol over'}
        runs_on: you
        via: process
        says: 'The app spawns `hc connect --session <name>` with pipes for stdin and stdout. --session picks the Core the way HC_SESSION does and reads the same in sh, cmd and PowerShell, so an app can keep a Core of its own apart from the person''s. Over SSH the same command reaches a Core on another machine (`ssh box hc connect`).'
        carries: 'session name'
      - id: app-connects-2
        fn: 'cli::run'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'Cmd::Connect { session } => {'}
        runs_on: cli
        via: process
        says: 'run sets HC_SESSION from --session while no other thread runs yet, so a Core this command starts inherits it, recomputes Paths (the state folder and socket path for that session) and calls connect.'
        carries: 'Paths for the session'
      - id: app-connects-3
        fn: 'cli::connect'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'fn connect(paths: &Paths) -> Result<(), RpcError> {'}
        runs_on: cli
        via: call
        says: 'connect_or_start reaches the socket, starting the Core if none answers. A second thread pumps stdin to the socket in reads of up to 64 KiB and shuts the socket''s write half at the end of input; the main thread pumps the socket to stdout, unbuffered because frames contain no newlines. Nothing is parsed or changed.'
        fails: 'If the Core cannot be reached or started, hc connect prints the error on stderr and exits with an error code before any bytes flow.'
      - id: app-connects-4
        fn: 'server::connection'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'async fn connection(core: Arc<Core>, read: platform::AsyncRead, mut write: Writer) -> io::Result<()> {'}
        runs_on: core-loop
        via: rpc
        says: 'The app''s first line arrives in plain mode: {"jsonrpc":"2.0","id":1,"method":"hello","params":{"generation":1,"framed":true}}. handle runs it like any call and the reply is written as one line. Because the reply has framed: true, the loop ends and the connection switches: a Conn holds its outbox, write_frames runs as its own task, and read_frames reads frames with 9-byte headers from then on. peer_joined ignores it, since an app''s hello names no Core.'
      - id: app-connects-5
        fn: hello
        module: 'rs:herdr_core::api'
        at: {path: crates/herdr-core/src/api.rs, find: 'async fn hello(core: Ctx<''_>, p: HelloParams) -> Result<HelloResult, RpcError> {'}
        runs_on: core-loop
        via: call
        says: 'A generation other than GENERATION (1) is refused. Otherwise the reply carries the generation, the package version, the Core''s permanent identity {id, name}, framed, every method name from the method table and FEATURES: framed, attach, events, status, shell, resize_notifications and automatic_input.'
        carries: '{"generation":1,"version":"0.1.19","core":{"id","name"},"framed":true,"methods":[...],"features":[...]}'
      - id: app-connects-6
        fn: 'server::read_frames'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'let task = tokio::spawn(async move {'}
        runs_on: core-loop
        via: rpc
        says: 'The app sends terminal.list as DATA on channel 0. A reply from a peer Core and $/cancelRequest are handled first; otherwise read_frames spawns a task per call, so calls run side by side and a slow one never holds up typing. machine.exec calls are remembered by id so that $/cancelRequest or a closed connection can abort them.'
        carries: '{"jsonrpc":"2.0","id":2,"method":"terminal.list","params":{"all":true}}'
      - id: app-connects-7
        fn: terminal_list
        module: 'rs:herdr_core::api'
        at: {path: crates/herdr-core/src/api.rs, find: 'async fn terminal_list(core: Ctx<''_>, p: ListParams) -> Result<ListResult, RpcError> {'}
        runs_on: core-loop
        via: call
        says: 'handle passes the params through remote::from_peer (unchanged for an app) and remote::route (no machine named, so here); api::dispatch parses ListParams and calls terminal_list. It prunes expired finished terminals, keeps those carrying every requested label and leaves finished ones out unless all is true, counting them in hidden_finished. It then asks every added machine for its list at once, giving each 3 seconds, and adds their terminals addressed like box/t3, plus each machine''s line state.'
        carries: 'ListResult {terminals, hidden_finished, machines}'
      - id: app-connects-8
        fn: 'server::write_frames'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'out.control(wire::encode(0, wire::DATA, reply.to_string().as_bytes()));'}
        runs_on: core-loop
        via: channel
        says: 'The call''s task queues the reply as a control frame under the outbox lock and notifies wake. write_frames wakes, serializes any repaint a viewer now has credit for, then writes whatever next_frame hands out: every control frame first, then stream data shared in turn between channels, each limited by its own credit.'
      - id: app-connects-9
        fn: 'cli::connect (stdout pump)'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'pump(&mut &stream, &mut *crate::platform::console::stdout());'}
        runs_on: cli
        via: rpc
        says: 'hc connect copies the frame bytes to its stdout as they arrive. The app reads the 9-byte header, then the payload, and matches the reply to its request by id.'
        carries: '{"jsonrpc":"2.0","id":2,"result":{"terminals":[...],"hidden_finished":0,"machines":[...]}}'
      - id: app-connects-10
        fn: 'Core::attach'
        module: 'rs:herdr_core::viewers'
        at: {path: crates/herdr-core/src/viewers.rs, find: 'out.open_paused(channel);'}
        runs_on: core-loop
        via: rpc
        says: 'To show a terminal the app calls terminal.attach with its own size and display facts, and for a watch-only view observe (with resize_notifications if it can apply RESIZE frames before data). The Core adds a viewer and opens the stream paused with the first paint queued. The call''s task resumes the channel only as it queues the reply, so the app always learns the channel before the first stream byte. The reply also confirms automatic_input: true.'
        carries: 'reply {channel, terminal, resize_notifications, automatic_input}; then the paint and live bytes'
      - id: app-connects-11
        fn: 'server::read_frames'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: '(ch, wire::AUTOMATIC_INPUT) => core.viewer_input(conn, ch, &payload, true),'}
        runs_on: core-loop
        via: stream
        says: 'On the stream channel the app sends DATA for typed keys, AUTOMATIC_INPUT (kind 6) for replies its own terminal emulator generates, CREDIT as it consumes output, and RESIZE, FOCUS and FACTS as they change. Automatic input reaches the program like typing, but does not make the viewer active or reset the quiet period that agents'' sends wait for. Frames for a channel the Core does not know are ignored.'
      - id: app-connects-12
        fn: 'server::connection (end)'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'core.detach(&conn, None);'}
        runs_on: core-loop
        via: process
        says: 'When the app closes stdin, the pump thread shuts the socket''s write half and read_frames sees the end. connection cleans up: detach removes all the app''s viewers and event subscriptions (sizes fall back to other viewers or the headless size), conn_gone ends streams relayed to other machines, peer_left forgets a peer line, and the writer task is aborted. The socket closes, the stdout pump ends and hc connect exits. The programs keep running.'
    branches:
      - id: app-connects-b1
        name: 'The app speaks another protocol generation'
        from: app-connects-5
        steps:
          - id: app-connects-b1-1
            fn: hello
            module: 'rs:herdr_core::api'
            at: {path: crates/herdr-core/src/api.rs, find: '"unsupported_generation",'}
            runs_on: core-loop
            via: call
            says: 'hello with a generation other than 1 is answered with error kind unsupported_generation ("protocol generation N not supported", hint "this core speaks generation 1"). handle switches to frames only after a successful hello, so the connection stays in plain mode and the app can read the error as a line.'
      - id: app-connects-b2
        name: 'The app stops reading'
        from: app-connects-8
        steps:
          - id: app-connects-b2-1
            fn: 'server::connection'
            module: 'rs:herdr_core::server'
            at: {path: crates/herdr-core/src/server.rs, find: 'eprintln!("core: a client stopped reading its replies: disconnected");'}
            runs_on: core-loop
            via: channel
            says: 'Stream output for a viewer that sends no CREDIT simply waits, and past MAX_PENDING (4 MiB) it is replaced by a repaint. Control frames are not limited by credit: once queued replies pass MAX_CONTROL (64 MiB), the outbox drops everything and signals overflowed, and connection ends the whole connection, logging "a client stopped reading its replies: disconnected".'
  - id: server-restart
    name: 'Restart the Core without ending programs: hc server restart'
    trigger: 'A person or agent runs `hc server restart`, or `hc update` installs a new build and restarts the Core the same way.'
    summary: 'The command asks the running Core for server.restart. The Core saves its environment to restart-env.json, replies, stops listening and hands over: it tells each Holder goodbye in handover mode, saves every screen exactly to screens/<address>.snap and flushes terminals.json, then exits. The Holder clears its tails and keeps every program running. The command then starts a new Core, which restores the saved environment, adopts every terminal from the Holder, rebuilds each screen from its snapshot plus the output since the goodbye, and starts serving again.'
    steps:
      - id: server-restart-1
        fn: 'cli::run'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'client::call(&stream, "server.restart", json!({}))?;'}
        runs_on: cli
        via: process
        says: 'run matches Cmd::Server with Restart. client::connect_existing connects only if a Core is listening; with none, the restart part is skipped and the status call below simply starts one. Otherwise client::call sends server.restart in plain mode and waits for its reply line.'
        carries: '{"jsonrpc":"2.0","id":1,"method":"server.restart","params":{}}'
      - id: server-restart-2
        fn: 'restart::prepare'
        module: 'rs:herdr_core::restart'
        at: {path: crates/herdr-core/src/restart.rs, find: 'pub(crate) fn prepare(core: &Core) -> io::Result<()> {'}
        runs_on: core-loop
        via: rpc
        says: 'api::dispatch calls server_restart, which calls prepare. A Core already stopping or restarting refuses. Otherwise it sets core.restart, which turns the coming stop into a handover, and save writes restart-env.json: this machine''s id, the boot id, the time and every environment variable, through a private temporary file that is synced and renamed into place. If saving fails, it logs that the next launcher''s environment will be used and goes on. The reply is {"stopped": true}.'
        carries: 'restart-env.json in the state folder; reply {stopped: true}'
        fails: 'A Core that is stopping or restarting returns an internal error "the core is stopping or restarting"; nothing else changes.'
      - id: server-restart-3
        fn: 'server::serve'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: '_ = core.stop.notified() => break,'}
        runs_on: core-loop
        via: channel
        says: 'Only after the reply is written does handle''s after() notify core.stop. The accept loop in serve breaks, the socket file is removed so no new client can connect, and finish sees core.restart set and calls core.handover.'
      - id: server-restart-4
        fn: 'Core::handover'
        module: 'rs:herdr_core::runtime'
        at: {path: crates/herdr-core/src/runtime.rs, find: 'self.goodbye(Goodbye::Handover);'}
        runs_on: core-loop
        via: ipc
        says: 'handover waits up to 6 seconds for any cleanup sweep in flight, then goodbye sends GOODBYE {"handover"} to every Holder and waits up to 6 seconds for each one''s BYE. The wait blocks the Core''s only async thread, which by now serves nobody.'
        carries: 'GOODBYE "handover" on the Core-Holder wire'
      - id: server-restart-5
        fn: 'Holder::commands'
        module: 'rs:herdr_core::holder'
        at: {path: crates/herdr-core/src/holder.rs, find: 'st.terms.values_mut().for_each(|t| t.tail.clear());'}
        runs_on: holder
        via: ipc
        says: 'The Holder ignores a goodbye from a Core that is no longer its newest. For a handover it clears every terminal''s tail, because the Core saved the screens up to this point, sends BYE, and marks the Core gone with previous = "handover". Its writer still delivers what was queued but no longer holds programs back for that Core. Programs keep running, and the pump threads keep reading their output into fresh tails.'
        carries: 'BYE back to the Core'
      - id: server-restart-6
        fn: 'Core::handover (save)'
        module: 'rs:herdr_core::runtime'
        at: {path: crates/herdr-core/src/runtime.rs, find: 'if let Some(snapshot) = screen.snapshot() {'}
        runs_on: core-loop
        via: channel
        says: 'The holder reader thread passes BYE to goodbye through the link''s bye channel. handover then forgets the Holders, flushes each relay into its screen, writes each screen''s snapshot to screens/<address>.snap with write_atomic, and saves and flushes terminals.json. serve returns and the process exits, which closes every connection and releases core.lock.'
        carries: 'screens/<address>.snap per live terminal; terminals.json'
      - id: server-restart-7
        fn: 'client::spawn_core'
        module: 'rs:herdr_core::client'
        at: {path: crates/herdr-core/src/client.rs, find: 'pub fn spawn_core(paths: &Paths) -> Result<(), RpcError> {'}
        runs_on: cli
        via: rpc
        says: 'The command''s wait_closed reads until the connection ends, for up to 30 seconds. It then calls server.status through connect_or_start, which finds no socket and runs spawn_core: spawn_detached starts `herdr-core serve` logging to core.log, without the inherited cleanup token, so ending the terminal it was typed in cannot end the Core. It polls the socket every 10 ms for up to 15 seconds.'
        fails: 'A Core that does not answer in 15 seconds gives unavailable, "core did not start within 15 s"; the Holder''s own restart (branch) still brings one up.'
      - id: server-restart-8
        fn: 'systemd::spawn'
        module: 'rs:herdr_core::platform::systemd'
        at: {path: crates/herdr-core/src/platform/systemd.rs, find: '.args(unit_args(&name, &dir.join("environment"), &unset, log, &here, version))'}
        runs_on: cli
        via: call
        says: 'On Linux with a systemd user manager, the Core becomes a user service so a logout or a closed SSH session cannot take it along. spawn writes the caller''s environment, minus an SSH login''s session variables and systemd''s own, to a private environment file; makes sure the hc-shutdown guard unit is active; and runs `systemd-run --user` for a transient unit named hc-serve-<8 hex> with KillMode=process and stderr appended to core.log. It also asks loginctl once, in the background, to enable linger. Without a user manager it falls back to a plain detached start; macOS uses a one-shot launchd job instead.'
        carries: 'systemd-run --user --unit=hc-serve-<hex> ... herdr-core serve'
        fails: 'A systemd-run failure is returned as an error; no systemd-run on PATH means a plain detached start.'
      - id: server-restart-9
        fn: 'restart::restore'
        module: 'rs:herdr_core::restart'
        at: {path: crates/herdr-core/src/restart.rs, find: 'pub(crate) unsafe fn restore(paths: &Paths) {'}
        runs_on: core-loop
        via: process
        says: 'The new process runs cli::main, Cmd::Serve and serve. serve takes core.lock with try_lock (a loser exits at once) and writes its socket path into the lock file. restore, still single-threaded, loads restart-env.json only if it was written on this machine, in this boot, less than VALID_MS (3 minutes) ago, with valid and unique keys; then it replaces the process environment with the saved one, keeping this launch''s own paths (HOME, XDG folders, HC_SESSION, HC_SOCKET) and service marks. Anything invalid is logged and discarded.'
        carries: 'the environment the previous Core started with'
      - id: server-restart-10
        fn: 'Core::attach_all'
        module: 'rs:herdr_core::runtime'
        at: {path: crates/herdr-core/src/runtime.rs, find: 'fn attach_all(self: &Arc<Self>) -> io::Result<()> {'}
        runs_on: core-loop
        via: ipc
        says: 'Core::start reads terminals.json, docs, machines and peers, then attach_all finds every Holder socket of this session in the socket folder and removes those nobody answers on. take_over sends HELLO and reads WELCOME {instance, pid, build, previous: "handover", terminals} and one TAIL per terminal: the output since the goodbye. A Holder of another build (after hc update) is sent DRAIN: it keeps its programs, takes no new ones and exits when empty. A writer thread and a holder reader thread start for each link.'
        carries: 'WELCOME and TAIL frames from the Holder'
      - id: server-restart-11
        fn: 'Core::adopt'
        module: 'rs:herdr_core::runtime'
        at: {path: crates/herdr-core/src/runtime.rs, find: 'let handover = welcome.previous == "handover";'}
        runs_on: core-loop
        via: call
        says: 'For each terminal the Holder runs: one with no live record is killed and released. After a handover, the screen is restored from screens/<address>.snap and is exact; the tail is fed through a Relay, answers to queries in it are sent to the program, and its status reports count as new. Without a snapshot (a crash) the screen is rebuilt from the tail alone, marked inexact, and nudged: resized one row smaller and back so full-screen programs redraw. Back in attach_all, live records that no Holder runs end as stopped_by_restart, and leftovers are swept.'
        carries: 'one screen per adopted terminal; registry saved'
      - id: server-restart-12
        fn: 'server::serve'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'crate::restart::discard(&core.paths);'}
        runs_on: core-loop
        via: call
        says: 'Only now does serve bind the socket, so nobody talks to a Core that has not adopted its terminals. It builds the single-threaded tokio runtime, deletes restart-env.json, and starts the background tasks: keep recovery every second, the jobs queue, the lines to added machines, the foreground watch and the delayed registry save. Then it accepts connections.'
      - id: server-restart-13
        fn: 'cli::run (status)'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: '"core {} ({}) running, pid {}, up {}s",'}
        runs_on: cli
        via: rpc
        says: 'wait_for_socket connects, the command sends server.status and prints "core <name> (<first 8 of its id>) running, pid N, up Ns". Terminals kept their programs. Viewers attached to the old Core lost their connection: hc attach exits with "[lost the core; it keeps web running: hc attach web]", and apps attach again.'
        carries: 'StatusResult {core, version, pid, uptime_ms, holder, holders, live, finished}'
    branches:
      - id: server-restart-b1
        name: 'hc update downloads a release and swaps the binary first'
        from: server-restart-1
        steps:
          - id: server-restart-b1-1
            fn: 'cli::run (Update)'
            module: 'rs:herdr_core::cli'
            at: {path: crates/herdr-core/src/cli.rs, find: 'let m = crate::releases::manifest(requested, &scratch.0)?;'}
            runs_on: cli
            via: process
            says: 'hc never checks for updates on its own. `hc update` makes a private scratch folder and fetches the release list with curl: core/latest.json, or core/<version>/manifest.json for --version, from releases.herdr.dev or HERDR_RELEASES_URL. A release of another protocol generation is refused unless --force. If this hc is already as new, it only restarts a running Core that is older than the installed binary.'
            carries: 'Manifest {version, generation, targets: {"linux-x86_64": {url, sha256}, ...}}'
            fails: 'A failed download gives unavailable ("cannot download <url>"); another generation gives refused with the hint to update the apps first.'
          - id: server-restart-b1-2
            fn: 'releases::download'
            module: 'rs:herdr_core::releases'
            at: {path: crates/herdr-core/src/releases.rs, find: 'pub fn download(m: &Manifest, target: &str, scratch: &Path, bundle: bool) -> Result<PathBuf, RpcError> {'}
            runs_on: cli
            via: process
            says: 'fetch downloads the archive for this machine''s target with curl and compares its SHA-256 (sha256sum or shasum; Windows hashes it itself) with the manifest. tar -xf unpacks it into the scratch folder; on macOS the signed app bundle is verified. The result is the path of the new herdr-core.'
            fails: 'A checksum mismatch, a missing build for this target or an archive without herdr-core gives refused.'
          - id: server-restart-b1-3
            fn: 'update::update'
            module: 'rs:herdr_core::cli::update'
            at: {path: crates/herdr-core/src/cli/update.rs, find: 'crate::platform::swap_in(from, &dest, |staged| version_of(staged).as_deref() == Some(now.as_str())).map_err('}
            runs_on: cli
            via: file
            says: 'A binary installed by Homebrew, Nix or mise, or in a folder you cannot write, is refused with the right upgrade command. version_of runs the new file with --version; an older build needs --force. swap_in copies it beside the running binary, checks the copy reports the same version, and renames it over the old one, so there is never a half-written hc. Then it calls server.restart on the running Core and joins the main route at step 2; the next Core starts from the new file, and the summary reads "<path>: hc a -> hc b; core running again (pid N), terminals kept".'
            fails: 'A copy that does not run gives refused; any other failure to replace the file gives an internal error and the old binary stays.'
      - id: server-restart-b2
        name: 'The Holder starts the next Core itself'
        from: server-restart-7
        steps:
          - id: server-restart-b2-1
            fn: 'Holder::supervise'
            module: 'rs:herdr_core::holder'
            at: {path: crates/herdr-core/src/holder.rs, find: 'fn supervise(&self) {'}
            runs_on: holder
            via: process
            says: 'Every 100 ms the Holder''s supervise thread checks whether a Core is connected. If none has been for HC_HOLDER_GRACE_MS (default 3 s) and it still holds terminals, it calls spawn_core itself, backing off (doubling, at most 60 s) after repeated starts within 5 minutes. A Holder with no terminals exits instead. If both the command and the Holder start a Core, try_lock on core.lock lets one serve and the other exit at once.'
  - id: run-on-machine
    name: 'Run a command on another machine: hc run --on box'
    not_run: 'Not run. It needs a second machine reachable over SSH, and `hc machine add` installs hc there.'
    trigger: 'A person or agent runs `hc run --on box --cwd /srv/app cargo test` and waits for the result.'
    summary: 'The command makes one terminal.run call to the local Core with on: "box". remote::route sees the machine name and the call is forwarded over the line the Core keeps open to box: an ssh process running `herdr-core connect` there, carrying framed JSON-RPC to box''s Core. Box''s Core starts cargo test in /srv/app, waits until it finishes or the wait times out, and replies with the record and output. The local Core rewrites addresses such as t3 to box/t3 and hands the reply back, and the command prints the output and exits with the program''s exit code.'
    steps:
      - id: run-on-machine-1
        fn: 'cli::run (Run)'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'let r = call("terminal.run", to(&p))?;'}
        runs_on: cli
        via: process
        says: 'run matches Cmd::Run. With --on set, --cwd is passed as given rather than joined to the current folder, because this folder means nothing on box. It adds the terminal identity variables (TERM, TERM_PROGRAM, TERM_PROGRAM_VERSION, COLORTERM), the caller (HC_TERMINAL_ID inside an hc terminal, else ppid:<parent pid>), wait: true because --bg is absent, and die_with_parent, then sends terminal.run in plain mode.'
        carries: '{"method":"terminal.run","params":{"argv":["cargo","test"],"cwd":"/srv/app","on":"box","wait":true,"env":{...},"caller":"t5",...}}'
      - id: run-on-machine-2
        fn: 'server::handle'
        module: 'rs:herdr_core::server'
        at: {path: crates/herdr-core/src/server.rs, find: 'let result = match crate::remote::route(core, method, &params) {'}
        runs_on: core-loop
        via: rpc
        says: 'The local Core reads the line on a plain connection. handle passes the params through remote::from_peer (unchanged: this is no peer Core) and asks remote::route where the call goes. A machine answer sends it to remote::forward_to instead of api::dispatch.'
      - id: run-on-machine-3
        fn: 'remote::route'
        module: 'rs:herdr_core::remote'
        at: {path: crates/herdr-core/src/remote.rs, find: 'pub fn route(core: &Core, method: &str, params: &Value) -> Result<Option<(To, Value)>, RpcError> {'}
        runs_on: core-loop
        via: call
        says: 'For terminal.run the "on" param names the place. route removes it and looks the name up: this Core''s own name or id means here, a machine added with `hc machine add` is To::Machine, and a Core that only dialled in is refused. The caller is rewritten to <this Core''s id>/t5 so box can tell whose terminal started the work.'
        fails: 'An unknown name gives machine_unknown with the list of added machines ("no machines yet: hc machine add <ssh-target>" when there are none).'
      - id: run-on-machine-4
        fn: 'remote::forward_waiting'
        module: 'rs:herdr_core::remote'
        at: {path: crates/herdr-core/src/remote.rs, find: 'async fn forward_waiting(core: &Core, m: &Machine, method: &str, mut params: Value) -> Result<Value, RpcError> {'}
        runs_on: core-loop
        via: call
        says: 'Because the run waits, forward picks forward_waiting. It labels the run hc.run=<random hex> so it can be found again if the line drops, and sets one deadline: machine_timeout (default 30 s) plus the template ready time (HC_READY_MS, default 60 s) plus the wait (--timeout, or wait_timeout, default 180 s). forward_once marks die_with_parent for older Cores, then line() waits, up to machine_timeout, while the line is first being dialled.'
        fails: 'A line that needs a login, needs an update or is unreachable fails at once with that reason and a hint such as "in a terminal: hc machine login box".'
      - id: run-on-machine-5
        fn: 'machines::dial'
        module: 'rs:herdr_core::machines'
        at: {path: crates/herdr-core/src/machines.rs, find: 'let options = ["BatchMode=yes", "ConnectTimeout=10", "ServerAliveInterval=15", "ServerAliveCountMax=4"];'}
        runs_on: core-loop
        via: network
        says: 'The line was opened when the Core started. remote::supervise dials again at once after a drop, and after a failed dial waits 250 ms, doubling up to 30 s. dial runs ssh with BatchMode=yes, ConnectTimeout=10, ServerAliveInterval=15 and ServerAliveCountMax=4, -T and the shared login''s control socket if one is up. The remote line is a sh script that finds herdr-core on PATH or in ~/.local/bin and execs `herdr-core connect` (with HC_SESSION for a named session). It writes hello with generation 1, framed: true, this Core''s identity, the name it calls box and its features, and takes the first reply line with id 1 within 20 s, skipping any login banner. A different Core id answering there is refused.'
        carries: 'Dialed {child, stdin, stdout, stderr, hello}'
        fails: 'Exit status 127 or the script''s marker gives hc_missing; a password or code prompt gives needs_login; another generation gives needs_update; anything else is unreachable with ssh''s last error line.'
      - id: run-on-machine-6
        fn: 'cli::connect'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'fn connect(paths: &Paths) -> Result<(), RpcError> {'}
        runs_on: remote
        via: network
        says: 'On box, ssh runs `herdr-core connect`. It connects to box''s Core, starting it if none runs, and pumps bytes between ssh''s pipes and the socket unchanged, exactly as for an app.'
      - id: run-on-machine-7
        fn: 'remote::peer_joined'
        module: 'rs:herdr_core::remote'
        at: {path: crates/herdr-core/src/remote.rs, find: 'pub fn peer_joined(core: &Arc<Core>, conn: &Arc<Conn>, hello: &Value) {'}
        runs_on: remote
        via: rpc
        says: 'Box''s Core answers the hello and switches the connection to frames. Because the hello names a Core, peer_joined records it as a peer in peers.json: its name (or its id if the name is taken there) and what it calls box. Anything kept in that peer''s outbox, such as notes for its terminals, goes out now. From here box can send notes and a few calls (send, get, read, wait) back to the parents of its terminals.'
      - id: run-on-machine-8
        fn: 'Line::call_into'
        module: 'rs:herdr_core::remote'
        at: {path: crates/herdr-core/src/remote.rs, find: 'async fn call_into('}
        runs_on: core-loop
        via: network
        says: 'The call goes out on the open line: a new id (counting from 2), refused if the request is over MAX_PAYLOAD (16 MiB), a oneshot reply slot in pending, and one DATA frame on channel 0 queued for the line''s writer task, which writes it to ssh''s stdin. The call then waits for its reply until the deadline. If the call is given up first (a deadline or the caller gone), it sends $/cancelRequest so box can stop it.'
        carries: 'frame {channel 0, DATA, {"jsonrpc":"2.0","id":7,"method":"terminal.run","params":{argv, cwd, wait, labels {"hc.run"}, caller "<core id>/t5", die_with_parent}}}'
        fails: 'No reply by the deadline gives unavailable, "box didn''t answer within N s".'
      - id: run-on-machine-9
        fn: terminal_run
        module: 'rs:herdr_core::api::run'
        at: {path: crates/herdr-core/src/api/run.rs, find: 'pub(super) async fn terminal_run(core: Ctx<''_>, mut p: RunParams) -> Result<RunResult, RpcError> {'}
        runs_on: remote
        via: rpc
        says: 'On box, read_frames spawns the call; from_peer turns the caller into <peer name>/t5 and route finds nothing left to forward, so terminal_run runs there. It sets PAGER, GIT_PAGER and GH_PAGER to cat so nothing waits for a person, starts cargo test in /srv/app in a new terminal, waits until it is no longer working, exits or the timeout passes, and reads the last 1000 lines (50,000 bytes at most) for the reply.'
        carries: 'RunResult {terminal record with address "t3", wait {reason, exit_code, signal, status}, output}'
      - id: run-on-machine-10
        fn: 'remote::hold'
        module: 'rs:herdr_core::remote'
        at: {path: crates/herdr-core/src/remote.rs, find: 'None => line.take_reply(message),'}
        runs_on: core-loop
        via: network
        says: 'The reply travels back through hc connect and ssh''s stdout. The local Core''s hold loop reads it as DATA on channel 0 without a method, and take_reply hands it to the waiting call by id. hold also keeps box''s terminals mirrored through an events subscription, and gives the line up if box sends nothing for machine_timeout plus the 15-second heartbeat.'
      - id: run-on-machine-11
        fn: 'remote::forward_once'
        module: 'rs:herdr_core::remote'
        at: {path: crates/herdr-core/src/remote.rs, find: 'let reply = if method.starts_with("doc.") { reply } else { localize(core, &m.name, &[], reply) };'}
        runs_on: core-loop
        via: call
        says: 'An unknown_method error from an older hc becomes needs_update with the hint `hc machine update box`. localize rewrites every address field: box''s t3 becomes box/t3, and this Core''s own addresses become bare again. Because the run has a parent here (t5), that terminal records box in afar, so its child there may report back and is ended with it.'
        carries: 'the run record with address "box/t3", wait and output'
      - id: run-on-machine-12
        fn: 'cli::ran'
        module: 'rs:herdr_core::cli'
        at: {path: crates/herdr-core/src/cli.rs, find: 'fn ran(r: &Value) -> Result<Option<Out>, RpcError> {'}
        runs_on: cli
        via: rpc
        says: 'handle writes the reply line on the plain connection. ran prints the output and, when there is more to say, a last line such as "[hc] box/t3 exited (exit 101)" or "still running as box/t3: hc wait box/t3, hc read box/t3". hc exits with the program''s code, 124 if it is still running and 128 plus the signal number if a signal ended it. A reply without wait means an older hc there only started it.'
        carries: 'output on stdout; exit code'
    branches:
      - id: run-on-machine-b1
        name: 'The line drops while the run waits'
        from: run-on-machine-10
        steps:
          - id: run-on-machine-b1-1
            fn: 'remote::hold (end)'
