    why: 'Header: like Ghostty, the system''s language and region in UTF-8 if this machine has that locale, else en_US.UTF-8; zsh in the C locale splits 你 into loose bytes. The doc comment on for_programs: Linux logins set one, so there is nothing to guess there.'
