      - fn: 'releases::fetch'
        path: crates/herdr-core/src/releases.rs
        find: 'pub fn fetch(m: &Manifest, target: &str, scratch: &Path) -> Result<PathBuf, RpcError> {'
        plain: 'Downloads the archive for one target and refuses it if its SHA-256 differs from the list (sha256sum or shasum; Windows'' own crypto on Windows).'
      - fn: 'releases::curl'
        path: crates/herdr-core/src/releases.rs
        find: 'fn curl(url: &str, to: &Path) -> Result<(), RpcError> {'
        plain: 'curl -fsL with 2 retries and a 10 s connect timeout. Its stderr is silenced so that a piped error stays one JSON line.'
      - fn: 'releases::this_target'
        path: crates/herdr-core/src/releases.rs
        find: 'pub fn this_target() -> String {'
        plain: 'This machine as release targets name it: linux-x86_64, macos-aarch64, windows-x86_64.'
    why: 'Header: curl, sha256sum/shasum and tar do the work: no HTTP or crypto code in hc for something run this rarely. docs/security.md: this trusts the release service and HTTPS; the checksum is not an independently signed manifest.'
    inferred: false
    note: 'Used by hc update and by machines::install, both in the short-lived hc process. hc never checks for updates on its own (comment in cli::run''s Update arm).'
  - id: 'rs:herdr_core::platform'
