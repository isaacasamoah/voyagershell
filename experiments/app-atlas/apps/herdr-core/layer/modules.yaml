    key:
      - fn: 'Holder::serve'
        path: crates/herdr-core/src/holder.rs
        find: 'fn serve(self: &Arc<Self>, mut stream: Stream) -> io::Result<()> {'
        plain: 'A Core says HELLO. Any earlier Core now counts as crashed, and the Holder answers with WELCOME (instance, pid, build, how the previous Core left, its terminals) and one TAIL frame per terminal.'
      - fn: 'Holder::commands'
        path: crates/herdr-core/src/holder.rs
        find: 'fn commands(self: &Arc<Self>, stream: &mut Stream, generation: u64) -> io::Result<()> {'
        plain: 'Handles SPAWN, INPUT, RESIZE, SIGNAL, FOREGROUND, RELEASE, DRAIN and GOODBYE. A handover goodbye clears the tails and sends BYE; a shutdown goodbye kills remaining programs, sends BYE and exits.'
      - fn: 'Holder::spawn'
        path: crates/herdr-core/src/holder.rs
        find: 'fn spawn(self: &Arc<Self>, id: u32, spec: proto::Spawn) {'
        plain: 'Starts the program in a new PTY through platform::spawn_pty, with an input writer thread, a pump thread and a reap thread, and answers SPAWNED or SPAWN_FAILED.'
      - fn: 'Holder::pump'
        path: crates/herdr-core/src/holder.rs
        find: 'fn pump(&self, id: u32, mut reader: impl Read) {'
        plain: 'Reads output whether or not a Core is connected, so programs never stall on a full PTY; keeps the tail and forwards OUTPUT. When more than 8 MiB (BACKLOG_BYTES) waits for a slow Core, it stops reading that program until the Core catches up.'
      - fn: 'Holder::reap'
        path: crates/herdr-core/src/holder.rs
        find: 'fn reap(self: &Arc<Self>, id: u32, mut child: Process) {'
        plain: 'Waits for the program to exit, lets its last output drain (up to 200 ms), then sends EXITED.'
      - fn: 'Holder::supervise'
