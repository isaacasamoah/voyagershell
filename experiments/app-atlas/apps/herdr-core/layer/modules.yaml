  - id: 'rs:herdr_core::holder'
    container: 'part:holder'
    feature: terminals
    plain: 'The Holder process: owns every pseudo-terminal, is the parent of every program and always reads their output, keeping the last megabyte of each. It spawns, pumps, resizes, signals and reaps, with no parsing and no policy.'
    holds: 'Per terminal: pid, PTY, an input queue with its writer thread, size, a 1 MiB output tail (TAIL_BYTES), exit status and drain state. For the connected Core: a generation number, a frame queue with its own writer thread and the backlog size. Also how the last Core left (none, handover or crash) and recent Core restarts.'
