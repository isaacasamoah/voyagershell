  - id: 'rs:herdr_core::platform::unix'
    container: 'part:platform'
    feature: platform
    plain: 'Linux and macOS: Unix sockets, pseudo-terminals, process groups, termios and file permissions.'
    holds: 'Little between calls. Pty holds a terminal''s master side and a socket pair used to cancel blocked reads.'
    entry:
      fn: 'unix::spawn_pty'
      path: crates/herdr-core/src/platform/unix.rs
      find: 'pub fn spawn_pty('
      plain: 'Called by the Holder for each new terminal. openpty at the given size, both ends close-on-exec, master non-blocking. The program starts with a cleared environment plus the given env, in the given folder, with stdin, stdout and stderr on the terminal; before exec it calls setsid and takes the terminal as its controlling terminal.'
    key:
      - fn: 'unix::PtyIo (Read)'
        path: crates/herdr-core/src/platform/unix.rs
