  - id: 'rs:herdr_core::machines'
    container: 'part:machines'
    feature: machines
    plain: 'Other machines: the saved profile of each, how ssh (or a custom --via command) reaches it, the pipe that runs herdr-core connect there, and copying hc there.'
    holds: 'The Machine profile (name, target, via, temporary, session, id, host, version), saved in machines.json, and a process-wide list of targets found to be Windows (WINDOWS).'
    entry:
      fn: 'machines::dial'
      path: crates/herdr-core/src/machines.rs
      find: 'pub async fn dial('
      plain: 'Starts the pipe, sends hello with the protocol generation, and skips banner lines until the reply with id 1, for up to 20 s. Failures become hc_missing, needs_login, incompatible or unreachable. If a Unix-style dial fails in a way that could mean Windows, it tries once more with a cmd line.'
    key:
      - fn: 'machines::pipe'
        path: crates/herdr-core/src/machines.rs
        find: 'fn pipe(paths: &crate::paths::Paths, to: Reach, session: Option<&str>, windows: bool) -> tokio::process::Command {'
        plain: 'The command for the line: a shell line there that finds herdr-core (on PATH, else ~/.local/bin) and runs connect, with BatchMode=yes so it never prompts, ConnectTimeout=10, ServerAliveInterval=15 and ServerAliveCountMax=4. The child is killed when dropped.'
      - fn: 'machines::ssh'
        path: crates/herdr-core/src/machines.rs
        find: 'fn ssh(paths: &crate::paths::Paths, target: &str, extra: &[&str]) -> std::process::Command {'
        plain: 'ssh riding a shared login (a ControlPath beside the socket). Only login creates that login (ControlMaster=auto); everything else uses ControlMaster=no. HC_SSH replaces ssh in tests.'
      - fn: 'machines::login'
        path: crates/herdr-core/src/machines.rs
        find: 'pub fn login(paths: &crate::paths::Paths, to: Reach) -> Result<(), RpcError> {'
        plain: 'Runs in the hc command, in a terminal: ssh with BatchMode=no and ControlPersist=600 runs exit, so a person can type a password or code. The login stays up for 10 minutes after its last use, for the Core''s connections. Nothing to do on Windows or for --via.'
      - fn: 'machines::install'
        path: crates/herdr-core/src/machines.rs
        find: 'pub fn install(paths: &crate::paths::Paths, to: Reach, session: Option<&str>) -> Result<String, RpcError> {'
        plain: 'Runs uname -sm there. Same OS and CPU: copies this very hc; otherwise this version''s release for that platform. Streams it over stdin into ~/.local/bin, checks its size and that it runs, swaps it in, adds hc if missing, and runs herdr-core server restart there. Windows goes through install_windows (scp and install.ps1).'
      - fn: 'machines::check_target'
        path: crates/herdr-core/src/machines.rs
        find: 'pub fn check_target(to: Reach) -> Result<(), RpcError> {'
        plain: 'An ssh target must be one argument: not empty, not starting with -, no spaces or control characters. A --via command must be one line, and is refused on Windows.'
      - fn: 'machines::default_name'
        path: crates/herdr-core/src/machines.rs
        find: 'pub fn default_name(target: &str, taken: impl Fn(&str) -> bool) -> Option<String> {'
        plain: 'A free name from the target''s host: can@rohan.lan becomes rohan, an IP address stays whole, and a taken name gets -2, -3 and so on.'
    why: 'docs/machines.md: run a program on another machine and come back to it from here; the other machine needs only hc. The comment on control_path: one login per target, shared, so a person logs in once and the Core''s connections ride that login.'
    inferred: false
    note: 'Runs in two processes: login and install in the hc command (cli::machine), dial and hello in the Core (remote::supervise and the machine.add handler).'
  - id: 'rs:herdr_core::remote'
    container: 'part:machines'
    feature: machines
    plain: 'The Core''s lines to other machines. It keeps one framed connection open to each added machine, sends calls that name box/... over it, mirrors that machine''s terminals into the local list, and handles cores that dialed in (peers) whose agents started work here.'
    holds: 'In the Core''s State, per machine: a LineState (connecting, connected, needs login, needs update, unreachable); the open Line with pending calls by id, stream channels relayed to viewers here and the mirror subscription; the mirror of its terminals; and an outbox. Also the peers, saved in peers.json, with their lines.'
    entry:
      fn: 'remote::start_all'
      path: crates/herdr-core/src/remote.rs
      find: 'pub fn start_all(core: &Arc<Core>) {'
      plain: 'Called once by server::serve. Runs keep_up for every saved machine; keep_up spawns supervise, which dials, holds the line, and dials again after a drop, backing off from 250 ms to 30 s.'
    key:
      - fn: 'remote::supervise'
        path: crates/herdr-core/src/remote.rs
        find: 'async fn supervise(core: Arc<Core>, id: String) {'
        plain: 'The loop for one machine: machines::dial with hello {framed, core, calls_you, features}. A different core answering counts as down; needs_login and incompatible get their own states. After a drop it dials again at once, since most drops are a restart there.'
      - fn: 'remote::hold'
        path: crates/herdr-core/src/remote.rs
        find: 'async fn hold(core: &Arc<Core>, m: &Machine, mut d: crate::machines::Dialed) {'
        plain: 'Serves one open line: sends the outbox, reattaches waiting viewers, subscribes to the machine''s events to keep its mirror, and reads frames until the line closes or stays silent longer than machine_timeout plus the heartbeat. Then pending calls fail at once and viewers see "[line to box lost; reconnecting...]".'
      - fn: 'remote::route'
        path: crates/herdr-core/src/remote.rs
        find: 'pub fn route(core: &Core, method: &str, params: &Value) -> Result<Option<(To, Value)>, RpcError> {'
        plain: 'Decides where a call goes: here, a machine (named by on, or by a box/ prefix on terminal), or a peer. Peers may only be sent send, get, read and wait. The caller travels as <this core''s id>/<caller>.'
      - fn: 'remote::forward'
        path: crates/herdr-core/src/remote.rs
        find: 'pub async fn forward(core: &Core, m: &Machine, method: &str, params: Value) -> Result<Value, RpcError> {'
        plain: 'Sends a call there and rewrites addresses in the reply (t7 becomes box/t7). A wait, or a waited run or send, survives a dropped line: forward_waiting finds the run again by its hc.run label and waits again until its own deadline.'
      - fn: 'remote::Line::call_into'
        path: crates/herdr-core/src/remote.rs
        find: 'async fn call_into('
        plain: 'Gives the call the next id, refuses one bigger than wire::MAX_PAYLOAD, sends it on channel 0 and waits until its deadline. A call given up before its reply sends $/cancelRequest so the other side can stop it.'
      - fn: 'remote::from_machine'
        path: crates/herdr-core/src/remote.rs
        find: 'async fn from_machine(core: Arc<Core>, m: Machine, line: Arc<Line>, message: Value) {'
        plain: 'Calls and notes coming back from a machine we dialed. They reach only terminals here that started work there (their afar set), and only send, get, read and wait; adding a machine gives it no say over the rest.'
    why: 'Header: the core keeps one framed connection open to each machine it added, and calls naming machine/... go over it; a core that dialed in may have parents of terminals here. docs/machines.md: your local core keeps the connection and combines terminal lists and events; the remote core owns its programs.'
    inferred: false
  - id: 'rs:herdr_core::remote::viewers'
    container: 'part:machines'
    feature: machines
    plain: 'Viewers here watching a terminal on another machine. The stream channel there is relayed to a new channel on the viewer''s connection, both ways, and attached again when a dropped line comes back.'
    holds: 'Relayed, one per relayed viewer in the Core''s State.relayed: the line, the channel there, the viewer''s connection, the machine id, and the attach params kept current with resizes and display facts.'
    entry:
      fn: 'remote::viewers::attach'
      path: crates/herdr-core/src/remote/viewers.rs
      find: 'pub async fn attach(core: &Core, conn: &Arc<Conn>, m: &Machine, mut params: Value) -> Result<Value, RpcError> {'
      plain: 'Called from server.rs for terminal.attach on box/t3. Opens a paused channel here, sends terminal.attach there with that channel as the sink so output flows from its first byte, records a Relayed, and returns the reply with the local channel number.'
    key:
      - fn: 'remote::viewers::relay_in'
        path: crates/herdr-core/src/remote/viewers.rs
        find: 'pub fn relay_in(core: &Core, conn: &Arc<Conn>, here: u32, kind: u8, payload: &[u8]) -> bool {'
        plain: 'A frame from the viewer on a relayed stream: remembers resizes and display facts for a later reattach, passes credit to the local stream, and sends the frame there. While the line is down it goes nowhere: typing into the gap is lost, not queued.'
      - fn: 'remote::viewers::reattach'
        path: crates/herdr-core/src/remote/viewers.rs
        find: 'pub(super) async fn reattach(core: Arc<Core>, m: Machine, line: Arc<Line>) {'
        plain: 'When a line comes back, attaches each waiting viewer again on the same local channel with history 0 and resumed true: the screen is painted again, and the viewer already has its history.'
      - fn: 'remote::viewers::negotiate_resize'
        path: crates/herdr-core/src/remote/viewers.rs
        find: 'pub(super) fn negotiate_resize(line: &Line, params: &mut Value) {'
        plain: 'Asks for resize notifications only if the other core''s hello lists that feature. An opted-in stream that loses it on the way is refused with "resize notifications lost".'
      - fn: 'remote::viewers::conn_gone'
        path: crates/herdr-core/src/remote/viewers.rs
        find: 'pub fn conn_gone(core: &Core, conn: &Arc<Conn>) {'
        plain: 'When a viewer''s connection closes, closes each of its relayed streams there.'
    why: 'Doc comment on Relayed: a viewer here on a terminal there outlives a dropped line; when the line is back, it is attached again on the same channel here. Header: viewer streams relayed to other cores, including reattachment.'
    inferred: false
  - id: 'rs:herdr_core::releases'
    container: 'part:cli'
    feature: lifecycle
    plain: 'Released builds on releases.herdr.dev: fetches the release list (latest.json, or one version''s manifest.json), downloads a build with curl, checks its SHA-256 against the list, and unpacks it with tar.'
