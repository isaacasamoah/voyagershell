schema: app-atlas/v0
note: 'Plain descriptions of each Herdr Core module: what it holds, where it starts and why. Module ids come from the generated architecture YAML.'
modules:
  - id: 'bin:herdr-core'
    container: 'part:cli'
    feature: cli
    plain: 'The herdr-core executable that installers also link as hc. Its main function is one line: it runs cli::main and exits with the number that returns.'
    holds: 'nothing: one function.'
    entry: {fn: main, path: crates/herdr-core/src/main.rs, find: 'fn main() {', plain: 'The process starts here, whether a person typed hc, the Core was started in the background, or the Core started a Holder.'}
    key:
      - fn: 'herdr_core::cli::main'
        path: crates/herdr-core/src/main.rs
        find: 'std::process::exit(herdr_core::cli::main());'
        plain: 'The hand-off. cli::main decides whether this process is a command, the Core daemon (serve) or the Holder (hold), and its return value becomes the exit code.'
    why: 'One executable is the command, the daemon and the holder, so an install or an update replaces one file. AGENTS.md asks for fewer files and fewer dependencies.'
    inferred: true
    note: 'The hc name is a link beside herdr-core: machines::install adds it with ln -s when hc is missing, and macos_bundle::install repoints it.'
  - id: 'rs:herdr_core'
    container: 'part:cli'
    feature: cli
    plain: 'The crate root. It only declares the crate''s 37 modules; all but kept and restart are public.'
    holds: 'nothing: declarations only.'
    entry: {fn: 'herdr_core::cli', path: crates/herdr-core/src/lib.rs, find: 'pub mod cli;', plain: 'The module main.rs calls into. Every process, whether command, Core or Holder, starts in cli::main.'}
    key:
      - {fn: 'herdr_core::platform', path: crates/herdr-core/src/lib.rs, find: 'pub mod platform;', plain: 'The operating-system layer. Shared modules are meant to reach the OS only through it.'}
      - {fn: 'herdr_core::kept', path: crates/herdr-core/src/lib.rs, find: 'mod kept;', plain: 'Private: lost kept terminals waiting for their replacement shell, used only inside the Core.'}
      - {fn: 'herdr_core::restart', path: crates/herdr-core/src/lib.rs, find: 'mod restart;', plain: 'Private: the short-lived handoff file for a requested restart, used by the Core and by hc server stop.'}
      - fn: 'herdr_core::wire'
        path: crates/herdr-core/src/lib.rs
        find: 'pub mod wire;'
        plain: 'Public like most modules. The integration tests in crates/herdr-core/tests import wire, platform, client, api and holder_proto directly.'
    why: 'There is no separate library for outside users. The modules are public so the one binary and the integration tests can both use them.'
    inferred: true
    note: 'The container is a judgement call: lib.rs runs no code. It sits with the command line because main.rs enters the crate through cli.'
  - id: 'rs:herdr_core::cli'
    container: 'part:cli'
    feature: cli
    plain: 'The hc command line. It parses arguments with clap, turns each command into one API request, sends it to the session''s Core and prints the result: a table or sentence for a person, JSON when piped or asked with --json. The same code starts the Core (hc serve) and the Holder (hc hold).'
    holds: 'The Cli, Cmd and ServerCmd argument types, the help.txt and SKILL.md texts built into the binary, and the COMMANDS table that maps each command to its API method. Nothing survives between runs.'
    entry:
      fn: 'cli::main'
      path: crates/herdr-core/src/cli.rs
      find: 'pub fn main() -> i32 {'
      plain: 'Asks platform::daemon_startup whether a macOS launchd start made this process the Core, remembers the binary''s path, and answers --help, --skill and --licenses itself. Then it parses with clap, decides JSON output from --json, a template''s trailing flags or a piped stdout, calls run and returns the exit code.'
    key:
      - fn: 'cli::run'
        path: crates/herdr-core/src/cli.rs
        find: 'fn run(cmd: Option<Cmd>, json: bool, asked: bool) -> Result<Option<Out>, RpcError> {'
        plain: 'One arm per command. Most fill the API params (caller, cwd from here, identity_env) and make one call. Serve runs server::serve, Hold runs holder::run, Attach hands over to attach::run, and Update, Machine and File go to their own modules. No command at all means bare: a picker in a terminal, an overview when piped.'
      - fn: 'cli::call'
        path: crates/herdr-core/src/cli.rs
        find: 'fn call(paths: &Paths, method: &str, params: Value) -> Result<Value, RpcError> {'
        plain: 'Connects with client::connect_or_start, which starts the Core if nobody is listening, makes one plain JSON-RPC call, and turns a cut-off connection into a clearer message with client::explain_closed.'
      - fn: 'cli::target'
        path: crates/herdr-core/src/cli.rs
        find: 'fn target(paths: &Paths, given: Option<String>, json: bool, finished: bool) -> Result<String, RpcError> {'
        plain: 'When a command needs a terminal and none was named: the fuzzy picker in an interactive terminal, else a needs_target error that lists the live terminals (or, for rm, the finished ones).'
      - fn: 'cli::flags_after_task'
        path: crates/herdr-core/src/cli.rs
        find: 'fn flags_after_task(paths: &Paths, p: RunParams) -> Result<(RunParams, bool), RpcError> {'
        plain: 'For hc run reviewer "task" --name x: flags written after a template''s task belong to hc, not to the task. trailing_flags parses them on their own and the two sets of flags are merged.'
      - fn: 'cli::ran'
        path: crates/herdr-core/src/cli.rs
        find: 'fn ran(r: &Value) -> Result<Option<Out>, RpcError> {'
        plain: 'A waited hc run prints the program''s output and exits with its exit code: 124 when the wait ran out with the program still running, 128 plus the signal number when a signal ended it.'
      - fn: 'cli::connect'
        path: crates/herdr-core/src/cli.rs
        find: 'fn connect(paths: &Paths) -> Result<(), RpcError> {'
        plain: 'hc connect copies bytes between stdin/stdout and the Core''s socket unchanged, plain or framed. Apps and other machines reach a Core this way, often through ssh.'
    why: 'AGENTS.md: one API; the CLI is one call per command. The params types in api/types.rs are also the clap arguments, so a command line and an API request are the same struct; the test a_command_line_becomes_the_api_request checks it.'
    inferred: false
    note: 'The test every_api_method_has_a_command_or_is_api_only fails when an API method has no command and is not listed in API_ONLY (hello, doc.get, doc.set). On Linux and macOS, hc server status also starts a Core when none is running, because unix::status_may_start_core returns true.'
  - id: 'rs:herdr_core::cli::file'
    container: 'part:cli'
    feature: files
    plain: 'hc file read, hc file write and hc file edit: read, replace or edit a text file here or, with --on, on another machine, each as one API call.'
    holds: 'The FileCmd subcommand type. Nothing else.'
    entry:
      fn: 'cli::file::file'
      path: crates/herdr-core/src/cli/file.rs
      find: 'pub(super) fn file('
      plain: 'Called from cli::run for hc file. Each arm resolves the folder, makes one call (file.read, file.write or file.edit) and prints the result.'
    key:
      - fn: 'cli::file::here_unless_on'
        path: crates/herdr-core/src/cli/file.rs
        find: 'fn here_unless_on(at: &mut FileAt) {'
        plain: 'A relative path here starts in the folder where hc runs, not where the Core runs. On another machine the path is sent as given.'
      - fn: 'cli::file::piped'
        path: crates/herdr-core/src/cli/file.rs
        find: 'pub(super) fn piped(max: usize) -> Result<Vec<u8>, RpcError> {'
        plain: 'Reads what is piped into hc, refusing a terminal on stdin and anything over max bytes (files::MAX_BYTES for write). hc exec -i uses it too, with exec::MAX_STDIN.'
      - fn: 'cli::file::file (edit arm)'
        path: crates/herdr-core/src/cli/file.rs
        find: 'p.edits = p.old.drain(..).zip(p.new.drain(..)).map(|(old, new)| Edit { old, new }).collect();'
        plain: 'Pairs each --old with its --new. An unequal count is a usage error before anything is sent.'
      - fn: 'cli::file::file (read arm)'
        path: crates/herdr-core/src/cli/file.rs
        find: 'eprintln!("[hc] lines {}-{} of {}", r["first"], r["last"], r["lines"]);'
        plain: 'The file''s text goes to stdout as it is, even when piped. When only part of the file was read, one line on stderr says which lines.'
    why: 'docs/machines.md: use file for remote reads and exact edits; edit needs the old text exactly once, and all pairs succeed or none do. It is split out of cli.rs, in line with the AGENTS.md limit of about 32 KB per source file.'
    inferred: true
  - id: 'rs:herdr_core::cli::machine'
    container: 'part:cli'
    feature: machines
    plain: 'hc machine add, ls, login, update, rename and rm. Most are one API call to the Core. Logging in and copying hc to the other machine run in this process instead, because ssh may need a person to type a password or answer a question.'
    holds: 'The MachineCmd subcommand type. Nothing else.'
    entry:
      fn: 'cli::machine::machine'
      path: crates/herdr-core/src/cli/machine.rs
      find: 'pub(super) fn machine('
      plain: 'Called from cli::run for hc machine. Each arm calls machine.add, machine.list, machine.connect, machine.rename or machine.rm, plus machines::login and machines::install where a person may be needed.'
    key:
      - fn: 'cli::machine::machine (add arm)'
        path: crates/herdr-core/src/cli/machine.rs
        find: 'MachineCmd::Add(p) => {'
        plain: 'In a terminal, logs in first with machines::login so the Core can ride that ssh login. If machine.add fails with hc_missing or incompatible, asks [Y/n] (or skips the question with --install), copies this hc there with machines::install, and calls machine.add again.'
      - fn: 'cli::machine::at_terminal'
        path: crates/herdr-core/src/cli/machine.rs
        find: 'fn at_terminal() -> bool {'
        plain: 'A person is present only when stdin and stderr are both terminals. Only then can ssh ask for a password, a code or a host key.'
      - fn: 'cli::machine::machine (login arm)'
        path: crates/herdr-core/src/cli/machine.rs
        find: 'MachineCmd::Login(p) => {'
        plain: 'Refuses without a terminal, finds the machine in machine.list, runs machines::login, then asks the Core to dial again with machine.connect.'
      - fn: 'cli::machine::machine (update arm)'
        path: crates/herdr-core/src/cli/machine.rs
        find: 'MachineCmd::Update(p) => {'
        plain: 'Looks the machine up with machine.list, then runs machines::install from this process. hc restarts there and its terminals keep running.'
    why: 'docs/machines.md: SSH passwords, codes and host-key prompts need a person at a terminal. The machines.rs comment on ssh: one login per target, shared, so a person logs in once in a terminal and the Core''s connections ride that login.'
    inferred: false
    note: 'The container is a judgement call: concepts.yaml lists the hc machine commands under Other machines, but this code runs in the short-lived hc process.'
  - id: 'rs:herdr_core::cli::output'
    container: 'part:cli'
    feature: cli
    plain: 'How results look to a person: the status word and its coloured dot, the hc ls table and picker rows with children under their parent, one-line summaries of terminals and waits, and how hc exec hands back output and exit code.'
    holds: 'nothing: functions only.'
    entry:
      fn: 'cli::output::table'
      path: crates/herdr-core/src/cli/output.rs
      find: 'pub(super) fn table(r: &Value) -> String {'
      plain: 'Builds the hc ls table from a terminal.list reply: rows from items, laid out by picker::table at the window width, then machines that are not connected, then how many finished terminals are hidden.'
    key:
      - fn: 'cli::output::status'
        path: crates/herdr-core/src/cli/output.rs
        find: 'pub(super) fn status(t: &Value) -> (String, &''static str) {'
        plain: 'The program''s own status word (working, blocked, error, done, idle) with a coloured dot; running when it reports none; exit code or signal once it has ended.'
      - fn: 'cli::output::orders'
        path: crates/herdr-core/src/cli/output.rs
        find: 'pub(super) fn orders(terminals: &[Value]) -> Vec<(&''static str, Vec<Value>)> {'
        plain: 'The three orders the picker cycles with Tab: latest status change first; what needs you first (blocked and error, then working, then done and idle); and by name.'
      - fn: 'cli::output::items'
        path: crates/herdr-core/src/cli/output.rs
        find: 'pub(super) fn items(terminals: &[Value], header: bool) -> Vec<picker::Item> {'
        plain: 'One picker::Item per terminal: dot, address, then name, agent, template and where (or folder) lined up, status last. Its parent is set so children draw under it.'
      - fn: 'cli::output::short'
        path: crates/herdr-core/src/cli/output.rs
        find: 'pub(super) fn short(t: &Value) -> Value {'
        plain: 'The JSON a command prints for a terminal: only the facts an agent acts on, such as address, name, state, status, agent and where. hc get keeps the full record.'
      - fn: 'cli::output::describe_wait'
        path: crates/herdr-core/src/cli/output.rs
        find: 'pub(super) fn describe_wait(r: &Value) -> String {'
        plain: 'Turns a terminal.wait reply into sentences: exited, still running, printed it, a message arrived (already in your input), or no children are working.'
      - fn: 'cli::output::exec_out'
        path: crates/herdr-core/src/cli/output.rs
        find: 'pub(super) fn exec_out(r: &Value) -> ! {'
        plain: 'Writes an exec''s stdout and stderr bytes exactly as the program wrote them, notes truncation (8 MB of stdout, 1 MB of stderr) or a timeout, and exits with the program''s code (124 for a timeout, 128 plus the signal).'
    why: 'The cli.rs header: tables for people, JSON when piped or --json. Keeping the formatting apart keeps cli.rs under the file size AGENTS.md asks for.'
    inferred: true
  - id: 'rs:herdr_core::cli::update'
    container: 'part:cli'
    feature: lifecycle
    plain: 'hc update: swaps the hc binary for another build (a download, or --from a file) and restarts the Core the planned way, so running terminals keep running.'
    holds: 'nothing: functions only.'
    entry:
      fn: 'cli::update::update'
      path: crates/herdr-core/src/cli/update.rs
      find: 'pub(super) fn update(paths: &Paths, from: &std::path::Path, force: bool) -> Result<Out, RpcError> {'
      plain: 'Refuses when a package manager owns the binary (Homebrew, Nix, mise, or a folder you cannot write) and when the new build is older (unless --force). Swaps it in with platform::swap_in, asks a running Core for server.restart, waits for its connection to close, then calls server.status.'
    key:
      - fn: 'cli::update::version_of'
        path: crates/herdr-core/src/cli/update.rs
        find: 'pub(super) fn version_of(path: &std::path::Path) -> Option<String> {'
        plain: 'Runs the candidate with --version. Only a successful run that prints "hc ..." counts as a working hc.'
      - fn: 'cli::update::older'
        path: crates/herdr-core/src/cli/update.rs
        find: 'pub(super) fn older(a: &str, b: &str) -> bool {'
        plain: 'Compares "hc X.Y.Z" versions as numbers. Anything it cannot read is never older.'
      - fn: 'cli::update::up_to_date'
        path: crates/herdr-core/src/cli/update.rs
        find: 'pub(super) fn up_to_date(paths: &Paths, release: &str, human: String) -> Result<Out, RpcError> {'
        plain: 'When the binary is already current, still restarts a running Core that is older, one started before the file was replaced. It never starts a Core just to check.'
      - fn: 'cli::update::release_version'
        path: crates/herdr-core/src/cli/update.rs
        find: 'pub(super) fn release_version(s: &str) -> Result<String, String> {'
        plain: 'Checks that --version is exactly three numbers, since it goes into a download URL.'
      - fn: 'platform::swap_in (call)'
        path: crates/herdr-core/src/cli/update.rs
        find: 'crate::platform::swap_in(from, &dest, |staged| version_of(staged).as_deref() == Some(now.as_str())).map_err('
        plain: 'The staged copy must report the same version before it replaces the old file: never a half-written hc.'
    why: 'The doc comment on update: swaps the binary, then restarts the core the planned way so every terminal keeps running; one swap path, for people and for apps that bundle hc.'
    inferred: false
    note: 'The download and the protocol-generation check happen earlier, in cli::run''s Update arm (releases::manifest, then releases::download). When no Core was running, the final server.status goes through connect_or_start and starts one.'
  - id: 'rs:herdr_core::client'
    container: 'part:cli'
    feature: lifecycle
    plain: 'How a short-lived process reaches the Core: connect to the session socket, start the Core if nobody is listening, make one JSON-RPC call and read one reply line. It also starts the Core and the Holder detached, and names which build is running.'
    holds: 'Two values set once per process: EXE, the binary''s path remembered at startup, and the build id. It keeps no connections.'
    entry:
      fn: 'client::connect_or_start'
      path: crates/herdr-core/src/client.rs
      find: 'pub fn connect_or_start(paths: &Paths) -> Result<Stream, RpcError> {'
      plain: 'Connects to paths.socket. If nobody listens, it checks that the Core is not listening on another socket (core.lock names the real one), asks platform::may_autostart, runs spawn_core and polls the socket for up to START_WAIT.'
    key:
      - fn: 'client::call'
        path: crates/herdr-core/src/client.rs
        find: 'pub fn call(stream: &Stream, method: &str, params: Value) -> Result<Value, RpcError> {'
        plain: 'Writes one request with id 1 and a newline, reads one line back, and returns the result or the Core''s error. An empty read means the Core closed the connection.'
      - fn: 'client::spawn_detached'
        path: crates/herdr-core/src/client.rs
        find: 'pub fn spawn_detached(paths: &Paths, args: &[&str], log: &str) -> std::io::Result<()> {'
        plain: 'Starts herdr-core serve or hold on its own, logging to the state folder: as a systemd user service on Linux, through a launchd job for serve on macOS, else detached by the platform. It drops the sweep variable, so ending the terminal that ran hc cannot end the Core or Holder.'
      - fn: 'client::wait_for_socket'
        path: crates/herdr-core/src/client.rs
        find: 'pub fn wait_for_socket(path: &std::path::Path, what: &str) -> Result<Stream, String> {'
        plain: 'Retries every 10 ms for up to START_WAIT (15 s). A busy machine, or one right after an update, can need well over 5 s.'
      - fn: 'client::explain_closed'
        path: crates/herdr-core/src/client.rs
        find: 'pub fn explain_closed(paths: &Paths, err: RpcError) -> RpcError {'
        plain: 'When the Core cut a call off, waits up to 10 s for a Core to answer again. If one does, it was a restart (usually an update) and the command can simply run again; if not, the Core stopped.'
      - fn: 'client::build_id'
        path: crates/herdr-core/src/client.rs
        find: 'pub fn build_id() -> String {'
        plain: 'Names the running build: the GNU build id from the ELF file on Linux, else the file''s identity. Taken at startup, so an update that swaps the file later does not change it.'
      - fn: 'client::terminal_id'
        path: crates/herdr-core/src/client.rs
        find: 'pub fn terminal_id() -> Option<String> {'
        plain: 'HC_TERMINAL_ID, the hc terminal this process runs in, but only when HC_TERMINAL_SOCKET points at the same Core. The id means nothing to another session.'
    why: 'Header: talking to the core from a short-lived process: connect, autostart, one call. docs/security.md: the CLI starts a background core when it needs one.'
    inferred: false
    note: 'The Core also calls spawn_detached to start the Holder (runtime.rs), but the module is written for the short-lived side. call builds a fresh BufReader for each reply, so bytes after the reply''s newline that arrive in the same read are dropped; hc events reads notifications on the same stream after such a call.'
  - id: 'rs:herdr_core::attach'
    container: 'part:cli'
    feature: screens
    plain: 'hc attach: puts your terminal on a Core terminal. Raw bytes go both ways over a framed connection; the only key it looks at is the detach chord, Ctrl+\ by default.'
    holds: 'For one attach: the outer terminal''s display facts (colours, cell size), raw mode, the stream channel, and a done flag and ending shared with its output thread.'
    entry:
      fn: 'attach::run'
      path: crates/herdr-core/src/attach.rs
      find: 'pub fn run(paths: &Paths, terminal: &str, observe: bool, history: usize) -> Result<String, RpcError> {'
      plain: 'Reads detach_key from the config, enters raw mode and asks the outer terminal for its colours and cell size (up to 500 ms). Connects, says hello with framed true, then sends terminal.attach on channel 0 with the window size and display facts. One thread copies output to the screen; the main loop sends keys, focus, resizes and display changes until you detach, the window closes or the stream ends. It writes RESET and returns a one-line message.'
    key:
      - fn: 'attach::find_detach'
        path: crates/herdr-core/src/attach.rs
        find: 'fn find_detach(input: &[u8], key: DetachKey) -> Option<usize> {'
        plain: 'Finds the detach chord as a control byte, a kitty keyboard sequence or a modifyOtherKeys sequence, so it works whatever key mode the program turned on.'
      - fn: 'attach::incomplete_tail'
        path: crates/herdr-core/src/attach.rs
        find: 'pub(crate) fn incomplete_tail(input: &[u8]) -> usize {'
        plain: 'Where an escape sequence cut off at the end of a read starts. The rest waits up to 50 ms (tmux''s escape-time); after that a lone Esc is just Esc. The picker uses it too.'
      - fn: 'attach::take_replies'
        path: crates/herdr-core/src/attach.rs
        find: 'fn take_replies(input: &[u8], facts: &mut Display) -> (Vec<u8>, bool) {'
        plain: 'Takes the outer terminal''s answers (OSC 10, 11 and 12 colours, cell size, DA1) out of typed input, so they update the display facts sent to the Core instead of reaching the program.'
      - fn: 'attach::shown'
        path: crates/herdr-core/src/attach.rs
        find: 'fn shown(payload: &[u8]) -> std::borrow::Cow<''_, [u8]> {'
        plain: 'Filters output on its way to your screen: drops ConPTY''s request for win32-input-mode, and turns focus reports back on wherever the program turned them off, because attach uses focus to pick the active viewer.'
      - fn: 'attach::RESET'
        path: crates/herdr-core/src/attach.rs
        find: 'const RESET: &[u8] = '
        plain: 'Written on the way out: undoes what the program may have changed in your terminal (synchronized output, kitty key flags on both screens, modes, scroll region, cursor, colours), keeping the cursor where the program left it.'
      - fn: 'attach::run (credit)'
        path: crates/herdr-core/src/attach.rs
        find: 'send(channel, wire::CREDIT, &(payload.len() as u32).to_le_bytes());'
        plain: 'After each output frame is written, sends credit for its size back to the Core: the flow control that lets the Core send more.'
    why: 'Header: raw bytes both ways; the only key we look at is the detach chord. README: hc attach web takes over, Ctrl+\ detaches, and closing your viewer does not end the program.'
    inferred: false
    note: 'It speaks framed mode itself instead of using client::call. Keys typed during the 500 ms display query are kept and sent once attached.'
  - id: 'rs:herdr_core::picker'
    container: 'part:cli'
    feature: cli
    plain: 'A small full-screen fuzzy picker for commands run in a terminal without a target, and for bare hc. It also holds the tree layout hc ls shares with it.'
    holds: 'The Item row type. While open: the query, the selection, the scroll position, which folded parents are open, and the last screen drawn.'
    entry:
      fn: 'picker::pick'
      path: crates/herdr-core/src/picker.rs
      find: 'pub fn pick(title: &str, orders: &[(&str, Vec<Item>)]) -> Option<String> {'
      plain: 'Enters raw mode and the alternate screen, then loops: filter, lay out, draw only when the screen changed, read keys. Enter returns the chosen value (or opens a folded "N more" row), Tab moves to the next order, Esc or Ctrl+C returns None.'
    key:
      - fn: 'picker::layout'
        path: crates/herdr-core/src/picker.rs
        find: 'fn layout(items: &[Item], shown: &[usize], fold: Option<&HashSet<usize>>) -> Vec<(Row, String)> {'
        plain: 'Puts each child right under its parent with tree guides. A parent with more than FOLD (3) children shows FOLD_KEEP (2) and an "N more" row until it is opened or a search is typed.'
      - fn: 'picker::draw'
        path: crates/herdr-core/src/picker.rs
        find: 'fn draw(items: &[Item], rows: &[(Row, String)], cols: usize) -> Vec<String> {'
        plain: 'Lines rows up after the widest head. When any line is wider than the screen, every row switches to its short form, with the status kept at the right edge.'
      - fn: 'picker::visible'
        path: crates/herdr-core/src/picker.rs
        find: 'fn visible(items: &[Item], query: &str) -> Vec<usize> {'
        plain: 'Keeps items whose text holds every query character in order, ignoring case and colour codes, plus the parents of each match.'
      - fn: 'picker::keys'
        path: crates/herdr-core/src/picker.rs
        find: 'fn keys(input: &[u8]) -> Vec<Key> {'
        plain: 'Turns one read of raw input into keys: Enter, Esc, arrows, Ctrl+P and Ctrl+N, Backspace, Tab and text. One read can hold several.'
      - {fn: 'picker::table', path: crates/herdr-core/src/picker.rs, find: 'pub fn table(items: &[Item], cols: usize) -> Vec<String> {', plain: 'The hc ls table: the same layout with nothing folded.'}
    why: 'Header: a small fuzzy picker for commands run in a terminal without a target, and the row layout hc ls shares with it. It is written on the platform console functions rather than a TUI library, in line with AGENTS.md asking for fewer dependencies.'
    inferred: true
    note: 'It borrows RawMode, out, read_stdin and window_size through attach, which re-exports them from platform::console.'
  - id: 'rs:herdr_core::addr'
