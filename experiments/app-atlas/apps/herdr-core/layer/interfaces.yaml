      plain: 'Viewer to Core. A 9-byte header (channel, kind, length) and a payload. On an attach channel: DATA with key bytes, AUTOMATIC_INPUT with replies the viewer''s terminal generated, CREDIT as output is written out, RESIZE, FOCUS, FACTS, and an empty CLOSE to detach.'
      shape: "[channel u32 LE][kind u8][len u32 LE][payload]\nkind 0 DATA     channel 0: one JSON-RPC message; stream: key bytes\nkind 1 CREDIT   u32 LE bytes consumed\nkind 2 CLOSE    empty (viewer detaches)\nkind 3 RESIZE   u16 LE cols, u16 LE rows\nkind 4 FOCUS    1 gained, 0 lost\nkind 5 FACTS    {\"fg\",\"bg\",\"cursor\":\"#rrggbb\",\"cell\":[w,h]}\nkind 6 AUTOMATIC_INPUT  reply bytes, not human activity\nterminal.attach params: {terminal, observe, resize_notifications, history, cols, rows, display, resumed, caller}"
