    nature: 'hc attach or an app holds one socket connection, switched to frames by hello with framed: true. JSON-RPC calls travel on channel 0 and run side by side; each terminal.attach opens a further channel that carries one terminal''s stream both ways. The viewer never waits for the Core: frames are written as they come, and the Core queues outgoing frames in a per-connection outbox that a write_frames task drains on the Core''s async thread. The connection crosses from the short-lived hc process or the app into the Core daemon.'
