schema: app-atlas/v0
note: 'Interfaces between Herdr Core''s parts: what kind of connection, what is sent and returned, how it fails and why. Shapes use field names from the code.'
interfaces:
  - id: cli-to-core
    name: 'A command makes one JSON-RPC call to the Core'
    from: ['rs:herdr_core::cli', 'rs:herdr_core::client']
    to: ['rs:herdr_core::server', 'rs:herdr_core::api']
    mechanism: rpc
    nature: 'The short-lived hc process starts it and waits. It connects to the session''s Unix socket (a named pipe on Windows), writes one JSON-RPC request as one line and blocks until one reply line comes back; the connection stays in plain mode. In the Core, the accept loop gives every connection its own task on the single async thread, so a slow call such as a wait never holds up another connection. It crosses from the command process into the Core daemon.'
    request:
      plain: 'A JSON-RPC 2.0 request with id 1, the method the command maps to and the params defined in api/types.rs. Most commands send exactly one call; `hc events` keeps reading notifications after its call.'
      shape: "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"terminal.run\",\"params\":{...}}   // one line\nterminal.run: {argv, line?, size?, display?, name?, cwd?, on?, env, labels, parent?, no_parent, no_notify, outlive_parent, die_with_parent, rm, keep, wait, timeout?, caller}\nterminal.send: {terminal, text, force, if?, wait, timeout?, caller}\nterminal.keys: {terminal, keys: [names], caller}\nterminal.wait: {terminal?, children?, output?, timeout?, caller}"
      type_at: {path: crates/herdr-core/src/api/types.rs, find: 'pub struct RunParams {'}
    response:
      plain: 'One line: the result, or an error with a kind and a hint. The command prints the result for a person or as JSON, and turns an error kind into its exit status.'
      shape: "{\"jsonrpc\":\"2.0\",\"id\":1,\"result\":{...}}\n{\"jsonrpc\":\"2.0\",\"id\":1,\"error\":{\"code\":-32000,\"message\":\"...\",\"data\":{\"kind\":\"name_taken\",\"hint\":\"...\"}}}"
      type_at: {path: crates/herdr-core/src/rpc.rs, find: 'pub fn response(id: Value, result: Result<Value, RpcError>) -> Value {'}
    errors: 'RpcError::exit_code maps kinds to exit statuses: usage 2, not_found 3, machine_unknown 4, unavailable 5, invalid_params 6, needs_target 7, config 8, blocked 9, status_mismatch 10, finished 11, anything else 1. A connection that closes before the reply becomes unavailable, worded by explain_closed as a restart or a stop. Errors print as `error:` and `hint:` lines, or as JSON on stderr when piped.'
    limits: 'The command sets no read timeout: it waits as long as the call runs, such as a wait for up to its timeout (wait_timeout in config.toml, else 180 s). Each message is one line of JSON.'
    why: 'AGENTS.md: one API; the CLI is one call per command. The schema is generated from one method table, so params and results in api/types.rs are also CLI arguments and the published schema.'
    inferred: false
    at: {path: crates/herdr-core/src/client.rs, find: 'pub fn call(stream: &Stream, method: &str, params: Value) -> Result<Value, RpcError> {'}
    steps:
      - run-background-4
      - run-background-5
      - run-background-14
      - first-command-starts-core-9
      - agent-sends-input-2
      - agent-sends-input-3
      - agent-sends-input-14
      - agent-sends-input-b1-1
      - agent-sends-input-b1-3
      - status-and-wait-1
      - status-and-wait-2
      - status-and-wait-12
  - id: core-autostart
    name: 'A command starts the Core when nobody answers'
    from: ['rs:herdr_core::client']
    to: ['rs:herdr_core::server']
    mechanism: process
    nature: 'Started by the short-lived command, and also by the Holder''s supervisor when a Core crashed and did not come back. The command starts `herdr-core serve` detached from itself and polls the socket until it accepts. The Core becomes a separate long-lived process: on Linux a systemd user service when the user manager runs at /run/user/<uid>, on macOS a launchd job, elsewhere a new session started with setsid. The command does not wait for the process itself, only for its socket.'
    request:
      plain: 'The same binary with the argument serve. HC_SCOPE is removed and HC_RUNTIME=1 set, so ending the terminal that ran the command never ends the Core. stdin and stdout go nowhere and stderr is appended to core.log in the state folder.'
      shape: "herdr-core serve\nenv: HC_SCOPE removed, HC_RUNTIME=1\nLinux with a user manager: systemd-run --user --unit=hc-serve-<8 hex> ...\nmacOS: launchd\notherwise: setsid; stdin and stdout /dev/null; stderr appended to <state>/core.log"
      type_at: {path: crates/herdr-core/src/client.rs, find: 'pub fn spawn_detached(paths: &Paths, args: &[&str], log: &str) -> std::io::Result<()> {'}
    response:
      plain: 'No message: success is the socket accepting a connection, tried every 10 ms. Inside serve, a process that cannot take core.lock exits quietly, because another Core already serves this session; the command then connects to that one.'
      shape: "connect(<runtime dir>/herdr-core/<session>.sock) succeeds within START_WAIT\n<state>/core.lock: the socket path of the Core that holds the lock"
      type_at: {path: crates/herdr-core/src/client.rs, find: 'pub fn wait_for_socket(path: &std::path::Path, what: &str) -> Result<Stream, String> {'}
    errors: '"cannot start core: <error>" when the process cannot start; "core did not start within 15 s" when the socket never answers; a Core of this session listening at another path (named in core.lock) is reported instead of starting a second one. All are kind unavailable, with a hint to check the core log in the state directory.'
    limits: 'START_WAIT 15 s, polled every 10 ms. Two commands racing both start serve; the session lock lets only one run.'
    why: 'client.rs: a busy machine, or one right after an update, can need well over 5 s, and giving up early reports a failure while the Core is still coming up. systemd.rs: as user services, Cores and Holders belong to the user, so a desktop crash, a logout or an ssh login ending cannot take them along. server.rs: a process that finds the lock taken must not wait for it, or it would start an unwanted Core after a stop.'
    inferred: false
    at: {path: crates/herdr-core/src/client.rs, find: 'fn connect_starting(paths: &Paths, explicit: bool) -> Result<Stream, RpcError> {'}
    steps: [first-command-starts-core-1, first-command-starts-core-2, first-command-starts-core-3, first-command-starts-core-4]
  - id: core-to-holder
    name: 'The Core and the Holder exchange frames'
    from: ['rs:herdr_core::runtime', 'rs:herdr_core::api::run', 'rs:herdr_core::input']
    to: ['rs:herdr_core::holder']
    mechanism: ipc
    nature: 'A private Unix socket per Holder, `<session>.holder.<8 hex>.sock`. The Core connects and says HELLO; the newest HELLO owns the Holder. Neither side writes inside its lock: each queues frames on a channel and a dedicated writer thread writes them, and each reads with its own thread (the Core''s read_holder thread, the Holder''s thread per connection). Most frames get no reply; SPAWN is answered by SPAWNED or SPAWN_FAILED, FOREGROUND by FOREGROUND_IS and GOODBYE by BYE. It crosses from the Core daemon into the Holder process.'
    request:
      plain: 'Core to Holder: a 9-byte header (kind, terminal id, payload length), then the payload. Control payloads are JSON; INPUT carries raw bytes.'
      shape: "[kind u8][terminal u32 LE][len u32 LE][payload]\n1 HELLO {version: 1}\n2 SPAWN {argv, env, cwd, cols, rows}\n3 INPUT <raw bytes>\n4 RESIZE {cols, rows}\n5 SIGNAL {signal}\n6 RELEASE (empty: forget the terminal)\n7 GOODBYE \"handover\" | \"shutdown\"\n8 FOREGROUND (empty)\n9 DRAIN (empty: take nothing new, exit when empty)"
      type_at: {path: crates/herdr-core/src/holder_proto.rs, find: 'pub struct Spawn {'}
    response:
      plain: 'Holder to Core, framed the same way. WELCOME lists what the Holder runs and is followed by one TAIL per terminal; OUTPUT carries raw program output.'
      shape: "101 WELCOME {version, instance, pid, build, previous: \"none\" | \"handover\" | \"crash\", terminals: [{id, pid, cols, rows, exit}]}\n102 TAIL <up to 1 MiB of recent output>\n103 OUTPUT <raw bytes>\n104 SPAWNED {pid}\n105 SPAWN_FAILED {error}\n106 EXITED {code, signal}\n107 BYE (empty)\n108 FOREGROUND_IS {pgid}"
      type_at: {path: crates/herdr-core/src/holder_proto.rs, find: 'pub struct Welcome {'}
    errors: 'A frame over 16 MiB, a closed socket or a panic ends the Core''s reading; read_holder reconnects once if the Holder still answers, else the Holder''s live terminals finish as holder_lost and their leftover processes are swept. A Holder of another build is told DRAIN and gets no new terminals. On the Holder side a failed write means that Core is gone, recorded as previous "crash".'
    limits: 'MAX_PAYLOAD 16 MiB per frame. BACKLOG_BYTES 8 MiB queued toward a Core before pumps wait. TAIL_BYTES 1 MiB per terminal. A spawn waits HC_SPAWN_MS (10 s). A reconnect waits RELINK_WAIT (5 s) for the welcome and happens at most once per RELINK_GAP (5 s). A goodbye waits up to 6 s for BYE.'
    why: 'holder.rs: the Holder owns every PTY, is every program''s parent and always reads output, with no parsing and no policy, and keeps a tail so a Core that crashed can rebuild screens. runtime.rs Link: frames for the Holder go through their own thread because the Holder writes to the Core under its own lock; both waiting would freeze the session.'
    inferred: false
    at: {path: crates/herdr-core/src/holder_proto.rs, find: 'pub fn frame(kind: u8, id: u32, payload: &[u8]) -> Vec<u8> {'}
    steps:
      - run-background-8
      - run-background-9
      - run-background-11
      - run-background-12
      - first-command-starts-core-7
      - first-command-starts-core-12
      - first-command-starts-core-13
      - agent-sends-input-8
      - agent-sends-input-9
      - output-to-screen-3
      - output-to-screen-4
      - output-to-screen-9
      - output-to-screen-b1-1
      - status-and-wait-5
  - id: holder-to-program
    name: 'The Holder runs a program in a pseudo-terminal'
    from: ['rs:herdr_core::holder', 'rs:herdr_core::platform::unix']
    to: ['ext:program']
    mechanism: process
    nature: 'The Holder is the program''s parent and holds the master side of its pseudo-terminal; the program has the slave side as stdin, stdout, stderr and controlling terminal. For each terminal the Holder runs three threads: an input writer, a pump that always reads output, and a reaper that waits for the exit. None of them waits for the Core. On Windows, platform/windows.rs does the same job with ConPTY and job objects.'
    request:
      plain: 'Start: argv, a complete environment, a folder and a size. Afterwards: input bytes, size changes and signals.'
      shape: "spawn_pty(argv, env, cwd, cols, rows): openpty, environment cleared then set, setsid, TIOCSCTTY\ninput: write(master, bytes)   // its own thread per terminal\nresize: ioctl(master, TIOCSWINSZ, {rows, cols})\nsignal: killpg(pid, signal), and killpg(foreground group, signal)\nrelease while the PTY is still held: killpg(pid, SIGHUP)\nforeground: tcgetpgrp(master)"
      type_at: {path: crates/herdr-core/src/platform/unix.rs, find: 'pub fn spawn_pty('}
    response:
      plain: 'Output read from the master in chunks of up to 64 KiB, and the exit code or signal from waiting on the child.'
      shape: "read(master) -> up to 64 KiB, until 0 bytes or EIO (every slave side closed)\nwait(child) -> (exit code, signal), reported after its output"
      type_at: {path: crates/herdr-core/src/platform/unix.rs, find: 'pub fn wait(child: &mut Process) -> io::Result<(Option<i32>, Option<i32>)> {'}
    errors: 'A spawn error becomes SPAWN_FAILED, "cannot start <program>: <error>", and a line in holder.log. Signals are never sent after the child has been reaped, since its pid may belong to another process by then. A program that stops reading blocks only its own input thread.'
    limits: '64 KiB read buffer. EXIT_DRAIN 200 ms: the exit is reported once the pump has finished, or 200 ms after the later of the exit and the moment its output could last drain. TAIL_BYTES 1 MiB kept per terminal.'
    why: 'holder.rs: the pump always reads, core or not, so programs never stall on a full PTY; input goes through its own thread so a program that stops reading blocks only itself; the exit code comes after the last output has been forwarded.'
    inferred: false
    at: {path: crates/herdr-core/src/holder.rs, find: 'fn spawn(self: &Arc<Self>, id: u32, spec: proto::Spawn) {'}
    steps: [run-background-10, agent-sends-input-10, agent-sends-input-11, output-to-screen-1, output-to-screen-2, status-and-wait-4, status-and-wait-b1-5]
  - id: core-screen
    name: 'The Core keeps a screen per terminal with ghostty-vt'
    from: ['rs:herdr_core::viewers', 'rs:herdr_core::relay', 'rs:herdr_core::runtime']
    to: ['rs:ghostty_vt', 'ext:libghostty']
    mechanism: call
    nature: 'Plain function calls on the Holder reader thread, under the Core''s state lock; ghostty_vt wraps the libghostty-vt C interface. A write is synchronous; what the program asked for is collected by callbacks during the write and taken afterwards. The screens live in State.screens, one per live terminal.'
    request:
      plain: 'Output bytes in order, through the Relay, plus the size and a viewer''s colours and cell size when they change.'
      shape: "Terminal::new(cols, rows, history_bytes)\nTerminal::write(bytes)   // ghostty_terminal_vt_write\nTerminal::set_display(fg, bg, cursor, cell)\nTerminal::set_xtversion(identity)"
      type_at: {path: crates/ghostty-vt/src/lib.rs, find: 'pub fn write(&mut self, bytes: &[u8]) {'}
    response:
      plain: 'Replies for the program, status reports, title changes and, on request, the screen as text or as a paint for a new viewer.'
      shape: "take_responses() -> bytes for the program (query replies)\ntake_status_reports() -> [StatusReport {state, kind?, progress?, id, app, title, message}]\ntake_title_changed() -> bool; title()\nplain_text(), paint(history), snapshot()"
      type_at: {path: crates/ghostty-vt/src/lib.rs, find: 'pub struct StatusReport {'}
    errors: 'write returns nothing and cannot fail from the Core''s side. An OSC 7501 state the wrapper does not know is dropped. A failing ghostty_terminal_new panics through an assert.'
    limits: 'Scrollback is capped by history_bytes from config.toml. The Relay judges an escape sequence within 64 bytes (CSI) or 512 bytes (strings) and passes longer ones through unexamined. Until a viewer reports its own, the screen answers with a 10 by 20 pixel cell, a white foreground and a #282c34 background.'
    why: 'relay.rs: every byte reaches the screen; viewers get every byte too, except queries the screen answered itself, because a viewer seeing them would answer a second time. AGENTS.md: libghostty-vt comes from fresh upstream Ghostty master, not Herdr''s vendored copy.'
    inferred: false
    at: {path: crates/herdr-core/src/relay.rs, find: 'pub fn feed(&mut self, screen: &mut Screen, input: &[u8]) -> Vec<u8> {'}
    steps: [output-to-screen-6, output-to-screen-7, output-to-screen-8, output-to-screen-9, output-to-screen-b1-2, status-and-wait-5, status-and-wait-6]
  - id: agent-input-queue
    name: 'Agent input waits its turn in a per-terminal queue'
    from: ['rs:herdr_core::api', 'rs:herdr_core::notes']
    to: ['rs:herdr_core::input']
    mechanism: channel
    nature: 'Inside the Core''s async loop. terminal.send, terminal.keys, terminal.interrupt and note delivery all go through Core::type_in, which takes an async mutex kept per terminal in State.queues, so their bytes never interleave. While one holds it, the terminal''s Gate is busy and keeps a person''s keystrokes from viewers until it is done. The caller waits for its turn, for a person to stop typing and through its own pauses.'
    request:
      plain: 'A prepare function that sees the current terminal and screen and returns a list of steps, or refuses before anything is typed.'
      shape: "type_in(id, quiet, prepare), prepare(&State, &Terminal) -> Result<(T, Vec<Step>), RpcError>\nStep::Write(bytes) | Step::Pause(duration) | Step::FirstTask(bytes)\nsend: [Write(paste, bracketed if mode 2004), Pause(200 ms), Write(Enter or template submit key)]\nkeys: [Write(keys::encode(name)), Pause(30 ms)] for each key"
      type_at: {path: crates/herdr-core/src/input.rs, find: 'pub async fn type_in<T>('}
    response:
      plain: 'Whatever prepare returned. For send: the status word, the turn, and then whether the program started working; for keys: the word and the turn. Each Write has already gone to the Holder as an INPUT frame.'
      shape: "send -> Sent {status, turn, started: true | false | null}\nkeys -> (status, turn)"
      type_at: {path: crates/herdr-core/src/input.rs, find: 'pub struct Sent {'}
    errors: 'finished (exit 11) when the terminal is no longer live; blocked (exit 9) for send to a blocked program without --force; status_mismatch (exit 10) for --if; unavailable when a starting agent''s output does not settle within 5 s; invalid_params for an unknown key name. A refusal types nothing.'
    limits: 'Quiet: 3 s since a person last typed (HC_QUIET_MS; notes_quiet in config.toml for notes). PASTE_GAP 200 ms. KEY_GAP 30 ms. Settle: in the first 10 s (STARTUP_MS), output still for 800 ms (HC_SETTLE_MS), for at most 5 s (SETTLE_MAX). Started: watched for 5 s (HC_STARTED_MS).'
    why: 'input.rs: one queue per terminal, so send, keys and interrupt never interleave with each other, and never with a person typing. settle: a starting agent can report before it is ready for a paste (Pi swaps its input box right after its first report and drops a paste in flight).'
    inferred: false
    at: {path: crates/herdr-core/src/input.rs, find: 'let queue = self.lock().queues.entry(id).or_default().clone();'}
    steps: [agent-sends-input-5, agent-sends-input-6, agent-sends-input-7, agent-sends-input-12, agent-sends-input-13, agent-sends-input-b1-2, status-and-wait-b1-4]
  - id: status-osc
    name: 'A program reports its status with OSC 7501'
    from: ['ext:program']
    to: ['rs:ghostty_vt', 'rs:herdr_core::viewers', 'rs:herdr_core::status']
    mechanism: stream
    nature: 'In-band and one-way: the program prints an escape sequence among its ordinary output, and it travels through the Holder like any other byte. The Core never asks and never infers status from the screen; it stores exactly what the program said. A `?` query is the one exception: the Core''s screen answers it, and viewers never see it.'
    request:
      plain: 'OSC 7501 with colon-separated key=value fields. state is required; id names a child record and is empty for the root; kind only with blocked; progress 0 to 100 with working or blocked; title and msg are base64.'
      shape: "ESC ] 7501 ; state=<idle|working|done|blocked|error|clear> [:id=<id>] [:kind=<permission|question|auth>] [:progress=<0-100>] [:app=<name>] [:title=<base64>] [:msg=<base64>] ESC \\\nexamples: state=done   state=done:id=sub   state=blocked:kind=permission"
      type_at: {path: crates/herdr-core/src/status.rs, find: 'pub fn encode(&self, id: &str) -> String {'}
    response:
      plain: 'Nothing goes back to the program. The report is stored in the terminal record, then status and turn events follow.'
      shape: "Terminal.status: {state, kind?, progress?, app?, title?, msg?} or null\nTerminal.records: {<id>: Status}\nTerminal.reported: true after the first report\nTerminal.turn: +1 each time the root record leaves working"
      type_at: {path: crates/herdr-core/src/status.rs, find: 'pub struct Status {'}
    errors: 'An unknown state is ignored. clear without an id removes the root record and every child record; with an id, that record and its children. When the program ends, its status and records reset.'
    limits: 'MAX_RECORDS 256 records per terminal; past that, the record with the first id goes. Words are stored as reported, never translated.'
    why: 'AGENTS.md: status comes only from OSC 7501, with no screen detection, no agent registry and no vendor-specific logic. README: a program that does not report status has none.'
    inferred: false
    at: {path: crates/herdr-core/src/status.rs, find: 'pub fn apply(t: &mut Terminal, r: &StatusReport) -> Change {'}
    steps: [status-and-wait-4, status-and-wait-5, status-and-wait-6, status-and-wait-7]
  - id: events-stream
    name: 'Fact changes stream to subscribers'
    from: ['rs:herdr_core::events']
    to: ['ext:app', 'rs:herdr_core::cli', 'rs:herdr_core::wait']
    mechanism: stream
    nature: 'A subscriber starts it with events.subscribe; from then on the Core pushes without being asked. Every fact change runs deliver_event under the state lock, on whichever thread made the change, and never blocks: framed connections get JSON lines on their own event channel, plain connections such as `hc events` get them through a bounded queue drained by the connection''s task, and the Core''s own waits get them through an unbounded channel.'
    request:
      plain: 'events.subscribe with optional filters: one terminal, the children of a terminal, or labels.'
      shape: '{"jsonrpc":"2.0","id":1,"method":"events.subscribe","params":{"terminal"?: "t7", "children_of"?: "t3", "labels": {"k": "v"}}}'
      type_at: {path: crates/herdr-core/src/api/types.rs, find: 'pub struct SubscribeParams {'}
    response:
      plain: 'A snapshot with the sequence it is current at, then one notification per change, a heartbeat every 15 s, and `missed` with a fresh snapshot when the subscriber fell behind.'
      shape: "result: {seq, terminals: [records], channel: <framed channel> or null}\n{\"jsonrpc\":\"2.0\",\"method\":\"event\",\"params\":{\"type\":\"status\",\"terminal\":\"t7\",\"data\":{...},\"seq\":42}}\ntypes: created, lost, restarted, keep, finished, removed, status, turn, title, labels, size, doc\n{\"jsonrpc\":\"2.0\",\"method\":\"heartbeat\",\"params\":{\"seq\":42}}\n{\"jsonrpc\":\"2.0\",\"method\":\"missed\",\"params\":{\"seq\":57,\"terminals\":[...]}}"
      type_at: {path: crates/herdr-core/src/api/types.rs, find: 'pub struct SubscribeResult {'}
    errors: 'A subscriber that falls behind gets `missed` and a fresh snapshot instead of the backlog; it should ignore events whose seq is not above the snapshot''s. A plain subscriber that does not read for 30 s is disconnected. A closed plain subscriber is dropped at the next event.'
    limits: 'PLAIN_QUEUE 1024 lines for a plain subscriber; MAX_PENDING 4 MiB on a framed event channel; heartbeat every 15 s (HC_HEARTBEAT_MS).'
    why: 'events.rs: every fact change, in order, to anyone subscribed; a subscriber that falls behind gets missed plus a fresh snapshot instead of a backlog. wait.rs: waits are driven by events, so even a quick flicker counts.'
    inferred: false
    at: {path: crates/herdr-core/src/events.rs, find: 'fn deliver_event(&self, st: &mut State, mut params: Value, record: &Value, was: Option<&Value>) {'}
    steps: [run-background-12, status-and-wait-3, status-and-wait-8, status-and-wait-9, status-and-wait-10]
  - id: notes-to-parent
    name: 'News about a child is typed into its parent'
    from: ['rs:herdr_core::notes']
    to: ['ext:agent']
    mechanism: channel
    nature: 'The Core decides and types; the parent agent does not ask. A change that matters queues a job on the Core''s jobs channel. One task per parent waits until the parent can take a note, then types it through the parent''s input queue, so it arrives in the parent''s input like a message, through the Holder and the parent''s pseudo-terminal. Text an agent sends with hc send carries the same kind of tag.'
    request:
      plain: 'A marked note for each child that is blocked, hit an error or ended and whose news the parent has not seen, been told or is not waiting for.'
      shape: "<hc>t7 review is blocked (permission). See: hc read t7</hc>\n<hc>t7 review hit an error: rate limited. See: hc read t7</hc>\n<hc>t7 review exited (exit 3). Last lines:\n...\nRead: hc read t7</hc>\nhc send between agents: <hc from=\"t3 lead\">text</hc>"
      type_at: {path: crates/herdr-core/src/notes.rs, find: 'format!("<hc>{address}{name} {what}{gap}{look}: hc read {address}</hc>")'}
    response:
      plain: 'None from the agent. The Core records noted = news for each child it told, so the same news is not typed twice.'
      shape: 'Terminal.noted = max(noted, news)'
      type_at: {path: crates/herdr-core/src/notes.rs, find: 'async fn type_note(&self, parent: u32) -> Result<bool, RpcError> {'}
    errors: 'If the parent becomes blocked while a note waits for quiet, the task tries again. A parent that ends stops the task. Notes from another machine that could not be typed are kept for the next try.'
    limits: 'A parent takes notes only when it is live, has reported status and is not blocked; the task re-checks at least every 60 s. Exit notes of programs that never reported status carry up to 20 last lines of up to 300 characters; error notes carry the first line of msg, up to 200 characters. notes = false in config.toml turns notes and tags off; notes_quiet sets the typing pause; --no-notify on a child turns its notes off.'
    why: 'notes.rs: news about a child is typed into its parent agent as a marked note, only when the parent can take it and has not seen it. A note covers what a child cannot say itself (blocked, an error, gone); everything else it reports with hc send.'
    inferred: false
    at: {path: crates/herdr-core/src/notes.rs, find: 'async fn deliver_notes(self: Arc<Self>, parent: u32) {'}
    steps: [agent-sends-input-4, status-and-wait-b1-1, status-and-wait-b1-2, status-and-wait-b1-3, status-and-wait-b1-4, status-and-wait-b1-5]
  - id: registry-persistence
    name: 'The terminal registry is written to the state folder'
    from: ['rs:herdr_core::runtime']
    to: ['rs:herdr_core::runtime::persistence']
    mechanism: file
    nature: 'Core::save serialises the whole Registry under the state lock and hands the bytes to RegistryWriter, which keeps only the newest pending snapshot. A dedicated registry-writer thread writes it to terminals.json and never holds the Core lock. Calls that change something await flush_saved before they reply.'
    request:
      plain: 'The whole registry as JSON, in the order the state changed.'
      shape: "<state>/terminals.json   // ~/.local/state/herdr-core/<session>/\n{\"next_id\": 8, \"holder\": null, \"terminals\": {\"7\": {address, name, labels, argv, cwd, keep, state, pid, exit_code, signal, reason, created_ms, finished_ms, status, records, turn, parent, news, seen, noted, holder, scope, ...}}}"
