<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture map</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1e22; --muted: #5d646e; --line: #d8dbe0; --soft: #eef0f2; --hover: #e4e8ee;
  --accent: #2f6fde; --ok: #1d7f47; --warn: #a86d12; --bad: #c03c12; --gray: #8b919a;
  --k-crate: #2f6fde; --k-module: #6b93e0; --k-binary: #2f6fde; --k-package: #8250df; --k-script: #a888e6; --k-host: #0f8a83; --k-runtime: #6aa7a3;
  --k-agent: #c96a12; --k-program: #b2432f; --k-generator: #2f8a4a; --k-artifact: #6fb183; --k-dep: #8b919a; --k-env: #9a8f7d; --k-location: #9a8f7d;
  --k-source: #c98f12; --k-files: #8b919a; --k-container: #747b85; --k-component: #3b4250;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #14161a; --panel: #1b1e23; --ink: #e6e8eb; --muted: #a0a7b1; --line: #333842; --soft: #23272e; --hover: #2c313a;
  --accent: #7aa7ff; --ok: #4cc38a; --warn: #e2b04e; --bad: #f2794a; --gray: #7c838d; --k-component: #c9ced6; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --panel: #1b1e23; --ink: #e6e8eb; --muted: #a0a7b1; --line: #333842; --soft: #23272e; --hover: #2c313a;
    --accent: #7aa7ff; --ok: #4cc38a; --warn: #e2b04e; --bad: #f2794a; --gray: #7c838d; --k-component: #c9ced6; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 14px; margin: 0; font-weight: 650; }
header .commit { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.tabs { display: flex; gap: 2px; background: var(--soft); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; font: inherit; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 12%); }
.search { position: relative; margin-left: auto; }
.search input { width: 230px; max-width: 46vw; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
.results { position: absolute; right: 0; top: 32px; width: 320px; max-width: 90vw; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgb(0 0 0 / 18%); z-index: 5; max-height: 60vh; overflow: auto; }
.results button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 6px 10px; font: inherit; cursor: pointer; }
.results button:hover, .results button:focus { background: var(--hover); }
.results small { color: var(--muted); display: block; font-size: 11px; }
.icon { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 4px 8px; font: inherit; cursor: pointer; }
main { display: grid; grid-template-columns: 1fr minmax(320px, 400px); min-height: 0; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
svg.panning { cursor: grabbing; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px 40px; min-height: 0; }
@media (max-width: 820px) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; grid-template-rows: 62vh auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
.node rect.box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.node rect.bar { fill: var(--kind, var(--gray)); }
.node text { fill: var(--ink); font-size: 12px; pointer-events: none; }
.node text.sub { fill: var(--muted); font-size: 10.5px; }
.node text.more { fill: var(--muted); font-size: 10.5px; font-weight: 600; }
.node { cursor: pointer; }
.node:hover rect.box { stroke: var(--accent); }
.node.selected rect.box { stroke: var(--accent); stroke-width: 2.5; }
.node.dim, .edge.dim, .group.dim { opacity: 0.22; }
.group rect.frame { fill: var(--soft); fill-opacity: 0.55; stroke: var(--line); stroke-dasharray: 0; }
.group.selected rect.frame { stroke: var(--accent); stroke-width: 2; }
.group text { fill: var(--muted); font-size: 11.5px; font-weight: 650; cursor: pointer; }
.edge path { fill: none; stroke: var(--gray); stroke-width: 1.2; opacity: 0.75; }
.edge path.hit { stroke: transparent; stroke-width: 10; opacity: 1; cursor: pointer; }
.edge.selected path:not(.hit), .edge.near path:not(.hit) { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }
.edge.implemented path:not(.hit) { stroke: var(--ok); }
.edge.not-found path:not(.hit) { stroke: var(--bad); stroke-dasharray: 6 4; }
.edge.unbound path:not(.hit) { stroke: var(--gray); stroke-dasharray: 2 4; }
.edge.unspecified path:not(.hit) { stroke: var(--warn); stroke-dasharray: 3 3; opacity: 0.8; }
.edge.added path:not(.hit) { stroke: var(--ok); stroke-width: 2.2; opacity: 1; }
.edge.removed path:not(.hit) { stroke: var(--bad); stroke-dasharray: 5 4; stroke-width: 2; opacity: 1; }
.node.st-implemented rect.box, .node.st-conforms rect.box { stroke: var(--ok); stroke-width: 1.6; }
.node.st-partial rect.box { stroke: var(--warn); stroke-width: 1.6; }
.node.st-missing rect.box { stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 5 3; }
.node.st-unbound rect.box { stroke: var(--gray); stroke-dasharray: 2 3; }
.node.st-unspecified rect.box { stroke: var(--warn); stroke-dasharray: 3 3; }
.node.ch-added rect.box { stroke: var(--ok); stroke-width: 2.4; }
.node.ch-removed rect.box { stroke: var(--bad); stroke-width: 2.4; stroke-dasharray: 5 3; }
.node.ch-changed rect.box, .node.ch-touched rect.box { stroke: var(--warn); stroke-width: 2.2; }
.badge-dot { stroke: var(--panel); stroke-width: 2; }
marker path { fill: var(--gray); }
[hidden] { display: none !important; }
.strip { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 6px; overflow-x: auto; padding: 6px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 10px; }
.strip button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; text-align: left; max-width: 260px; }
.strip button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.strip small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { position: absolute; left: 10px; top: 10px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); max-width: calc(100% - 20px); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
aside h2 { font-size: 16px; margin: 0 0 2px; line-height: 1.3; word-break: break-word; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
aside .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
aside p { margin: 8px 0; }
aside details { border-top: 1px solid var(--line); padding: 6px 0; }
aside details > summary { cursor: pointer; font-weight: 600; padding: 3px 0; list-style-position: outside; }
aside details details { border-top: 0; padding: 2px 0 2px 10px; }
aside details details > summary { font-weight: 500; }
aside ul { margin: 4px 0; padding-left: 18px; }
aside li { margin: 3px 0; }
code, pre { font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
aside code { overflow-wrap: anywhere; }
code.line { display: block; background: var(--soft); border-radius: 5px; padding: 3px 6px; margin: 2px 0 6px; white-space: pre-wrap; word-break: break-word; }
pre { background: var(--soft); border-radius: 6px; padding: 8px; overflow-x: auto; margin: 6px 0; white-space: pre; }
pre .add { color: var(--ok); } pre .del { color: var(--bad); } pre .hunk { color: var(--muted); }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
button.link:hover { text-decoration: underline; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; margin-right: 4px; white-space: nowrap; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.row button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 4px 9px; font: inherit; cursor: pointer; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.quote { border-left: 3px solid var(--line); padding: 2px 8px; margin: 4px 0; color: var(--ink); }
.context { white-space: pre-wrap; font-size: 12px; background: var(--soft); border-radius: 6px; padding: 6px 8px; max-height: 320px; overflow: auto; }
.context mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Architecture map</h1>
  <span class="commit" id="commit"></span>
  <div class="tabs" role="group" aria-label="View">
    <button data-mode="code" aria-pressed="true">Code</button>
    <button data-mode="proposed">Proposed vs code</button>
    <button data-mode="changes">Changes</button>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Find a node ( / )" autocomplete="off" aria-label="Find a node">
    <div class="results" id="results" hidden></div>
  </div>
  <button class="icon" id="theme" title="Switch light or dark">◐</button>
</header>
<main>
  <div id="stage">
    <svg id="svg" role="img" aria-label="Architecture graph">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"></path></marker>
      </defs>
      <g id="viewport"><g id="groups"></g><g id="edges"></g><g id="nodes"></g></g>
    </svg>
    <div class="legend" id="legend"></div>
    <div class="zoom"><button class="icon" id="fit" title="Fit to screen">Fit</button><button class="icon" id="collapse" title="Collapse everything">Collapse all</button></div>
    <div class="strip" id="strip" hidden></div>
  </div>
  <aside id="inspector" aria-live="polite"></aside>
</main>
<script id="data" type="application/json">__ARCHITECTURE_DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const O = D.observed;
const C = D.comparison;
const I = D.intended;
const H = D.history;
const COMMIT = O.provenance.source.commit;
const NODE_W = 176, NODE_H = 44, GAP_X = 58, GAP_Y = 14, PAD = 14, HEAD = 28;
const KIND_COLOR = { crate: "--k-crate", module: "--k-module", binary: "--k-binary", package: "--k-package", script: "--k-script", "host-module": "--k-host", "runtime-module": "--k-runtime", "agent-tool": "--k-agent", program: "--k-program", generator: "--k-generator", artifact: "--k-artifact", dependency: "--k-dep", environment: "--k-env", location: "--k-location", source: "--k-source", files: "--k-files", container: "--k-container", component: "--k-component" };
const KIND_TEXT = { crate: "Rust crate", module: "Rust module", binary: "binary", package: "script package", script: "TypeScript", "host-module": "script module from Rust", "runtime-module": "script runtime module", "agent-tool": "agent tool", program: "external program", generator: "generator", artifact: "generated output", dependency: "crate dependency", environment: "environment variable", location: "profile location", source: "source outside crates", files: "embedded files", container: "group", component: "proposed component" };
const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
const short = (sha) => (sha ?? "").slice(0, 7);
const gh = (file, line, commit = COMMIT) => `${D.repository}/blob/${commit}/${file}${line ? `#L${line}` : ""}`;
const $ = (selector) => document.querySelector(selector);
const observedNodes = new Map(O.nodes.map((node) => [node.id, node]));
const compared = {
  components: new Map((C?.components ?? []).map((item) => [item.id, item])),
  relations: new Map((C?.relations ?? []).map((item) => [item.id, item])),
  rules: new Map((C?.rules ?? []).map((item) => [item.id, item])),
};
const components = new Map((I?.components ?? []).map((item) => [item.id, item]));
const sources = new Map((I?.sources ?? []).map((item) => [item.id, item]));

const state = { mode: "code", expanded: { code: new Set(), proposed: new Set(), changes: new Set() }, selected: null, change: H.changes.length - 1, view: { x: 30, y: 30, k: 1 }, fitted: false };

function nameOf(node) {
  if (!node) return "";
  if (node.kind === "module") return node.id.includes("::") ? node.id.split("::").pop() : `${node.id.slice(3)} (root)`;
  if (node.kind === "script" || node.kind === "source") return node.file?.split("/").pop() ?? node.name;
  if (node.kind === "package") return node.name.replace(/ \(.*\)$/, "");
  return node.name ?? node.id;
}
function subOf(node) {
  if (node.kind === "crate") return `crate · ${node.area}/`;
  if (node.kind === "module") return node.file ? node.file : "module";
  if (node.kind === "package") return node.id.slice(8);
  if (node.kind === "host-module") return `${(node.functions ?? []).length || "components"}${node.functions ? " functions" : ""} · ${(node.scopes ?? []).join(", ") || "no scope"}`;
  return KIND_TEXT[node.kind] ?? node.kind;
}

function observedSource(extra) {
  const nodes = new Map();
  for (const node of [...O.nodes, ...(extra?.nodes ?? [])]) nodes.set(node.id, { id: node.id, label: nameOf(node), sub: subOf(node), kind: node.kind, parent: node.parent, data: node });
  const edges = [...O.edges, ...(extra?.edges ?? [])].map((edge) => ({ id: edge.id, from: edge.from, to: edge.to, kind: edge.kind, data: edge }));
  return { nodes, edges };
}

function proposedSource() {
  const nodes = new Map();
  const edges = [];
  if (!I) return { nodes, edges };
  for (const component of I.components) {
    const result = compared.components.get(component.id);
    const failing = I.rules.filter((rule) => (rule.applies_to ?? []).includes(component.id) && compared.rules.get(rule.id)?.result === "diverges").length;
    nodes.set(component.id, { id: component.id, label: component.name, sub: `${result?.status ?? "?"}${failing ? ` · ${failing} rule${failing > 1 ? "s" : ""} broken` : ""}`, kind: "component", parent: component.parent, status: result?.status, alert: failing, data: component });
  }
  if (C?.unspecified?.nodes?.length) {
    nodes.set("group:unspecified", { id: "group:unspecified", label: "In code, not in the specs", sub: "group", kind: "container", status: "unspecified", data: { id: "group:unspecified", kind: "container" } });
    for (const id of C.unspecified.nodes) {
      const node = observedNodes.get(id);
      nodes.set(id, { id, label: nameOf(node), sub: KIND_TEXT[node?.kind] ?? "", kind: node?.kind ?? "container", parent: "group:unspecified", status: "unspecified", data: node });
    }
  }
  for (const relation of I.relations) edges.push({ id: relation.id, from: relation.from, to: relation.to, kind: relation.kind, status: compared.relations.get(relation.id)?.status ?? "unbound", data: relation });
  for (const pair of C?.unspecified?.relations ?? []) edges.push({ id: `unspecified(${pair.from},${pair.to})`, from: pair.from, to: pair.to, kind: "unspecified", status: "unspecified", data: pair });
  return { nodes, edges };
}

function currentChange() {
  return H.changes[state.change] ?? null;
}

function sourceFor(mode) {
  if (mode === "proposed") return proposedSource();
  if (mode === "changes") return observedSource(currentChange()?.removed);
  return observedSource();
}

let SOURCE = sourceFor("code");
let LAYOUT = null;

function childrenMap(source) {
  const map = new Map();
  for (const node of source.nodes.values()) {
    const parent = node.parent && source.nodes.has(node.parent) ? node.parent : "";
    if (!map.has(parent)) map.set(parent, []);
    map.get(parent).push(node.id);
  }
  for (const list of map.values()) list.sort((a, b) => order(source, a) - order(source, b) || a.localeCompare(b));
  return map;
}
const KIND_ORDER = ["component", "crate", "binary", "module", "package", "script", "generator", "artifact", "container", "host-module", "runtime-module", "agent-tool", "program", "source", "files", "dependency", "environment", "location"];
function order(source, id) {
  const index = KIND_ORDER.indexOf(source.nodes.get(id)?.kind);
  return index < 0 ? 99 : index;
}

function ancestors(source, id) {
  const chain = [];
  for (let current = source.nodes.get(id)?.parent; current && source.nodes.has(current); current = source.nodes.get(current).parent) chain.unshift(current);
  return chain;
}

function layout(source, expanded) {
  const kids = childrenMap(source);
  const open = (id) => expanded.has(id) && kids.has(id);
  const rep = (id) => {
    if (!source.nodes.has(id)) return null;
    const chain = [...ancestors(source, id), id];
    for (let index = 0; index < chain.length - 1; index += 1) if (!open(chain[index])) return chain[index];
    return id;
  };
  const inside = (outer, inner) => ancestors(source, inner).includes(outer);
  const visual = new Map();
  for (const edge of source.edges) {
    if (state.mode === "code" && hiddenKinds.has(edge.kind)) continue;
    const from = rep(edge.from);
    const to = rep(edge.to);
    if (!from || !to || from === to || inside(from, to) || inside(to, from)) continue;
    const key = `${from}\u0000${to}`;
    if (!visual.has(key)) visual.set(key, { from, to, items: [] });
    visual.get(key).items.push(edge);
  }
  const sizes = new Map();
  const relative = new Map();
  const place = (group) => {
    const members = kids.get(group) ?? [];
    for (const member of members) {
      if (open(member)) {
        const inner = place(member);
        sizes.set(member, { w: Math.max(inner.w + PAD * 2, NODE_W), h: inner.h + HEAD + PAD, group: true });
      } else sizes.set(member, { w: NODE_W, h: NODE_H, group: false });
    }
    const memberSet = new Set(members);
    const lift = (id) => {
      for (let current = id; current; current = source.nodes.get(current)?.parent) {
        if (memberSet.has(current)) return current;
        if (current === group) return null;
      }
      return null;
    };
    const links = new Set();
    for (const { from, to } of visual.values()) {
      const a = lift(from);
      const b = lift(to);
      if (a && b && a !== b) links.add(`${a}\u0000${b}`);
    }
    const positions = arrange(members, [...links].map((key) => key.split("\u0000")), sizes);
    for (const [id, point] of positions.points) relative.set(id, point);
    return { w: positions.w, h: positions.h };
  };
  const total = place("");
  const boxes = new Map();
  const absolute = (group, x, y) => {
    for (const member of kids.get(group) ?? []) {
      const point = relative.get(member);
      const size = sizes.get(member);
      const box = { x: x + point.x, y: y + point.y, w: size.w, h: size.h, group: size.group };
      boxes.set(member, box);
      if (size.group) absolute(member, box.x + PAD, box.y + HEAD);
    }
  };
  absolute("", 0, 0);
  return { boxes, edges: [...visual.values()], total, rep, kids };
}

function arrange(members, links, sizes) {
  const points = new Map();
  if (!members.length) return { points, w: 0, h: 0 };
  const out = new Map(members.map((id) => [id, []]));
  const into = new Map(members.map((id) => [id, []]));
  for (const [a, b] of links) out.get(a).push(b), into.get(b).push(a);
  const linked = members.filter((id) => out.get(id).length || into.get(id).length);
  const lonely = members.filter((id) => !out.get(id).length && !into.get(id).length);
  const visiting = new Set();
  const done = new Set();
  const forward = new Map(members.map((id) => [id, []]));
  const visit = (id) => {
    visiting.add(id);
    for (const next of out.get(id)) {
      if (visiting.has(next)) continue;
      forward.get(id).push(next);
      if (!done.has(next)) visit(next);
    }
    visiting.delete(id);
    done.add(id);
  };
  for (const id of linked) if (!done.has(id)) visit(id);
  const layer = new Map(linked.map((id) => [id, 0]));
  const pending = new Map(linked.map((id) => [id, 0]));
  for (const list of forward.values()) for (const next of list) pending.set(next, pending.get(next) + 1);
  const ready = linked.filter((id) => pending.get(id) === 0);
  while (ready.length) {
    const id = ready.shift();
    for (const next of forward.get(id)) {
      layer.set(next, Math.max(layer.get(next), layer.get(id) + 1));
      pending.set(next, pending.get(next) - 1);
      if (pending.get(next) === 0) ready.push(next);
    }
  }
  const columns = [];
  for (const id of linked) {
    const index = layer.get(id);
    (columns[index] ??= []).push(id);
  }
  const position = new Map();
  columns.forEach((column) => column.forEach((id, index) => position.set(id, index / Math.max(1, column.length - 1))));
  for (let pass = 0; pass < 8; pass += 1) {
    for (const column of columns) {
      if (!column) continue;
      const score = new Map(column.map((id) => {
        const near = [...out.get(id), ...into.get(id)].filter((other) => position.has(other));
        return [id, near.length ? near.reduce((sum, other) => sum + position.get(other), 0) / near.length : position.get(id)];
      }));
      column.sort((a, b) => score.get(a) - score.get(b) || a.localeCompare(b));
      column.forEach((id, index) => position.set(id, index / Math.max(1, column.length - 1)));
    }
  }
  const filled = columns.filter(Boolean);
  const widest = Math.max(0, ...filled.map((column) => column.length));
  const rows = filled.length > 3 && (filled.length * (NODE_W + GAP_X)) / (widest * (NODE_H + GAP_Y)) > 2.2;
  let width = 0;
  let height = 0;
  if (rows) {
    const spans = filled.map((column) => column.reduce((sum, id) => sum + sizes.get(id).w, 0) + 22 * (column.length - 1));
    width = Math.max(0, ...spans);
    let y = 0;
    filled.forEach((column, index) => {
      let x = (width - spans[index]) / 2;
      const tallestInRow = Math.max(...column.map((id) => sizes.get(id).h));
      for (const id of column) {
        points.set(id, { x, y });
        x += sizes.get(id).w + 22;
      }
      y += tallestInRow + GAP_Y * 3;
    });
    height = Math.max(0, y - GAP_Y * 3);
  } else {
    const heights = filled.map((column) => column.reduce((sum, id) => sum + sizes.get(id).h, 0) + GAP_Y * (column.length - 1));
    const tallest = Math.max(0, ...heights);
    let x = 0;
    filled.forEach((column, index) => {
      const columnWidth = Math.max(...column.map((id) => sizes.get(id).w));
      let y = (tallest - heights[index]) / 2;
      for (const id of column) {
        points.set(id, { x, y });
        y += sizes.get(id).h + GAP_Y;
      }
      x += columnWidth + GAP_X;
    });
    width = Math.max(0, x - GAP_X);
    height = tallest;
  }
  if (lonely.length) {
    const cellW = Math.max(...lonely.map((id) => sizes.get(id).w));
    const cellH = Math.max(...lonely.map((id) => sizes.get(id).h));
    const perRow = Math.max(1, Math.min(lonely.length, Math.max(2, Math.round(Math.sqrt(lonely.length * 2))), Math.floor(Math.max(width, cellW * 3) / (cellW + 24)) || 1));
    const top = height ? height + GAP_Y * 3 : 0;
    lonely.forEach((id, index) => points.set(id, { x: (index % perRow) * (cellW + 24), y: top + Math.floor(index / perRow) * (cellH + GAP_Y) }));
    width = Math.max(width, perRow * (cellW + 24) - 24);
    height = top + Math.ceil(lonely.length / perRow) * (cellH + GAP_Y) - GAP_Y;
  }
  return { points, w: width, h: height };
}

const hiddenKinds = new Set();
const SVG = "http://www.w3.org/2000/svg";
function element(name, attributes = {}, parent) {
  const node = document.createElementNS(SVG, name);
  for (const [key, value] of Object.entries(attributes)) if (value !== undefined && value !== null) node.setAttribute(key, value);
  if (parent) parent.appendChild(node);
  return node;
}

function changeMarks() {
  const change = currentChange();
  const marks = new Map();
  if (state.mode !== "changes" || !change) return marks;
  for (const id of change.change.nodes.added) marks.set(id, "added");
  for (const id of change.change.nodes.removed) marks.set(id, "removed");
  for (const item of change.change.nodes.changed) marks.set(item.id, "changed");
  return marks;
}

function edgeMarks() {
  const change = currentChange();
  const marks = new Map();
  if (state.mode !== "changes" || !change) return marks;
  for (const id of change.change.edges.added) marks.set(id, "added");
  for (const id of change.change.edges.removed) marks.set(id, "removed");
  for (const item of change.change.edges.changed) marks.set(item.id, "changed");
  return marks;
}

function truncate(text, size) {
  return text.length > size ? `${text.slice(0, size - 1)}…` : text;
}

function draw() {
  const expanded = state.expanded[state.mode];
  LAYOUT = layout(SOURCE, expanded);
  const groups = $("#groups"), edges = $("#edges"), nodes = $("#nodes");
  groups.replaceChildren();
  edges.replaceChildren();
  nodes.replaceChildren();
  const marks = changeMarks();
  const linkMarks = edgeMarks();
  const touched = new Map();
  for (const [id, mark] of marks) {
    const rep = LAYOUT.rep(id);
    if (rep && rep !== id) touched.set(rep, (touched.get(rep) ?? 0) + 1);
  }
  for (const [key, mark] of linkMarks) {
    const edge = SOURCE.edges.find((item) => item.id === key);
    if (!edge) continue;
    for (const end of [edge.from]) {
      const rep = LAYOUT.rep(end);
      if (rep && rep !== end) touched.set(rep, (touched.get(rep) ?? 0) + 1);
    }
  }
  const selected = state.selected;
  const near = new Set();
  if (selected) {
    near.add(selected);
    for (const edge of LAYOUT.edges) if (edge.from === selected || edge.to === selected) near.add(edge.from), near.add(edge.to);
  }
  for (const [id, box] of LAYOUT.boxes) {
    const node = SOURCE.nodes.get(id);
    if (!box.group) continue;
    const g = element("g", { class: `group${selected && !near.has(id) && !isInside(selected, id) ? " dim" : ""}${selected === id ? " selected" : ""}`, "data-id": id }, groups);
    element("rect", { class: "frame", x: box.x, y: box.y, width: box.w, height: box.h, rx: 10 }, g);
    const title = element("text", { x: box.x + 10, y: box.y + 18, "data-collapse": id }, g);
    title.textContent = `▾ ${truncate(node.label, 60)}  (${(LAYOUT.kids.get(id) ?? []).length})`;
  }
  for (const edge of LAYOUT.edges) {
    const a = LAYOUT.boxes.get(edge.from);
    const b = LAYOUT.boxes.get(edge.to);
    if (!a || !b) continue;
    const statuses = new Set(edge.items.map((item) => item.status).filter(Boolean));
    const changes = new Set(edge.items.map((item) => linkMarks.get(item.id)).filter(Boolean));
    let cls = "edge";
    if (state.mode === "proposed") cls += statuses.has("not-found") ? " not-found" : statuses.has("implemented") ? " implemented" : statuses.has("unbound") ? " unbound" : " unspecified";
    if (changes.has("added")) cls += " added";
    else if (changes.has("removed")) cls += " removed";
    const key = `${edge.from}\u0000${edge.to}`;
    if (selected === key) cls += " selected";
    else if (selected && (edge.from === selected || edge.to === selected)) cls += " near";
    else if (selected && !(isInside(edge.from, selected) || isInside(edge.to, selected))) cls += " dim";
    const g = element("g", { class: cls, "data-edge": key }, edges);
    const d = curve(a, b);
    element("path", { d, "marker-end": "url(#arrow)" }, g);
    const hit = element("path", { d, class: "hit" }, g);
    const title = element("title", {}, hit);
    title.textContent = `${SOURCE.nodes.get(edge.from)?.label} → ${SOURCE.nodes.get(edge.to)?.label}: ${[...new Set(edge.items.map((item) => item.kind))].join(", ")} (${edge.items.length})`;
  }
  for (const [id, box] of LAYOUT.boxes) {
    if (box.group) continue;
    const node = SOURCE.nodes.get(id);
    let cls = `node`;
    if (node.status) cls += ` st-${node.status}`;
    if (marks.has(id)) cls += ` ch-${marks.get(id)}`;
    else if (touched.has(id)) cls += " ch-touched";
    if (selected === id) cls += " selected";
    else if (selected && !near.has(id) && !isInside(id, selected)) cls += " dim";
    const g = element("g", { class: cls, "data-id": id, transform: `translate(${box.x},${box.y})`, style: `--kind: var(${KIND_COLOR[node.kind] ?? "--gray"})` }, nodes);
    element("rect", { class: "box", width: box.w, height: box.h, rx: 8 }, g);
    element("rect", { class: "bar", width: 4, height: box.h - 12, x: 0, y: 6, rx: 2 }, g);
    const title = element("text", { x: 12, y: 18 }, g);
    title.textContent = truncate(node.label, 24);
    const sub = element("text", { x: 12, y: 33, class: "sub" }, g);
    sub.textContent = truncate(node.sub ?? "", 30);
    const count = (LAYOUT.kids.get(id) ?? []).length;
    if (count) {
      const more = element("text", { x: box.w - 8, y: 18, class: "more", "text-anchor": "end" }, g);
      more.textContent = `+${count}`;
    }
    if (touched.has(id) && !marks.has(id)) element("circle", { cx: box.w - 6, cy: box.h - 7, r: 4, fill: "var(--warn)", class: "badge-dot" }, g);
    if (node.alert) element("circle", { cx: box.w - 6, cy: box.h - 7, r: 4, fill: "var(--bad)", class: "badge-dot" }, g);
    const tip = element("title", {}, g);
    tip.textContent = `${node.label}\n${node.id}${count ? `\nDouble-click to open ${count} members` : ""}`;
  }
  applyView();
  legend();
  writeHash();
}

function isInside(inner, outer) {
  return ancestors(SOURCE, inner).includes(outer);
}

function curve(a, b) {
  const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
  const horizontal = Math.abs(bx - ax) > Math.abs(by - ay) * 0.6;
  let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
  if (horizontal) {
    const right = bx > ax;
    x1 = right ? a.x + a.w : a.x; y1 = ay;
    x2 = right ? b.x : b.x + b.w; y2 = by;
    const bend = Math.max(30, Math.abs(x2 - x1) / 2);
    c1x = x1 + (right ? bend : -bend); c1y = y1; c2x = x2 - (right ? bend : -bend); c2y = y2;
  } else {
    const down = by > ay;
    x1 = ax; y1 = down ? a.y + a.h : a.y;
    x2 = bx; y2 = down ? b.y : b.y + b.h;
    const bend = Math.max(24, Math.abs(y2 - y1) / 2);
    c1x = x1; c1y = y1 + (down ? bend : -bend); c2x = x2; c2y = y2 - (down ? bend : -bend);
  }
  return `M${x1},${y1} C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}`;
}

function applyView() {
  $("#viewport").setAttribute("transform", `translate(${state.view.x},${state.view.y}) scale(${state.view.k})`);
}

function fit() {
  if (!LAYOUT) return;
  const svg = $("#svg").getBoundingClientRect();
  const margin = 40;
  const bottom = state.mode === "changes" ? 70 : 0;
  const width = Math.max(1, LAYOUT.total.w), height = Math.max(1, LAYOUT.total.h);
  const k = Math.min(1.3, (svg.width - margin * 2) / width, (svg.height - margin * 2 - bottom - 30) / height);
  state.view = { k: Math.max(0.15, k), x: (svg.width - width * Math.max(0.15, k)) / 2, y: margin + 30 + (svg.height - margin * 2 - bottom - 30 - height * Math.max(0.15, k)) / 2 };
  applyView();
}

function center(id) {
  const box = LAYOUT?.boxes.get(id);
  if (!box) return;
  const svg = $("#svg").getBoundingClientRect();
  const room = { w: svg.width - 80, h: svg.height - 140 };
  const k = box.group ? Math.max(0.25, Math.min(1.1, room.w / box.w, room.h / box.h)) : Math.max(state.view.k, 0.9);
  state.view = { k, x: svg.width / 2 - (box.x + box.w / 2) * k, y: svg.height / 2 - (box.y + box.h / 2) * k };
  applyView();
}

function legend() {
  const box = $("#legend");
  if (state.mode === "proposed") {
    box.innerHTML = `<span><i style="border-color:var(--ok)"></i>found in code</span><span><i style="border-color:var(--bad);border-top-style:dashed"></i>not found</span><span><i style="border-color:var(--warn);border-top-style:dotted"></i>in code, not in spec</span><span><i style="border-color:var(--gray);border-top-style:dotted"></i>not bound to code</span>`;
  } else if (state.mode === "changes") {
    box.innerHTML = `<span><i style="border-color:var(--ok)"></i>added</span><span><i style="border-color:var(--bad);border-top-style:dashed"></i>removed</span><span><i style="border-color:var(--warn)"></i>changed inside</span>`;
  } else {
    box.innerHTML = `<span>Click to inspect · double-click to open · drag to pan · scroll to zoom</span>`;
  }
}

function reveal(id, mode = state.mode) {
  if (mode !== state.mode) setMode(mode, false);
  if (!SOURCE.nodes.has(id)) return;
  for (const ancestor of ancestors(SOURCE, id)) state.expanded[state.mode].add(ancestor);
  state.selected = id;
  draw();
  center(id);
  inspect();
}

function setMode(mode, render = true) {
  state.mode = mode;
  state.selected = null;
  for (const button of document.querySelectorAll(".tabs button")) button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
  SOURCE = sourceFor(mode);
  $("#strip").hidden = mode !== "changes";
  if (mode === "changes") {
    openChange();
    strip();
  }
  if (render) {
    draw();
    fit();
    inspect();
  }
}

function strip() {
  const box = $("#strip");
  box.innerHTML = H.changes
    .map((change, index) => {
      const total = change.change.nodes.added.length + change.change.nodes.removed.length + change.change.nodes.changed.length + change.change.edges.added.length + change.change.edges.removed.length + change.change.edges.changed.length;
      return `<button data-change="${index}" aria-pressed="${index === state.change}"><strong>${change.pull ? `#${change.pull}` : short(change.after)}</strong> ${total ? `· ${total} changes` : "· no architecture change"}<small>${esc(change.title)}</small></button>`;
    })
    .join("");
}

function evidenceList(list, commit = COMMIT) {
  if (!list?.length) return `<p class="muted">No source line recorded.</p>`;
  return list.map((item) => `<div><a href="${gh(item.path, item.line, commit)}" target="_blank" rel="noopener">${esc(item.path)}:${item.line}</a><code class="line">${esc(item.text)}</code></div>`).join("");
}

function nodeLink(id, mode = state.mode, label) {
  const node = mode === "proposed" ? components.get(id) ?? observedNodes.get(id) : observedNodes.get(id) ?? removedNode(id);
  const text = label ?? (mode === "proposed" && components.get(id) ? components.get(id).name : nameOf(node) || id);
  return `<button class="link" data-go="${esc(id)}" data-mode="${mode}" title="${esc(id)}">${esc(text)}</button>`;
}

function removedNode(id) {
  for (const change of H.changes) {
    const found = change.removed?.nodes?.find((node) => node.id === id);
    if (found) return found;
  }
  return null;
}

function pill(status) {
  const tone = { implemented: "ok", conforms: "ok", partial: "warn", "needs-judgment": "warn", stale: "warn", unspecified: "warn", missing: "bad", diverges: "bad", "not-found": "bad", unbound: "muted" }[status] ?? "muted";
  const text = { implemented: "found in code", conforms: "conforms", partial: "partly found", "needs-judgment": "needs a judgment", stale: "decision is stale", unspecified: "not in spec", missing: "not found in code", diverges: "diverges", "not-found": "not found in code", unbound: "not bound to code" }[status] ?? status;
  return `<span class="pill ${tone}">${esc(text)}</span>`;
}

function specContext(sourceId, line, span = 5) {
  const text = D.intendedTexts?.[sourceId];
  if (!text) return "";
  const lines = text.split("\n");
  const from = Math.max(0, line - 1 - span), to = Math.min(lines.length, line + span);
  return `<div class="context">${lines.slice(from, to).map((value, index) => (from + index + 1 === line ? `<mark>${esc(value)}</mark>` : esc(value))).join("\n")}</div>`;
}

function citations(list) {
  return (list ?? [])
    .map((cite) => {
      const source = sources.get(cite.source);
      return `<details><summary>${esc(source?.path?.split("/").pop() ?? cite.source)} line ${cite.line}</summary><div class="quote">${esc(cite.text)}</div>${specContext(cite.source, cite.line)}<div class="meta">${esc(source?.path ?? "")}</div></details>`;
    })
    .join("");
}

function docMentions(id) {
  const ids = new Set([id]);
  const hits = [];
  for (const document of D.specs.documents) {
    for (const section of document.sections) {
      const match = section.mentions.filter((mention) => ids.has(mention.node));
      if (match.length) hits.push({ document, section, lines: [...new Set(match.flatMap((mention) => mention.lines))] });
    }
  }
  return hits;
}

function docBlock(hits) {
  if (!hits.length) return `<p class="muted">No tracked doc or spec section names it by path or identifier.</p>`;
  const byDoc = new Map();
  for (const hit of hits) {
    if (!byDoc.has(hit.document.path)) byDoc.set(hit.document.path, []);
    byDoc.get(hit.document.path).push(hit);
  }
  return [...byDoc]
    .map(([file, list]) => {
      const text = (D.texts[file] ?? "").split("\n");
      const link = list[0].document.tracked ? `<a href="${gh(file)}" target="_blank" rel="noopener">${esc(file)}</a>` : `<span class="meta">${esc(file)}</span>`;
      return `<details><summary>${esc(list[0].document.title)} (${list.length})</summary>${link}${list
        .map((hit) => `<details><summary>${esc(hit.section.heading)} · lines ${hit.section.line}-${hit.section.end}</summary>${hit.lines.map((line) => `<div class="quote"><span class="muted">${line}:</span> ${esc(text[line - 1] ?? "")}</div>`).join("")}<details><summary>Whole section</summary><div class="context">${esc(text.slice(hit.section.line - 1, hit.section.end).join("\n"))}</div></details></details>`)
        .join("")}</details>`;
    })
    .join("");
}

function coveringComponents(id) {
  if (!C) return [];
  const chain = [id, ...ancestors(observedSource(), id).reverse()];
  const out = [];
  for (const result of C.components) {
    const component = components.get(result.id);
    const hit = chain.find((candidate) => result.matched.includes(candidate));
    if (hit) out.push({ component, result, via: hit });
  }
  return out;
}

function rulesTouching(id) {
  if (!C) return [];
  return C.rules.filter((rule) => (rule.violations ?? []).some((item) => item.edge && (item.edge.includes(`(${id},`) || item.edge.endsWith(`,${id})`))));
}

function changesTouching(id) {
  const out = [];
  H.changes.forEach((change, index) => {
    const steps = change.walkthrough.flatMap((section) => section.steps).filter((step) => step.subject === id || step.subject.includes(`(${id},`) || step.subject.endsWith(`,${id})`));
    if (steps.length) out.push({ change, index, steps });
  });
  return out;
}

function relationships(id) {
  const out = O.edges.filter((edge) => edge.from === id);
  const into = O.edges.filter((edge) => edge.to === id);
  const group = (list, end) => {
    const byKind = new Map();
    for (const edge of list) {
      if (!byKind.has(edge.kind)) byKind.set(edge.kind, []);
      byKind.get(edge.kind).push(edge);
    }
    return [...byKind]
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([kind, edges]) => `<details><summary>${esc(kind.replace(/_/g, " "))} (${edges.length})</summary><ul>${edges.map((edge) => `<li>${nodeLink(edge[end], "code")} <details><summary class="muted">evidence (${edge.evidence_total ?? edge.evidence.length})</summary>${evidenceList(edge.evidence)}</details></li>`).join("")}</ul></details>`)
      .join("");
  };
  return `<details open><summary>Relationships (${out.length} out, ${into.length} in)</summary><h3>Out</h3>${group(out, "to") || '<p class="muted">None.</p>'}<h3>In</h3>${group(into, "from") || '<p class="muted">None.</p>'}</details>`;
}

function attributes(node) {
  const lines = [];
  if (node.functions) lines.push(`<p><strong>Functions:</strong> ${node.functions.map((name) => `<code>${esc(name)}</code>`).join(", ")}</p>`);
  if (node.declarations) lines.push(`<p><strong>Type declarations:</strong> <a href="${gh(node.declarations.path, node.declarations.line)}" target="_blank" rel="noopener">${esc(node.declarations.path)}:${node.declarations.line}</a> ${node.declarations.generated ? pill("conforms") : '<span class="pill warn">written by hand</span>'}</p>`);
  if (node.scopes) lines.push(`<p><strong>Available to scopes:</strong> ${node.scopes.join(", ")}</p>`);
  if (node.scope) lines.push(`<p><strong>Script scope:</strong> ${esc(node.scope.name)} may import ${node.scope.modules.map((name) => `<code>${esc(name)}</code>`).join(", ")}</p>`);
  if (node.condition) lines.push(`<p><strong>Compiled only when:</strong> <code>${esc([].concat(node.condition).join(" and "))}</code></p>`);
  if (node.features) lines.push(`<p><strong>Features:</strong> ${Object.entries(node.features).map(([name, list]) => `<code>${esc(name)}</code> → ${esc(list.join(", "))}`).join("; ")}</p>`);
  if (node.source_outside_crate) lines.push(`<p class="warn"><strong>Compiled from outside the crate:</strong> ${esc(node.file)}</p>`);
  if (node.commands) lines.push(`<p><strong>Run by:</strong> ${node.commands.map((command) => `<code>${esc(command)}</code>`).join(", ")}</p>`);
  return lines.join("");
}

function inspectCode(id) {
  const node = observedNodes.get(id) ?? removedNode(id);
  if (!node) return inspectOverview();
  const members = LAYOUT?.kids.get(id) ?? [];
  const open = state.expanded[state.mode].has(id);
  const covering = coveringComponents(id);
  const rules = rulesTouching(id);
  const docs = docMentions(id);
  const changes = changesTouching(id);
  const fileLink = node.file && !node.file.endsWith("/") ? `<a href="${gh(node.file)}" target="_blank" rel="noopener">${esc(node.file)}</a>` : "";
  return `<h2>${esc(nameOf(node))}</h2><div class="meta">${esc(KIND_TEXT[node.kind] ?? node.kind)} · <code>${esc(node.id)}</code></div>
  ${fileLink ? `<p>${fileLink}</p>` : ""}
  ${members.length ? `<div class="row"><button data-toggle="${esc(id)}">${open ? "Close" : "Open"} ${members.length} members</button></div>` : ""}
  ${attributes(node)}
  <details open><summary>Where it is (${node.evidence_total ?? node.evidence.length})</summary>${evidenceList(node.evidence)}</details>
  ${node.kind === "container" ? "" : relationships(id)}
  <details ${covering.length || rules.length ? "open" : ""}><summary>Proposed architecture (${covering.length} component${covering.length === 1 ? "" : "s"}, ${rules.length} rule${rules.length === 1 ? "" : "s"} broken)</summary>
    ${covering.length ? `<ul>${covering.map(({ component, result, via }) => `<li>${nodeLink(component.id, "proposed")} ${pill(result.status)}${via !== id ? ` <span class="muted">through ${esc(via)}</span>` : ""}</li>`).join("")}</ul>` : `<p class="muted">No proposed component names this ${C ? "or its parents" : "(no spec comparison loaded)"}.</p>`}
    ${rules.map((rule) => `<p>${pill(rule.result)} ${esc(I.rules.find((item) => item.id === rule.id)?.statement ?? rule.id)} <button class="link" data-rule="${esc(rule.id)}">open rule</button></p>`).join("")}
  </details>
  <details><summary>Mentioned in docs and specs (${docs.length} section${docs.length === 1 ? "" : "s"})</summary>${docBlock(docs)}</details>
  <details ${changes.length ? "" : ""}><summary>Changed in merged PRs (${changes.length})</summary>${changes.length ? `<ul>${changes.map(({ change, index, steps }) => `<li><button class="link" data-change="${index}">${change.pull ? `#${change.pull}` : short(change.after)} ${esc(change.title)}</button><ul>${steps.slice(0, 6).map((step) => `<li>${esc(step.text)}</li>`).join("")}${steps.length > 6 ? `<li class="muted">and ${steps.length - 6} more</li>` : ""}</ul></li>`).join("")}</ul>` : '<p class="muted">Not changed in the recorded history.</p>'}</details>`;
}

function inspectComponent(id) {
  const component = components.get(id);
  if (!component) {
    if (id === "group:unspecified") return `<h2>In code, not in the specs</h2><p>These code nodes are not bound to any proposed component. Each one is either missing from the specs or a binding the spec reader has not made yet.</p><ul>${C.unspecified.nodes.map((node) => `<li>${nodeLink(node, "code")} <span class="muted">${esc(KIND_TEXT[observedNodes.get(node)?.kind] ?? "")}</span></li>`).join("")}</ul>`;
    return observedNodes.has(id) ? `<p class="muted">This node is in the code but no proposed component covers it.</p>${inspectCode(id)}` : inspectOverview();
  }
  const result = compared.components.get(id);
  const out = I.relations.filter((relation) => relation.from === id);
  const into = I.relations.filter((relation) => relation.to === id);
  const rules = I.rules.filter((rule) => (rule.applies_to ?? []).includes(id));
  const unspecified = (C?.unspecified?.relations ?? []).filter((pair) => pair.from === id || pair.to === id);
  const relationItem = (relation, end) => {
    const found = compared.relations.get(relation.id);
    return `<li>${esc(relation.kind.replace(/_/g, " "))} ${nodeLink(relation[end], "proposed")} ${pill(found?.status)}<details><summary class="muted">${esc(relation.summary)}</summary>${found?.path ? `<p>Found through: ${found.path.map((edge) => `<code>${esc(edge)}</code>`).join(" then ")}</p>${found.path.map((edgeId) => evidenceList(O.edges.find((edge) => edge.id === edgeId)?.evidence?.slice(0, 2))).join("")}` : `<p class="muted">No chain of at most two code relationships of a matching kind connects the bound code.</p>`}${citations(relation.cite)}</details></li>`;
  };
  return `<h2>${esc(component.name)}</h2><div class="meta">proposed component · <code>${esc(id)}</code></div>
  <p>${pill(result?.status)}</p><p>${esc(component.summary)}</p>
  ${component.note ? `<p class="muted">${esc(component.note)}</p>` : ""}
  <details open><summary>What the specs say (${(component.cite ?? []).length})</summary>${citations(component.cite)}</details>
  <details open><summary>Where it is in code (${result?.matched?.length ?? 0})</summary>
    ${result?.matched?.length ? `<ul>${result.matched.map((node) => `<li>${nodeLink(node, "code")} <span class="muted">${esc(node)}</span></li>`).join("")}</ul>` : '<p class="muted">Nothing bound.</p>'}
    ${result?.unmatched?.length ? `<p class="bad">Named in the binding but not found: ${result.unmatched.map((item) => `<code>${esc(item)}</code>`).join(", ")}</p>` : ""}
    ${result?.unclaimed?.length ? `<details><summary>Code inside it that no sub-component names (${result.unclaimed.length})</summary><ul>${result.unclaimed.map((node) => `<li>${nodeLink(node, "code")}</li>`).join("")}</ul></details>` : ""}
  </details>
  <details open><summary>Proposed relationships (${out.length} out, ${into.length} in)</summary><ul>${out.map((relation) => relationItem(relation, "to")).join("")}${into.map((relation) => relationItem(relation, "from")).join("")}</ul></details>
  <details ${rules.length ? "open" : ""}><summary>Rules (${rules.length})</summary>${rules.map(ruleBlock).join("") || '<p class="muted">No rule applies directly.</p>'}</details>
  <details><summary>In code, not in the spec (${unspecified.length})</summary>${unspecified.length ? `<ul>${unspecified.map((pair) => `<li>${nodeLink(pair.from, "proposed")} → ${nodeLink(pair.to, "proposed")} <span class="muted">${pair.count} code relationship${pair.count > 1 ? "s" : ""}</span><details><summary class="muted">examples</summary>${pair.edges.map((edgeId) => `<p><code>${esc(edgeId)}</code></p>${evidenceList(O.edges.find((edge) => edge.id === edgeId)?.evidence?.slice(0, 1))}`).join("")}</details></li>`).join("")}</ul>` : '<p class="muted">None.</p>'}</details>`;
}

function ruleBlock(rule) {
  const result = compared.rules.get(rule.id);
  const notes = (D.notes ?? []).filter((note) => note.subject === rule.id);
  return `<details ${result?.result === "diverges" ? "open" : ""}><summary>${pill(result?.result)} ${esc(rule.statement)}</summary>
    ${result?.violations?.length ? `<p><strong>Where the code differs:</strong></p>${result.violations.map((item) => (item.edge ? `<p><code>${esc(item.edge)}</code>${item.basis === "annotated" ? ' <span class="pill muted">from a recorded resolution</span>' : ""}</p>${evidenceList([item.evidence].filter(Boolean))}` : `<p><code>${esc(item.package)}</code> is reachable in Cargo.lock</p>`)).join("")}` : ""}
    ${result?.checked ? `<p class="muted">Checked: ${esc(result.checked)}</p>` : ""}
    ${result?.question ? `<p><strong>Question for a reviewer:</strong> ${esc(result.question)}</p>` : ""}
    ${result?.decision ? `<p><strong>Recorded decision (${esc(result.decision.by ?? "reviewer")}):</strong> ${esc(result.decision.rationale)}</p>${evidenceList(result.decision.evidence)}` : ""}
    ${notes.map((note) => `<p><strong>Note (${esc(note.by ?? "reviewer")}):</strong> ${esc(note.text)}</p>`).join("")}
    <p class="muted">Check: <code>${esc(JSON.stringify(rule.check))}</code></p>
    ${citations(rule.cite)}</details>`;
}

function hunkFor(change, step) {
  const list = change.hunks?.[step.evidence?.path];
  if (!list) return "";
  const hunk = list.find((item) => {
    const [from, to] = step.side === "before" ? item.before : item.after;
    return step.evidence.line >= from && step.evidence.line < Math.max(to, from + 1);
  });
  if (!hunk) return "";
  const body = hunk.text
    .split("\n")
    .map((line) => `<span class="${line.startsWith("@@") ? "hunk" : line.startsWith("+") ? "add" : line.startsWith("-") ? "del" : ""}">${esc(line)}</span>`)
    .join("\n");
  return `<details><summary class="muted">code change</summary><pre>${body}</pre></details>`;
}

function inspectChange(id) {
  const change = currentChange();
  if (!change) return `<p class="muted">No recorded history.</p>`;
  const total = change.totals;
  const narrative = (D.narratives ?? []).find((item) => item.change === `${short(change.before)}..${short(change.after)}`);
  const head = `<h2>${change.pull ? `#${change.pull} ` : ""}${esc(change.title)}</h2>
  <div class="meta">${change.pull ? `<a href="${D.repository}/pull/${change.pull}" target="_blank" rel="noopener">pull request</a> · ` : ""}<a href="${D.repository}/compare/${change.before}...${change.after}" target="_blank" rel="noopener">${short(change.before)}…${short(change.after)}</a></div>
  <p>${total.nodes.added + total.nodes.removed + total.nodes.changed + total.edges.added + total.edges.removed + total.edges.changed === 0 ? "No architecture change: nodes and relationships are identical before and after." : `Nodes: ${total.nodes.added} added, ${total.nodes.removed} removed, ${total.nodes.changed} changed. Relationships: ${total.edges.added} added, ${total.edges.removed} removed, ${total.edges.changed} changed.`}</p>
  ${narrative ? `<div class="quote">${esc(narrative.summary)}<div class="meta">${narrative.key === change.key ? `Written by ${esc(narrative.by ?? "a reviewer")} from this exact change set.` : "Stale: the change set differs from the one this summary was written for."}</div></div>` : ""}
  ${change.documents?.length ? `<p><strong>Docs changed:</strong> ${change.documents.map((file) => `<a href="${gh(file, null, change.after)}" target="_blank" rel="noopener">${esc(file)}</a>`).join(", ")}</p>` : ""}`;
  let focus = "";
  if (id) {
    const steps = change.walkthrough.flatMap((section) => section.steps).filter((step) => step.subject === id || step.subject.includes(`(${id},`) || step.subject.endsWith(`,${id})`));
    const members = new Set([id, ...[...observedNodes.values(), ...(change.removed?.nodes ?? [])].filter((node) => ancestors(SOURCE, node.id).includes(id)).map((node) => node.id)]);
    const inside = change.walkthrough.flatMap((section) => section.steps).filter((step) => !steps.includes(step) && [...members].some((member) => step.subject === member || step.subject.includes(`(${member},`)));
    focus = `<h3>${esc(SOURCE.nodes.get(id)?.label ?? id)} in this change</h3>${steps.length || inside.length ? `<ul>${[...steps, ...inside].slice(0, 60).map((step) => stepItem(change, step)).join("")}</ul>` : '<p class="muted">Not changed by this PR.</p>'}<p>${nodeLink(id, "code", "Open in the code view")}</p>`;
  }
  const sections = change.walkthrough.map((section) => `<details ${change.walkthrough.length <= 2 ? "open" : ""}><summary>${esc(section.headline)}</summary><ul>${section.steps.slice(0, 80).map((step) => stepItem(change, step)).join("")}${section.steps.length > 80 ? `<li class="muted">and ${section.steps.length - 80} more in history.yaml</li>` : ""}</ul></details>`).join("");
  return `${head}${focus}<h3>Walkthrough generated from the diff</h3>${sections || '<p class="muted">Nothing to walk through.</p>'}`;
}

function stepItem(change, step) {
  const commit = step.side === "before" ? change.before : change.after;
  const subject = step.subject.includes("(") ? step.subject.slice(step.subject.indexOf("(") + 1, step.subject.indexOf(",")) : step.subject;
  return `<li><span class="${step.change === "added" ? "ok" : step.change === "removed" ? "bad" : "warn"}">${esc(step.change)}</span> ${esc(step.text)} <button class="link" data-focus="${esc(subject)}">show</button>${step.evidence ? `<div><a href="${gh(step.evidence.path, step.evidence.line, commit)}" target="_blank" rel="noopener">${esc(step.evidence.path)}:${step.evidence.line}</a><code class="line">${esc(step.evidence.text)}</code></div>${hunkFor(change, step)}` : ""}</li>`;
}

function inspectOverview() {
  if (state.mode === "proposed") {
    if (!C) return `<h2>No spec comparison loaded</h2><p>Build with <code>--intended</code> to compare a spec-derived YAML with the code.</p>`;
    const counts = (object) => Object.entries(object).map(([key, value]) => `${pill(key)} ${value}`).join(" ");
    const rules = [...I.rules].sort((a, b) => rank(compared.rules.get(a.id)?.result) - rank(compared.rules.get(b.id)?.result));
    return `<h2>Proposed vs code</h2><p>The proposed architecture is a YAML file derived from ${I.sources.length} spec sources. Every component, relationship and rule cites the spec line it comes from. The comparison binds it to the code YAML at <code>${short(COMMIT)}</code>.</p>
    <h3>Components</h3><p>${counts(C.summary.components)}</p><h3>Relationships</h3><p>${counts(C.summary.relations)}</p><h3>Rules</h3><p>${counts(C.summary.rules)}</p>
    <p class="muted">${C.summary.unspecified_nodes} code nodes and ${C.summary.unspecified_relations} component-level relationships are in code but not in the specs. ${C.provenance.citations.checked} spec citations checked, ${C.provenance.citations.mismatched.length} no longer match. Spec sources: ${C.provenance.intended.filter((item) => item.state === "current").length} of ${C.provenance.intended.length} unchanged since extraction.</p>
    <h3>Rules</h3>${rules.map(ruleBlock).join("")}
    <details><summary>Spec gaps noted while extracting (${(I.gaps ?? []).length})</summary><ul>${(I.gaps ?? []).map((gap) => `<li>${esc(gap)}</li>`).join("")}</ul></details>
    <details><summary>Spec sources (${I.sources.length})</summary><ul>${I.sources.map((source) => `<li>${esc(source.title)} <span class="muted">${esc(source.path)}</span> ${pill(C.provenance.intended.find((item) => item.id === source.id)?.state === "current" ? "conforms" : "stale")}<div class="muted">${esc(source.role)}</div></li>`).join("")}</ul></details>
    <p><a href="intended.yaml">intended.yaml</a> · <a href="comparison.yaml">comparison.yaml</a></p>`;
  }
  if (state.mode === "changes") return inspectChange(null);
  const coverage = Object.entries(O.coverage)
    .map(([token, item]) => `<tr><td><code>${esc(token)}</code></td><td>${item.total}</td><td>${item.facts}</td><td>${item.test}</td><td class="${item.unresolved ? "warn" : ""}">${item.unresolved}</td></tr>`)
    .join("");
  const kinds = [...new Set(O.edges.map((edge) => edge.kind))].sort();
  return `<h2>Code architecture</h2><p>Generated from commit <a href="${D.repository}/commit/${COMMIT}" target="_blank" rel="noopener"><code>${short(COMMIT)}</code></a>: ${O.nodes.length} nodes and ${O.edges.length} relationships, each with the source line it came from. Open a crate or group to see its members.</p>
  <div class="row"><a class="icon" href="observed.yaml">observed.yaml</a><a class="icon" href="specs.yaml">specs.yaml</a><a class="icon" href="history.yaml">history.yaml</a></div>
  <details><summary>Relationship kinds shown</summary>${kinds.map((kind) => `<label style="display:block"><input type="checkbox" data-kind="${kind}" ${hiddenKinds.has(kind) ? "" : "checked"}> ${esc(kind.replace(/_/g, " "))} (${O.edges.filter((edge) => edge.kind === kind).length})</label>`).join("")}</details>
  <details open><summary>Unresolved (${O.unresolved.length})</summary><p class="muted">Code the extractor saw but could not turn into a fact. Nothing is dropped silently.</p><ul>${O.unresolved.map((item) => `<li><code>${esc(item.kind)}</code> in ${nodeLink(item.subject, "code")}: ${esc(item.reason)}${item.argument ? ` (<code>${esc(item.argument)}</code>)` : ""}${item.evidence ? evidenceList([item.evidence]) : ""}${resolutionFor(item.id)}</li>`).join("")}</ul></details>
  <details><summary>Coverage of trigger tokens</summary><table><tr><th>Token</th><th>Seen</th><th>Facts</th><th>Tests</th><th>Unresolved</th></tr>${coverage}</table></details>
  <details><summary>Provenance</summary><table>${Object.entries({ commit: COMMIT, tree: O.provenance.source.tree, generator: O.provenance.generator.version, rules: O.provenance.generator.rules, ...O.provenance.tools }).map(([key, value]) => `<tr><td>${esc(key)}</td><td><code>${esc(value)}</code></td></tr>`).join("")}</table></details>`;
}

function resolutionFor(id) {
  const found = C?.annotations?.resolutions?.find((item) => item.unresolved === id);
  return found ? `<p>${pill(found.state === "current" ? "conforms" : "stale")} Resolved by a recorded decision: ${esc(found.to)}. ${esc(found.note ?? "")}</p>` : "";
}

function rank(result) {
  return { diverges: 0, stale: 1, "needs-judgment": 2, conforms: 3 }[result] ?? 4;
}

function inspect() {
  const id = state.selected;
  const box = $("#inspector");
  if (id && id.includes("\u0000")) box.innerHTML = inspectEdge(id);
  else if (state.mode === "proposed") box.innerHTML = id ? inspectComponent(id) : inspectOverview();
  else if (state.mode === "changes") box.innerHTML = id ? `${inspectChange(id)}` : inspectOverview();
  else box.innerHTML = id ? inspectCode(id) : inspectOverview();
}

function inspectEdge(key) {
  const [from, to] = key.split("\u0000");
  const edge = LAYOUT.edges.find((item) => item.from === from && item.to === to);
  if (!edge) return inspectOverview();
  return `<h2>${esc(SOURCE.nodes.get(from)?.label)} → ${esc(SOURCE.nodes.get(to)?.label)}</h2><div class="meta">${edge.items.length} relationship${edge.items.length > 1 ? "s" : ""} between the visible boxes</div><ul>${edge.items
    .slice(0, 80)
    .map((item) => `<li>${state.mode === "proposed" ? pill(item.status) : ""}<code>${esc(item.id)}</code>${item.data?.summary ? `<div>${esc(item.data.summary)}</div>` : ""}${item.data?.evidence ? evidenceList(item.data.evidence.slice(0, 3)) : ""}${item.data?.edges ? item.data.edges.map((edgeId) => `<div><code>${esc(edgeId)}</code></div>`).join("") : ""}</li>`)
    .join("")}</ul>`;
}

function writeHash() {
  const parts = new URLSearchParams();
  parts.set("mode", state.mode);
  if (state.selected && !state.selected.includes("\u0000")) parts.set("node", state.selected);
  const open = [...state.expanded[state.mode]];
  if (open.length) parts.set("open", open.join(","));
  if (state.mode === "changes" && currentChange()) parts.set("pr", currentChange().pull ?? short(currentChange().after));
  history.replaceState(null, "", `#${parts.toString()}`);
}

function readHash() {
  const parts = new URLSearchParams(location.hash.slice(1));
  const mode = parts.get("mode");
  if (["code", "proposed", "changes"].includes(mode)) state.mode = mode;
  const pr = parts.get("pr");
  if (pr) {
    const index = H.changes.findIndex((change) => String(change.pull) === pr || short(change.after) === pr);
    if (index >= 0) state.change = index;
  }
  for (const id of (parts.get("open") ?? "").split(",").filter(Boolean)) state.expanded[state.mode].add(id);
  state.selected = parts.get("node");
}

$("#commit").textContent = `${short(COMMIT)} · ${O.nodes.length} nodes · ${O.edges.length} relationships`;
document.querySelector(".tabs").addEventListener("click", (event) => {
  const mode = event.target.closest("button")?.dataset.mode;
  if (mode) setMode(mode);
});
function openChange() {
  const change = currentChange();
  if (!change) return;
  const subjects = [...change.change.nodes.added, ...change.change.nodes.removed, ...change.change.nodes.changed.map((item) => item.id), ...[...change.change.edges.added, ...change.change.edges.removed, ...change.change.edges.changed.map((item) => item.id)].map((id) => id.slice(id.indexOf("(") + 1, id.indexOf(",")))];
  const unique = [...new Set(subjects)].filter((id) => SOURCE.nodes.has(id));
  if (unique.length > 12 || !unique.length) return null;
  for (const id of unique) for (const ancestor of ancestors(SOURCE, id)) state.expanded.changes.add(ancestor);
  return [...change.change.nodes.added, ...change.change.nodes.changed.map((item) => item.id), ...unique].find((id) => SOURCE.nodes.has(id)) ?? null;
}
$("#strip").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-change]");
  if (!button) return;
  state.change = Number(button.dataset.change);
  state.selected = null;
  SOURCE = sourceFor("changes");
  const focus = openChange();
  strip();
  draw();
  fit();
  if (focus) center(focus);
  inspect();
});
$("#nodes").addEventListener("click", (event) => {
  const id = event.target.closest(".node")?.dataset.id;
  if (!id) return;
  state.selected = id;
  draw();
  inspect();
});
$("#nodes").addEventListener("dblclick", (event) => toggle(event.target.closest(".node")?.dataset.id));
$("#groups").addEventListener("click", (event) => {
  const collapse = event.target.closest("[data-collapse]")?.dataset.collapse;
  const id = event.target.closest(".group")?.dataset.id;
  if (collapse && event.detail === 1) {
    state.selected = collapse;
    draw();

});
$("#groups").addEventListener("dblclick", (event) => toggle(event.target.closest(".group")?.dataset.id));
$("#edges").addEventListener("click", (event) => {
  const key = event.target.closest(".edge")?.dataset.edge;
  if (!key) return;
  state.selected = key;
  draw();

});
function toggle(id) {
  if (!id || !(LAYOUT.kids.get(id) ?? []).length) return;
  const set = state.expanded[state.mode];
  if (set.has(id)) {
    set.delete(id);
    for (const other of [...set]) if (ancestors(SOURCE, other).includes(id)) set.delete(other);
  } else set.add(id);
  state.selected = id;
  draw();
  if (set.has(id)) center(id);
  inspect();
}
$("#inspector").addEventListener("click", (event) => {
  const target = event.target.closest("[data-go],[data-toggle],[data-change],[data-focus],[data-rule]");
  if (!target) return;
  if (target.dataset.go) reveal(target.dataset.go, target.dataset.mode);
  else if (target.dataset.toggle) toggle(target.dataset.toggle);
  else if (target.dataset.change) {
    state.change = Number(target.dataset.change);
    const keep = state.selected;
    setMode("changes");
    if (keep && SOURCE.nodes.has(keep)) reveal(keep);
  } else if (target.dataset.focus) reveal(target.dataset.focus);
  else if (target.dataset.rule) {
    const rule = I.rules.find((item) => item.id === target.dataset.rule);
    const first = rule?.applies_to?.[0];
    if (first) reveal(first, "proposed");
  }
});
$("#inspector").addEventListener("change", (event) => {
  const kind = event.target.dataset.kind;
  if (!kind) return;
  if (event.target.checked) hiddenKinds.delete(kind);
  else hiddenKinds.add(kind);
  draw();
});
$("#fit").addEventListener("click", fit);
$("#collapse").addEventListener("click", () => {
  state.expanded[state.mode].clear();
  state.selected = null;
  draw();

});
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
});
const svg = $("#svg");
let drag = null;
svg.addEventListener("pointerdown", (event) => {
  if (event.target.closest(".node,.edge,.group text")) return;
  drag = { x: event.clientX, y: event.clientY, view: { ...state.view }, moved: false };
  svg.classList.add("panning");
});
window.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  state.view = { ...drag.view, x: drag.view.x + dx, y: drag.view.y + dy };
  applyView();
});
window.addEventListener("pointerup", (event) => {
  if (drag && !drag.moved && !event.target.closest?.(".node,.edge,.group")) {
    state.selected = null;
    draw();
    inspect();
  }
  drag = null;
  svg.classList.remove("panning");
});
svg.addEventListener("wheel", (event) => {
  event.preventDefault();
  const rect = svg.getBoundingClientRect();
  const k = Math.min(3, Math.max(0.12, state.view.k * Math.exp(-event.deltaY * 0.0015)));
  const px = event.clientX - rect.left, py = event.clientY - rect.top;
  state.view = { k, x: px - ((px - state.view.x) / state.view.k) * k, y: py - ((py - state.view.y) / state.view.k) * k };
  applyView();
}, { passive: false });
const search = $("#search");
const results = $("#results");
search.addEventListener("input", () => {
  const query = search.value.trim().toLowerCase();
  if (!query) {
    results.hidden = true;
    return;
  }
  const matches = [...SOURCE.nodes.values()].filter((node) => node.label.toLowerCase().includes(query) || node.id.toLowerCase().includes(query)).slice(0, 14);
  results.innerHTML = matches.map((node) => `<button data-hit="${esc(node.id)}">${esc(node.label)}<small>${esc(node.id)}</small></button>`).join("") || `<button disabled>No match</button>`;
  results.hidden = false;
});
search.addEventListener("keydown", (event) => {
  if (event.key === "Enter") results.querySelector("button[data-hit]")?.click();
  if (event.key === "Escape") (search.value = ""), (results.hidden = true);
});
results.addEventListener("click", (event) => {
  const id = event.target.closest("[data-hit]")?.dataset.hit;
  if (!id) return;
  results.hidden = true;
  search.value = "";
  reveal(id);
});
document.addEventListener("keydown", (event) => {
  if (event.key === "/" && document.activeElement !== search) {
    event.preventDefault();
    search.focus();
  } else if (event.key === "Escape" && document.activeElement !== search) {
    state.selected = null;
    draw();
    inspect();
  }
});
window.addEventListener("resize", () => applyView());
readHash();
const startMode = state.mode;
const startSelected = state.selected;
state.mode = "";
setMode(startMode, false);
state.selected = startSelected && SOURCE.nodes.has(startSelected) ? startSelected : null;
if (state.selected) for (const ancestor of ancestors(SOURCE, state.selected)) state.expanded[state.mode].add(ancestor);
draw();
fit();
if (state.selected) center(state.selected);
inspect();
</script>
</body>
</html>
