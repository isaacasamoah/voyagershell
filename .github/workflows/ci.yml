name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    name: Build Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Placeholder values so Next.js env validation passes in CI
          # (not connecting to real services)
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          OPENAI_API_KEY: placeholder
          GOOGLE_GENERATIVE_AI_API_KEY: placeholder

      # TODO: wire npm run test:run here once the project has test files.
      # Currently `vitest run` exits with code 1 ("No test files found") so
      # including it would always fail. Add after the first *.test.ts lands.
