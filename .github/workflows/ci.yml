name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  build:
    name: Build Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Strict changed-file line cap
        env:
          LINE_CAP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-changed-file-lines.sh "$LINE_CAP_BASE"

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          # Placeholder values so Next.js env validation passes in CI
          # (not connecting to real services)
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          ANTHROPIC_API_KEY: placeholder
          OPENAI_API_KEY: placeholder
          GOOGLE_GEMINI_API_KEY: placeholder

      - name: Test
        run: npm run test:run

      - name: Recipe syntax
        run: find recipes -type f -name '*.sh' -print0 | xargs -0 bash -n

      - name: Pull installed-authority database image
        run: docker pull pgvector/pgvector@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee

      - name: Prove installed schema authority
        run: ./recipes/installed-schema-authority.sh
