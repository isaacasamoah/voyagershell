name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

run-name: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('dry run {0}', github.ref_name) }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.99.1
  ZIG_VERSION: 0.17.0
  IS_TAG: ${{ github.ref_type == 'tag' }}

jobs:
  ci-passed:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion) \(.id)"') || run="api error"
            echo "checks for $GITHUB_SHA: $run"
            case "$run" in
              "completed success "*) exit 0 ;;
              "completed cancelled "*) echo "cancelled by a duplicate: this job keeps waiting for a rerun" ;;
              completed*) exit 1 ;;
            esac
            sleep 30
          done

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Native build libraries
        timeout-minutes: 20
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=5 -o Acquire::http::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          xargs -a .github/native-apt-packages.txt sudo apt-get install -y --no-install-recommends "${apt_options[@]}"
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          for crate in app contract desktop; do
            have=$(sed -n 's/^version = "\(.*\)"/\1/p' "$crate/Cargo.toml" | head -1)
            [ "v$have" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but $crate/Cargo.toml says v$have"; exit 1; }
          done
      - run: python3 desktop/prepare-sdk.py
      - name: Build
        env:
          VOYAGER_RELEASE: "1"
        run: cargo build --release --locked -p voyager-desktop -p voyager-app --bin voyager-shell --bin voyager
      - name: The build runs and reports its version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          core=$(tr -d '[:space:]' < distribution/core-version)
          report=$(target/release/voyager-shell --version)
          echo "$report"
          [ "$(printf '%s\n' "$report" | sed -n 1p)" = "voyager-shell $version" ] || { echo "version line is wrong"; exit 1; }
          [ "$(printf '%s\n' "$report" | sed -n 2p)" = "core: $core" ] || { echo "core line is wrong"; exit 1; }
      - name: Pack
        run: scripts/package target/release dist
      - name: Manifest
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/Cargo.toml | head -1)
          node scripts/release-data.cjs manifest \
            --version "$version" \
            --commit "$GITHUB_SHA" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/voyagershell-linux-x86_64.tar.gz" \
            --archive dist/voyagershell-linux-x86_64.tar.gz > dist/latest.json
          cat dist/latest.json
          cp distribution/install.sh dist/install.sh
          node scripts/release-data.cjs entry "$version" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voyagershell-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, ci-passed]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: voyagershell-dist
          path: dist
      - name: Create the release and upload its files, latest.json last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "VoyagerShell $version" --notes-file dist/notes.md \
            dist/voyagershell-linux-x86_64.tar.gz dist/install.sh
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/latest.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
