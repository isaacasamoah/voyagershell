rules:
  - id: no-experiment-includes
    check: forbid_code
    from: ['*']
    to: ['source:experiments/*', 'files:experiments/*', 'rs:*experiments*']
  - id: no-unresolved-includes
    check: forbid_unresolved
    kinds: ['include_str!/include_bytes!(', 'include!(']
  - id: contract-stays-low
    check: forbid_reach
    from: voyager-contract
    to: ['gpui*', voyager-app, voyager-desktop]
  - id: voyage-close-not-on-client
    check: forbid_code
    from: ['rs:voyager_app::families::voyage_close*']
    to: ['rs:voyager_app::client*']
    kinds: [uses]
  - id: families-stay-apart
    check: forbid_cross
    group: 'rs:voyager_app::families::'
    kinds: [uses]
  - id: families-not-aliased
    check: forbid_code
    from: ['rs:voyager_app']
    to: ['rs:voyager_app::families*']
  - id: families-reach-shared-only
    check: forbid_code
    from: ['rs:voyager_app::families*']
    to: ['rs:voyager_app::*']
    except: ['rs:voyager_app::families*', 'rs:voyager_app::activity', 'rs:voyager_app::activity::*', 'rs:voyager_app::core', 'rs:voyager_app::core::*', 'rs:voyager_app::core_shapes', 'rs:voyager_app::core_shapes::*', 'rs:voyager_app::core_state', 'rs:voyager_app::core_state::*', 'rs:voyager_app::layout_parts', 'rs:voyager_app::layout_parts::*', 'rs:voyager_app::observation', 'rs:voyager_app::observation::*', 'rs:voyager_app::panels', 'rs:voyager_app::panels::*', 'rs:voyager_app::scope', 'rs:voyager_app::scope::*', 'rs:voyager_app::workspace', 'rs:voyager_app::workspace::*']
  - id: families-no-widened-visibility
    check: forbid_text
    pattern: 'pub\s*\(\s*(super|in)\b'
    roots: ['app/src/families/*']
  - id: no-module-cycles
    check: acyclic
    kind: uses
  - id: no-child-cycles
    check: acyclic
    kind: uses
    children: true
  - id: no-script-cycles
    check: acyclic
    kind: imports
  - id: file-size
    check: max_lines
    limit: 1000
    roots: ['app/*', 'contract/src/*', 'desktop/src/*', 'desktop/canvas/*', 'content/*', 'tests/architecture/*']
    exclude: ['contract/generated/*']
  - id: one-vocabulary
    check: forbid_terms
    table: vocabulary.yaml
  - id: notes-type-has-one-home
    check: forbid_literal
    literals: [notes]
    owner: app/src/vessel_type.rs
    roots: ['app/src/**', 'contract/src/**', 'desktop/src/**']
    tests: skip
  - id: agent-names-stay-in-adapters
    check: forbid_literal
    terms: [claude, codex]
    extensions: ['.rs', '.ts']
    owners:
      - app/src/codex.rs
      - app/src/codex_protocol.rs
      - app/src/focus_hook.rs
      - app/src/reply_hook.rs
    roots: ['app/src/**', 'contract/src/**', 'desktop/src/**', 'desktop/canvas/**', 'content/**']
    exclude: ['contract/generated/*']
    tests: skip
  - id: one-owner-per-module
    check: one_owner
  - id: intended-edges
    check: intended_edges
