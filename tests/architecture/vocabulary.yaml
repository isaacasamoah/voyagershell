    old: '(?<!Context::)(?<!RenameTarget::)(?<!Scope::)\bVessel\b(?!\s*\{\s*id:\s*PlacementId)'
    new: 'Placement'
    files: ['**/*.rs', 'desktop/canvas/*.ts']
    code: true
    ban: false
