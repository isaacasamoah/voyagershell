settings:
  kinds: [rs, ts, js, cjs, json, md, toml, yaml, yml, py, patch, txt, html, sh]
  skip:
    - 'experiments/**'
    - 'tests/architecture/vocabulary.*'
    - 'desktop/patches/**'
    - '**/Cargo.lock'
    - '**/package-lock.json'
  generated:
    - 'contract/generated/**'
    - 'desktop/script-types.json'
    - 'desktop/canvas/*.js'
    - 'content/ui.js'
    - 'content/notes/main.js'

exceptions:
  - text: '--native-mod-host'
    reason: 'Legacy reproduction route flag. The retained Python route keeps its name until its journeys are retired.'
  - text: 'proof_native_mod_host.py'
    reason: 'Legacy reproduction driver. It keeps its name until it is retired.'
  - text: 'Herdr worktree mod'
    reason: 'Herdr App calls its own scripts mods. This names that upstream feature.'

moves:
  - {stage: 2, from: desktop/mods/header, to: desktop/canvas}
  - {stage: 2, from: desktop/canvas/canvas.ts, to: desktop/canvas/regions.ts}
  - {stage: 2, from: desktop/canvas/canvas.js, to: desktop/canvas/regions.js}
  - {stage: 2, from: desktop/canvas/mod.json, to: desktop/canvas/canvas.json}
  - {stage: 2, from: content/notes/mod.json, to: content/notes/vessel.json}

rules:
  - id: canvas-package-path
    stage: 2
    group: canvas-package
    old: 'desktop/mods/header'
    new: 'desktop/canvas'
  - id: canvas-package-root
    stage: 2
    group: canvas-package
    old: 'desktop/mods\b'
    new: 'desktop/canvas'
  - id: canvas-profile-path
    stage: 2
    group: canvas-package
    old: '\bmods/header\b'
    new: 'canvas'
  - id: canvas-manifest-path
    stage: 2
    group: canvas-package
    old: 'canvas/mod\.json'
    new: 'canvas/canvas.json'
  - id: canvas-seed-manifest
    stage: 2
    group: canvas-package
    old: 'package\.join\("mod\.json"\)'
    new: 'package.join("canvas.json")'
    files: ['desktop/src/lib.rs']
  - id: canvas-import-depth
    stage: 2
    old: '\.\./\.\./\.\./'
    new: '../../'
    files: ['desktop/canvas/*.ts']
    ban: false
  - id: vessel-package-path
    stage: 2
    group: vessel-package
    old: '\bmods/'
    new: 'vessels/'
  - id: vessel-package-directory
    stage: 2
    group: vessel-package
    old: '"mods"'
    new: '"vessels"'
  - id: vessel-manifest
    stage: 2
    group: vessel-package
    old: '\bmod\.json\b'
    new: 'vessel.json'
  - id: theme-module
    stage: 2
    group: theme-module
    old: '\bvoyager_header\b'
    new: 'voyager_theme'
  - id: theme-module-constant
    stage: 2
    group: theme-module
    old: '\bHEADER_MODULE\b'
    new: 'THEME_MODULE'
  - id: canvas-manifest-name
    stage: 2
    old: '"Voyager header"'
    new: '"Voyager canvas"'
    ban: false
  - id: canvas-host-messages
    stage: 2
    old: '\bHeader (load|reload|manifest)'
    new: 'Canvas $1'
    files: ['desktop/src/*.rs']
    ban: false
  - id: canvas-host-manifest-message
    stage: 2
    old: 'Reading header manifest'
    new: 'Reading canvas manifest'
    files: ['desktop/src/lib.rs']
    ban: false
  - id: canvas-host-type
    stage: 2
    group: canvas-package
    old: '\bHeader\b'
    new: 'CanvasHost'
    files: ['desktop/src/*.rs']
    code: true
  - id: canvas-host-binding
    stage: 2
    group: canvas-package
    old: '\bheader\b'
    new: 'canvas'
    files: ['desktop/src/host.rs', 'desktop/src/quit.rs', 'desktop/src/lib.rs']
    code: true
  - id: canvas-host-render-counter
    stage: 2
    old: '"header_renders"'
    new: '"canvas_renders"'
    ban: false
  - id: canvas-script-scope
    stage: 2
    old: '"header"'
    new: '"canvas"'
    files: ['desktop/typecheck.cjs', 'tests/architecture/config.json']
    ban: false
  - id: canvas-root-class
    stage: 2
    old: '\bWorkspace\b'
    new: 'Canvas'
