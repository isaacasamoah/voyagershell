    stage: 3
    group: vessel-ids
    old: '\bContentId\b'
    new: 'VesselId'
  - id: placement-owner-type
    stage: 3
    group: placement-names
    old: '\bPanelOwner\b'
    new: 'PlacementOwner'
  - id: placement-insertion-type
    stage: 3
    group: placement-names
    old: '\bPanelInsertion\b'
    new: 'PlacementInsertion'
  - id: placement-observation-type
    stage: 3
    group: placement-names
