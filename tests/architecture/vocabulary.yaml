retired:
  - id: retired-header-package
    group: canvas-package
    words: header package
    swap: canvas package
    stage: 6
    term: Canvas
  - id: retired-header-script
    group: canvas-package
    words: header script
    swap: canvas script
    stage: 6
    term: Canvas
  - id: retired-header-mod
    group: canvas-package
    words: header mod
    swap: canvas package
    stage: 6
    term: Canvas
  - id: retired-content-type
    group: content-words
    words: content type
    swap: vessel type
    stage: 6
    term: Vessel type
    allow:
      - '\b[Cc]ontent-[Tt]ype\b'
      - '(?<!\b(?:const|static|let|fn)\s+)\bCONTENT_TYPE\b'
  - id: retired-content-package
    group: content-words
    words: content package
    swap: vessel package
    stage: 6
    term: Vessel package
  - id: retired-content-instance
    group: content-words
    words: content instance
    term: Vessel
  - id: retired-mod
    group: package-nickname
    words: mod
    term: Vessel package
    allow:
      - '\b(?:pub(?:\([^)]*\))?\s+)?mod\s+[a-z_][a-z0-9_]*\s*[;{]'
      - {pattern: '\b(?:Mods|set_mods)\b', files: ['desktop/src/terminal.rs']}
      - '\bmod\.rs\b'
    skip: ['tests/architecture/observe*.cjs', 'tests/architecture/rust.cjs']
  - id: retired-realm
    group: legacy-names
    words: realm
    term: Voyage
  - id: retired-content-id
    group: vessel-ids
    words: content id
    swap: vessel id
    stage: 6
    term: Vessel

contexts:
  - id: core-adapter
    name: Core adapter
