    code: true
    ban: false
  - id: canvas-root-class-evaluated
    stage: 2
    old: '\}\\nWorkspace`'
    new: '}\nCanvas`'
    files: ['desktop/rename-test.cjs']
    ban: false
  - id: canvas-regions-function
    stage: 2
    group: canvas-package
    old: '\bcomposeCanvas\b'
    new: 'composeRegions'
  - id: panel-frame-function
    stage: 2
    group: canvas-package
    old: '\bvesselFrame\b'
    new: 'panelFrame'
  - id: regions-module
    stage: 2
