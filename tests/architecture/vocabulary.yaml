    old: '\b(saved_layouts|savedLayouts)\b'
    new: 'arrangements'
  - id: vessel-id-field-snake
    stage: 3
    group: vessel-ids
    old: '\bcontent_id\b'
    new: 'vessel_id'
  - id: vessel-id-field-camel
    stage: 3
    group: vessel-ids
    old: '\bcontentId\b'
    new: 'vesselId'
  - id: created-vessels-field
    stage: 3
