    ban: false
  - id: placement-vessel-access
    stage: 3
    old: '\.content\b(?!\s*\()'
    new: '.vessel'
    files: ['**/*.rs', 'desktop/canvas/*.ts', 'desktop/*.cjs']
    ban: false
  - id: placement-vessel-field
    stage: 3
    old: '\b(pub )?content: (VesselId|&VesselId)'
    new: '$1vessel: $2'
    files: ['contract/src/lib.rs', 'contract/src/voyage_close.rs', 'contract/src/panels.rs']
    ban: false
  - id: placement-vessel-literal
