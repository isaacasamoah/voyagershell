    old: '\bcreated_contents\b'
    new: 'created_vessels'
  - id: created-vessels-key
    stage: 3
    group: vessel-ids
    old: '\bcreatedContents\b'
    new: 'createdVessels'
  - id: primary-placement-field
    stage: 3
