settings:
  own:
    - github.com/isaacasamoah/voyagershell
    - raw.githubusercontent.com/isaacasamoah/voyagershell
  skip:
    - 'experiments/**'
    - 'tests/architecture/vocabulary.*'
    - 'docs/glossary.md'
    - 'desktop/patches/**'
    - 'tests/native/fixtures/profile-updates/**'
    - '**/Cargo.lock'
    - '**/package-lock.json'
  generated:
    - 'contract/generated/**'
    - 'desktop/script-types.json'
    - 'desktop/canvas/*.js'
    - 'content/ui.js'
    - 'content/notes/main.js'

exceptions:
  - text: 'voyager-layout-v1'
    reason: 'The stored layout document name before the Vessel and Placement vocabulary. The importer in contract/src/layout_document.rs reads it once.'
  - text: 'savedLayouts'
    reason: 'A key of the voyager-layout-v1 document, renamed by the importer.'
  - text: 'primaryVessel'
    reason: 'A key of the voyager-layout-v1 document, renamed by the importer.'
  - text: '--native-mod-host'
    reason: 'Legacy reproduction route flag. The retained Python route keeps its name until its journeys are retired.'
  - text: 'proof_native_mod_host'
    reason: 'Legacy reproduction driver and its module name. It keeps its name until it is retired.'
  - text: 'Herdr worktree mod'
    reason: 'Herdr App calls its own scripts mods. This names that upstream feature.'

moves:
  - {stage: 2, from: desktop/mods/header, to: desktop/canvas}
  - {stage: 2, from: desktop/canvas/canvas.ts, to: desktop/canvas/regions.ts}
  - {stage: 2, from: desktop/canvas/canvas.js, to: desktop/canvas/regions.js}
  - {stage: 2, from: desktop/canvas/mod.json, to: desktop/canvas/canvas.json}
  - {stage: 2, from: content/notes/mod.json, to: content/notes/vessel.json}
  - {stage: 6, from: app/src/content_type.rs, to: app/src/vessel_type.rs}

rules:
  - id: canvas-package-path
    stage: 2
    group: canvas-package
    old: 'desktop/mods/header'
    new: 'desktop/canvas'
  - id: canvas-package-root
    stage: 2
    group: canvas-package
    old: 'desktop/mods\b'
    new: 'desktop/canvas'
  - id: canvas-profile-path
    stage: 2
    group: canvas-package
    old: '\bmods/header\b'
    new: 'canvas'
  - id: canvas-manifest-path
    stage: 2
    group: canvas-package
    old: 'canvas/mod\.json'
    new: 'canvas/canvas.json'
  - id: canvas-seed-manifest
    stage: 2
    group: canvas-package
    old: 'package\.join\("mod\.json"\)'
    new: 'package.join("canvas.json")'
    files: ['desktop/src/lib.rs']
  - id: canvas-import-depth
    stage: 2
    old: '\.\./\.\./\.\./'
    new: '../../'
    files: ['desktop/canvas/*.ts']
    ban: false
  - id: vessel-package-path
    stage: 2
    group: vessel-package
    old: '\bmods/'
    new: 'vessels/'
  - id: vessel-package-directory
    stage: 2
    group: vessel-package
    old: '"mods"'
    new: '"vessels"'
  - id: vessel-manifest
    stage: 2
    group: vessel-package
    old: '\bmod\.json\b'
    new: 'vessel.json'
  - id: theme-module
    stage: 2
    group: theme-module
    old: '\bvoyager_header\b'
    new: 'voyager_theme'
  - id: theme-module-constant
    stage: 2
    group: theme-module
    old: '\bHEADER_MODULE\b'
    new: 'THEME_MODULE'
  - id: canvas-manifest-name
