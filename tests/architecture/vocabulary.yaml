terms:
  - term: Core
    context: core-adapter
    meaning: 'Herdr Core, the external process that owns terminals, screens and processes. Voyager never supervises a process itself.'
    code: [CoreTerminalId]
  - term: Core session
    context: core-adapter
    meaning: 'One named Core session. Stop session ends every program that Core started in it.'
  - term: Core terminal
    context: core-adapter
    meaning: 'A terminal that Core runs, addressed by a CoreTerminalId.'
    code: [CoreTerminalId]
  - term: Program
    context: core-adapter
    meaning: 'What Core runs in a Core terminal, such as a shell or a coding agent.'
    code: [AGENT_PROGRAMS]
  - term: Queue
    context: application-queue
    meaning: 'The one ordered owner of application effects. A caller sends a request and the queue decides its outcome.'
  - term: Operation
    context: application-queue
    meaning: 'A named request in the typed application contract. A view, a Vessel or an agent sends the same Operation.'
    code: [Action]
  - term: Refusal
    context: application-queue
    meaning: 'A known outcome. The application declined the Operation and nothing changed.'
  - term: Uncertain effect
    context: application-queue
    meaning: 'An outcome the application could not confirm. Its caller asks the provider and settles it, retries only what a read proves did not happen and never restores a process automatically.'
  - term: Voyage
    context: placement
    meaning: 'A space for one project. It holds Fleets and a Portal column.'
    code: [VoyageId]
  - term: Fleet
    context: placement
    meaning: 'A tab in a Voyage. It holds a split tree of Placements.'
    code: [FleetId]
  - term: Placement
    context: placement
    meaning: 'Where one Vessel sits, in a Fleet or as a Portal. It has a PlacementId, a Vessel, a name and a hidden flag.'
    code: [PlacementId]
  - term: Portal
    context: placement
    meaning: 'A Placement that stays on screen across every Fleet of its Voyage. Its mode is overlay, which is the default, or make-room.'
    code: [PortalLayout, PortalMode]
  - term: Arrangement
    context: placement
    meaning: 'A named, saved split tree of Placements.'
    code: [Arrangement]
  - term: Layout
    context: placement
    meaning: 'The whole stored workspace document. It holds the Voyages, Fleets, Placements, Vessels, Arrangements, Context and Canvas regions.'
    code: [Layout]
  - term: Context
    context: placement
    meaning: 'What the avatar acts on: the workspace, a Voyage, a Fleet, a Vessel or a Portal. Docking sets it. It stays separate from keyboard focus, visual selection and delegated assignment.'
    code: [Context]
  - term: Overwatch
    context: placement
    meaning: 'The name users see for the workspace Context, which covers every Voyage.'
  - term: Region
    context: placement
    meaning: 'A node of the Canvas region tree, such as the sidebar, the Fleet strip, the active Fleet, the Portals or the context bar.'
    code: [Region]
  - term: Vessel
    context: content
    meaning: 'One piece of content with its own identity, configuration, state and revision, of one Vessel type. A Placement puts it on screen.'
    code: [VesselId]
  - term: Vessel type
    context: content
    meaning: 'The kind of a Vessel, keyed by type_id. The built-in types are terminal, notes and agents.'
    code: [NOTES_TYPE]
  - term: Vessel package
    context: content
    meaning: 'The source folder under vessels/ in the profile that provides one scripted Vessel type. Its manifest is vessel.json.'
  - term: Backend
    context: content
    meaning: 'The Core terminal that runs behind a Vessel. Hiding, moving or uninstalling the Vessel leaves it running.'
    code: [Backend]
  - term: Description
    context: content
    meaning: 'The catalogue entry that tells a caller the renderers, configuration, state, named actions and allowed Placements of a Vessel type.'
    code: [Description]
  - term: Administrator
    context: conversation-provider
    meaning: 'Voyager''s private agent. It inspects, arranges, delegates and verifies through Operations. Working Vessels change project code.'
  - term: Conversation
    context: conversation-provider
    meaning: 'The private exchange between the user and the Administrator. It is separate from terminal agents and Vessels.'
  - term: Provider
    context: conversation-provider
    meaning: 'The adapter that serves the Conversation model and any voice. Codex is the supported Provider.'
    code: [Provider]
  - term: Canvas
    context: desktop-presentation
    meaning: 'The whole window surface and the script package in desktop/canvas that draws it.'
    code: [CanvasHost]
  - term: Panel
    context: desktop-presentation
    meaning: 'The drawn frame of one Placement, with its title bar. It names a drawing, never a stored or wire object.'
    code: [panelFrame]
  - term: Avatar
    context: desktop-presentation
    meaning: 'The Voyager assistant figure. It holds its user''s authority, and docking it selects the Context.'
  - term: Dock
    context: desktop-presentation
    meaning: 'To place the Avatar on a Vessel, a Portal, a Fleet, a Voyage or Overwatch. It never moves keyboard focus.'
  - term: Profile
    context: desktop-presentation
    meaning: 'The user''s data directory, passed as --profile. It holds canvas, vessels, data, themes and the avatar pack.'
  - term: Journey
    context: verification
    meaning: 'A Rust test in tests/native that drives the real app on an owned display and writes evidence.'
  - term: Fixture
    context: verification
    meaning: 'The owned display, isolated Core, profile and cleanup that every Journey shares.'
  - term: Control
    context: verification
    meaning: 'A patch that breaks the app on purpose to show that a Journey fails.'
  - term: Evidence
    context: verification
    meaning: 'The raw bundle a run writes. It names whether the product, the Fixture or an unknown cause failed.'
