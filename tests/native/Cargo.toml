[package]
name = "voyager-verification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rustix = { version = "=1.1.6", features = ["process", "termios"] }
signal-hook = "=0.3.18"
