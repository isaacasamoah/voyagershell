[package]
name = "voyager-verification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
globset = { version = "=0.4.21", default-features = false }
anyhow = "=1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rustix = { version = "=1.1.6", features = ["event", "process", "termios"] }
signal-hook = "=0.3.18"
voyager-contract = { path = "../../contract" }
x11rb = { version = "=0.13.2", features = ["xtest"] }

[profile.dev.package."*"]
opt-level = 3
