# Out of scope. Each was checked on origin/main at 87ffcd4.

[[out_of_scope]]
id = "non-whole-min-reader"
state = "A stored layout whose minReader is not a whole number, such as \"2\", 2.0, 2.5, -1 or null"
why = "The only writer, write() in contract/src/layout_document.rs, inserts a u64, and git grep finds no other writer of minReader outside tests, fixtures and docs. Only a hand edit of the Core document produces it. The audit counts about 47 minutes across five sessions on it."
revisit_when = "Code writes minReader from anything but a u64, or someone reports hand-editing the stored layout"
confidence = "inferred"

[[out_of_scope]]
id = "product-wipes-profile"
state = "A product build that deletes its own profile directory on quit"
why = "Every remove_dir_all under app/src and desktop/src on main is test cleanup inside a test module (git grep remove_dir_all). It exists only as a planted fault (#162)."
revisit_when = "Non-test code calls remove_dir_all or remove_dir on a path derived from the profile"
confidence = "inferred"

[[out_of_scope]]
id = "request-id-reuse"
state = "A caller sending a request id that was already used: replayed, reused across kinds or arriving after the 32-entry eviction"
why = "Every workspace request id comes from Client::request_id() in app/src/client.rs, built from the pid, a nanosecond clock and an atomic counter. Canvas scripts get a fresh id per invoke, and nothing under content/ passes its own id (git grep -i requestid origin/main -- content is empty)."
revisit_when = "A package or caller passes its own requestId, or retries with an id it kept"
confidence = "inferred"

[[out_of_scope]]
id = "layout-duplicate-id"
state = "Two objects in the stored layout sharing one id, so a kept field is grafted onto the wrong one"
why = "Every layout id comes from Workspace::id in app/src/workspace.rs, which uses one checked counter with a type prefix, so ids never repeat. v1 documents written before 2 Nov 2026 were not checked."
revisit_when = "A writer creates layout ids outside Workspace::id, or a stored document is found with duplicate ids"
confidence = "inferred"

[[out_of_scope]]
id = "vocabulary-gate-odd-literals"
state = "The vocabulary gate meeting a raw or byte string literal of a type id, a cfg_attr test gate, or an empty rules file"
why = "git grep finds no r#\"notes\"#, b\"notes\" or cfg_attr under app/src, contract/src or desktop/src, and tests/architecture/rules.yaml is not empty"
revisit_when = "A file under the rule's roots gains such a literal or a cfg_attr(test) gate, or rules.yaml is emptied"
confidence = "inferred"

[[out_of_scope]]
id = "edit-during-install-swap"
state = "A person saving a first-party profile file in the moment between the startup install reading it and swapping it"
why = "install() runs once at startup, from desktop/src/lib.rs, before the content owner opens, so an editor save must land inside that window of one launch. The window was not timed."
revisit_when = "Install runs outside startup, such as a live update or watcher, or someone reports edited text lost after an update"
confidence = "inferred"

[[out_of_scope]]
id = "synthetic-busy-loop-load"
state = "The app running while 18 or 24 busy loops pin every core"
why = "Only the crew's battery lane created this load. Nothing in the product or tests/native does. Issue #177 shows trunk failing under it while the same journeys pass on a quiet machine, so a failure under it says nothing about real use."
revisit_when = "A failure reproduces under real load, such as a cargo build beside the app, or on a quiet machine"
confidence = "inferred"

[[out_of_scope]]
id = "other-platforms"
state = "Behaviour on macOS, Windows or any platform other than Linux"
why = "Isaac set macOS and Windows as future-only work on 29 Oct 2026, and every feature in features.toml lists only linux"
