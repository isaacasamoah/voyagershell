# A finding or plan item that names no entry here is a note, not a fix round.
# confidence: "stated" means Isaac or AGENTS.md says it directly; "inferred" means derived from a defect or a doc.

# Lifecycle: what keeps and what stops programs

[[invariant]]
id = "quit-keeps-programs"
says = "Ctrl+Q, the window's close button and a window-manager close all quit and keep. Core, every program and its output carry on, and the next launch reattaches to the same programs."
hurts = "user"
source = "AGENTS.md, User experience and proportionate safeguards; Isaac, 3 Nov 2026 owner UX note; #184 (Close button wired to Stop session would end every program)"
features = ["close-quit-restore"]
checked_by = ["quit-restore:quit-and-keep", "quit-restore:relaunch-reattaches", "quit-restore:relaunch-adopts-and-attaches", "quit-restore:quit-busy-keeps-output", "quit-restore:close-window-keeps", "quit-restore:close-button-keeps"]
confidence = "stated"

[[invariant]]
id = "hide-keeps-backend"
says = "Closing or hiding a Vessel or Portal panel, moving it or switching Fleets never stops its program, and reopening it shows the same program."
hurts = "user"
source = "AGENTS.md: 'Hiding, moving, switching Fleets or uninstalling a view must not stop its backend'; Isaac, 3 Nov 2026: 'Preserve the existing distinction between removing/hiding a view and explicitly stopping its program'"
features = ["vessels", "portals", "fleets"]
checked_by = ["portals:hide-portals", "portals:portal-across-fleets", "portals:close-portal", "portals:reopen-portal"]
confidence = "stated"

[[invariant]]
id = "stop-is-explicit"
says = "Programs end only through Stop session after its confirmation dialog, or a confirmed Close Voyage, and only the programs that action names. No key chord stops the session."
hurts = "user"
