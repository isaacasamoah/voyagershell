check = ["journey:portals/hide-portals", "journey:portals/portal-across-fleets", "journey:portals/close-portal", "journey:portals/reopen-portal"]
gap = "The showing half has no linked case. The case unit CC5 added and the shared_panels test are linked by the unit that links existing checks (DI5)."
confidence = "stated"

[[invariant]]
id = "stop-is-explicit"
says = "Programs end only through Stop session after its confirmation dialog, or a confirmed Close Voyage, and only the programs that action names. Close Voyage lists exactly the programs it will stop, stops nothing before Confirm, and Cancel changes nothing. No key chord stops the session."
