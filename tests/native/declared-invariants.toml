features = ["close-quit-restore"]
checked_by = ["quit-restore:stop-session", "voyage-close:close-voyage-asks", "voyage-close:close-voyage-cancel"]
confidence = "stated"

[[invariant]]
id = "close-voyage-confirms"
says = "Close Voyage lists exactly the programs it will stop and stops nothing before Confirm. Cancel changes nothing. A closed Voyage stays closed across a restart and reopens with plain shells in the same Fleets and Vessels."
