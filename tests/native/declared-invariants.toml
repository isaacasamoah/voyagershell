# A finding or plan item that names no entry here is a note, not a fix round.
# confidence: "stated" means Isaac or AGENTS.md says it directly; "inferred" means derived from a defect or a doc.

# Lifecycle: what keeps and what stops programs

[[invariant]]
id = "quit-keeps-programs"
says = "Ctrl+Q, the window's close button and a window-manager close all quit and keep. Core, every program and its output carry on, and the next launch reattaches to the same programs."
kind = "user"
owner = "application-queue"
source = "AGENTS.md, User experience and proportionate safeguards; Isaac, 3 Nov 2026 owner UX note; #184 (Close button wired to Stop session would end every program)"
features = ["close-quit-restore"]
guard = ["type:app/src/families/terminal/lifecycle.rs#Lifecycle"]
check = ["journey:quit-restore/quit-and-keep", "journey:quit-restore/relaunch-reattaches", "journey:quit-restore/relaunch-adopts-and-attaches", "journey:quit-restore/quit-busy-keeps-output", "journey:quit-restore/close-window-keeps", "journey:quit-restore/close-button-keeps"]
confidence = "stated"

[[invariant]]
id = "views-never-start-or-stop-programs"
says = "Showing, hiding, closing, moving or switching to a Vessel or Portal never starts or stops its Program, and reopening it shows the same Program."
kind = "user"
owner = "placement"
source = "AGENTS.md: 'Hiding, moving, switching Fleets or uninstalling a view must not stop its backend'; Isaac, 3 Nov 2026: 'Preserve the existing distinction between removing/hiding a view and explicitly stopping its program'; shells started at 17:55 and 20:49 on finished agents' Vessels (unit CC5); merges hide-keeps-backend and showing-starts-nothing per the declared invariants design, section 3e, agreed by Isaac 19 Nov 2026"
features = ["vessels", "portals", "fleets"]
guard = ["type:contract/src/lib.rs#Placement"]
check = ["journey:portals/hide-portals", "journey:portals/portal-across-fleets", "journey:portals/close-portal", "journey:portals/reopen-portal", "journey:adopt-by-label/ended-away-adopted-removed-when-shown"]
gap = "The linked control case, portals/portal-across-fleets, has a patch that changes portal visibility on a Fleet switch, so the clause that a view never starts or stops its Program is not proved to fail."
confidence = "stated"

[[invariant]]
id = "stop-is-explicit"
says = "Programs end only through Stop session after its confirmation dialog, or a confirmed Close Voyage, and only the programs that action names. Close Voyage lists exactly the programs it will stop, stops nothing before Confirm, and Cancel changes nothing. No key chord stops the session."
kind = "user"
owner = "application-queue"
source = "AGENTS.md: 'Explicit stop must target only the verified selected program'; docs/terminal.md, Lifecycle; docs/workspace.md, Confirmed Voyage shutdown; absorbs the confirm and cancel half of close-voyage-confirms per the declared invariants design, section 3, agreed by Isaac 19 Nov 2026"
features = ["close-quit-restore"]
guard = ["type:contract/src/lib.rs#Action"]
type_gap = "ConfirmVoyageClose and its cancel take plan: String, so any string passes as a close plan id. DI14 adds VoyageClosePlanId."
check = ["journey:quit-restore/stop-session", "journey:voyage-close/close-voyage-asks", "journey:voyage-close/close-voyage-cancel", "journey:voyage-close/close-voyage-confirm"]
gap = "The linked control case, voyage-close/close-voyage-confirm, proves Confirm only, so the Cancel, Stop session and no-chord clauses are not proved to fail."
confidence = "stated"

[[invariant]]
id = "restart-reopens-plain-shells"
says = "An adopted agent's Vessel whose program ended closes, at once or on the next reopen, and starts no new program. A Vessel the person opened keeps its shell when an agent run inside it ends, a typed exit closes it, and after a restart or a Voyage reopen it runs a new plain shell in place of a program that ended. An agent is never resumed automatically."
kind = "user"
owner = "application-queue"
source = "Close adopted Vessels whose program ended on reopen (#251); Pin what happens when a program ends (#274); gains the reopen clause of close-voyage-confirms per the declared invariants design, section 3, agreed by Isaac 19 Nov 2026; AGENTS.md: 'Never restore an uncertain process' and 'Do not ... recreate native agent session recovery'; docs/terminal.md, Lifecycle"
features = ["close-quit-restore", "agent-vessels", "adopted-vessels"]
guard = []
type_gap = "A Vessel can hold a backend terminal and a pending start at once, and an adopted Vessel can have no backend, because backend, start_pending and adopted are independent fields of Vessel. DI16 replaces them with one BackendState."
check = ["journey:quit-restore/cold-restart-restores", "journey:voyage-close/reopen-voyage", "journey:voyage-close/reopen-after-restart", "journey:adopt-by-label/reopen-restarts-own-terminal", "journey:adopt-by-label/reopen-closes-ended-adopted", "journey:adopt-by-label/ended-away-adopted-removed-when-shown", "journey:adopt-by-label/agent-exit-in-own-shell-keeps-shell", "journey:adopt-by-label/user-started-agent-vessel-keeps-shell", "journey:adopt-by-label/typed-exit-closes-vessel"]
gap = "No linked case is proved to fail when this breaks. The control cases of its three journeys are quit-restore/relaunch-reattaches, voyage-close/close-voyage-confirm and adopt-by-label/agent-in-fleet, and none is linked here."
confidence = "stated"

[[invariant]]
id = "live-vessel-attaches"
says = "A view of a live Program always attaches, and the user never sees a stale-revision refusal for it."
kind = "user"
source = "'Layout changed' on Voyager's own Vessel after a relaunch (unit bf1); declared invariants design, section 3c, reworded in 3e, agreed by Isaac 19 Nov 2026"
features = ["vessels"]
guard = []
type_gap = "Every request carries a Layout-wide expected_version u64 that any stale value can fill, and it is a bare number beside the per-Vessel revision String. DI14 adds LayoutVersion and VesselRevision so one cannot stand in for the other. A stale value for a live Program stays representable, and no planned unit removes it."
check = ["journey:quit-restore/relaunch-adopts-and-attaches"]
gap = "No owner is set. Section 3c named none, so a later unit sets it."
confidence = "inferred"

