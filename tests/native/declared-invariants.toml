owner = "placement"
source = "AGENTS.md: 'Hiding, moving, switching Fleets or uninstalling a view must not stop its backend'; Isaac, 3 Nov 2026: 'Preserve the existing distinction between removing/hiding a view and explicitly stopping its program'; shells started at 17:55 and 20:49 on finished agents' Vessels (unit CC5); merges hide-keeps-backend and showing-starts-nothing per the declared invariants design, section 3e, agreed by Isaac 19 Nov 2026"
