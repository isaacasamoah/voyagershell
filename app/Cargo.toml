[package]
name = "voyager-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
voyager-contract = { path = "../contract" }
serde_json = "1"
async-channel = "=2.5.0"
serde = { version = "1", features = ["derive"] }
typify = "=0.5.0"
sha2 = "0.10"
jsonschema = { version = "=0.60.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
